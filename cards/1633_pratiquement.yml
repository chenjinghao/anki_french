Wort mit Artikel: pratiquement
Femininum / Plural: ''
IPA: \pʁa.tik.mɑ̃\
Definition: Practically, almost
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
