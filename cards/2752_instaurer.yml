Notiz: |-
  <div class="section">
    <div class="section-title"><i>entamer</i> and <i>instaurer</i></div>
    <div class="section-content">
      <p><span class="fr">Entamer</span> #2325) means to start or start something, often with the connotation that you take the first step or intervene in something. It often implies the beginning of a process or an action.</p>
      <div class="examples">
        <div class="fr">Ils ont entamé les négociations ce matin.</div>
        <div class="de spoiler">You started the negotiations this morning.</div>
        <div class="fr">Elle a entamé la lecture du livre hier soir.</div>
        <div class="de spoiler">She started reading the book last night.</div>
      </div>
      <p><span class="fr">Instaurer</span> (#2752) means to introduce, establish or institutionalize something new. It is often used in connection with the introduction of systems, rules or practices.</p>
      <div class="examples">
        <div class="fr">Le gouvernement a instauré de nouvelles mesures de sécurité.</div>
        <div class="de spoiler">The government has introduced new security measures.</div>
        <div class="fr">Il faut instaurer un climat de confiance dans l'équipe.</div>
        <div class="de spoiler">It is necessary to create an atmosphere of trust in the team.</div>
      </div>
      <p>In the meantime <span class="fr">entamer</span> implies more about the beginning of an action or process <span class="fr">instaurer</span> the introduction or establishment of something permanent or structural. <span class="fr">Entamer</span> is more commonly used for concrete actions, whereas <span class="fr">instaurer</span> It is more likely to be used for abstract concepts or systemic changes.</p>
    </div>
  </div>
