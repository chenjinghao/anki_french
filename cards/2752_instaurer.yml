Rang: 2752
Wort: instaurer
Wortart: vt, vr

# Feel free to improve these fields!
Wort mit Artikel: instaurer
Femininum / Plural: ''
IPA: \ɛ̃s.tɔ.ʁe\
Definition: Introduce, create
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Notre nouveau directeur a *instauré* un programme pour travailler en équipe.
  Our new director has introduced a teamwork program.

  La révolution a *instauré* un nouveau régime politique dans le pays.
  The revolution has *established* a new political regime in the country.

  Le gouvernement souhaite *instaurer* une nouvelle taxe sur les produits de luxe.
  The government wants to introduce a new tax on luxury products.

  Cette décision a *instauré* un climat de confiance entre les deux parties.
  This decision has *created* a climate of confidence between the two parties.

  Le styliste a *instauré* une nouvelle mode vestimentaire audacieuse.
  The designer has *created* a new, daring style of clothing.

  L'entreprise a *instauré* des liens solides avec ses partenaires commerciaux.
  The company has established a strong relationship with its business partners.

  Les négociateurs ont *instauré* un processus de paix entre les nations en conflit.
  Negotiators have *initiated* a peace process between the parties to the conflict.

  Une tradition s'est *instaurée* dans notre famille : nous cuisinons ensemble chaque dimanche.
  In our family, a tradition has become common: we cook together every Sunday.

  Au fil du temps, de nouvelles habitudes se sont *instaurées* dans notre quotidien.
  Over time, new habits have *established* themselves in our everyday lives.

  Un sentiment de méfiance s'est rapidement *instauré* parmi les employés.
  A feeling of mistrust has spread rapidly among the employees.

  Le doute s'est *instauré* dans son esprit après cette conversation troublante.
  After this disturbing conversation, the doubt has settled in his mind.

  Une collaboration fructueuse s'est *instaurée* entre les deux équipes de recherche.
  A fruitful cooperation has been established between the two research teams.

  Le vote historique a *instauré* la République dans ce pays autrefois monarchique.
  The historic vote has established the Republic in this former monarchic country.

  Le designer a *instauré* une nouvelle tendance dans le monde de la mode.
  The designer has *launched* a new trend in the fashion world.

  Le comité a *instauré* de nouvelles règles pour améliorer la sécurité au travail.
  The committee has introduced new rules to improve occupational safety.

  Cette loi a *instauré* l'égalité des droits pour tous les citoyens.
  This law has *established* equality for all citizens.

  Le professeur a *instauré* un système de tutorat pour aider les élèves en difficulté.
  The teacher has *set up* a tutoring system to help students with difficulties.

  La nouvelle direction a *instauré* une politique de transparence dans l'entreprise.
  The new leadership has *established* a policy of transparency in the company.

