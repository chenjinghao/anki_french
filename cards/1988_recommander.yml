Notiz: |-
  <div class="section">
    <div class="section-title"><i>recommander</i> and <i>conseiller</i></div>
    <div class="section-content">
      <p><span class="fr">Recommander</span> means <span class="de">"empfehlen"</span> in the sense of a strong endorsement or official recommendation. It often implies a certain authority or expertise.</p>
      <div class="examples">
        <div class="fr">Le médecin recommande un repos complet pendant une semaine.</div>
        <div class="de spoiler">The doctor recommends a week of complete rest.</div>
        <div class="fr">Je vous recommande vivement ce restaurant pour sa cuisine exceptionnelle.</div>
        <div class="de spoiler">I highly recommend this restaurant for its exceptional cuisine.</div>
      </div>

      <p><span class="fr">Conseiller</span> (#970) implies more advice or suggestion, often based on personal experience or opinion.</p>
      <div class="examples">
        <div class="fr">Mon ami m'a conseillé de prendre des vacances pour me reposer.</div>
        <div class="de spoiler">My friend advised me to take a vacation to rest.</div>
        <div class="fr">Le guide nous a conseillé de partir tôt pour éviter la foule.</div>
        <div class="de spoiler">The guide advised us to leave early to avoid the crowd.</div>
      </div>

      <p>While both verbs are often interchangeable, implies <span class="fr">recommander</span> A stronger or more formal recommendation is tending to be adopted, while <span class="fr">conseiller</span> It is not a question of the right to vote in the European Parliament.</p>
    </div>
