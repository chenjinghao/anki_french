Wort mit Artikel: aucunement
Femininum / Plural: ''
IPA: \o.kyn.mɑ̃\
Definition: by no means, in any way
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Je ne me sens *aucunement* coupable.
  I don't feel guilty at all.

  Elle n'est *aucunement* responsable de cette erreur.
  She is *in no way* responsible for this mistake.

  Je n'ai *aucunement* envie de sortir ce soir.
  I don't feel like going out tonight.

  – "Êtes-vous satisfait du résultat ?"<br>– "*Aucunement* !"
  – "Are you satisfied with the result?"<br>– "No way!"

  Cette décision ne m'affecte *aucunement*.
  This decision does not concern me at all.

  Je ne souhaite *aucunement* vous déranger.
  I don't want to disturb you in any way.

  Ce commentaire n'était *aucunement* destiné à vous offenser.
  This comment was by no means intended to offend you.

  Il n'a *aucunement* l'intention de démissionner.
  He has no intention of quitting at all.

  – "Voulez-vous participer au projet ?"<br>– "*Aucunement*."
  – "Would you like to participate in the project?"<br>– "Never mind."

  Elle n'est *aucunement* intéressée par cette proposition.
  She is absolutely not interested in this proposal.

  Cette situation ne me dérange *aucunement*.
  This situation doesn't bother me at all.

  Je ne suis *aucunement* convaincu par ses arguments.
  I am *in no way* convinced of his arguments.

  Cette remarque n'était *aucunement* justifiée.
  This remark was by no means justified.

  Il n'a *aucunement* besoin de s'excuser.
  He doesn't have to apologize.

  Ces changements ne m'inquiètent *aucunement*.
  These changes do not bother me in any way.

  Tu n'es *aucunement* obligé de venir à la fête.
  You're not obligated to come to the party at all.

  Je ne me sens *aucunement* concerné par cette affaire.
  I do not feel affected by this matter in any way.

