Wort mit Artikel: parallèlement
Femininum / Plural: ''
IPA: \pa.ʁa.lɛl.mɑ̃\
Definition: parallel to each other
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  J'ai toujours mené *parallèlement* le travail poétique et le travail social.
  I have always carried out poetry and social work *at the same time*.

  Les deux rivières coulent *parallèlement* l'une à l'autre sur plusieurs kilomètres.
  The two rivers run parallel to each other for several miles.

  *Parallèlement* à ses études de médecine, elle donne des cours de piano.
  Along with her medical studies, she teaches piano lessons.

  Les oiseaux migrateurs volent *parallèlement* à la côte.
  Migratory birds fly parallel to the coast.

  Pierre et Marie ont évolué *parallèlement* dans leur carrière d'enseignants.
  *At the same time*, Pierre and Marie developed their careers as teachers.

  Ces deux équipes travaillent *parallèlement* sur le même projet.
  These two teams are working on the same project *at the same time*.

  Les skieurs descendent *parallèlement* la pente enneigée.
  Skiers are descending the snow slope *at the same time*.

  *Parallèlement* à la construction du pont, on aménage les berges.
  *At the same time* as the bridge is being built, the banks are being upgraded.

  Les arbres ont été plantés *parallèlement* à la route principale.
  The trees were planted alongside the main road.

  *Parallèlement* à son activité principale, elle développe sa propre entreprise.
  Alongside her main activity, she develops her own business.

  Les enfants marchent *parallèlement* au bord de la piscine.
  The children are walking parallel to the pool.

  Ces deux civilisations se sont développées *parallèlement* pendant des siècles.
  These two civilizations have developed in parallel for centuries.

  Les câbles électriques courent *parallèlement* au mur.
  The electrical cables run parallel to the wall.

  *Parallèlement* à ses recherches, elle écrit des articles scientifiques.
  In addition to her research, she writes scientific articles.

  Les deux danseurs se déplacent *parallèlement* sur la scène.
  The two dancers move in parallel on the stage.

  Les architectes ont conçu ces bâtiments *parallèlement* à l'avenue.
  The architects designed these buildings alongside the avenue.

