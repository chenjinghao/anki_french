Notiz: |-
  <div class="section">
    <div class="section-title"><i>réussite</i> and <i>succès</i></div>
    <div class="section-content">
      <p><span class="fr">Réussite</span> emphasizes the successful achievement or completion of a task or goal, while <span class="fr">succès</span> (#620) is more general and suggests far-reaching applause or popularity.</p>
      <div class="examples">
        <div class="fr">Il a obtenu son diplôme avec grande réussite.</div>
        <div class="de spoiler">He completed his studies with great success.</div>
        <div class="fr">La réussite de ce plat dépend de la qualité des ingrédients.</div>
        <div class="de spoiler">The success of this court depends on the quality of the ingredients.</div>
        <div class="fr">Sa réussite aux examens a été célébrée par toute sa famille.</div>
        <div class="de spoiler">His success in the exams was celebrated by his entire family.</div>
      </div>
      <p><span class="fr">Succès</span> is used more generally to indicate success, popularity or applause, particularly in social, artistic or commercial contexts.</p>
      <div class="examples">
        <div class="fr">Le nouveau film a eu beaucoup de succès au box-office.</div>
        <div class="de spoiler">The new film was very successful at the box office.</div>
        <div class="fr">Cette chanteuse connaît un succès international.</div>
        <div class="de spoiler">This singer enjoys international success.</div>
        <div class="fr">Le lancement du produit fut un grand succès commercial.</div>
        <div class="de spoiler">The product launch was a great commercial success.</div>
      </div>
    </div>
  </div>
