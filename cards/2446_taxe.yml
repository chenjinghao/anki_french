  <div class="section">
    <div class="section-title"><i>taxe</i> and <i>impôt</i></div>
    <div class="section-content">
      <p><span class="fr">Taxe</span> and <span class="fr">impôt</span> (#1241) are both forms of taxes or levies, but have some distinguishing features:</p>

      <p><span class="fr">Impôt</span> (<span class="de">"Steuer"</span>):</p>
      <ul>
        <li>Is mandatory and applies to all natural and legal persons.</li>
        <li>Is charged in favour of the State to finance public expenditure.</li>
        <li>Doesn't have any direct consideration for the payer.</li>
        <li>Examples: income tax, corporation tax</li>
      </ul>

      <div class="examples">
        <div class="fr">L'impôt sur le revenu est progressif en France.</div>
        <div class="de spoiler">Income tax is progressive in France.</div>
      </div>

      <p><span class="fr">Taxe</span> (<span class="de">"Abgabe"</span> or <span class="de">"Fee"</span>):</p>
      <ul>
        <li>It is often collected for specific products or services.</li>
        <li>Income is often earmarked for certain areas of expenditure.</li>
        <li>Can also be collected by local authorities.</li>
        <li>Examples: tourist tax, development fee</li>
      </ul>

      <div class="examples">
        <div class="fr">La taxe de séjour est collectée par les communes touristiques.</div>
