      <p><span class="fr">Presque</span> (#481) means <span class="de">"fast"</span> or <span class="de">"beinahe"</span> and is the more common and neutral expression in the French language.</p>
      <div class="examples">
        <div class="fr">Il est presque midi.</div>
        <div class="de spoiler">It's almost noon.</div>
        <div class="fr">J'ai mangé presque tout le gâteau.</div>
        <div class="de spoiler">I ate almost the whole cake.</div>
      </div>
      <p><span class="fr">Quasiment</span> means ebenfalls <span class="de">"fast"</span> or <span class="de">"beinahe"</span>However, it often has a somewhat stronger or stronger connotation. It is used more often in informal contexts or in the spoken language.</p>
      <div class="examples">
        <div class="fr">Il a quasiment terminé son travail.</div>
        <div class="de spoiler">He's finished his work.</div>
        <div class="fr">La salle était quasiment vide.</div>
        <div class="de spoiler">The hall was practically empty.</div>
      </div>
      <p>Both adverbs can be used interchangeably in many contexts, whereby <span class="fr">presque</span> a little more formal, and <span class="fr">quasiment</span> It's a little more colloquial.</p>
