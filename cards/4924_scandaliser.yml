Wort mit Artikel: scandaliser
Femininum / Plural: ''
IPA: \skɑ̃.da.li.ze\
Definition: Shocking, upsetting
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
