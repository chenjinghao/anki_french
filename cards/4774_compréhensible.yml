# Feel free to improve these fields!
Wort mit Artikel: compréhensible
Femininum / Plural: ''
IPA: \kɔ̃.pʁe.ɑ̃.sibl\
Definition: It 's understandable
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Il est *compréhensible* que le public soit inquiet.
  It is *understandable* that the public is concerned.

  Ces instructions ne sont pas *compréhensibles* pour les débutants.
  These instructions are not easy for beginners to understand.

  Le professeur explique les mathématiques d'une manière *compréhensible*.
  The teacher explains mathematics in an *understandable* way.

  Sa réaction était tout à fait *compréhensible* dans ces circonstances.
  His reaction was quite *understandable* under these circumstances.

  Parle plus lentement pour être *compréhensible*.
  Speak more slowly to be understood.

  Les arguments du ministre n'étaient pas *compréhensibles*.
  The minister's arguments were incomprehensible.

  Cette erreur est *compréhensible* pour un débutant.
  This mistake is *understandable* to a beginner.

  Le texte doit être *compréhensible* pour tous les lecteurs.
  The text must be *understandable* to all readers.

  Son mécontentement est tout à fait *compréhensible*.
  His discontent is quite *understandable*.

  Les balbutiements de l'enfant étaient à peine *compréhensibles*.
  The child's infancy was hardly *understandable*.

  La colère de Marie était parfaitement *compréhensible*.
  Marie's anger was perfectly *understandable*.

  Il faut rendre ce message plus *compréhensible*.
  We need to make this message more *understandable*.

  Ces symboles ne sont pas *compréhensibles* sans explication.
  These symbols cannot be understood without explanation.

  Sa peur n'était que trop *compréhensible*.
  His fear was just too *understandable*.

  Le manuel est écrit dans un langage *compréhensible*.
  The manual is written in a language that is *understandable*.

  Cette décision n'est pas *compréhensible* pour moi.
  This decision is incomprehensible to me.

