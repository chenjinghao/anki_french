    <div class="section-content">
      <p class="highlight"><b>Second</b> #397) is elevated, and can almost always be used with <b>deuxième</b> to be replaced.</p>

      <p><span class="fr">Second</span> The nuance can imply that a list contains exactly two elements. <span class="fr">Deuxième</span> is used when a list has more than two elements.</p>
