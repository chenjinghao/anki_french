Wort mit Artikel: préoccuper
Femininum / Plural: ''
IPA: \pʁe.ɔ.ky.pe\
Definition: They are busy, they are anxious
Register: ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Il nous faut sans doute nous *préoccuper* de l'avenir de nos enfants.
  We may have to worry about the future of our children.

  La situation économique *préoccupe* de plus en plus les citoyens.
  The economic situation is a growing concern for citizens.

  Ce problème me *préoccupe* depuis des semaines.
  I've been worried about this problem for weeks.

  "Je suis tellement *préoccupé* que je n'arrive pas à dormir."
  "I'm so *worried* I can't sleep".

  Elle ne se *préoccupe* que de son apparence.
  All she cares about is how she looks.

  Les parents sont *préoccupés* par les résultats scolaires de leur fille.
  Parents are concerned about their daughter's academic performance.

  Il faut se *préoccuper* de l'environnement avant qu'il ne soit trop tard.
  We need to take care of the environment before it's too late.

  La santé de ma grand-mère me *préoccupe* beaucoup.
  I'm very concerned about my grandmother's health.

  Le directeur semble *préoccupé* par les chiffres du dernier trimestre.
  The director seems concerned about the figures for the last quarter.

  Pourquoi te *préoccupes*-tu tant de ce que pensent les autres ?
  Why do you care so much about what other people think?

  Cette affaire *préoccupe* les autorités depuis plusieurs mois.
  This case has been a concern for the authorities for several months.

  Les scientifiques se *préoccupent* de plus en plus du changement climatique.
  Scientists are increasingly concerned about climate change.

  "Ne vous *préoccupez* pas de moi, je vais bien."
  "Don't worry about me, I'm all right".

  L'absence de son fils *préoccupe* beaucoup Mme Dupont.
  Mrs. Dupont is very concerned about her son's absence.

  Il faut se *préoccuper* de son bien-être mental autant que physique.
  You have to be as concerned about your mental and physical well-being as you are.

  Les étudiants sont *préoccupés* par leurs examens à venir.
  The students are *worried* about their upcoming exams.

