Notiz: |-
  <div class="section">
    <div class="section-title"><i>adéquat</i>, <i>approprié</i> and <i>convenable</i></div>
    <div class="section-content">
      <p><span class="fr">Adéquat</span> (#3525) means <span class="de">"angemessen"</span> or <span class="de">"entsprechend"</span> and refers to something that exactly meets the requirements or purpose. It emphasizes the precise conformity.</p>
      <div class="examples">
        <div class="fr">Cette solution n'est pas adéquate pour résoudre le problème.</div>
        <div class="de spoiler">This solution is not appropriate to solve the problem.</div>
        <div class="fr">Il faut trouver un financement adéquat pour ce projet.</div>
        <div class="de spoiler">It is important to find adequate funding for this project.</div>
      </div>
      <p><span class="fr">Approprié</span> (#3591) means <span class="de">"passend"</span> or <span class="de">"geeignet"</span> and denotes something that is correctly chosen for a particular situation or context.</p>
      <div class="examples">
        <div class="fr">Ce cadeau est très approprié pour l'occasion.</div>
        <div class="de spoiler">This gift is very suitable for the occasion.</div>
        <div class="fr">Il a choisi des mots appropriés pour s'excuser.</div>
        <div class="de spoiler">He chose appropriate words for his apology.</div>
      </div>
      <p><span class="fr">Convenable</span> means <span class="de">"decent"</span> or <span class="de">"Apparently"</span> and often refers to social norms or moral appropriateness. It can also <span class="de">"ausreichend"</span> bedeuten.</p>
      <div class="examples">
        <div class="fr">Il est important de porter une tenue convenable à cette cérémonie.</div>
        <div class="de spoiler">It is important to wear appropriate clothing for this ceremony.</div>
        <div class="fr">Son salaire est convenable mais pas exceptionnel.</div>
        <div class="de spoiler">His salary is decent, but not extraordinary.</div>
      </div>
    </div>
  </div>
