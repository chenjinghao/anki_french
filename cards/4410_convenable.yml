Notiz: |-
  <div class="section">
    <div class="section-title"><i>adéquat</i>, <i>approprié</i> and <i>convenable</i></div>
    <div class="section-content">
      <p><span class="fr">Adéquat</span> #3525) means <span class="de">'appropriate' means:</span> or <span class="de">'correspondingly'</span> And it refers to something that exactly matches the requirements or the purpose. It emphasizes the precise match.</p>
      <div class="examples">
        <div class="fr">Cette solution n'est pas adéquate pour résoudre le problème.</div>
        <div class="de spoiler">This solution is not adequate to solve the problem.</div>
        <div class="fr">Il faut trouver un financement adéquat pour ce projet.</div>
        <div class="de spoiler">We need to find adequate funding for this project.</div>
      </div>
      <p><span class="fr">Approprié</span> #3591) means <span class="de">'Fittingly'</span> or <span class="de">'appropriate'</span> And it refers to something that's rightly chosen for a particular situation or context.</p>
      <div class="examples">
        <div class="fr">Ce cadeau est très approprié pour l'occasion.</div>
        <div class="de spoiler">This gift is very appropriate for the occasion.</div>
        <div class="fr">Il a choisi des mots appropriés pour s'excuser.</div>
        <div class="de spoiler">He chose appropriate words for his apology.</div>
      </div>
      <p><span class="fr">Convenable</span> means <span class="de">"Decently"</span> or <span class="de">"sophisticated"</span> And it often refers to social norms or moral appropriateness. <span class="de">'sufficient'</span> What do you mean?</p>
      <div class="examples">
        <div class="fr">Il est important de porter une tenue convenable à cette cérémonie.</div>
        <div class="de spoiler">It is important to wear appropriate clothing for this ceremony.</div>
        <div class="fr">Son salaire est convenable mais pas exceptionnel.</div>
        <div class="de spoiler">His salary is decent, but not unusual.</div>
      </div>
    </div>
  </div>
