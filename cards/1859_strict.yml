Rang: 1859
Wort: strict
Wortart: adj

# Feel free to improve these fields!
Wort mit Artikel: strict
Femininum / Plural: stricte
IPA: \stʁikt\
Definition: strict; rigorous
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Ce serait son *strict* devoir.
  It would be his *strict* duty.

  Pendant le carême, il suit un régime *strict*.
  During Lent, he follows a *strict* diet.

  Elle a reçu une éducation très *stricte*.
  She got a very *strict* education.

  Le professeur est *strict* avec ses élèves.
  The teacher is *strict* with his students.

  Dans la plus *stricte* intimité, ils se sont mariés hier.
  They were married yesterday in the *strictest privacy*.

  C'est la *stricte* vérité, je vous assure !
  It's the *strict* truth, I assure you!

  Les patients doivent respecter un isolement *strict*.
  Patients must observe *strict* isolation.

  Elle portait une robe noire très *stricte*.
  She was wearing a very *strict* black dress.

  Au sens *strict* du terme, ce n'est pas correct.
  In the *strict* sense of the word, it's not right.

  Il faut observer une discipline *stricte*.
  *Strict* discipline is required.

  Les horaires de travail sont très *stricts*.
  Working hours are very *strict*.

  Je me contente du *strict* minimum.
  I'm content with the *strict* minimum.

  La directrice est particulièrement *stricte* sur le règlement.
  The Director is particularly *strict* about the regulations.

  Ces principes *stricts* nous protègent.
  These *strict* principles protect us.

  Il a toujours été *strict* dans sa gestion financière.
  He's always been *strict* about his financial management.

  Nous devons maintenir un contrôle *strict* des entrées.
  We must maintain *strict* control of the entrances.

  La *stricte* application de la loi est nécessaire.
  *Strict* enforcement of the law is necessary.

  Ses parents ont toujours été très *stricts*.
  Her parents were always very *strict*.

  Elle garde une neutralité *stricte* dans ce conflit.
  It maintains *strict* neutrality in this conflict.

  Son allure *stricte* intimidait les visiteurs.
  His *strict* pace intimidated the visitors.

  Il faut une interprétation *stricte* de ces règles.
  There is a need for a *strict* interpretation of these rules.

  Le règlement est devenu plus *strict* cette année.
  The regulations have become stricter this year.

  Cette école suit des principes très *stricts*.
  This school follows very *strict* principles.

  Une surveillance *stricte* sera mise en place.
  *Strict* supervision will be put in place.

  Il porte toujours des costumes très *stricts*.
  He always wears very *strict* costumes.

  La nouvelle loi impose des mesures plus *strictes*.
  The new law imposes stricter measures.

  Ils suivent un programme d'entraînement *strict*.
  They follow a *strict* training program.

  Les conditions d'admission sont *strictes*.
  Admission requirements are strict.

