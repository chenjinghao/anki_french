Notiz: |-
  <div class="section">
    <div class="section-title"><i>épouvantable</i> and <i>horrible</i></div>
    <div class="section-content">
      <p><span class="fr">Épouvantable</span> means <span class="de">It's awful.</span> or <span class="de">'substitute'</span> and emphasizes especially the aspect of fear or dread. <span class="fr">épouvante</span> (Scream) off.</p>
      <div class="examples">
        <div class="fr">Il y a eu un accident épouvantable sur l'autoroute.</div>
        <div class="de spoiler">There was a terrible accident on the highway.</div>
        <div class="fr">Le temps est épouvantable aujourd'hui.</div>
        <div class="de spoiler">The weather is terrible today.</div>
      </div>
      <p><span class="fr">Horrible</span> (#3190) means <span class="de">It's awful.</span>, <span class="de">"Fearful"</span> or <span class="de">It's awful.</span> And it can refer to both physical disgust and moral outrage.</p>
      <div class="examples">
        <div class="fr">Cette histoire horrible m'a donné des cauchemars.</div>
        <div class="de spoiler">This terrible story has given me nightmares.</div>
        <div class="fr">Il a commis un crime horrible.</div>
        <div class="de spoiler">He committed a terrible crime.</div>
      </div>
      <p>Both words express strong negative feelings, but <span class="fr">épouvantable</span> It emphasizes more the horrors and fears, while <span class="fr">horrible</span> It can also be used to express disgust or moral outrage.</p>
    </div>
  </div>
