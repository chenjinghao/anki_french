Notiz: |-
  <div class="section">
    <div class="section-title"><i>épouvantable</i> and <i>horrible</i></div>
    <div class="section-content">
      <p><span class="fr">Épouvantable</span> means <span class="de">"Frightful"</span> or <span class="de">"in appalling"</span> and emphasizes in particular the aspect of terror or fear. It derives from <span class="fr">épouvante</span> (Schrecken) ab.</p>
      <div class="examples">
        <div class="fr">Il y a eu un accident épouvantable sur l'autoroute.</div>
        <div class="de spoiler">There was a terrible accident on the highway.</div>
        <div class="fr">Le temps est épouvantable aujourd'hui.</div>
        <div class="de spoiler">The weather is terrible today.</div>
      </div>
      <p><span class="fr">Horrible</span> (#3190) means <span class="de">"Frightful"</span>, <span class="de">"furchtbar"</span> or <span class="de">"Greek"</span> and can refer to both physical abhorrence and moral indignation.</p>
      <div class="examples">
        <div class="fr">Cette histoire horrible m'a donné des cauchemars.</div>
        <div class="de spoiler">This terrible story has caused me nightmares.</div>
        <div class="fr">Il a commis un crime horrible.</div>
        <div class="de spoiler">He's committed a terrible crime.</div>
      </div>
      <p>Both words express strong negative feelings, but <span class="fr">épouvantable</span> emphasizes more the horror and the fear, while <span class="fr">horrible</span> It is also the case that the European Union is not in a position to take a decision on this matter.</p>
    </div>
  </div>
