# Feel free to improve these fields!
Wort mit Artikel: stipuler
Femininum / Plural: ''
IPA: \sti.py.le\
Definition: (contractual) specify, (expressly) say
Register: ↘Fiktion

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Les vœux ne *stipulent* pas le bébé.
  Wishes don't dictate the baby.

  Le contrat *stipule* que vous devez payer le loyer avant le 5 du mois.
  The contract stipulates that you must pay the rent before the 5th of the month.

  Notre règlement *stipule* clairement l'interdiction de fumer dans les locaux.
  Our regulations clearly state that smoking is prohibited in the premises.

  Dans sa lettre, elle *stipule* qu'elle arrivera dimanche prochain.
  In her letter, she says she'll be arriving next Sunday.

  Il est *stipulé* dans le testament que la maison revient à sa fille.
  It's *stipulated* in the will that the house belongs to his daughter.

  Le document *stipulait* que tous les employés devaient être vaccinés.
  The document *stipulated* that all employees must be vaccinated.

  L'accord *stipule* expressément l'interdiction de revendre le produit.
  The agreement expressly prohibits the resale of the product.

  Les parents ont *stipulé* que leurs enfants devaient étudier la musique.
  The parents *stipulated* that their children should study music.

  La note de service *stipule* que les congés doivent être posés deux mois à l'avance.
  The service note states that leave must be given two months in advance.

  Le règlement intérieur *stipule* l'obligation du port du masque.
  Internal regulations stipulate the requirement to wear a mask.

  Comme *stipulé* dans le contrat, les heures supplémentaires seront payées double.
  As *stipulated* in the contract, overtime will be paid twice as much.

  L'assurance *stipule* que les dégâts causés par les catastrophes naturelles sont couverts.
  The insurance policy states that damage caused by natural disasters is covered.

  La convention collective *stipule* un salaire minimum de 2500 euros.
  The collective agreement stipulates a minimum wage of 2500 euros.

