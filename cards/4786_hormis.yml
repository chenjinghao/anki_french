Wort mit Artikel: hormis
Femininum / Plural: ''
IPA: \ɔʁ.mi\
Definition: with the exception of:
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  *Hormis* vous, personne n'a vu ce gamin.
  No one has seen this boy *except* you.

  *Hormis* les chats, tous les animaux sont interdits dans cet immeuble.
  *Except* cats, all animals in this building are forbidden.

  Le jardin était vide, *hormis* quelques oiseaux qui chantaient dans les arbres.
  The garden was empty, *except for* a few birds singing in the trees.

  *Hormis* le dimanche, je me lève toujours à six heures.
  Except on Sundays, I get up at six o'clock.

  *Hormis* les cas d'urgence, les visites sont interdites après 20 heures.
  *With the exception of* emergencies, visits after 8 pm are prohibited.

  *Hormis* Marie et Pierre, tous les invités sont déjà partis.
  *Except for* Marie and Pierre, all guests have already left.

  Les élèves ont tous réussi l'examen, *hormis* deux qui étaient malades ce jour-là.
  The students all passed the exam, *except* two who were sick that day.

  *Hormis* la pluie du matin, nous avons eu une journée magnifique.
  *Apart from* the rain in the morning, we had a wonderful day.

  Tout s'est bien passé pendant le voyage, *hormis* que nous avons raté notre correspondance.
  During the trip everything went well, *only* that we missed our connection.

  *Hormis* les frais de transport, tout est inclus dans le prix.
  *With the exception of* transport costs, everything is included in the price.

  C'est un bon restaurant, *hormis* qu'il est un peu cher.
  It's a good restaurant, just that it's a little expensive.

  *Hormis* quelques détails, le projet est prêt à être lancé.
  The project is ready to start *except for* a few details.

  La salle était complètement silencieuse, *hormis* le tic-tac de l'horloge.
  The room was completely quiet, *except for* ticking the clock.

