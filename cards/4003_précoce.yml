        <div class="fr">C'est un enfant précoce qui a appris à lire à trois ans.</div>
        <div class="de spoiler">This is a precocious child who learned to read at the age of three.</div>
        <div class="fr">Cette année, nous avons eu un printemps précoce.</div>
        <div class="de spoiler">We had an early spring this year.</div>
      </div>
      <p><span class="fr">Prématuré</span> (#3105) means <span class="de">"early"</span> or <span class="de">"premature"</span> And it refers to something that happens too early, often with a negative connotation or a hint of immaturity.</p>
      <div class="examples">
