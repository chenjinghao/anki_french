Notiz: |-
  <p>The verb <span class="fr">voir</span> describes the passive process of seeing in which sensory impressions from the outside are perceived involuntarily.</p>

  <div class="examples">
    <div class="fr">Madame Rose voit une voile à l'horizon.</div>
    <div class="de spoiler">Mrs. Rose sees a sail on the horizon.</div>
  </div>

  <p><span class="fr">Voir</span> It's also used to express that something is being seen at the exact moment of speaking.</p>

  <div class="examples">
    <div class="fr">Tu <span class="fr">vois</span> cet oiseau là-bas?</div>
    <div class="de spoiler">See that bird over there?</div>
  </div>

  <p>The verb <span class="fr">voir</span> may also be used in the sense of <span class="de">meeting someone (regularly)</span>, <span class="de">Having an appointment with someone</span>, <span class="de">visiting someone</span>, to be used.</p>

  <div class="examples">
    <div class="fr">Je suis allé <span class="fr">voir</span> ma grand-mère le week-end dernier.</div>
    <div class="de spoiler">I went to see my grandmother last weekend.</div>

    <div class="fr">Est-ce que tu <span class="fr">vois</span> toujours Jean-Baptiste? Il m'a l'air très gentil.</div>
    <div class="de spoiler">Do you still meet Jean-Baptiste?</div>
  </div>
