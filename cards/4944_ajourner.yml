Wort mit Artikel: ajourner
Femininum / Plural: ''
IPA: \a.ʒuʁ.ne\
Definition: postpone, postpone
Register: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Je suis prête à *ajourner* le débat.
  I am prepared to postpone the debate.

  Le conseil a décidé d'*ajourner* la réunion à la semaine prochaine.
  The Council decided to postpone the meeting until next week.

  En raison du mauvais temps, nous devons *ajourner* notre voyage.
  Because of the bad weather, we have to postpone our journey.

  La banque a accepté d'*ajourner* le paiement jusqu'au mois prochain.
  The bank has agreed to make the payment by the next month.

  Le président a été contraint d'*ajourner* les élections.
  The president was forced to *move* the elections.

  Le jury a décidé d'*ajourner* la candidate à la session suivante.
  The jury has decided to postpone the candidate to the next examination period.

  La commission médicale a dû *ajourner* plusieurs conscrits.
  The medical commission had to *reset* several recruits.

  Le juge a *ajourné* le procès sine die.
  The judge postponed the trial indefinitely.

  Nous sommes obligés d'*ajourner* notre décision jusqu'à l'obtention de plus d'informations.
  We are forced to *postpone* our decision until further information is received.

  Le professeur a *ajourné* l'examen en raison d'une épidémie de grippe.
  The professor has postponed the exam for a flu wave.

  Le parlement a *ajourné* le vote sur cette motion controversée.
  Parliament postponed the vote on this controversial motion.

  La séance a été *ajournée* après trois heures de débat intense.
  The meeting was *adjourned* after three hours of intense debate.

  Le comité a *ajourné* sa décision concernant le nouveau projet.
  The committee has *postponed* its decision on the new project.

  À cause de la grève des transports, nous devons *ajourner* le rendez-vous.
  Because of the traffic strike, we have to postpone the appointment.

  L'assemblée générale a été *ajournée* jusqu'à nouvel ordre.
  The Annual General Meeting was postponed until further notice.

