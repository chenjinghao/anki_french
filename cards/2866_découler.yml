Notiz: |-
  <div class="section">
    <div class="section-title"><i>résulter</i> and <i>découler</i></div>
    <div class="section-content">
      <p><span class="fr">Résulter</span> (#2095) means <span class="de">"resultieren"</span> or <span class="de">"sich ergeben"</span> and is used to denote a direct sequence or result. It often expresses an immediate consequence.</p>
      <div class="examples">
        <div class="fr">Sa réussite résulte de son travail acharné.</div>
        <div class="de spoiler">His success results from his hard work.</div>
        <div class="fr">De cette négociation a résulté un accord satisfaisant.</div>
        <div class="de spoiler">The outcome of this negotiation was a satisfactory agreement.</div>
      </div>
      <p><span class="fr">Découler</span> means <span class="de">"sich ableiten"</span> or <span class="de">"follow"</span> and often implies a logical or natural connection. It emphasizes more the flowing transition from cause to effect.</p>
      <div class="examples">
        <div class="fr">Cette conclusion découle logiquement des faits présentés.</div>
        <div class="de spoiler">This conclusion is logically derived from the facts presented.</div>
        <div class="fr">De ses principes découle sa façon d'agir.</div>
        <div class="de spoiler">His principles follow his course of action.</div>
      </div>
      <p>Both verbs express causality, but <span class="fr">résulter</span> stresses more the concrete result, while <span class="fr">découler</span> the logical or natural flow of a cause.</p>
    </div>
  </div>
