Rang: 4101
Wort: équité
Wortart: nf

# Feel free to improve these fields!
Wort mit Artikel: une équité
Femininum / Plural: ''
IPA: \e.ki.te\
Definition: Fairness, equity
Register: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Il faudra renforcer l'*équité* en matière d'emploi.
  *Fairness* in employment needs to be strengthened.

  Le juge a statué en *équité* dans cette affaire délicate.
  The judge has decided on this delicate matter in equity.

  L'*équité* du partage de l'héritage n'a pas été contestée.
  The appropriateness of the inheritance division was not contested.

  Marie traite toujours ses employés avec *équité*.
  Marie always treats her employees with *fairness*.

  En toute *équité*, je dois admettre que tu as raison.
  In all fairness, I have to admit that you're right.

  Cette décision va à l'encontre de toute *équité*.
  This decision contradicts all *fairness*.

  Le médiateur a fait preuve d'une grande *équité* dans la résolution du conflit.
  The mediator showed great impartiality in resolving conflicts.

  L'*équité* doit primer sur la stricte application de la loi.
  Equity must take precedence over strict application of the law.

  Pour des raisons d'*équité*, nous avons révisé les salaires.
  For reasons of *fairness*, we checked the salaries.

  Son sens de l'*équité* est reconnu par tous ses collègues.
  His sense of *justice* is recognized by all colleagues.

  L'*équité* procédurale est un principe fondamental du système juridique.
  Procedural *fairness* is a fundamental principle of the legal system.

  Cette réforme vise à garantir plus d'*équité* dans l'accès aux soins.
  This reform aims to increase *justice* in access to health care.

  Le tribunal a tranché selon l'*équité* plutôt que selon le droit strict.
  The court ruled according to equity rather than strict law.

  L'*équité* dans la distribution des ressources est essentielle.
  *Fairness* in the distribution of resources is essential.

  Un homme d'*équité* ne fait pas de différence entre les personnes.
  A man of *justice* makes no distinction between people.

  L'*équité* salariale entre hommes et femmes reste un défi majeur.
  Wage equality between men and women remains a major challenge.

  Le principe d'*équité* exige que chacun reçoive ce qui lui est dû.
  The principle of *justice* requires that everyone get what is due.

  Nous devons veiller à l'*équité* dans l'évaluation des candidats.
  We need to be fair in evaluating candidates.

