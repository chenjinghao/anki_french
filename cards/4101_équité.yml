Notiz: |-
  <div class="section">
    <div class="section-title"><i>justice</i> and <i>équité</i></div>
    <div class="section-content">
      <p><span class="fr">Justice</span> (#637) refers to: <span class="de">"Justice"</span> in the sense of a formal legal system or the application of laws and rules. It often implies an institutional or social dimension.</p>
      <div class="examples">
        <div class="fr">La justice a condamné le criminel à dix ans de prison.</div>
        <div class="de spoiler">The judiciary has sentenced the criminal to ten years in prison.</div>
        <div class="fr">Il croit en la justice et attend le verdict du tribunal.</div>
        <div class="de spoiler">He believes in justice and waits for the judgment of the court.</div>
      </div>
      <p><span class="fr">Équité</span> means <span class="de">"Fairness"</span> or <span class="de">"Blessedness"</span> and describes a moral quality that goes beyond the strict application of laws. It takes into account individual circumstances and aims at fair treatment.</p>
      <div class="examples">
        <div class="fr">Le professeur doit traiter tous ses élèves avec équité.</div>
        <div class="de spoiler">The teacher must treat all his students with fairness.</div>
        <div class="fr">L'équité exige que l'on prenne en compte la situation particulière de chacun.</div>
        <div class="de spoiler">Fairness requires that the particular situation of each individual be taken into account.</div>
      </div>
    </div>
  </div>
