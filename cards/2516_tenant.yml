Wort mit Artikel: le tenant
Femininum / Plural: tenante
IPA: \tə.nɑ̃\
Definition: holder; supporter
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
