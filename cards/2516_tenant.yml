Notiz: <p>Das französische Wort <span class="fr">tenant</span> hat vielfältige Bedeutungen,
  all of which derive from its basic meaning <i>halten</i> are derived. This basic meaning
  developed into different contexts, e.g. as “partisan” or “advocate”,
  someone who “holds” a particular position. In sports it denotes the “title holder”
  or “cup holder”, who “holds” the title. The expression <i>les tenants et
  les aboutissants</i> describes the circumstances of a situation, namely
  what one “holds” and where it “ends”. Schließlich means <i>d’un seul tenant</i> “in one
  piece” or “continuous”, something that is “held” as a whole.</p>
