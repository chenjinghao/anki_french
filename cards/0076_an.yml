Notiz: |-
  <p>The Word <span class="fr">an</span> refers to the year as the date and not as the period of time. <span class="fr">An</span> is used when it comes to the year as a mathematical size and to make age or date data.</p>

  <div class="examples">
    <div class="fr">J'ai 32 ans.</div>
    <div class="de spoiler">I'm 32 years old.</div>

    <div class="fr">Louis XIV est né en l'an 1638.</div>
    <div class="de spoiler">Louis XIV was born in 1638.</div>

    <div class="fr">Sidonie a déménagé il y a deux ans.</div>
    <div class="de spoiler">Sidonie moved two years ago.</div>
  </div>

  <p>With cardinal numbers (1, 2, 3, etc.) you almost always use the word <span class="fr">an</span>.</p>

  <p>Attention: <span class="fr">an</span> never the The Demonstrative Pronouns <span class="fr">cet</span> stehen <span class="fr">(cet an)</span>.</p>

  <p>Follows <span class="fr">an</span> or <span class="fr">année</span> an adjective, it is usually possible to use both words. In this case they are interchangeable.</p>
