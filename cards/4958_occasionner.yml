Notiz: |-
  <div class="section">
    <div class="section-title"><i>causer</i>, <i>occasionner</i> and <i>provoquer</i></div>
    <div class="section-content">
      <p><span class="fr">Causer</span> (#1089) means <span class="de">"verursachen"</span> in the general sense and is used for most cause-effect relationships. It is the most neutral of the three verbs.</p>
      <div class="examples">
        <div class="fr">La pluie a causé des inondations dans la région.</div>
        <div class="de spoiler">The rain has caused flooding in the region.</div>
        <div class="fr">Son imprudence a causé l'accident.</div>
        <div class="de spoiler">His imprudence caused the accident.</div>
      </div>
      <p><span class="fr">Occasionner</span> means <span class="de">"verursachen"</span> or <span class="de">"Bringing"</span> and is often used in more formal contexts. It often implies unintended or indirect cause.</p>
      <div class="examples">
        <div class="fr">Cette décision va occasionner des frais supplémentaires.</div>
        <div class="de spoiler">This decision will entail additional costs.</div>
        <div class="fr">Les travaux ont occasionné de nombreux désagréments.</div>
        <div class="de spoiler">The work has caused many inconveniences.</div>
      </div>
      <p><span class="fr">Provoquer</span> means <span class="de">"hervorrufen"</span> or <span class="de">"Start"</span> and often implies a conscious or direct cause. It can also describe emotional reactions.</p>
      <div class="examples">
        <div class="fr">Ses paroles ont provoqué une vive réaction.</div>
        <div class="de spoiler">His words have caused a violent reaction.</div>
        <div class="fr">Il a provoqué la bagarre intentionnellement.</div>
        <div class="de spoiler">He deliberately provoked the fight.</div>
      </div>
    </div>
  </div>
