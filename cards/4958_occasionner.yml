Rang: 4958
Wort: occasionner
Wortart: vt

# Feel free to improve these fields!
Wort mit Artikel: occasionner
Femininum / Plural: ''
IPA: \ɔ.ka.zjɔ.ne\
Definition: cause, induce or induce
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Le conflit *occasionne* des pertes énormes.
  The conflict has resulted in enormous losses.

  Cette décision a *occasionné* beaucoup de controverse dans l'entreprise.
  This decision caused a lot of controversy in the company.

  L'accident a malheureusement *occasionné* la mort de deux personnes.
  Unfortunately, the accident killed two people.

  Les travaux routiers *occasionnent* des embouteillages importants.
  Highway work is causing significant traffic congestion.

  La tempête a *occasionné* des dégâts considérables.
  The storm caused considerable damage.

  Son absence prolongée *occasionnera* sûrement des problèmes.
  His long absence will surely cause problems.

  La fuite d'eau a *occasionné* des dommages dans tout l'appartement.
  The leak caused damage to the entire apartment.

  Cette maladie peut *occasionner* des complications graves.
  This disease can lead to serious complications.

  Le déménagement nous a *occasionné* beaucoup de stress.
  The move brought us a lot of stress.

  La grève des transports *occasionne* de nombreux retards.
  The transport strike is causing many delays.

  Le bruit constant *occasionne* des troubles du sommeil.
  Constant noise causes sleep disturbances.

  Les nouvelles règles ont *occasionné* des changements majeurs.
  The new rules have led to major changes.

