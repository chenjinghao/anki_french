Beispielsätze: |-
  Le bien n'est pas *nécessairement* beau.
  Good is not *necessarily* beautiful.

  Cette solution n'est pas *nécessairement* la meilleure.
  This is not *necessarily* the best solution.

  Plus cher ne signifie pas *nécessairement* meilleur.
  More expensive doesn't *necessarily* mean better.

  La vie en ville implique *nécessairement* certains compromis.
  Urban life *necessarily* involves some compromises.

  Il faudra *nécessairement* repenser notre stratégie.
  We will *necessarily* have to rethink our strategy.

  Le succès entraîne *nécessairement* des responsabilités.
  Success *necessarily* entails responsibility.

  Un changement doit *nécessairement* se produire.
  A change must *necessarily* occur.

  Les erreurs font *nécessairement* partie de l'apprentissage.
  Mistakes are *necessarily* part of learning.

  Cette situation va *nécessairement* évoluer avec le temps.
  This situation will *necessarily* change over time.

  L'amour ne dure pas *nécessairement* toujours.
  Love does not *necessarily* last forever.

  Être intelligent ne signifie pas *nécessairement* être sage.
  Being intelligent does not *necessarily* mean being wise.

  Les symptômes ne sont pas *nécessairement* graves.
  Symptoms are not *necessarily* severe.

  Il devra *nécessairement* partir avant midi.
  He'll have to leave by noon.

  Cette méthode aboutira *nécessairement* à un échec.
  This method will inevitably fail.

  Le progrès entraîne *nécessairement* des changements.
  Progress *necessarily* leads to change.

