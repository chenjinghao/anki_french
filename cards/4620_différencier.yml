Notiz: |-
  <div class="section">
    <div class="section-title"><i>distinguer</i> and <i>différencier</i></div>
    <div class="section-content">
      <p><span class="fr">Distinguer</span> (#1807) means <span class="de">"unterscheiden"</span> or <span class="de">"erkennen"</span> and refers to the ability to perceive or identify differences between things.</p>
      <div class="examples">
        <div class="fr">Il arrive à distinguer les vrais billets des faux.</div>
        <div class="de spoiler">He can distinguish real banknotes from false ones.</div>
        <div class="fr">Dans l'obscurité, on ne peut pas distinguer les couleurs.</div>
        <div class="de spoiler">In the darkness you can't distinguish the colors.</div>
      </div>
      <p><span class="fr">Différencier</span> means <span class="de">"differenzieren"</span> or <span class="de">"make a difference"</span> and refers to consciously creating or emphasizing differences.</p>
      <div class="examples">
        <div class="fr">Cette entreprise cherche à différencier ses produits de ceux de la concurrence.</div>
        <div class="de spoiler">This company is trying to differentiate its products from those of its competitors.</div>
        <div class="fr">Il faut différencier les méthodes selon l'âge des élèves.</div>
        <div class="de spoiler">You have to differentiate the methods according to the age of the students.</div>
      </div>
      <p><span class="fr">Distinguer</span> stresses the perception of existing differences, while <span class="fr">différencier</span> the active creation or highlighting of differences implies.</p>
    </div>
  </div>
