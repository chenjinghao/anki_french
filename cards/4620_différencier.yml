Rang: 4620
Wort: différencier
Wortart: vt, vr

# Feel free to improve these fields!
Wort mit Artikel: différencier
Femininum / Plural: ''
IPA: \di.fe.ʁɑ̃.sje\
Definition: Distinguish, separate from each other
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Je sais *différencier* un compliment d'une flatterie.
  I can tell the difference between a compliment and a flattery.

  Il est important de *différencier* les champignons comestibles des toxiques.
  It is important to distinguish between edible mushrooms and toxic ones.

  L'enseignant utilise une pédagogie *différenciée* pour aider chaque élève.
  The teacher uses a different pedagogy to help each student.

  Les cellules de l'embryon commencent à se *différencier* dès la première semaine.
  The embryo's cells begin *to differentiate* from each other within the first week.

  Cette marque se *différencie* de ses concurrents par sa qualité.
  This brand differs from its competitors by its quality.

  Le daltonisme empêche de *différencier* certaines couleurs.
  Daltonism prevents you from distinguishing certain colors.

  Notre entreprise doit se *différencier* pour survivre sur le marché.
  Our company needs *to differentiate* itself to survive in the marketplace.

  Les jumeaux se *différencient* par leur personnalité.
  Twins differ in their personalities.

  Il faut *différencier* les faits des opinions dans les médias.
  We need *to differentiate* between the facts and the opinions in the media.

  Marie se *différencie* des autres par son accent étranger.
  Marie differs from others by her foreign accent.

  La couleur du plumage *différencie* le mâle de la femelle.
  The color of the feathers distinguishes the male from the female.

  Les experts peuvent facilement *différencier* un original d'une copie.
  Experts can easily distinguish between an original and a copy.

  Son style d'écriture se *différencie* nettement des autres auteurs.
  His writing style differs markedly from that of other authors.

  Comment *différencier* un rhume d'une grippe ?
  How do you tell a cold from a flu?

  L'intelligence *différencie* l'homme des autres espèces.
  Intelligence distinguishes man from other species.

  Les équipes se *différencient* par la couleur de leur maillot.
  The teams differ by the color of their jerseys.

  Pierre se *différencie* des autres élèves par sa créativité.
  Pierre differs from the other students in his creativity.

  Il est difficile de *différencier* ces deux variétés de roses.
  It's hard to tell the difference between these two varieties of roses.

  Les cultures commencent à se *différencier* avec la mondialisation.
  Cultures are starting *to differentiate* with globalization.

  L'expérience nous aide à *différencier* le vrai du faux.
  Experience helps us distinguish between true and false.

