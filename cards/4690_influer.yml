      <p>The main difference lies in the design: <span class="fr">influer sur quelque chose</span> versus <span class="fr">influencer quelqu'un</span>. While both verbs <span class="de">"Policy influence"</span> the <span class="fr">influer</span> rather for factual effects, and <span class="fr">influencer</span> used for personal influence.</p>
