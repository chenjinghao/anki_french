Notiz: |-
  <div class="section">
    <div class="section-title"><i>processus</i> and <i>procédure</i></div>
    <div class="section-content">
      <p><span class="fr">Processus</span> (#689) refers to a sequence of operations or a series of organized, successive operations aimed at a particular outcome.</p>
      <div class="examples">
        <div class="fr">J'ai écouté un reportage qui expliquait le processus de croissance économique.</div>
        <div class="de spoiler">I heard a report explaining the process of economic growth.</div>
      </div>

      <p><span class="fr">Procédure</span> (#993) describes a set of formalities or steps to be followed or a set of rules to be followed in a given situation.</p>
      <div class="examples">
        <div class="fr">La pilote a suivi scrupuleusement la procédure d'atterrissage que lui a indiquée la tour de contrôle.</div>
        <div class="de spoiler">The pilot followed the landing procedure prescribed by the control tower.</div>
      </div>

      <p>In summary, one can say: <span class="fr">processus</span> is a sequence of operations, and a <span class="fr">procédure</span> a framework for achieving a specific objective.</p>
    </div>
  </div>
