Notiz: |-
  <div class="section">
    <div class="section-title"><i>commencer</i> and <i>débuter</i></div>
    <div class="section-content">
      <p>Both verbs mean basically <span class="de">"to start"</span> or <span class="de">"to start"</span>The main difference lies in their grammatical use:</p>

      <p><span class="fr">Commencer</span> (#139) can be used with or without a direct object:</p>
      <div class="examples">
        <div class="fr">L'animatrice a commencé l'émission par un numéro humoristique.</div>
        <div class="de spoiler">The presenter started the show with a humorous number.</div>
        <div class="fr">Nous commencerons les travaux de rénovation la semaine prochaine.</div>
        <div class="de spoiler">We'll start the renovation next week.</div>
      </div>

      <p><span class="fr">Débuter</span> It is usually used without a direct object. It is often used with time signatures or in the context of careers:</p>
      <div class="examples">
        <div class="fr">Cette série télévisée débute le 20 septembre.</div>
        <div class="de spoiler">This TV series starts on September 20th.</div>
        <div class="fr">Elle a débuté comme simple choriste dans un groupe méconnu.</div>
        <div class="de spoiler">She began her career as a simple choir singer in an unknown band.</div>
      </div>

      <p class="tip">The use of <span class="fr">débuter</span> a direct object is often considered to be incorrect, even though it occurs in everyday speech.</p>
    </div>
  </div>
