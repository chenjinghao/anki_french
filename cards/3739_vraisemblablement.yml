Notiz: |-
  <div class="section">
    <div class="section-title"><i>vraisemblablement</i> and <i>probablement</i></div>
    <div class="section-content">
      <p><span class="fr">Vraisemblablement</span> means <span class="de">"probably"</span> or <span class="de">"seems to be".</span> and expresses that something appears to be true based on observations or logical conclusions.</p>
      <div class="examples">
        <div class="fr">Il arrivera vraisemblablement en retard, comme d'habitude.</div>
        <div class="de spoiler">He'll probably be late, as usual.</div>
        <div class="fr">C'est vraisemblablement la meilleure solution dans ce cas.</div>
        <div class="de spoiler">That seems to be the best solution in this case.</div>
      </div>
      <p><span class="fr">Probablement</span> (#903) also means <span class="de">"probably"</span>However, it emphasizes more on mathematical or statistical probability and is more commonly used in everyday situations.</p>
      <div class="examples">
        <div class="fr">Il va probablement pleuvoir demain.</div>
        <div class="de spoiler">It's probably going to rain tomorrow.</div>
        <div class="fr">Je serai probablement en retard à la réunion.</div>
        <div class="de spoiler">I'll probably be late for the meeting.</div>
      </div>
    </div>
  </div>
