# Please do not change these fields.
Rang: 3739
Wort: vraisemblablement
Wortart: adv

# Feel free to improve these fields!
Wort mit Artikel: vraisemblablement
Femininum / Plural: ''
IPA: \vʁɛ.sɑ̃.bla.blə.mɑ̃\
Definition: Probably
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Les prix resteront *vraisemblablement* stables.
  Prices are likely to remain stable.

  Il ne viendra *vraisemblablement* pas à la réunion demain.
  He *probably* won't come to the meeting tomorrow.

  *Vraisemblablement*, nous devrons reporter le pique-nique à cause de la pluie.
  We'll probably have to postpone the picnic because of the rain.

  Le train arrivera *vraisemblablement* avec une heure de retard.
  The train will *probably* arrive an hour late.

  Les résultats seront *vraisemblablement* publiés la semaine prochaine.
  The results are likely to be published next week.

  *Vraisemblablement*, elle a oublié notre rendez-vous.
  She must have forgotten our date.

  Le nouveau magasin ouvrira *vraisemblablement* ses portes en septembre.
  The new store is likely to open in September.

  C'est *vraisemblablement* la dernière fois que nous nous voyons cette année.
  This is *probably* the last time we'll see each other this year.

  Les travaux dureront *vraisemblablement* plus longtemps que prévu.
  The work is likely to take longer than expected.

  *Vraisemblablement*, il faudra compter deux heures pour arriver à destination.
  It probably takes two hours to get there.

  Le concert sera *vraisemblablement* complet ce soir.
  The concert is likely to be complete tonight.

  *Vraisemblablement*, cette espèce d'oiseau aura disparu d'ici dix ans.
  It is likely that this species of bird will be extinct within ten years.

