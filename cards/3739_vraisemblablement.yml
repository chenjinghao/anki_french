Notiz: |-
  <div class="section">
    <div class="section-title"><i>vraisemblablement</i> and <i>probablement</i></div>
    <div class="section-content">
      <p><span class="fr">Vraisemblablement</span> means <span class="de">"Probably"</span> or <span class="de">"To all appearances"</span> and expresses that something has the appearance of truth, based on observations or logical conclusions.</p>
      <div class="examples">
        <div class="fr">Il arrivera vraisemblablement en retard, comme d'habitude.</div>
        <div class="de spoiler">He'll probably be late, as usual.</div>
        <div class="fr">C'est vraisemblablement la meilleure solution dans ce cas.</div>
        <div class="de spoiler">This seems to be the best solution in this case.</div>
      </div>
      <p><span class="fr">Probablement</span> (#903) means ebenfalls <span class="de">"Probably"</span>However, it stresses the mathematical or statistical probability and is more frequently used in everyday situations.</p>
      <div class="examples">
        <div class="fr">Il va probablement pleuvoir demain.</div>
        <div class="de spoiler">It'll probably rain tomorrow.</div>
        <div class="fr">Je serai probablement en retard à la réunion.</div>
        <div class="de spoiler">I'm probably gonna be late for the meeting.</div>
      </div>
    </div>
  </div>
