Beispielsätze: |-
  Ne *sous-estimez* pas votre charme.
  Don't *underestimate* your charm.

  Tu *sous-estimes* toujours la valeur de cette vieille montre.
  You always underestimate the value of this old watch.

  L'expert avait *sous-estimé* le prix de ce tableau de plusieurs milliers d'euros.
  The expert had underestimated the price of this painting by several thousand euros.

  Je me *sous-estime* souvent, mais mes amis me rappellent mes qualités.
  I often underestimate myself, but my friends remind me of my qualities.

  Nous avons gravement *sous-estimé* la durée du trajet.
  We have seriously underestimated the duration of the journey.

  Les météorologues ont *sous-estimé* la force de la tempête.
  Meteorologists have underestimated the strength of the storm.

  Marie *sous-estime* complètement ses chances de réussir l'examen.
  Marie completely underestimates her chances of passing the exam.

  En *sous-estimant* nos concurrents, nous avons perdu des clients importants.
  By underestimating our competitors, we have lost important customers.

  L'architecte a *sous-estimé* le coût total de la construction.
  The architect has underestimated the total cost of the construction.

  Il ne faut jamais *sous-estimer* l'importance d'une bonne préparation.
  We must never *underestimate* the importance of good preparation.

  Pierre *sous-estime* systématiquement ses compétences professionnelles.
  Pierre systematically underestimates his professional skills.

  Les dangers de la montagne sont souvent *sous-estimés* par les débutants.
  The dangers of the mountain are often underestimated by beginners.

  En *sous-estimant* la difficulté de l'exercice, j'ai échoué.
  Because I underestimated the difficulty of the task, I failed.

  N'as-tu pas *sous-estimé* l'impact de tes paroles sur elle ?
  Didn't you underestimate the effect of your words on them?

