Rang: 974
Wort: outre
Wortart: nf, prep, adv

# Feel free to improve these fields!
Wort mit Artikel: outre
Femininum / Plural: ''
IPA: \utʁ\
Definition: except; in addition
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Il a *en outre* publié deux ouvrages.
  He has also published two books.

  *Outre* les bagages, nous avions les chiens avec nous.
  Besides the luggage, we had the dogs with us.

  *Outre* qu'ils vivent à six dans trois pièces, ils ont un chien et un chat.
  Besides living in six rooms in three, they have a dog and a cat.

  Nous devons apporter, *outre* les témoignages, des preuves écrites.
  *In addition* to testimony, we must provide written evidence.

  "Il était *plein comme une outre* après la fête d'hier soir."
  "It was *full like a sack* after the party last night".

  Elle a décidé de *passer outre* à l'interdiction et d'entrer quand même.
  She decided to override the ban and still come in.

  *Outre le fait que* cela est connu, c'est aussi très important.
  *In addition to the fact that* this is known, it is also very important.

  Les nouvelles *outre-Atlantique* sont souvent surprenantes pour nous.
  The news across the Atlantic is often surprising to us.

  Il ne faut pas boire *outre mesure*, cela peut être dangereux.
  You should not drink too much, it can be dangerous.

  *En outre*, je voudrais souligner l'importance de cette décision.
  *In addition*, I would like to emphasize the importance of this decision.

  La situation *outre-Rhin* semble s'améliorer progressivement.
  The situation beyond the Rhine seems to be gradually improving.

  *Outre* son travail, elle s'occupe de trois enfants.
  In addition to her work, she cares for three children.

  Il ne faut pas s'inquiéter *outre mesure* pour des petits problèmes.
  There is no need to worry too much about small problems.

  L'explorateur a rempli son *outre* d'eau fraîche avant de partir.
  The explorer filled his sack with cold water before leaving.

  Les relations *outre-Manche* sont compliquées depuis le Brexit.
  Overseas relations have been complicated since Brexit.

  "Ça ne l'a pas étonné *outre mesure*."
  "It didn't surprise him too much".

  *Outre* ses compétences professionnelles, son attitude positive est très appréciée.
  In addition to her professional skills, her positive attitude is highly appreciated.

  Le chevalier a traversé les terres *outre-monts* pour rejoindre son royaume.
  The rider has crossed the mountains to join his kingdom.

  *En outre*, nous devons considérer les conséquences à long terme.
  We also need to consider the long-term consequences.

  L'entreprise a décidé de *passer outre* aux recommandations du comité.
  The company decided to ignore the committee's recommendations.

  *Outre* le prix élevé, la qualité du produit laisse à désirer.
  In addition to the high price, the quality of the product leaves something to be desired.

  La flèche l'a transpercé *d'outre en outre*.
  The arrow pierced him further.

  *Outre que* c'est illégal, c'est aussi moralement répréhensible.
  *In addition to* being illegal, it is morally reprehensible.

  Elle ne s'est pas formalisée *outre mesure* de cette remarque déplacée.
  She did not overly formalize this unreasonable remark.

