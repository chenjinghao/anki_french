Wort mit Artikel: systématiquement
Femininum / Plural: ''
IPA: \sis.te.ma.tik.mɑ̃\
Definition: systematic, always
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
