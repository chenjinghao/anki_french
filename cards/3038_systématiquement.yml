Beispielsätze: |-
  Ce genre de choses sort *systématiquement*.
  This kind of thing happens systematically.

  Il refuse *systématiquement* toutes nos propositions.
  He categorically rejects all our proposals.

  Les données ont été *systématiquement* collectées et analysées.
  The data were systematically collected and analysed.

  Elle vérifie *systématiquement* son travail avant de le soumettre.
  She systematically checks her work before submitting it.

  Les faits ont été *systématiquement* groupés par catégorie.
  The facts were systematically grouped by categories.

  Le gouvernement s'abstient *systématiquement* de commenter cette affaire.
  The government consistently abstains from commenting on this matter.

  Cet ouvrage traite *systématiquement* de l'histoire de l'art moderne.
  This work systematically deals with the history of modern art.

  Les termes de la question ont été *systématiquement* repris dans la conclusion.
  The concepts of the question were systematically revisited in the conclusion.

  Les adolescents ont tendance à contester *systématiquement* les valeurs établies.
  Young people tend to systematically question established values.

  Dans ce pays, les nouveau-nés sont *systématiquement* vaccinés contre la rougeole.
  In this country, newborns are systematically vaccinated against measles.

  Elle arrive *systématiquement* en retard à nos rendez-vous.
  She's systematically late for our appointments.

  Le logiciel met *systématiquement* à jour la base de données chaque nuit.
  The software systematically updates the database every night.

  Notre équipe vérifie *systématiquement* la qualité de chaque produit.
  Our team systematically checks the quality of each product.

  Il faut aborder *systématiquement* chaque problème pour trouver une solution efficace.
  It is necessary to tackle every problem systematically in order to find an effective solution.

  Cette méthode renvoie *systématiquement* la valeur 1000.
  This method *always* returns a value of 1000.

  Toute modification sera *systématiquement* publiée sur ce site web avant son entrée en vigueur.
  Changes will *always* be published on this website before entry into force.

  Il s'agit *systématiquement* de commencer par vous.
  The work *always* starts with yourself.

  Utilisez *systématiquement* une nouvelle aiguille stérile pour chaque injection.
  *Always* use a new sterile needle for each injection.

