Notiz: |-
  <div class="section">
    <div class="section-title"><i>se marier</i> and <i>épouser</i></div>
    <div class="section-content">
      <p><span class="fr">Se marier</span> #1686) means <span class="de">"married"</span> as a reflexive verb and describes the act of marriage from the perspective of the person who marries. <span class="fr">avec</span> used when the partner is named.</p>
      <div class="examples">
        <div class="fr">Ils se sont mariés en juin dernier.</div>
        <div class="de spoiler">They got married last June.</div>
        <div class="fr">Elle s'est mariée avec son ami d'enfance.</div>
        <div class="de spoiler">She married her teenage boyfriend.</div>
      </div>

      <p><span class="fr">Épouser</span> is a transitive verb and also means <span class="de">"married"</span>It emphasizes the relationship between the spouses and is often used in more formal contexts.</p>
      <div class="examples">
        <div class="fr">Il a épousé sa collègue de travail.</div>
        <div class="de spoiler">He married his work colleague.</div>
        <div class="fr">Elle va épouser le fils du boulanger.</div>
        <div class="de spoiler">She's going to marry the baker's son.</div>
      </div>

      <p>In the transferable sense it can be <span class="fr">épouser</span> It also means accepting a thing or an idea completely or attributing it to yourself.</p>
      <div class="examples">
        <div class="fr">Il a épousé la cause environnementale.</div>
        <div class="de spoiler">He's committed to environmental issues.</div>
      </div>
    </div>
  </div>
