Notiz: |-
  <div class="section">
    <div class="section-title"><i>se marier</i> and <i>épouser</i></div>
    <div class="section-content">
      <p><span class="fr">Se marier</span> (#1686) means <span class="de">"heiraten"</span> as a reflexive verb and describes the act of marriage from the perspective of the person who marries. It is associated with the preposition <span class="fr">avec</span> used when the partner is called.</p>
      <div class="examples">
        <div class="fr">Ils se sont mariés en juin dernier.</div>
        <div class="de spoiler">You got married last June.</div>
        <div class="fr">Elle s'est mariée avec son ami d'enfance.</div>
        <div class="de spoiler">She married her childhood friend.</div>
      </div>

      <p><span class="fr">Épouser</span> is a transitive verb and also means <span class="de">"heiraten"</span>But it requires a direct object – the person you marry. It emphasizes more strongly the relationship between spouses and is often used in more formal contexts.</p>
      <div class="examples">
        <div class="fr">Il a épousé sa collègue de travail.</div>
        <div class="de spoiler">He married his workmate.</div>
        <div class="fr">Elle va épouser le fils du boulanger.</div>
        <div class="de spoiler">She's going to marry the baker's son.</div>
      </div>

      <p>For the purposes of the delegated act: <span class="fr">épouser</span> also mean that one accepts or prescribes a thing or idea completely:</p>
      <div class="examples">
        <div class="fr">Il a épousé la cause environnementale.</div>
        <div class="de spoiler">He's committed to environmental issues.</div>
      </div>
    </div>
  </div>
