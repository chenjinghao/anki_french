Beispielsätze: |-
  Trop d'événements néfastes sont *survenus* cette année.
  Too many unfortunate events have occurred this year.

  Une panne d'électricité est *survenue* pendant la réunion importante.
  During the important meeting a power failure *occurred*.

  Si des complications *surviennent*, n'hésitez pas à contacter votre médecin.
  If *unexpected* complications *occur*, do not hesitate to contact your doctor.

  Le changement climatique *survient* plus rapidement que prévu.
  Climate change occurs faster than expected.

  "Que faire si un incendie *survient* pendant la nuit ?"
  "What if a fire *breaks* out at night?"

  Une opportunité inattendue est *survenue* dans sa carrière.
  An unexpected opportunity has arisen in his career.

  Des problèmes techniques sont *survenus* lors du lancement du satellite.
  The launch of the satellite has caused technical problems.

  Si des témoins *surviennent*, nous devrons interrompre notre conversation.
  If witnesses *suddenly* *show up*, we have to interrupt our conversation.

  Un miracle est *survenu* au moment où tout semblait perdu.
  A miracle happened when everything seemed lost.

  L'accident est *survenu* sans que personne ne puisse l'anticiper.
  The accident happened without anyone knowing it.

  Des changements inattendus sont *survenus* dans le programme de la conférence.
  The conference programme has undergone unforeseen changes.

  Un quiproquo fâcheux est *survenu* entre les deux collègues.
  There has been an annoying misunderstanding between the two colleagues.

  Si un problème *survient*, n'hésitez pas à m'appeler, même tard dans la nuit.
  *If* a problem occurs, don't hesitate to call me, even late at night.

  La crise économique est *survenue* de manière brutale et inattendue.
  The economic crisis *has occurred* suddenly and unexpectedly.

