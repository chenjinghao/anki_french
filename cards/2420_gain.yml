Notiz: |-
  <div class="section">
    <div class="section-title"><i>profit</i>, <i>bénéfice</i> and <i>gain</i></div>
    <div class="section-content">
      <p><span class="fr">Profit</span> (#1032) often refers to an advantage or gain from a situation and is not used exclusively for financial gains. It can be broader and sometimes non-material.</p>
      <div class="examples">
        <div class="fr">Il a vendu sa voiture en faisant un gros profit.</div>
        <div class="de spoiler">He sold his car with a big profit.</div>
        <div class="fr">Elle tire profit de chaque opportunité pour apprendre quelque chose de nouveau.</div>
        <div class="de spoiler">She uses every opportunity to learn something new.</div>
      </div>
      <p><span class="fr">Bénéfice</span> (#1915) is mostly used in its financial sense and refers specifically to the net profit - the surplus after deduction of all costs. It is often used in the context of business and accounting.</p>
      <div class="examples">
        <div class="fr">L'entreprise a déclaré un bénéfice net de trois millions d'euros pour l'année fiscale passée.</div>
        <div class="de spoiler">The company has declared a net profit of three million euros for the past financial year.</div>
        <div class="fr">Les bénéfices de la vente seront investis dans la recherche et le développement.</div>
        <div class="de spoiler">The profits from the sale are invested in research and development.</div>
      </div>
      <p><span class="fr">Gain</span> describes a concrete increase or profit, whether financial, material or in the form of an advantage. It is often more specific and tangible than <span class="fr">profit</span>.</p>
      <div class="examples">
        <div class="fr">Le gain de temps grâce à cette nouvelle méthode est considérable.</div>
        <div class="de spoiler">The time gained by this new method is considerable.</div>
        <div class="fr">Son gain à la loterie lui a permis d'acheter une maison.</div>
        <div class="de spoiler">His winnings in the lottery allowed him to buy a house.</div>
      </div>
    </div>
  </div>
