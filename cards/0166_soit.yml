Rang: 166
Wort: soit
Wortart: adv, conj

# Feel free to improve these fields!
Wort mit Artikel: soit
Femininum / Plural: ''
IPA: \swa\
Definition: either ... or; agree; i.e.
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  *Soit* il est une star, *soit* il n'est rien.
  *Either* he's a star, *or* he's nothing.

  *Soit* qu'il pleuve, *soit* qu'il neige, nous irons à la montagne.
  Whether it's raining *or* snowing, we're going to the mountains.

  *Soit* ! Je vais accepter ta proposition.
  All right, I'll take your suggestion.

  Il faut choisir : *soit* tu restes, *soit* tu pars.
  You have to decide: *either* you stay *or* you leave.

  L'incendie a détruit la forêt, *soit* 500 hectares de bois.
  The fire destroyed the forest, which means 500 hectares of forest.

  *Soit* deux droites parallèles qui ne se croisent jamais.
  There are two parallel lines that never cut.

  *Soit* que tu viennes, *soit* que tu restes, je serai content.
  Whether you're coming *or* staying, I'll be happy.

  Il a lu *soit* des romans, *soit* des essais pendant ses vacances.
  He read *either* novels *or* essays on vacation.

  *Soit* ! Je vais essayer de comprendre.
  I'll try to understand.

  Il a acheté trois livres, *soit* un total de 50 euros.
  He bought three books, that is 50 euros in total.

  *Soit* qu'il soit malade, *soit* qu'il n'ait pas envie, il ne viendra pas.
  *Either* he's sick *or* he doesn't want to, he won't come.

  *Soit* ! Mais n'oublie pas de me prévenir la prochaine fois.
  All right, but don't forget to let me know next time.

  Vous pouvez venir *soit* aujourd'hui, *soit* demain.
  You can come *either* today *or* tomorrow.

  Il a commandé deux pizzas, *soit* une pour chacun.
  He ordered two pizzas, that is one for everyone.

  *Soit* que tu aies raison, *soit* que tu te trompes, il faut agir.
  Whether you're right *or* wrong, we have to act.

  *Soit* ! Je vais le faire moi-même.
  All right, I'll do it myself.

  Il a pris *soit* le train, *soit* l'avion pour aller à Paris.
  He went to Paris *either* by train *or* by plane.

  *Soit* un cercle de rayon 5 cm.
  There is a circle with a radius of 5 cm.

  *Soit* ! Mais je ne suis pas convaincu.
  All right, but I'm not convinced.

  Il a dépensé 100 euros, *soit* tout son argent de poche.
  He spent 100 euros, that is, all his pocket money.

  *Soit* que tu sois fatigué, *soit* que tu n'aies pas envie, repose-toi.
  Whether you're tired *or* not, get some rest.

  Il a acheté *soit* des pommes, *soit* des poires au marché.
  He bought *either* apples *or* pears at the market.

  *Soit* ! Mais tu me dois une explication.
  *Good*, but you owe me an explanation.

  Il a choisi *soit* de partir, *soit* de rester.
  He decided to *either* go *or* stay.

  *Soit* ! Fais comme tu veux.
  All right, do whatever you want.

