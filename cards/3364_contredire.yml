Beispielsätze: |-
  J'aimerais que vous le *contredisiez*.
  I'd like you to contradict that.

  Il ne veut pas *contredire* son patron devant les autres.
  He doesn't want to contradict his boss in front of others.

  Les résultats de l'étude *contredisent* complètement nos attentes.
  The results of the study completely contradict our expectations.

  Marie s'est *contredite* plusieurs fois pendant l'entretien.
  Marie contradicted herself several times during the interview.

  Ces deux experts ne cessent de se *contredire*.
  These two experts constantly contradict each other.

  Mon expérience personnelle *contredit* cette théorie.
  My personal experience contradicts this theory.

  Les témoins se sont *contredits* sur plusieurs points.
  The witnesses disagreed on several points.

  Je ne peux pas *contredire* les faits présentés.
  I cannot contradict the facts presented.

  Ses actions *contredisent* totalement ses paroles.
  His actions completely contradict his words.

  Les deux rapports se *contredisent* sur des points essentiels.
  The two reports contradict each other on key points.

  N'osez-vous pas me *contredire* ?
  Don't you dare to contradict me?

  Je n'y *contredis* pas.
  I don't disagree with that.

  Thomas aime *contredire* tout le monde juste pour le plaisir.
  Thomas likes to contradict everyone just for fun.

  La réalité *contredit* souvent nos espérances.
  The reality often contradicts our expectations.

  Ces nouvelles données *contredisent* l'hypothèse initiale.
  These new data contradict the original hypothesis.

  Les deux versions de l'histoire se *contredisent*.
  The two versions of the story contradict each other.

  Il déteste être *contredit*.
  He hates to be contradicted.

  Personne n'ose *contredire* ses arguments.
  No one dares to contradict his arguments.

