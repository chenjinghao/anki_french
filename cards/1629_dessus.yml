Notiz: |-
  <p><span class="fr">Dessus</span> can be used as adverb, as nouns and in prepositional expressions.</p>

  <h3>As adverb</h3>
  <p><span class="fr">Dessus</span> is mainly used as adverb and means <span class="de">"darauf"</span> or <span class="de">"oben"</span>. It denotes the upper side or the upper part of something.</p>
  <div class="examples">
    <div class="fr">Mona a pris la chaise et s'est assise <u>dessus</u>.</div>
    <div class="de spoiler">Mona took the chair and sat down <u>darauf</u>.</div>
    <div class="fr">Regarde <u>dessus</u>, il y a plein de poussière.</div>
    <div class="de spoiler">Schau <u>oben</u>It's full of dust.</div>
  </div>

  <h3>As Nouns</h3>
  <p>A noun is defined as: <span class="fr">dessus</span> the upper part of something. It can also be used in compound nouns.</p>
  <div class="examples">
    <div class="fr">J'ai mis de la crème fouettée sur le <u>dessus</u> de son gâteau d'anniversaire.</div>
    <div class="de spoiler">I've got whipped cream on the <u>Oberseite</u> seines Geburtstagskuchens gegeben.</div>
    <div class="fr">Elle s'est acheté un magnifique <u>dessus-de-lit</u>!</div>
    <div class="de spoiler">She's got herself a beautiful <u>Tagesdecke</u> gekauft!</div>
  </div>

  <h3>As Preposition</h3>
  <p>The use of <span class="fr">dessus</span> as an independent preposition is considered outdated:</p>
  <div class="examples">
    <div class="fr wrong">Mettez le livre <u>dessus</u> la table.</div>
    <div class="fr">Mettez le livre <u>sur</u> la table.</div>
    <div class="de spoiler">Put the book <u>on</u> The table.</div>
  </div>
  <p>Instead, it is used in prepositional expressions – e.g. <span class="fr">au-dessus</span> (#1480) – used, often written with hyphen.</p>
  <div class="examples">
    <div class="fr">Il te faudrait une pointure <u>au-dessus</u>.</div>
    <div class="de spoiler">You need a size <u>about</u>.</div>
    <div class="fr">Le chien a sauté <u>par-dessus</u> la clôture.</div>
    <div class="de spoiler">The dog is <u>on</u> The fence jumped.</div>
    <div class="fr">Enlève tes pieds <u>de dessus</u> mon canapé neuf!</div>
    <div class="de spoiler">Take your feet <u>from</u> meinem neuen Sofa!</div>
  </div>
