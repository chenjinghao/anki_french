Notiz: |-
  <div class="section">
    <div class="section-title">The Court of Auditors <i>bœuf</i>, <i>œuf</i> and <i>os</i></div>
    <div class="section-content">
      <p>The three words <span class="fr">bœuf</span> (#3914), <span class="fr">œuf</span> #2685) and <span class="fr">os</span> are the only ones in French whose final consonants are pronounced in singular but not in plural  a peculiarity of Old French!</p>

      <p><strong>In the singular:</strong></p>
      <div class="examples">
        <div class="fr force-audio">un bœuf <span class="ipa">[bœf]</span></div>
        <div class="fr force-audio">un œuf <span class="ipa">[œf]</span></div>
        <div class="fr force-audio">un os <span class="ipa">[ɔs]</span></div>
      </div>

      <p><strong>In the plural:</strong></p>
      <div class="examples">
        <div class="fr force-audio">des bœufs <span class="ipa">[bø]</span></div>
        <div class="fr force-audio">des œufs <span class="ipa">[ø]</span></div>
        <div class="fr force-audio">des os <span class="ipa">[o]</span></div>
      </div>

      <p>This rule is derived from Old French, where final consonants were not pronounced before the plural. It was not until the 19th century that the distinction between singular and plural was established.</p>
    </div>
  </div>
