Notiz: |-
  <div class="section">
    <div class="section-title">Debates of the European Parliament <i>bœuf</i>, <i>œuf</i> and <i>os</i></div>
    <div class="section-content">
      <p>The Three Words <span class="fr">bœuf</span> (#3914), <span class="fr">œuf</span> (#2685) and <span class="fr">os</span> are the only ones in French whose final consonants are pronounced in the singular, but not in the plural – a peculiarity from the Old French!</p>

      <p><strong>Im Singular:</strong></p>
      <div class="examples">
        <div class="fr force-audio">un bœuf <span class="ipa">[bœf]</span></div>
        <div class="fr force-audio">un œuf <span class="ipa">[œf]</span></div>
        <div class="fr force-audio">un os <span class="ipa">[ɔs]</span></div>
      </div>

      <p><strong>Im Plural:</strong></p>
      <div class="examples">
        <div class="fr force-audio">des bœufs <span class="ipa">[bø]</span></div>
        <div class="fr force-audio">des œufs <span class="ipa">[ø]</span></div>
        <div class="fr force-audio">des os <span class="ipa">[o]</span></div>
      </div>

      <p>This rule comes from the Old French, where end consonants were not pronounced before the plural. Only in the 19th century did the present distinction between singular and plural become established.</p>
    </div>
  </div>
