Wort mit Artikel: croître
Femininum / Plural: ''
IPA: \kʁwatʁ\
Definition: Growing up
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Les bureaucraties ont tendance à *croître* et à s'étendre.
  Bureaucracies tend to grow and expand.

  Les blés *croissent* dans les champs dorés.
  Wheat grows in golden fields.

  Sa popularité ne fait que *croître* depuis son dernier film.
  His popularity has only grown since his last film.

  L'inquiétude *croissait* dans son esprit jour après jour.
  Worry grew in his mind day by day.

  Le chômage a *crû* de manière significative cette année.
  Unemployment has risen significantly this year.

  Les jeunes arbres *croissent* rapidement au printemps.
  Young trees grow quickly in the spring.

  Son influence *croît* de jour en jour.
  His influence grows day by day.

  La production industrielle a *crû* de 5% au dernier trimestre.
  Industrial production grew by 5% in the last quarter.

  Cette petite fille ne fait que *croître* et embellir.
  This little girl is just *growing up* and making herself beautiful.

  Les prix ne cessent de *croître* depuis le début de l'année.
  Prices have been rising steadily since the beginning of the year.

  Le niveau d'eau *croît* rapidement pendant la saison des pluies.
  The water level rises rapidly during the rainy season.

  Les bambous peuvent *croître* de plusieurs centimètres par jour.
  Bamboos can grow up to several centimeters a day.

  La tension *croissait* entre les deux pays.
  Tensions between the two countries were growing.

  Ces fleurs sauvages *croissent* naturellement dans la région.
  These wildflowers grow naturally in the area.

  L'enthousiasme de la foule *croissait* à chaque minute.
  The enthusiasm of the crowd grew from minute to minute.

  La lune *croît* pendant la première moitié du mois.
  The moon grows during the first half of the month.

  Son talent ne fait que *croître* avec les années.
  His talent only grows with age.

  Les vignes *croissent* particulièrement bien sur ce coteau.
  Vineyards grow particularly well on this hill.

  La chaleur *croissait* au fil de la journée.
  The heat was rising throughout the day.

  Le bruit de la ville *va croissant* chaque année.
  The city's noise is increasing every year.

  Les difficultés *croissent* à mesure que le projet avance.
  The difficulties increase as the project progresses.

  L'herbe *croît* plus vite après la pluie.
  The grass grows faster after the rain.

  Sa réputation *croît* dans le monde entier.
  His reputation is *growing* all over the world.

  Le nombre de participants *croît* chaque année.
  The number of participants is increasing every year.

