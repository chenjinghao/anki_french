Notiz: |-
  <div class="section">
    <div class="section-title"><i>grandir</i> and <i>croître</i></div>
    <div class="section-content">
      <p><span class="fr">Grandir</span> (#1936) is typically used to describe the physical growth of living things, especially humans, or personal development.</p>
      <div class="examples">
        <div class="fr">Les enfants grandissent vite.</div>
        <div class="de spoiler">Kids grow up fast.</div>
        <div class="fr">Il a grandi dans un petit village.</div>
        <div class="de spoiler">He grew up in a small village.</div>
        <div class="fr">Elle a beaucoup grandi pendant l'été.</div>
        <div class="de spoiler">She's grown a lot in the summer.</div>
      </div>
      <p><span class="fr">Croître</span> is generally used for natural, organic growth or increase, often in an ecological or economic context.</p>
      <div class="examples">
        <div class="fr">La population mondiale continue de croître.</div>
        <div class="de spoiler">The world's population continues to grow.</div>
        <div class="fr">Les plantes croissent mieux avec suffisamment de lumière.</div>
        <div class="de spoiler">Plants grow better with enough light.</div>
        <div class="fr">L'économie du pays a cru de 3% l'année dernière.</div>
        <div class="de spoiler">The country's economy grew by 3% last year.</div>
      </div>
    </div>
  </div>
