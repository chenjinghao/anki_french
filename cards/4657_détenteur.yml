Notiz: |-
  <div class="section">
    <div class="section-title"><i>détenteur</i> and <i>propriétaire</i></div>
    <div class="section-content">
      <p><span class="fr">Détenteur</span> means <span class="de">"Holder"</span> or <span class="de">"Officer"</span> and means a person who has an animal or an object in his care and is responsible for it, without necessarily being the owner.</p>
      <div class="examples">
        <div class="fr">Le détenteur du cheval doit tenir un registre d'élevage.</div>
        <div class="de spoiler">The owner of the horse must keep a breeding register.</div>
        <div class="fr">En tant que détenteur de cette carte, vous êtes responsable de sa sécurité.</div>
        <div class="de spoiler">As the owner of this card, you are responsible for its security.</div>
      </div>
      <p><span class="fr">Propriétaire</span> means <span class="de">"Owners"</span> And it means the person who is legally in possession of something and can have it.</p>
      <div class="examples">
        <div class="fr">Le propriétaire de l'équidé doit déclarer le changement de propriété.</div>
        <div class="de spoiler">The owner of the horse must report the transfer of ownership.</div>
        <div class="fr">Elle est propriétaire de cette maison depuis dix ans.</div>
        <div class="de spoiler">She's owned this house for ten years.</div>
      </div>
      <p>The difference is that the <span class="fr">détenteur</span> is responsible for the practical care and care while the <span class="fr">propriétaire</span> A person can have both roles at the same time.</p>
    </div>
  </div>
