Notiz: |-
  <div class="section">
    <div class="section-title"><i>détenteur</i> and <i>propriétaire</i></div>
    <div class="section-content">
      <p><span class="fr">Détenteur</span> means <span class="de">"Halter"</span> or <span class="de">"Betreuer"</span> and designates a person who has an animal or an object in his care and is responsible for it without necessarily being the owner.</p>
      <div class="examples">
        <div class="fr">Le détenteur du cheval doit tenir un registre d'élevage.</div>
        <div class="de spoiler">The keeper of the horse must keep a breeding record.</div>
        <div class="fr">En tant que détenteur de cette carte, vous êtes responsable de sa sécurité.</div>
        <div class="de spoiler">As the holder of this card, you are responsible for your safety.</div>
      </div>
      <p><span class="fr">Propriétaire</span> means <span class="de">"owner"</span> and designates the person who is legally in possession of something and who can dispose of it.</p>
      <div class="examples">
        <div class="fr">Le propriétaire de l'équidé doit déclarer le changement de propriété.</div>
        <div class="de spoiler">The owner of the horse must register the transfer of ownership.</div>
        <div class="fr">Elle est propriétaire de cette maison depuis dix ans.</div>
        <div class="de spoiler">She's been the owner of this house for ten years.</div>
      </div>
      <p>The difference is that the <span class="fr">détenteur</span> is responsible for the practical care and care, while the <span class="fr">propriétaire</span> a person may hold both roles at the same time.</p>
    </div>
  </div>
