Notiz: |-
  <div class="section">
    <div class="section-title"><i>se rappeler</i> and <i>se souvenir</i></div>
    <div class="section-content">
      <p><span class="fr">Se rappeler</span> (#208) and <span class="fr">se souvenir</span> Both mean "remember" but have syntactical differences:</p>

      <p>1. <span class="fr">Se rappeler</span> is used with a direct object without a preposition:</p>
      <div class="examples">
        <div class="fr">Je me rappelle les vacances de ma jeunesse.</div>
        <div class="de spoiler">I remember the holidays of my youth.</div>
      </div>

      <p>2. <span class="fr">Se souvenir</span> is replaced by the following: <b>de</b> used:</p>
      <div class="examples">
        <div class="fr">Je me souviens <u>des</u> vacances de ma jeunesse.</div>
        <div class="de spoiler">I remember the holidays of my youth.</div>
      </div>

      <p>Specific features:</p>
      <ul>
        <li><span class="fr">Se rappeler de</span> is widely used but not recommended in the standard language.</li>
        <li>The pronoun is <span class="fr">se rappeler <u>de</u></span> permitted: <span class="fr">Je me rappelle de vous.</span></li>
        <li>The infinitive can be <span class="fr">se rappeler <u>de</u></span> used: <span class="fr">Rappelle-toi de me téléphoner.</span></li>
        <li><span class="fr">se rappeler</span> used <b>le</b> as a pronoun, <span class="fr">se souvenir</span> used <b>en</b>:
          <span class="fr">Je me <u>le</u> rappelle.</span> (i.e. the number of days) <span class="fr">Je m'<u>en</u> souviens.</span>
        </li>
      </ul>
    </div>
  </div>
