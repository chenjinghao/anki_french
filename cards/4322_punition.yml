Notiz: |-
  <div class="section">
    <div class="section-title"><i>sanction</i> and <i>punition</i></div>
    <div class="section-content">
      <p><span class="fr">Sanction</span> (#2282) means <span class="de">"Sanktion"</span> or <span class="de">Action</span> and is used in formal or official contexts. It denotes a consequence imposed by an authority.</p>
      <div class="examples">
        <div class="fr">Le conseil de discipline a pris des sanctions contre l'étudiant.</div>
        <div class="de spoiler">The Disciplinary Council has imposed sanctions on the student.</div>
        <div class="fr">Les sanctions économiques ont été levées.</div>
        <div class="de spoiler">Economic sanctions have been lifted.</div>
      </div>
      <p><span class="fr">Punition</span> means <span class="de">"Strafe"</span> or <span class="de">"Bestrafung"</span> and is used more frequently in everyday or personal contexts, especially in raising children.</p>
      <div class="examples">
        <div class="fr">Sa punition était de ranger sa chambre.</div>
        <div class="de spoiler">His punishment was to clean up his room.</div>
        <div class="fr">L'enfant a reçu une punition pour avoir menti.</div>
        <div class="de spoiler">The child was punished for lying.</div>
      </div>
      <p><span class="fr">Sanction</span> is used more in institutional or legal contexts, while <span class="fr">punition</span> is more personal and less formal.</p>
    </div>
  </div>
