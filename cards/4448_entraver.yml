Wort mit Artikel: entraver
Femininum / Plural: ''
IPA: \ɑ̃.tʁa.ve\
Definition: to impede
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Son pantalon *entravait* la liberté de ses mouvements.
  His pants were restricting his freedom of movement.

  Les manifestants ont *entravé* la circulation dans le centre-ville.
  Protesters blocked traffic in the city centre.

  Le fermier a dû *entraver* ses chevaux pour la nuit.
  The farmer must have stopped his horses for the night.

  La crise sanitaire *entrave* le développement économique du pays.
  The health crisis is hampering the country's economic development.

  Sa jupe étroite *entravait* sa marche dans les escaliers.
  Her tight skirt prevented her from walking up the stairs.

  Les gardes ont *entravé* le prisonnier avant de le transporter.
  The guards blocked the prisoner before transporting him.

  Ces nouvelles règles *entravent* la créativité des artistes.
  These new rules hinder the creativity of artists.

  La neige *entrave* le bon fonctionnement des trains.
  Snow hinders the proper operation of trains.

  Les préjugés *entravent* souvent le progrès social.
  Prejudice often hinders social progress.

  "Je n'*entrave* que dalle à ce qu'il raconte."
  "I don't care what he says".

  La bureaucratie excessive *entrave* l'innovation des entreprises.
  Excessive bureaucracy is a barrier to business innovation.

  Le berger *entrave* ses moutons pendant la tonte.
  The shepherd hinders his sheep during the shearing.

  Les travaux routiers *entravent* l'accès au centre commercial.
  Road works prevented access to the shopping centre.

  Cette décision politique *entrave* nos plans d'expansion.
  This political decision is hampering our expansion plans.

  La peur de l'échec *entrave* souvent notre réussite.
  Fear of failure often hinders our success.

  Les mauvaises conditions météorologiques *entravent* le sauvetage.
  Bad weather is hindering the rescue.

