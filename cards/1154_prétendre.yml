Beispielsätze: |-
  Il *prétend* avoir un portable.
  He *claims* to have a cell phone.

  À ce qu'on *prétend*, il est millionnaire.
  He's supposed to be a millionaire.

  Je ne *prétends* pas vous convaincre, mais écoutez mon point de vue.
  I'm not trying to convince you, but listen to my point.

  L'entreprise *prétend* à une créance en contrepartie des services fournis.
  The company *claims* a claim in return for the services provided.

  Certains politiciens *prétendent* aux honneurs sans les mériter.
  Some politicians claim honor without deserving it.

  Elle *prétend* à un poste de directrice dans notre société.
  She's running for a position as a director in our company.

  Au XIX<sup>e</sup> siècle, il était courant de *prétendre* à la main d'une femme en demandant la permission à son père.
  In the 19th century, it was common to claim a woman's hand by asking permission from her father.

  Il se *prétend* insulté par mes propos, mais je n'ai rien dit de mal.
  He *claims* he's insulted by what I said, but I didn't say anything wrong.

  Bien qu'il n'ait jamais étudié la médecine, il se *prétend* médecin.
  Although he never studied medicine, he *claims* to be a doctor.

  Le roi *prétendait* être obéi sans discussion.
  The king *claimed* to be obeyed without question.

  Que *prétendez*-vous faire face à cette crise ?
  What do you intend to do about this crisis?

  Il *prétend* nous donner des leçons de morale, mais son propre comportement est discutable.
  He *claims* to teach us moral lessons, but his own behavior is questionable.

  Plusieurs pays *prétendent* à ce titre de champion du monde.
  Many countries claim the title of world champion.

  Elle *prétend* m'avoir prévenu, mais je n'ai reçu aucun message.
  She *claims* to have warned me, but I didn't get any messages.

  Il se *prétend* persécuté par ses collègues, mais c'est lui qui crée des conflits.
  He *claims* to be persecuted by his colleagues, but he is the one who creates conflicts.

  Je ne *prétends* pas qu'il ait dit cela, mais ses actions le suggèrent.
  I don't claim he said that, but his actions suggest it.

  Il *prétend* être le seul à savoir résoudre ce problème complexe.
  He *claims* to be the only one who knows how to solve this complex problem.

  Vous *prétendez* le convaincre, mais ses opinions sont bien ancrées.
  You pretend to convince him, but his opinions are deeply rooted.

  Il *prétend* qu'on lui obéisse en tout, comme s'il était un dictateur.
  He demands obedience in all things, as if he were a dictator.

  Vous pouvez *prétendre* à une indemnité suite à cet accident de travail.
  You can claim compensation for an accident at work.

  "Je me *prétends* artiste," dit-il, "mais c'est au public de juger mon travail."
  "I pretend to be an artist", he said, "but it's up to the public to judge my work".

  *Prétendez*-vous vraiment que cette théorie soit infaillible ?
  Do you really claim that this theory is infallible?

  Je ne *prétends* pas détenir la vérité, mais j'ai des arguments solides.
  I don't claim to have the truth, but I have solid arguments.

  Comment peut-on *prétendre* pareille absurdité sans preuves ?
  How can you claim such nonsense without proof?

  Ils *prétendent* bénéficier de hautes protections dans le monde politique.
  *They claim* to enjoy high levels of protection in the political world.

  Ce charlatan *prétend* guérir toutes sortes de maladies avec ses remèdes miracles.
  This charlatan *claims* to cure all sorts of diseases with his miraculous cures.

  Ils se sont *prétendus* lésés dans ce partage d'héritage.
  They claimed to have been hurt in sharing this inheritance.

  Dans sa situation actuelle, il peut *prétendre* à un poste de direction.
  In his current situation, he may be a candidate for a leadership position.

  Cette bibliographie *ne prétend pas à* l'exhaustivité, mais offre un bon aperçu du sujet.
  This bibliography does not claim to be exhaustive, but it gives a good insight into the subject.

