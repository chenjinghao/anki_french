Notiz: |-
  <div class="section">
    <div class="section-title"><i>sembler</i> and <i>paraître</i></div>
    <div class="section-content">
      <p>It is etymologically <span class="fr">sembler</span> #180 closer to <span class="de">"the appearance"</span> or <span class="de">"Make the impression"</span>, while <span class="fr">paraître</span> more with <span class="de">"be visible"</span> or <span class="de">"showing up"</span> It's connected.</p>

      <p>In the case of <span class="fr">sembler</span> If you give a subjective description or personal opinion, you might be wrong.</p>
      <div class="examples">
        <div class="fr">Il semble jeune.</div>
        <div class="de spoiler">He seems young [but maybe he's older than he looks].</div>
        <div class="fr">Le temps semble s'améliorer.</div>
        <div class="de spoiler">Looks like the weather's getting better.</div>
      </div>

      <p>In the case of <span class="fr">paraître</span> The statement is more neutral, you're just describing what you see.</p>
      <div class="examples">
        <div class="fr">Il paraît jeune.</div>
        <div class="de spoiler">He looks young [and he's probably young].</div>
        <div class="fr">Ça paraît incroyable.</div>
        <div class="de spoiler">That sounds incredible [but I believe what I'm told].</div>
      </div>

      <p>The difference is not always clear and depends heavily on the context. <span class="fr">avoir l'air</span> or <span class="fr">sembler</span> use.</p>
      <div class="examples">
        <div class="fr">Il avait l'air jeune.</div>
        <div class="de spoiler">He sounded young.</div>
        <div class="fr">Ça semble incroyable.</div>
        <div class="de spoiler">That seems incredible [with a hint of doubt in the voice].</div>
      </div>
    </div>
  </div>
