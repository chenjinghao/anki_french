Notiz: |-
  <div class="section">
    <div class="section-title"><i>sembler</i> and <i>paraître</i></div>
    <div class="section-content">
      <p>Etymological <span class="fr">sembler</span> (#180) closer to <span class="de">"have the appearance"</span> or <span class="de">"to give the impression"</span>, while <span class="fr">paraître</span> more with <span class="de">"to be visible"</span> or <span class="de">"sich zeigen"</span> or</p>

      <p>For <span class="fr">sembler</span> A subjective description or personal opinion is given, but one could be quite mistaken.</p>
      <div class="examples">
        <div class="fr">Il semble jeune.</div>
        <div class="de spoiler">He seems young [but maybe he's older than he looks].</div>
        <div class="fr">Le temps semble s'améliorer.</div>
        <div class="de spoiler">It looks like the weather is getting better.</div>
      </div>

      <p>For <span class="fr">paraître</span> the statement is more neutral, one describes only what one sees.</p>
      <div class="examples">
        <div class="fr">Il paraît jeune.</div>
        <div class="de spoiler">He looks young [and is probably also].</div>
        <div class="fr">Ça paraît incroyable.</div>
        <div class="de spoiler">This seems incredible [but I believe what I'm told].</div>
      </div>

      <p>The difference is not always clear and depends heavily on the context. For voices or people you have not seen, you would rather <span class="fr">avoir l'air</span> or <span class="fr">sembler</span> verwenden.</p>
      <div class="examples">
        <div class="fr">Il avait l'air jeune.</div>
        <div class="de spoiler">He sounded young [to be heard on the phone].</div>
        <div class="fr">Ça semble incroyable.</div>
        <div class="de spoiler">This seems incredible [with a hint of doubt in the voice].</div>
      </div>
    </div>
  </div>
