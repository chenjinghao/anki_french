Notiz: |-
  <div class="section">
    <div class="section-title"><i>remplacer</i> and <i>substituer</i></div>
    <div class="section-content">
      <p><span class="fr">Remplacer</span> (#448) means <span class="de">"ersetzen"</span> and is used when something or someone takes the place of something else. It is the more common verb in everyday life.</p>
      <div class="examples">
        <div class="fr">Il faut remplacer cette ampoule cassée.</div>
        <div class="de spoiler">You have to replace this broken light bulb.</div>
        <div class="fr">Elle va remplacer le directeur pendant ses vacances.</div>
        <div class="de spoiler">She will represent the director during his vacation.</div>
      </div>
      <p><span class="fr">Substituer</span> means ebenfalls <span class="de">"ersetzen"</span> or <span class="de">"substituieren"</span>But it's mainly used in more formal or technical contexts, and it often emphasizes the exchange of something by something similar.</p>
      <div class="examples">
        <div class="fr">Le médecin a décidé de substituer ce médicament par un autre.</div>
        <div class="de spoiler">The doctor decided to replace this medicine with another one.</div>
        <div class="fr">Dans cette recette, on peut substituer le beurre par de l'huile.</div>
        <div class="de spoiler">In this recipe you can replace the butter with oil.</div>
      </div>
    </div>
  </div>
