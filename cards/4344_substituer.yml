      <p><span class="fr">Remplacer</span> (#448) means <span class="de">'replacing'</span> And it's used when something or someone takes the place of something else. It's the most common verb in everyday life.</p>
      <div class="examples">
        <div class="fr">Il faut remplacer cette ampoule cassée.</div>
        <div class="de spoiler">We need to replace this broken light bulb.</div>
