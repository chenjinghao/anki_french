        <div class="de spoiler">She'll be representing the director during his vacation.</div>
      </div>
      <p><span class="fr">Substituer</span> also means <span class="de">'replacing'</span> or <span class="de">'replacing'</span>It often emphasizes the exchange of something for something similar.</p>
      <div class="examples">
