Notiz: |-
  <div class="section">
    <div class="section-title"><i>augmenter</i>, <i>accroître</i> and <i>hausser</i></div>
    <div class="section-content">

      <p><span class="fr">Augmenter</span> (#823) is used to display an increase in size, quantity, or degrees in different contexts.</p>
      <div class="examples">
        <div class="fr">Le prix du lait a augmenté.</div>
        <div class="de spoiler">The price of milk has risen.</div>
        <div class="fr">Nous devons augmenter la production pour répondre à la demande.</div>
        <div class="de spoiler">We need to increase production to meet demand.</div>
      </div>

      <p><span class="fr">Accroître</span> (#1523) means to enlarge, grow or expand, mostly in abstract terms such as wealth, influence or prestige; but can also be applied to physical things such as surfaces or quantities. It often implies a gradual process.</p>
      <div class="examples">
        <div class="fr">Nous devons accroître notre présence sur les marchés internationaux.</div>
        <div class="de spoiler">We need to expand our presence in the international markets.</div>
        <div class="fr">L'entreprise cherche à accroître ses profits chaque année.</div>
        <div class="de spoiler">Every year, the company strives to increase its profits.</div>
      </div>

      <p><span class="fr">Hausser</span> means to lift or lift something directly and sometimes abruptly; is mainly used with body parts, prices, sounds and can also refer to the increase of the level of something.</p>
      <div class="examples">
        <div class="fr">Haussant les épaules, il a continué son chemin.</div>
        <div class="de spoiler">With a shrug he continued his way.</div>
        <div class="fr">Le gouvernement a haussé les taxes.</div>
        <div class="de spoiler">The government has increased taxes.</div>
      </div>
    </div>
  </div>
