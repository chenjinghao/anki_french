Rang: 1858
Wort: confronter
Wortart: vt, vr

# Feel free to improve these fields!
Wort mit Artikel: confronter
Femininum / Plural: ''
IPA: \kɔ̃.fʁɔ̃.te\
Definition: confronting, opposing
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Elle est *confrontée* à des défis plus nombreux.
  It faces major challenges.

  La police a *confronté* le suspect avec le témoin principal.
  The police have confronted the suspects with the main witness.

  Les chercheurs ont *confronté* leurs résultats pour trouver des similitudes.
  The researchers have *compared* their results to find similarities.

  Les étudiants doivent *confronter* différentes théories philosophiques.
  The students have to face different philosophical theories.

  Je me suis *confronté* à la réalité du marché du travail.
  I had to face the reality of the labour market.

  Le juge a décidé de *confronter* l'accusé avec sa victime.
  The judge decided to face the accused with the victim.

  Nous devons *confronter* nos opinions sur ce sujet délicat.
  We need to *compare* our opinions on this sensitive issue.

  Les experts se sont *confrontés* sur la question du changement climatique.
  The experts have discussed the issue of climate change controversially.

  Il est *confronté* à un choix difficile.
  He's facing a difficult decision.

  Le professeur a *confronté* les deux versions de l'histoire.
  The teacher contrasted the two versions of history.

  Les pays se sont *confrontés* sur la question des frontières.
  The countries have been arguing about the border issue.

  L'entreprise est *confrontée* à des difficultés financières.
  The company is facing financial difficulties.

  Le détective a *confronté* les déclarations des témoins.
  The detective *compared* the testimony of the witnesses.

  Les scientifiques ont *confronté* leurs hypothèses aux données réelles.
  The scientists have compared their hypotheses with the real data.

  Nous devons nous *confronter* à nos peurs pour les surmonter.
  We must face our fears to overcome them.

  Le jury a *confronté* les deux candidats lors du débat final.
  The jury faced the two candidates in the final debate.

  Les journalistes ont *confronté* les programmes des partis politiques.
  Journalists have *compared* the programmes of political parties.

  L'avocat a demandé à *confronter* les versions contradictoires.
  The lawyer demanded to face the contradictory versions.

  Les médecins se sont *confrontés* à une nouvelle maladie inconnue.
  The doctors *faced* a new unknown disease.

  Elle doit *confronter* son passé pour avancer.
  She has to face her past to make progress.

