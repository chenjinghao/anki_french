  Le coach *exhorte* son équipe à donner le meilleur d'elle-même.
  The coach urges his team to do their best.

  Je m'*exhorte* chaque jour à la persévérance.
  I urge myself every day to persevere.

  Les dirigeants *exhortent* à la solidarité en temps de crise.
