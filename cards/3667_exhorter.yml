Beispielsätze: |-
  Je l'*exhorte* à retirer sa motion.
  I urge him to withdraw his request.

  Le professeur *exhorte* ses élèves à la patience pendant l'examen.
  The teacher admonishes his students to be patient during the exam.

  Les parents *exhortent* leurs enfants à faire leurs devoirs.
  The parents urge their children to do their homework.

  Marie s'*exhorte* à la patience face aux provocations de son frère.
  Marie urges herself to be patient in the face of her brother's provocations.

  Le général *exhortait* ses soldats au combat avec passion.
  The general passionately *encouraged* his soldiers to fight.

  Son échec précédent l'avait *exhorté* à plus de prudence.
  His previous failure had encouraged him to be more cautious.

  Les manifestants s'*exhortaient* mutuellement au calme.
  The demonstrators urged each other to rest.

  Le médecin *exhorte* son patient à arrêter de fumer.
  The doctor tells his patients to stop smoking.

  Je vous *exhorte* à réfléchir avant d'agir.
  I urge you to think about what you're doing.

  Le maire *exhorte* les citoyens à économiser l'eau.
  The mayor exhorts the citizens to save water.

  Les experts *exhortent* à la prudence face aux nouveaux investissements.
  The experts urge caution with new investments.

  Sa mère l'*exhortait* toujours à l'obéissance.
  His mother always exhorted him to obey.

  Le coach *exhorte* son équipe à donner le meilleur d'elle-même.
  The coach encourages his team *to* give the best.

  Je m'*exhorte* chaque jour à la persévérance.
  I beg to persevere every day.

  Les dirigeants *exhortent* à la solidarité en temps de crise.
  In times of crisis, the executives urge solidarity.

