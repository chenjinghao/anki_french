Notiz: |-
  <div class="section">
    <div class="section-title"><i>répartition</i> and <i>distribution</i></div>
    <div class="section-content">
      <p><span class="fr">Répartition</span> means <span class="de">"Verteilung"</span> or <span class="de">"Aufteilung"</span> and often refers to the allocation of resources, tasks or responsibilities in an organised or systematic sense.</p>
      <div class="examples">
        <div class="fr">La répartition des tâches entre les membres de l'équipe.</div>
        <div class="de spoiler">The distribution of tasks among the team members.</div>
        <div class="fr">Une répartition équitable des ressources.</div>
        <div class="de spoiler">A fair distribution of resources.</div>
      </div>
      <p><span class="fr">Distribution</span> (#1911) may also: <span class="de">"Verteilung"</span> It may also refer to the dissemination of information or the allocation of roles in a play or film.</p>
      <div class="examples">
        <div class="fr">La distribution des journaux commence tôt le matin.</div>
        <div class="de spoiler">The distribution of newspapers begins early in the morning.</div>
        <div class="fr">La distribution des rôles pour le nouveau film a été annoncée.</div>
        <div class="de spoiler">The role distribution for the new film was announced.</div>
      </div>
      <p>While both words <span class="de">"Verteilung"</span> Implications <span class="fr">répartition</span> often a more systematic or planned division, while <span class="fr">distribution</span> more often describes the process of distributing or spending.</p>
    </div>
  </div>
