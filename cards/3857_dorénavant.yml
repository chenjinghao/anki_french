Notiz: |-
  <div class="section">
    <div class="section-title"><i>désormais</i>, <i>dorénavant</i> and <i>maintenant</i></div>
    <div class="section-content">
      <p>The Adverbs <span class="fr">désormais</span> (#1025), <span class="fr">dorénavant</span> and <span class="fr">maintenant</span> (#192) can be used in similar contexts, but are not completely synonymous.</p>

      <p><span class="fr">Désormais</span> comes from: <span class="fr">des ore</span> (<span class="de">"jetzt"</span>) and <span class="fr">mais</span> (<span class="de">"more"</span>) and means: <span class="de">"ab diesem Moment"</span>The reference point can be the present or a moment in the past.</p>
      <div class="examples">
        <div class="fr">Désormais, j'utiliserai le transport en commun pour me rendre au travail.</div>
        <div class="de spoiler">From now on, I will use public transport to go to work.</div>
        <div class="fr">Même s'ils avaient été très proches, ils ne s'adressaient désormais plus la parole.</div>
        <div class="de spoiler">Although they had been very close, they no longer spoke to each other.</div>
      </div>

      <p><span class="fr">Dorénavant</span>, originated from <span class="fr">d'ore en avant</span>, means ebenfalls <span class="de">"ab diesem Moment"</span>It is used especially frequently to express a request, a threat or a command.</p>
      <div class="examples">
        <div class="fr">Dorénavant, je ne travaillerai plus le vendredi.</div>
        <div class="de spoiler">From now on, I won't be working on Fridays.</div>
        <div class="fr">Dorénavant, efforcez-vous d'arriver à l'heure aux réunions.</div>
        <div class="de spoiler">From now on, try to appear on time for the meetings.</div>
      </div>

      <p><span class="fr">Maintenant</span> is derived from the participle present of the verb <span class="fr">maintenir</span> ab. Es means im Allgemeinen <span class="de">"currently, in the present moment"</span>, but sometimes can also <span class="de">"ab jetzt"</span> In this case it is synonymous with <span class="fr">désormais</span> and <span class="fr">dorénavant</span> and is often used with a verb in the futur.</p>
      <div class="examples">
        <div class="fr">Vous saurez maintenant ce que nous pensons de ce type de musique.</div>
        <div class="de spoiler">You will know from now on what we think of this kind of music.</div>
        <div class="fr">Après Nicole, c'est maintenant au tour de René de remettre sa carrière en question.</div>
        <div class="de spoiler">After Nicole, it's René's turn to rethink his career.</div>
      </div>
    </div>
  </div>
