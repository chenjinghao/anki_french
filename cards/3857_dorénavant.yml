Notiz: |-
  <div class="section">
    <div class="section-title"><i>désormais</i>, <i>dorénavant</i> and <i>maintenant</i></div>
    <div class="section-content">
      <p>The adverbs <span class="fr">désormais</span> (#1025), <span class="fr">dorénavant</span> and <span class="fr">maintenant</span> (#192) can be used in similar contexts but are not entirely synonymous.</p>

      <p><span class="fr">Désormais</span> It's from <span class="fr">des ore</span> (<span class="de">"now"</span>) and <span class="fr">mais</span> (<span class="de">"more"</span>) and means <span class="de">"from this moment on"</span>The reference point can be the present or a moment in the past.</p>
      <div class="examples">
        <div class="fr">Désormais, j'utiliserai le transport en commun pour me rendre au travail.</div>
        <div class="de spoiler">From now on, I'm going to use public transport to get to work.</div>
        <div class="fr">Même s'ils avaient été très proches, ils ne s'adressaient désormais plus la parole.</div>
        <div class="de spoiler">Although they were very close, from then on they stopped talking to each other.</div>
      </div>

      <p><span class="fr">Dorénavant</span>, derived from <span class="fr">d'ore en avant</span>, also means <span class="de">"from this moment on"</span>. It is particularly commonly used to express a request, threat or order.</p>
      <div class="examples">
        <div class="fr">Dorénavant, je ne travaillerai plus le vendredi.</div>
        <div class="de spoiler">From now on, I won't be working on Friday.</div>
        <div class="fr">Dorénavant, efforcez-vous d'arriver à l'heure aux réunions.</div>
        <div class="de spoiler">From now on, make an effort to arrive at the meetings on time.</div>
      </div>

      <p><span class="fr">Maintenant</span> is derived from the participle presence of the verb <span class="fr">maintenir</span> In general, it means <span class="de">"currently, in the present moment"</span>But sometimes it can be <span class="de">"from now on"</span> In this case, it is synonymous with <span class="fr">désormais</span> and <span class="fr">dorénavant</span> And it's often used with a verb in the future.</p>
      <div class="examples">
        <div class="fr">Vous saurez maintenant ce que nous pensons de ce type de musique.</div>
        <div class="de spoiler">From now on, you'll know what we think of this kind of music.</div>
        <div class="fr">Après Nicole, c'est maintenant au tour de René de remettre sa carrière en question.</div>
        <div class="de spoiler">After Nicole, it's René's turn to rethink his career.</div>
      </div>
    </div>
  </div>
