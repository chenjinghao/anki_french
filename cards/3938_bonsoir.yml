Beispielsätze: |-
  *Bonsoir* cher ami. Quel plaisir de vous voir.
  Good evening, dear friend, how nice to see you.

  Je vous souhaite un agréable *bonsoir*, Madame Martin.
  I wish you a pleasant farewell, Mrs. Martin.

  En sortant du bureau, il m'a dit "*bonsoir*" et est parti rapidement.
  As he left the office, he said "goodbye" and left quickly.

  "*Bonsoir de bonsoir* ! Qu'est-ce que c'est que ce bruit ?"
  "Good-bye, what's that noise?"

  Il ne m'a même pas dit *bonsoir* quand je suis rentré.
  He didn't even say goodbye to me when I got home.

  "Tu peux dire *bonsoir* à tes économies !"
  "You can say goodbye to your savings!"

  Marc nous a souhaité un tendre *bonsoir* avant d'aller se coucher.
  Marc wished us a warm good night before going to bed.

  "Si tu refuses cette offre, *bonsoir* !"
  "If you refuse this offer, goodbye!"

  Les enfants ont *donné le bonsoir* à leurs grands-parents par vidéo.
  The kids said goodbye to their grandparents on video.

  "*Bonsoir*, tout le monde ! La réunion peut commencer."
  "Congratulations, everyone, the meeting can begin".

  Je passais devant sa maison et lui ai fait un petit signe en disant "*bonsoir*".
  I was passing by his house and I gave him a little sign saying "goodbye".

  Il est déjà 21 heures, je vous *dis bonsoir*.
  It's already nine o'clock. I'm saying goodbye.

  "*Bien le bonsoir*, les amis !"
  "Good afternoon, my friends!"

  La vieille dame m'a souhaité un aimable *bonsoir*.
  The old lady said goodbye to me.

  "*Bonsoir* à tous et à demain !"
  "Good luck to all and see you tomorrow!"

  "*Bonsoir la compagnie* !" a-t-il lancé en entrant dans le café.
  "Bless the company!" he shouted as he entered the café.

  Ce soir-là, nous nous sommes *dit bonsoir* pour la dernière fois.
  That night, we said goodbye for the last time.

