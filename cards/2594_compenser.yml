  Les exercices physiques peuvent *compenser* les effets d'une alimentation déséquilibrée.
  Exercise can offset the effects of an unbalanced diet.

  Cette technologie permet de *compenser* les variations de température.
  This technology makes it possible to compensate for temperature variations.

  L'arrivée de nouveaux clients a *compensé* la perte des anciens.
  The arrival of new customers made up for the loss of the old ones.

