  Les scientifiques cherchent à *approfondir* leur compréhension des mécanismes du cerveau.
  Scientists are trying to *deepen* their understanding of brain mechanisms.

  Il est nécessaire d'*approfondir* cette théorie pour en tirer toutes les implications.
  It is necessary to *deepen* this theory in order to derive all implications from it.

