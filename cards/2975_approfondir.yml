  Il est important d'*approfondir* ses connaissances tout au long de sa carrière.
  It is important to *deepen* your knowledge throughout your career.

  Le silence s'est *approfondi* dans la salle quand le conférencier a commencé à parler.
  The silence in the hall deepened as the speaker began to speak.

  Les experts ont recommandé d'*approfondir* l'enquête sur les causes de l'accident.
  The experts have recommended that the investigation of the causes of the accident be intensified.

  Le désaccord entre les deux parties s'est *approfondi* au cours des négociations.
