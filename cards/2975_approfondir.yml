  Son regard s'est *approfondi* de tristesse en apprenant la nouvelle.
  His gaze deepened with sadness as he learned the news.

  Les chercheurs veulent *approfondir* leur étude sur les effets du changement climatique.
  The researchers want to *deepen* their study on the effects of climate change.

  "Il faut *approfondir* la question avant de prendre une décision", a déclaré le président.
  "We need to examine the issue more thoroughly before we make a decision," the President said.

  Le fossé entre les deux communautés s'est *approfondi* au fil des ans.
  The gap between the two communities has widened over the years.

  Les étudiants doivent *approfondir* leur analyse du texte pour l'exposé de demain.
  The students must *deepen* their text analysis for tomorrow's lecture.

  Le mystère ne fait que s'*approfondir* à mesure que l'enquête progresse.
