# Feel free to improve these fields!
Wort mit Artikel: préciser
Femininum / Plural: ''
IPA: \pʁe.si.ze\
Definition: specify, clarify
Register: ↗nonfiction

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Je *préciserai* seulement deux choses.
  I'm just gonna make two things clear.

  Pouvez-vous *préciser* l'heure de votre arrivée ?
  Can you *specify* the time of your arrival?

  La situation se *précise* de jour en jour.
  The situation is becoming clearer *from* day to day.

  Dans son testament, il a *précisé* ses dernières volontés.
  In his will, he made his final will clear.

  « Il faut *préciser* que je n'étais pas présent », a déclaré le témoin.
  "I have to make it clear that I was not present," the witness explained.

  Le professeur a demandé à l'élève de *préciser* sa pensée.
  The teacher asked the student to *explain* his thoughts in more detail.

  Les contours du projet se *précisent* petit à petit.
  The contours of the project gradually become *clearer*.

  Elle a *précisé* qu'elle viendrait en voiture.
  She made it clear that she would come by car.

  Le danger se *précise* à l'horizon.
  The danger is more evident on the horizon.

  Pourriez-vous *préciser* votre question ?
  Could you *explain* your question in more detail?

  L'auteur *précise* dans une note de bas de page que ce passage est autobiographique.
  The author makes it *clear* in a footnote that this passage is autobiographical.

  Les intentions de nos concurrents se *précisent*.
  The intentions of our competitors are becoming clearer.

  Il faut *préciser* le lieu de la réunion.
  The location of the meeting must be specified.

  Le directeur a *précisé* les objectifs du trimestre.
  The director has specified the objectives of the quarter.

  La méthode doit être *précisée* davantage.
  The method must be more precisely described.

  Les symptômes se *précisent* de plus en plus.
  The symptoms are getting clearer and clearer.

  Je dois *préciser* que ce n'est qu'une hypothèse.
  I have to make it clear that this is just a hypothesis.

  L'image se *précise* dans mon esprit.
  The picture becomes *clearer* in my head.

  Veuillez *préciser* vos intentions.
  Please *explain* your intentions.

  Le commissaire a *précisé* les circonstances de l'accident.
  The Commissioner has explained the circumstances of the accident.

  Les conséquences du changement climatique se *précisent* chaque année.
  The consequences of climate change are more evident each year.

  Il faudrait *préciser* les modalités de paiement.
  The payment arrangements must be specified in more detail.

