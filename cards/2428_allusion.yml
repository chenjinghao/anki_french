Beispielsätze: |-
  Le texte auquel vous *faites allusion* date de 1989.
  The text you're alluding to is from 1989.

  J'ai compris son *allusion* à mon ancien emploi.
  I understood his allusion to my former job.

  Cette *allusion* voilée à son passé l'a mis mal à l'aise.
  This hidden allusion to his past has made him embarrassed.

  Le professeur a fait une *allusion* à Shakespeare dans son cours.
  The teacher made an allusion to Shakespeare in his class.

  Son discours était rempli d'*allusions* littéraires.
  His speech was full of literary allusions.

  Elle a fait une *allusion* discrète à la surprise-partie.
  She made a subtle allusion to the surprise party.

  Les *allusions* constantes à son âge l'agaçaient.
  The constant allusions to his age annoyed him.

  "As-tu saisi mon *allusion* ?" demanda-t-elle en souriant.
  "Did you understand my allusion?" she asked smilingly.

  Le roman contient de nombreuses *allusions* historiques.
  The novel contains numerous historical allusions.

  Il a parlé par *allusions*, sans jamais nommer directement les personnes concernées.
  He spoke in insinuations without ever mentioning the persons in question directly.

  L'*allusion* au scandale récent n'a pas échappé aux journalistes.
  Journalists did not miss out on the recent scandal.

  Cette publicité *fait allusion* à un film culte des années 80.
  This advertisement refers *to* a cult film of the 80s.

  Les enfants n'ont pas compris l'*allusion* dans la blague de leur grand-père.
  The children did not understand the allusion in the joke of their grandfather.

  "Je ne *faisais aucune allusion* à toi", s'est-elle défendue.
  "I didn't pretend to be you in any way," she defended herself.

  Sa remarque contenait une *allusion* à peine voilée à mon échec.
  His remark contained a hardly veiled allusion to my failure.

  L'*allusion* à ses origines l'a profondément blessé.
  The allusion to his origin has deeply violated him.

