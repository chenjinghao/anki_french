# Please do not change these fields.
Rang: 1766
Wort: contrairement
Wortart: adv

# Feel free to improve these fields!
Wort mit Artikel: contrairement
Femininum / Plural: ''
IPA: \kɔ̃.tʁɛʁ.mɑ̃\
Definition: in contrast to, unlike
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  *Contrairement à* une idée couramment répandue, le café n'empêche pas la croissance.
  Unlike a widespread opinion, coffee does not prevent growth.

  *Contrairement à* Paul, Marie aime beaucoup voyager en train.
  Unlike Paul, Marie likes to travel by train.

  *Contrairement à* mes attentes, l'examen s'est très bien passé.
  *Contrary* to my expectations, the test went very well.

  Le spectacle commencera à 20h, *contrairement à* ce qui était prévu initialement.
  The show starts at 8 p.m., contrary to the original planning.

  *Contrairement aux* années précédentes, nous fêterons Noël chez mes parents.
  Unlike in recent years, we will celebrate Christmas with my parents.

  *Contrairement à* ce qu'on pourrait penser, les pandas ne sont pas très sociables.
  *Contrary* to the general assumption, Pandas are not very social.

  Les enfants ont agi *contrairement aux* instructions de leur professeur.
  The children acted contrary to the instructions of their teacher.

  *Contrairement à* mes habitudes, je me suis levé très tôt ce matin.
  *Contrary* to my habits, I got up very early this morning.

  Le restaurant était excellent, *contrairement à* ce que disaient les critiques.
  The restaurant was excellent, unlike what the critics said.

  *Contrairement à* la météo annoncée, il a fait beau tout le weekend.
  *Contrary* to the weather forecast, it was nice all weekend.

  Elle a réussi *contrairement à* toute attente.
  It has been successful, contrary to all expectations.

  *Contrairement à* sa sœur, Thomas n'a jamais aimé le sport.
  Unlike his sister, Thomas never liked sports.

  Les prix ont baissé, *contrairement à* la tendance générale du marché.
  Prices have fallen, contrary to the general market trend.

  *Contrairement à* ce que tu penses, je n'ai pas oublié ton anniversaire.
  Unlike you think, I haven't forgotten your birthday.

  *Contrairement à* mes collègues, j'ai décidé de travailler pendant les vacances.
  Unlike my colleagues, I decided to work during the holidays.

