Notiz: |-
  <div class="section">
    <div class="section-title"><i>enseignant</i> and <i>professeur</i></div>
    <div class="section-content">
      <p><span class="fr">Enseignant</span> is the general term for <span class="de">"Lehrkraft"</span> or <span class="de">"Lehrperson"</span>. It includes all persons who teach in any form.</p>

      <p>For primary education (<i>niveau primaire</i>) there are the following terms:</p>
      <ul>
        <li><span class="fr">Instituteur/institutrice</span>: offizielle Verwaltungssprache</li>
        <li><span class="fr">Maître/maîtresse</span>: colloquial, <span class="de">"Lehrer/Lehrerin"</span></li>
      </ul>
      <p><span class="fr">Professeur</span> (#1150) refers to teachers in secondary, colleges, universities or private educational institutions.</p>

      <p>Important note: Only university professors are allowed the title <span class="fr">"Professeur"</span> to bear their name.</p>

      <div class="examples">
        <div class="fr">M. le Professeur X enseigne à l'université.</div>
        <div class="de spoiler">Professor X teaches at the university.</div>
        <div class="fr">M. Y est professeur au cégep. (et non M. le Professeur Y)</div>
        <div class="de spoiler">Mr. Y is a teacher at Cégep. (and not Professor Y)</div>
      </div>
    </div>
  </div>
