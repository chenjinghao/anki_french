  <div class="section">
    <div class="section-title"><i>enseignant</i> and <i>professeur</i></div>
    <div class="section-content">
      <p><span class="fr">Enseignant</span> is the general term for <span class="de">"Teaching power"</span> or <span class="de">"Teacher"</span>It encompasses all persons who teach in any form.</p>

      <p>For primary school (<i>niveau primaire</i>) are as follows:</p>
      <ul>
        <li><span class="fr">Instituteur/institutrice</span>: official administrative language</li>
        <li><span class="fr">Maître/maîtresse</span>: in everyday language, <span class="de">"Teacher/Teacher"</span></li>
      </ul>
      <p><span class="fr">Professeur</span> (#1150) refers to teachers in secondary schools, colleges, universities or private educational institutions.</p>

      <p>Important note: Only university professors are entitled to the title <span class="fr">"Professeur"</span> carrying her name.</p>

      <div class="examples">
