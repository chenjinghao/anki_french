  After this long day, a well-deserved rest awaits us.

  Il *mérite* mieux que ce travail ennuyeux.
  He deserves better than this boring job.

  Elle *méritait* de réussir après tous ces efforts.
  She deserved to succeed after all these efforts.

  Cette lettre *mérite* une réponse rapide.
  This letter deserves a quick answer.

  Je ne pense pas *mériter* cet honneur.
