Wort mit Artikel: mériter
Femininum / Plural: ''
IPA: \me.ʁi.te\
Definition: to earn, to be worthwhile
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
