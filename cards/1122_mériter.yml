  This victory was well deserved after so much effort.

  Son comportement lui a *mérité* un avertissement.
  His behavior earned him a warning.

  Cette exposition *mérite* d'être vue.
  This exhibition is worth seeing.

  Ces données *méritent* d'être prises en compte.
  These data are worth taking into account.

  Cette question *mérite* réflexion.
  This is a question worth considering.

  Elle *mérite* amplement la reconnaissance de ses collègues.
  She deserves wide recognition from her colleagues.

  "Tu l'as bien *mérité*!"
  "You've earned it!"

