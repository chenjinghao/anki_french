Beispielsätze: |-
  Il m'a donné un bijou *soi-disant* précieux.
  He gave me a so-called precious jewel.

  Ces *soi-disant* amis l'ont trahi dès qu'ils en ont eu l'occasion.
  These so-called friends betrayed him as soon as they had the opportunity.

  Le *soi-disant* expert n'avait même pas de diplôme.
  *The so-called* expert didn't even have a degree.

