Rang: 4378
Wort: bannir
Wortart: vt

# Feel free to improve these fields!
Wort mit Artikel: bannir
Femininum / Plural: ''
IPA: \ba.niʁ\
Definition: banish, exclude
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  La religion est *bannie* de chez nous.
  Religion is *banished* from us.

  Le dictateur a *banni* tous ses opposants politiques du pays.
  The dictator *banished* all political opponents from the country.

  Après son comportement scandaleux, il a été *banni* du club de tennis.
  After his scandalous behavior, he was *banished* from the tennis club.

  Les parents ont décidé de *bannir* la télévision pendant la semaine.
  Parents have decided to ban the TV during the week.

  Le nouveau règlement *bannit* l'utilisation des téléphones portables en classe.
  The new regulation *prohibits* the use of mobile phones in class.

  Elle a juré de *bannir* le sucre de son alimentation.
  She has sworn to *banish* sugar from her diet.

  Le comité a *banni* l'athlète de toute compétition pour dopage.
  The committee *excluded* the athlete from all competitions because of dopings.

  Il faut *bannir* ces préjugés de notre société.
  These prejudices must be *banished* from our society.

  La ville a *banni* les véhicules diesel du centre-ville.
  The city has banned diesel vehicles from downtown.

  L'écrivain fut *banni* à perpétuité de son pays natal.
  The writer was *banished* from his home country for life.

  Les réseaux sociaux ont *banni* son compte pour désinformation.
  The social networks have blocked his account for misinformation.

  Elle a *banni* son ex-mari de sa vie.
  She *banished* her ex-husband from her life.

  Le coach nous a demandé de *bannir* toute pensée négative.
  The coach asked us to *banish* all negative thoughts.

  Le nouveau directeur a *banni* les réunions inutiles.
  The new director banned unnecessary meetings.

  Les organisateurs ont *banni* l'usage du plastique lors du festival.
  The organizers have banned the use of plastic at the festival.

  La société moderne doit *bannir* toute forme de discrimination.
  Modern society must outlaw any form of discrimination.

