Notiz: |-
  <div class="section">
    <div class="section-title"><i>reléguer</i> and <i>bannir</i></div>
    <div class="section-content">
      <p><span class="fr">Reléguer</span> (#3728) means <span class="de">"verbannen"</span> or <span class="de">"verweisen"</span> and denotes the removal or downgrading to a less important place or to a lower position.</p>
      <div class="examples">
        <div class="fr">Il a été relégué au poste de gardien de nuit.</div>
        <div class="de spoiler">He was banished to the night watchman's post.</div>
        <div class="fr">Ces livres ont été relégués au grenier.</div>
        <div class="de spoiler">These books were banished to the attic.</div>
      </div>
      <p><span class="fr">Bannir</span> means <span class="de">"verbannen"</span> or <span class="de">"Exclude"</span> in the sense of a complete removal or ban. It is often more definitive and punishable than <span class="fr">reléguer</span>.</p>
      <div class="examples">
        <div class="fr">Le roi a banni le traître du royaume.</div>
        <div class="de spoiler">The king banished the traitor from the kingdom.</div>
        <div class="fr">Il faut bannir la violence de nos écoles.</div>
        <div class="de spoiler">We must banish violence from our schools.</div>
      </div>
      <p><span class="fr">Reléguer</span> often implies a downgrading within a system, while <span class="fr">bannir</span> means complete exclusion or elimination.</p>
    </div>
  </div>
