Notiz: |-
  <div class="section">
    <div class="section-title"><i>lutter</i> and <i>combattre</i></div>
    <div class="section-content">
      <p><span class="fr">Lutter</span> (#1031) and <span class="fr">combattre</span> They have similar meanings.</p>
      <p><span class="fr">Combattre</span> is often used in both physical and metaphorical contexts, typically with an emphasis on opposition to an enemy, cause or disease.</p>
      <div class="examples">
        <div class="fr">Les soldats combattent l'ennemi.</div>
        <div class="de spoiler">The soldiers are fighting the enemy.</div>
        <div class="fr">Elle combat la maladie depuis plusieurs années.</div>
        <div class="de spoiler">She's been battling the disease for several years.</div>
      </div>

      <p><span class="fr">Lutter</span> It is often a connotation of the struggle against difficult circumstances or resistance to some form of adversity. It can be used for both tangible and intangible challenges.</p>
      <div class="examples">
        <div class="fr">Il lutte contre le courant pour atteindre l'autre rive.</div>
        <div class="de spoiler">He's fighting the current to reach the other shore.</div>
        <div class="fr">Nous devons lutter contre l'injustice sociale.</div>
        <div class="de spoiler">We must fight against social injustice.</div>
      </div>
    </div>
  </div>
