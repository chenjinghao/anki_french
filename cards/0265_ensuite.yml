Rang: 265
Wort: ensuite
Wortart: adv

# Feel free to improve these fields!
Wort mit Artikel: ensuite
Femininum / Plural: ''
IPA: \ɑ̃.sɥit\
Definition: Then, after that
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  *Ensuite*, il va au restaurant.
  Then he goes to the restaurant.

  Je vais ranger ma chambre et *ensuite* je ferai mes devoirs.
  I'll clean up my room and *then* do my homework.

  Il a bu son café, *ensuite* il est parti travailler.
  He drank his coffee, *then* went to work.

  *Ensuite*, qu'est-ce que tu proposes de faire ?
  Then what do you propose to do?

  Le guide marchait devant, et nous venions *ensuite*.
  The guide walked ahead, and we followed.

  D'abord la théorie, *ensuite* la pratique.
  First theory, *then* practice.

  On traverse le pont, et *ensuite* on tourne à droite.
  We cross the bridge, and *then* we turn right.

  *Ensuite* de quoi, ils se sont réconciliés.
  After that, they reconciled.

  Prenez l'escalier jusqu'au deuxième étage ; *ensuite*, c'est la première porte à gauche.
  Take the stairs to the second floor, and *then* the first door to the left.

  Il a lu le message, et *ensuite* il l'a effacé.
  He read the message, and *then* he deleted it.

  D'abord écouter, réfléchir *ensuite*.
  Listen first, *then* think.

  La route passe *ensuite* par une forêt dense.
  The road *then* passes through a dense forest.

  J'ai fini mon travail ; que fait-on *ensuite* ?
  I'm done with my work, what do we do next?

  *Ensuite*, nous avons visité le musée pendant deux heures.
  Then we visited the museum for two hours.

  Elle a préparé le dîner, *ensuite* elle s'est reposée.
  She made dinner, *then* she rested.

  D'abord je ne peux pas, et *ensuite* je n'en ai pas envie.
  First I can't, and *then* I don't want to.

  Le président parlait, *ensuite* venaient les ministres.
  The president spoke, *then* the ministers came.

