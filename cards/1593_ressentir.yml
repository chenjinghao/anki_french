Notiz: |-
  <div class="section">
    <div class="section-title"><i>sentir</i> and <i>ressentir</i></div>
    <div class="section-content">
      <p><span class="fr">Sentir</span> (#1593) is mainly used for physical sensations (touching, smell), but can also be used in the sense of <span class="de">wahrnehmen</span> The Commission has already taken a number of steps to ensure that this is done in the future.</p>
      <div class="examples">
        <div class="fr">Je sens la fraîcheur de l'eau sur ma peau.</div>
        <div class="de spoiler">I feel the freshness of the water on my skin.</div>
        <div class="fr">Je sens le parfum des lilas.</div>
        <div class="de spoiler">I smell the scent of lilac.</div>
        <div class="fr">Je sens qu'elle n'est pas heureuse.</div>
        <div class="de spoiler">I feel she's not happy.</div>
      </div>
      <p><span class="fr">Ressentir</span> is used to express the experience of (sometimes intense) feelings.</p>
      <div class="examples">
        <div class="fr">Je ressens une immense tristesse.</div>
        <div class="de spoiler">I feel immense sadness.</div>
        <div class="fr">Je ressens une grande joie.</div>
        <div class="de spoiler">I feel great joy.</div>
      </div>
      <p>In some cases, both verbs can be interchangeable:</p>
      <div class="examples">
        <div class="fr">Je sens (ressens) une douleur dans le bras gauche.</div>
        <div class="de spoiler">I feel pain in my left arm.</div>
        <div class="fr">Je sens (ressens) les bienfaits de mon séjour à la montagne.</div>
        <div class="de spoiler">I feel the benefits of my stay in the mountains.</div>
      </div>
    </div>
  </div>
