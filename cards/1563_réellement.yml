Rang: 1563
Wort: réellement
Wortart: adv

# Feel free to improve these fields!
Wort mit Artikel: réellement
Femininum / Plural: ''
IPA: \ʁe.ɛl.mɑ̃\
Definition: actually, really
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Elle ne sait pas qui je suis *réellement*.
  She doesn't know who I *really* am.

  Ces faits ont *réellement* eu lieu.
  These events have actually taken place.

  Je ne pense pas qu'il soit *réellement* malade.
  I don't think he's *really* sick.

  "*Réellement*, tu ne m'as pas reconnu ?"
  "Truly, you didn't recognize me?"

  Ce conte est *réellement* plaisant à lire.
  This story is *really* pleasant to read.

  Es-tu *réellement* prêt à relever ce défi ?
  Are you really ready to accept this challenge?

  Elle est *réellement* la plus compétente pour ce poste.
  It is *really* the most competent for this position.

  Je me demande s'il m'aime *réellement*.
  I wonder if he *really* loves me.

  Cette technologie pourrait *réellement* changer nos vies.
  This technology could actually change our lives.

  As-tu *réellement* besoin de tous ces livres ?
  Do you *really* need all these books?

  Le film était *réellement* différent de ce que j'attendais.
  The movie was actually different than I expected.

  Nous devrions essayer de voir les gens tels qu'ils sont *réellement*.
  We should try to see people as they *really* are.

  *Réellement*, je ne sais pas quoi faire dans cette situation.
  *Honestly*, I don't know what to do in this situation.

  Ce personnage historique a *réellement* existé.
  This historical figure actually existed.

  Es-tu *réellement* sûr de vouloir démissionner ?
  Are you sure you want to quit?

  Je n'avais pas *réellement* compris l'importance de cette décision.
  I had not *really* understood the meaning of this decision.

