Notiz: |-
  <div class="section">
    <div class="section-title"><i>forcément</i> and <i>inévitablement</i></div>
    <div class="section-content">
      <p><span class="fr">Forcément</span> (#2188) means <span class="de">'necessarily'</span> or <span class="de">'Certainly'</span> and is used to express a logical consequence or conclusion. It emphasizes logic or rational context.</p>
      <div class="examples">
        <div class="fr">Il pleut depuis ce matin, les rues sont forcément mouillées.</div>
        <div class="de spoiler">It's been raining since this morning, the streets are definitely wet.</div>
        <div class="fr">Si tu ne révises pas, tu vas forcément échouer à l'examen.</div>
        <div class="de spoiler">If you don't learn, you will necessarily fail the exam.</div>
      </div>
      <p><span class="fr">Inévitablement</span> means <span class="de">"unavoidable"</span> or <span class="de">"inevitable"</span> and expresses that something cannot be prevented, often with a certain resignation or a sense of inevitability.</p>
      <div class="examples">
        <div class="fr">Avec l'âge, les rides apparaissent inévitablement.</div>
        <div class="de spoiler">With age, wrinkles inevitably arise.</div>
        <div class="fr">La technologie évolue, et certains métiers disparaîtront inévitablement.</div>
        <div class="de spoiler">Technology continues to evolve, and certain professions will inevitably disappear.</div>
      </div>
    </div>
  </div>
