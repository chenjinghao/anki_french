Notiz: |-
  <div class="section">
    <div class="section-title"><i>forcément</i> and <i>inévitablement</i></div>
    <div class="section-content">
      <p><span class="fr">Forcément</span> (#2188) means <span class="de">"Necessary"</span> or <span class="de">"Compulsory"</span> and is used to express a logical consequence or conclusion. It emphasizes the logic or the reasonable context.</p>
      <div class="examples">
        <div class="fr">Il pleut depuis ce matin, les rues sont forcément mouillées.</div>
        <div class="de spoiler">It's been raining since this morning, the roads are necessarily wet.</div>
        <div class="fr">Si tu ne révises pas, tu vas forcément échouer à l'examen.</div>
        <div class="de spoiler">If you do not learn, you will necessarily fail the exam.</div>
      </div>
      <p><span class="fr">Inévitablement</span> means <span class="de">"Inavoidable"</span> or <span class="de">"inescapable"</span> and expresses that something cannot be prevented, often with a certain resignation or feeling of inevitability.</p>
      <div class="examples">
        <div class="fr">Avec l'âge, les rides apparaissent inévitablement.</div>
        <div class="de spoiler">With age inevitably wrinkles arise.</div>
        <div class="fr">La technologie évolue, et certains métiers disparaîtront inévitablement.</div>
        <div class="de spoiler">Technology is evolving and certain professions will inevitably disappear.</div>
      </div>
    </div>
  </div>
