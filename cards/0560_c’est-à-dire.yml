# Feel free to improve these fields!
Wort mit Artikel: c’est-à-dire
Femininum / Plural: ''
IPA: \s‿ɛ.t‿a diʁ\
Definition: that means:
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Il s'agit de vivre, *c'est-à-dire* d'avancer.
  It's about living, that is, moving forward.

  Le train arrive à 14h30, *c'est-à-dire* dans une demi-heure.
  The train arrives at 2:30, that is in half an hour.

  Mon frère est végétarien, *c'est-à-dire* qu'il ne mange pas de viande.
  My brother is a vegetarian, which means he doesn't eat meat.

  - Tu viendras à la fête ?<br>- *C'est-à-dire* que j'ai déjà d'autres plans.
  - Are you coming to the party?

  Elle parle trois langues, *c'est-à-dire* l'anglais, le français et l'espagnol.
  She speaks three languages: English, French *and* Spanish.

  - J'ai perdu mon portable.<br>- *C'est-à-dire* que tu l'as encore oublié au restaurant.
  - I lost my phone, *I guess that means* you left it in the restaurant again.

  Il est insomniaque, *c'est-à-dire* qu'il a du mal à dormir la nuit.
  He suffers from insomnia, which means he can sleep badly at night.

  Nous partons bientôt, *c'est-à-dire* dans environ dix minutes.
  We'll be off soon, more precisely in about ten minutes.

  Elle est philologue, *c'est-à-dire* qu'elle étudie les langues anciennes.
  She's a philologist, which means she's researching old languages.

  - Tu as fini le projet ?<br>- *C'est-à-dire* que j'ai encore quelques détails à régler.
  - Are you done with the project?

  Cette machine est automatique, *c'est-à-dire* qu'elle fonctionne toute seule.
  This machine is automatic, which means it works by itself.

  Il habite en banlieue, *c'est-à-dire* à vingt minutes du centre-ville.
  He lives in the suburbs, which means twenty minutes from the city centre.

  Je suis fatigué, *c'est-à-dire* que je n'ai dormi que quatre heures.
  I'm tired, it's because I only slept four hours.

  Elle est polyglotte, *c'est-à-dire* qu'elle parle plusieurs langues.
  It is polyglot, that is, it speaks several languages.

  - Tu prendras le train de midi ?<br>- *C'est-à-dire* que je préfère celui de 14h.
  - Are you taking the train at noon?

  J'ai fait une erreur, *c'est-à-dire* que j'ai mal calculé le temps nécessaire.
  I made a mistake, *and* I miscalculated the time needed.

  Il est parti tôt, *c'est-à-dire* vers huit heures ce matin.
  He left early, more precisely around eight o'clock this morning.

  L'héliotropisme, *c'est-à-dire* l'orientation des plantes vers le soleil, est fascinant.
  Heliotropism, i.e. the orientation of plants towards the sun, is fascinating.

