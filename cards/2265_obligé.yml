Rang: 2265
Wort: obligé
Wortart: adj, nm

# Feel free to improve these fields!
Wort mit Artikel: obligé
Femininum / Plural: obligée
IPA: \ɔb.li.ʒe\
Definition: Compulsory
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Vous n'êtes pas *obligés* de me donner une réponse.
  You are not obliged to answer me.

  C'était *obligé* que ça se passe comme ça avec tous ces problèmes.
  It was inevitable that all these problems had to happen this way.

  Je suis *obligé* de travailler ce week-end pour finir le projet.
  I'm *forced* to work this weekend to complete the project.

  "C'était *obligé* qu'il rate son examen, il n'a pas étudié du tout !"
  "It was *preprogrammed* that he did not pass his exam, he did not learn at all!"

  Nous vous serions très *obligés* de bien vouloir nous accorder un rendez-vous.
  We'd be very close if you'd give us an appointment.

  Le port du casque est *obligé* pour tous les cyclistes.
  Wearing a helmet is *mandatory* for all cyclists.

  Je me sens *obligée* de vous dire la vérité sur cette affaire.
  I feel obliged to tell you the truth about this matter.

  Monsieur le Maire, je suis votre *obligé* pour votre aide précieuse.
  Mr. Mayor, I am your *debtor* for your valuable help.

  La visite de la Tour Eiffel est un passage *obligé* pour les touristes à Paris.
  A visit to the Eiffel Tower is a mandatory programme for tourists in Paris.

  Elle s'est sentie *obligée* d'accepter l'invitation par politesse.
  She felt forced to accept the invitation out of courtesy.

  Je suis *obligé* de vous informer que votre contrat ne sera pas renouvelé.
  I'm *forced* to inform you that your contract will not be renewed.

  Dans ce restaurant, le pourboire est *obligé* et inclus dans l'addition.
  In this restaurant the tip is *mandatory* and included in the bill.

  Nous sommes *obligés* de respecter les règles de sécurité sur le chantier.
  We are obliged to comply with the safety regulations at the construction site.

  Je me sens *obligée* envers mes parents pour tout ce qu'ils ont fait pour moi.
  I feel obliged to my parents for everything they've done for me.

  L'acheteur est *obligé* par contrat de payer le prix convenu.
  The buyer is contractually obliged to pay the agreed price.

  La partie de violon est *obligée* dans cette symphonie.
  The violin part is obligatory in this symphony.

  "C'était *obligé* que tu gagnes, tu es le meilleur joueur de l'équipe !"
  "It was *clear* that you were winning, you were the best player in the team!"

  Je suis votre *obligé*, Madame, pour votre généreuse recommandation.
  Thank you, madam, for your generous recommendation.

  Les personnes *obligées* font parfois preuve d'ingratitude envers leurs bienfaiteurs.
  *Committed* persons sometimes show ingratitude to their benefactors.

  Dans cette entreprise, le costume-cravate est *obligé* pour les hommes.
  In this company, the suit with tie is mandatory for men.

