Notiz: |-
  <div class="section">
    <div class="section-title" data-topic="Verwendungshinweise"><i>similaire</i></div>
    <div class="section-content">
      <p>The adjective <span class="fr">similaire</span> (similar) is similar in meaning to words like <span class="fr">analogue</span>, <span class="fr">pareil</span> or <span class="fr">semblable</span>However, there are other grammatical rules.</p>

      <p class="attention">In the meantime <span class="fr">analogue</span>, <span class="fr">pareil</span> and <span class="fr">semblable</span> Either absolutely or with a <span class="fr">à</span> In the case of a product that is not intended for use in the manufacture of foodstuffs, it is possible to use the supplement initiated by the manufacturer. <span class="fr">similaire</span> used exclusively in the written language absolute (without preposition).</p>

      <h3>Proper use</h3>
      <div class="examples">
        <div class="fr">La baliste et la catapulte sont des armes de siège similaires.</div>
        <div class="de spoiler">The ballistics and the catapults are similar siege weapons.</div>
        <div class="fr">Vos deux cas sont similaires.</div>
        <div class="de spoiler">Your two cases are similar.</div>
        <div class="fr">Dans une situation similaire, qu'auriez-vous fait?</div>
        <div class="de spoiler">What would you have done in a similar situation?</div>
      </div>

      <h3>Inadequate or incorrect use of common language</h3>
      <div class="examples">
        <div class="fr">La baliste est une arme de siège similaire à la catapulte.</div>
        <div class="de spoiler">The ballist is a siege weapon similar to the catapult.</div>
        <div class="fr">Son cas est similaire au vôtre.</div>
        <div class="de spoiler">His case is similar to yours.</div>
        <div class="fr">Dans une situation similaire à celle-ci, qu'auriez-vous fait?</div>
        <div class="de spoiler">What would you have done in a situation like this?</div>
      </div>

      <p>For comparison with <span class="fr">à</span> should instead be <span class="fr">semblable à</span>, <span class="fr">pareil à</span> or <span class="fr">analogue à</span> use.</p>
    </div>
  </div>
  <div class="section">
    <div class="section-title"><i>semblable</i> and <i>similaire</i></div>
    <div class="section-content">
      <p>The adjectives <span class="fr">semblable</span> (#1978) and <span class="fr">similaire</span> They have similar meanings and a common origin, since both derive from the Latin <i>similis</i> (<span class="de">"similar"</span>, <span class="de">'equivalent to'</span>(i) the number of persons who are descended from them.</p>

      <h3><span class="fr">Semblable</span></h3>
      <p>The adjective <span class="fr">semblable</span>, from the verb <span class="fr">sembler</span> derived, refers to persons or things that are similar, share essential characteristics, so that they are considered to be of the same type or of the same nature.</p>
      <div class="examples">
        <div class="fr">Le style d'écriture de ces deux auteurs est semblable.</div>
        <div class="de spoiler">The writing style of these two authors is similar.</div>
        <div class="fr">Mes enfants ont des tempéraments très semblables.</div>
        <div class="de spoiler">My kids have very similar temperaments.</div>
      </div>
      <p><span class="fr">Semblable</span> If it is followed by one of these comparison elements, this is done by the preposition <span class="fr">à</span> It's been initiated.</p>
      <div class="examples">
        <div class="fr">Ton imperméable est semblable au mien.</div>
        <div class="de spoiler">Your raincoat is similar to mine.</div>
      </div>
      <p>If used with an affective value before a noun, <span class="fr">semblable</span> also <span class="de">"such"</span> or <span class="de">"such as this"</span> What do you mean?</p>
      <div class="examples">
        <div class="fr">Un semblable engouement pour une première de film, c'est du jamais vu.</div>
        <div class="de spoiler">Such enthusiasm for a film premiere you've never seen before.</div>
      </div>

      <h3><span class="fr">Similaire</span></h3>
      <p>The adjective <span class="fr">similaire</span> It expresses a comparison between elements that are roughly the same or of the same nature, or that can be equated to each other in certain points.</p>
      <p>It's never followed by a complement, so you wouldn't say: <span class="fr">un produit similaire à un autre</span>But rather <span class="fr">analogue à</span>, <span class="fr">comparable à un autre</span>.</p>
      <div class="examples">
        <div class="fr">Les biens importés à des prix très bas ne sont pas d'aussi bonne qualité que les biens similaires produits par les entreprises d'ici.</div>
        <div class="de spoiler">The products imported at very low prices are not of the same quality as similar products produced by local companies.</div>
        <div class="fr">J'ai acheté en voyage une montre similaire à un prix inférieur.</div>
        <div class="de spoiler">I bought a similar watch on a trip at a lower price.</div>
      </div>
    </div>
  </div>
