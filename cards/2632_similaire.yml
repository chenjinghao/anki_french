  <div class="section">
    <div class="section-title" data-topic="Verwendungshinweise"><i>similaire</i></div>
    <div class="section-content">
      <p>The Adjective <span class="fr">similaire</span> (similar) is meaning-like to words such as <span class="fr">analogue</span>, <span class="fr">pareil</span> or <span class="fr">semblable</span>However, it follows other grammatical rules.</p>

      <p class="attention">During <span class="fr">analogue</span>, <span class="fr">pareil</span> and <span class="fr">semblable</span> either absolute or with a <span class="fr">à</span> The Commission will be able to use initiated supplement, which will be <span class="fr">similaire</span> used in the written language only absolutely (without preposition).</p>

      <h3>Correct use</h3>
      <div class="examples">
        <div class="fr">La baliste et la catapulte sont des armes de siège similaires.</div>
        <div class="de spoiler">The Balliste and the catapults are similar siege weapons.</div>
        <div class="fr">Vos deux cas sont similaires.</div>
        <div class="de spoiler">Your two cases are similar.</div>
        <div class="fr">Dans une situation similaire, qu'auriez-vous fait?</div>
        <div class="de spoiler">What would you have done in a similar situation?</div>
      </div>

      <h3>Incorrect or colloquial use</h3>
      <div class="examples">
        <div class="fr">La baliste est une arme de siège similaire à la catapulte.</div>
        <div class="de spoiler">The Balliste is one of the catapults similar siege weapon.</div>
        <div class="fr">Son cas est similaire au vôtre.</div>
        <div class="de spoiler">His case is similar to yours.</div>
        <div class="fr">Dans une situation similaire à celle-ci, qu'auriez-vous fait?</div>
        <div class="de spoiler">What would you have done in a situation similar to this?</div>
      </div>

      <p>For comparisons with <span class="fr">à</span> sollten stattdessen <span class="fr">semblable à</span>, <span class="fr">pareil à</span> or <span class="fr">analogue à</span> and the use.</p>
    </div>
  </div>
  <div class="section">
    <div class="section-title"><i>semblable</i> and <i>similaire</i></div>
    <div class="section-content">
      <p>The Adjectives <span class="fr">semblable</span> (#1978) and <span class="fr">similaire</span> have similar meanings and a common origin, since both of the Latin <i>similis</i> (<span class="de">"similar"</span>, <span class="de">"gleichartig"</span>) abstammen.</p>

      <h3><span class="fr">Semblable</span></h3>
      <p>The Adjective <span class="fr">semblable</span>, the verb <span class="fr">sembler</span> is derived refers to persons or things that are similar, which share essential characteristics, so that they are considered of the same type or nature.</p>
      <div class="examples">
        <div class="fr">Le style d'écriture de ces deux auteurs est semblable.</div>
        <div class="de spoiler">The writing style of these two authors is similar.</div>
        <div class="fr">Mes enfants ont des tempéraments très semblables.</div>
        <div class="de spoiler">My children have very similar temperaments.</div>
      </div>
      <p><span class="fr">Semblable</span> always implies a comparison between elements. If it is followed by one of these comparison elements, this is represented by the preposition <span class="fr">à</span> eingeleitet.</p>
      <div class="examples">
        <div class="fr">Ton imperméable est semblable au mien.</div>
        <div class="de spoiler">Your raincoat is like mine.</div>
      </div>
      <p>If it is used with affective value before a noun, <span class="fr">semblable</span> also <span class="de">"solch"</span> or <span class="de">"derartig"</span> bedeuten.</p>
      <div class="examples">
        <div class="fr">Un semblable engouement pour une première de film, c'est du jamais vu.</div>
        <div class="de spoiler">Such an enthusiasm for a film premiere has never been seen before.</div>
      </div>

      <h3><span class="fr">Similaire</span></h3>
      <p>The Adjective <span class="fr">similaire</span> It expresses a comparison between elements that are about the same or of the same nature, or which can be equated in certain points.</p>
      <p>It is never followed by a complement; so one would not say: <span class="fr">un produit similaire à un autre</span>, sondern eher <span class="fr">analogue à</span>, <span class="fr">comparable à un autre</span>.</p>
      <div class="examples">
        <div class="fr">Les biens importés à des prix très bas ne sont pas d'aussi bonne qualité que les biens similaires produits par les entreprises d'ici.</div>
        <div class="de spoiler">The goods imported at very low prices are not of as good quality as similar goods produced by local companies.</div>
        <div class="fr">J'ai acheté en voyage une montre similaire à un prix inférieur.</div>
        <div class="de spoiler">I bought a similar watch on a trip at a lower price.</div>
      </div>
    </div>
  </div>
