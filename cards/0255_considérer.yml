Wort mit Artikel: considérer
Femininum / Plural: ''
IPA: \kɔ̃.si.de.ʁe\
Definition: consider, consider
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
