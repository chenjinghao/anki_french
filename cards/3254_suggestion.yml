Notiz: |-
  <div class="section">
    <div class="section-title"><i>suggestion</i> and <i>proposition</i></div>
    <div class="section-content">
      <p><span class="fr">Suggestion</span> refers to a proposal that is offered rather as a suggestion or idea, and it often implies a softer, less formal approach.</p>
      <div class="examples">
        <div class="fr">Avez-vous des suggestions pour améliorer notre service?</div>
        <div class="de spoiler">Do you have suggestions to improve our service?</div>
        <div class="fr">Je vous fais cette suggestion, mais c'est à vous de décider.</div>
        <div class="de spoiler">I'll make this proposal to you, but the decision is up to you.</div>
      </div>
      <p><span class="fr">Proposition</span> (#799) is a more formal, concrete proposal or offer. It often implies something that is submitted for acceptance or rejection.</p>
      <div class="examples">
        <div class="fr">Il a fait une proposition de mariage.</div>
        <div class="de spoiler">He proposed to marry me.</div>
        <div class="fr">L'entreprise a reçu une proposition d'achat.</div>
        <div class="de spoiler">The company has received a purchase offer.</div>
      </div>
    </div>
  </div>
