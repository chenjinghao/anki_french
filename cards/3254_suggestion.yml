# Feel free to improve these fields!
Wort mit Artikel: la suggestion
Femininum / Plural: ''
IPA: \syɡ.ʒɛs.tjɔ̃\
Definition: Proposal, suggestion
Register: ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Cette *suggestion* enchanta le directeur.
  This *proposal* inspired the director.

  J'ai une *suggestion* à vous faire concernant le projet.
  I have a *proposal* for you regarding the project.

  Je préfère recourir à la *suggestion* plutôt qu'à donner des ordres directs.
  I prefer to resort to suggestions rather than direct orders.

  Sa *suggestion* de faire une pause a été bien accueillie par toute l'équipe.
  His suggestion to take a break was well received by the whole team.

  Notre chef nous présente les *suggestions* du jour avant chaque service.
  Our chef introduces us to every service the daily suggestions.

  As-tu des *suggestions* pour améliorer notre méthode de travail ?
  Do you have any suggestions on how we can improve our working method?

  Il a suivi la *suggestion* de son collègue et a changé de stratégie.
  He followed his colleague's suggestion and changed his strategy.

  Les *suggestions* répétitives font partie de la technique thérapeutique.
  Repeated *suggestions* are part of the therapeutic technique.

  Votre *suggestion* d'organiser une fête surprise est excellente !
  Your suggestion to organize a surprise party is excellent!

  Cette *suggestion* diabolique lui venait de son pire ennemi.
  This diabolical *proposal* came from his worst enemy.

  Le professeur demande souvent aux élèves leurs *suggestions* pour améliorer le cours.
  The teacher often asks the students for suggestions to improve the teaching.

  La boîte à *suggestions* est installée dans le hall d'entrée.
  The suggestion box is installed in the entrance hall.

  "Et si on allait au cinéma ?" - Cette *suggestion* arriva à point nommé.
  "How about cinema?" - This *proposal* was just right.

