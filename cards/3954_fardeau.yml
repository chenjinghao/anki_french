Notiz: |-
  <div class="section">
    <div class="section-title"><i>charge</i> and <i>fardeau</i></div>
    <div class="section-content">
      <p><span class="fr">Charge</span> (#849) means <span class="de">"Last"</span>, <span class="de">"Belastung"</span> or <span class="de">"Verantwortung"</span> and can be used in both the physical and the figurative sense. It can also designate an official function or professional responsibility.</p>
      <div class="examples">
        <div class="fr">Il a pris en charge l'éducation de ses neveux.</div>
        <div class="de spoiler">He took responsibility for the education of his nephews.</div>
        <div class="fr">Cette dépense est à la charge du client.</div>
        <div class="de spoiler">This issue shall be charged to the customer.</div>
      </div>
      <p><span class="fr">Fardeau</span> means ebenfalls <span class="de">"Last"</span> or <span class="de">"Loyalty"</span>However, it has a stronger emotional connotation and often denotes a heavy, burdensome or oppressive burden.</p>
      <div class="examples">
        <div class="fr">Cette dette est un lourd fardeau pour la famille.</div>
        <div class="de spoiler">This guilt is a heavy burden for the family.</div>
        <div class="fr">Le vieil homme portait un fardeau de bois sur son dos.</div>
        <div class="de spoiler">The old man carried a load of wood on his back.</div>
      </div>
      <p>The main difference lies in the intensity and emotional coloring: <span class="fr">Charge</span> is more neutral and can also include positive responsibilities, while <span class="fr">fardeau</span> often emphasizes a heavy, burdensome situation or load that is felt to be laborious.</p>
    </div>
  </div>
