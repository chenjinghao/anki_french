Rang: 3954
Wort: fardeau
Wortart: nm

# Feel free to improve these fields!
Wort mit Artikel: le fardeau
Femininum / Plural: fardeaux
IPA: \faʁ.do\
Definition: Load, burden
Register: ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Le gouvernement doit alléger le *fardeau* des entreprises.
  The government must ease the burden on businesses.

  Il porte un lourd *fardeau* sur ses épaules depuis des années.
  He's been carrying a heavy *load* on his shoulders for years.

  Les impôts représentent un *fardeau* considérable pour les familles modestes.
  Taxes represent a significant burden for low-income families.

  Marie plie sous le *fardeau* des responsabilités familiales.
  The family responsibilities are heavy on Marie.

  Le déménageur soulève des *fardeaux* toute la journée.
  The removal worker raises *loads* all day.

  Le *fardeau* de la dette devient insupportable pour ce pays.
  The debt burden is becoming unbearable for this country.

  Ces souvenirs sont un *fardeau* dont je voudrais me débarrasser.
  These memories are a burden I want to get rid of.

  Elle transporte son *fardeau* dans une brouette jusqu'au jardin.
  She transports her *load* in a wheelbarrow to the garden.

  Le *fardeau* administratif décourage les petites entreprises.
  The administrative burden discourages small businesses.

  Les enfants sont devenus un *fardeau* pour leurs parents âgés.
  The children have become a burden for their old parents.

  Cette décision allégera le *fardeau* financier des étudiants.
  This decision will facilitate the financial burden of students.

  Le *fardeau* de la preuve incombe à l'accusation.
  The burden of proof lies with the prosecution.

  Les réformes ont augmenté le *fardeau* fiscal des classes moyennes.
  Reforms have increased the tax burden on the middle class.

  Paul aide son frère à porter ce lourd *fardeau*.
  Paul helps his brother carry this heavy burden.

  La solitude est devenue un *fardeau* insupportable pour elle.
  Loneliness has become an unbearable burden for them.

