Notiz: |-
  <div class="section">
    <div class="section-title"><i>charge</i> and <i>fardeau</i></div>
    <div class="section-content">
      <p><span class="fr">Charge</span> (#849) means <span class="de">"Last"</span>, <span class="de">'Loaded'</span> or <span class="de">'Responsibility'</span> It can also refer to an official function or professional responsibility.</p>
      <div class="examples">
        <div class="fr">Il a pris en charge l'éducation de ses neveux.</div>
        <div class="de spoiler">He has assumed responsibility for the upbringing of his nephews.</div>
        <div class="fr">Cette dépense est à la charge du client.</div>
        <div class="de spoiler">This expenditure is at the expense of the customer.</div>
      </div>
      <p><span class="fr">Fardeau</span> also means <span class="de">"Last"</span> or <span class="de">"Load"</span>But it has a stronger emotional connotation and often denotes a heavy, burdensome or oppressive burden.</p>
      <div class="examples">
        <div class="fr">Cette dette est un lourd fardeau pour la famille.</div>
        <div class="de spoiler">This debt is a heavy burden on the family.</div>
        <div class="fr">Le vieil homme portait un fardeau de bois sur son dos.</div>
        <div class="de spoiler">The old man carried a load of wood on his back.</div>
      </div>
      <p>The main difference lies in the intensity and emotional coloration: <span class="fr">Charge</span> is more neutral and can also include positive responsibilities, while <span class="fr">fardeau</span> usually emphasizes a difficult, stressful situation or burden that is perceived to be tedious.</p>
    </div>
  </div>
