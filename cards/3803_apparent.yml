# Feel free to improve these fields!
Wort mit Artikel: apparent
Femininum / Plural: apparente
IPA: \a.pa.ʁɑ̃\
Definition: obvious, visible
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Je me surprenais à pleurer sans cause *apparente*.
  I started crying without any obvious reason.

  Les poutres *apparentes* donnent du caractère à cette vieille maison.
  The *visible* beams give this old house character.

  Le contraste entre les coutures *apparentes* et le tissu noir est très élégant.
  The contrast between the *visible* seams and the black fabric is very elegant.

  Les traces de pas étaient très *apparentes* dans la neige fraîche.
  The footprints were clearly visible in the fresh snow.

  Son droit de propriété est *apparent* et incontestable.
  His right to property is *obvious* and undeniable.

  Le mouvement *apparent* du Soleil peut tromper nos sens.
  The apparent movement of the sun can deceive our senses.

  Leur richesse n'était qu'*apparente* : ils avaient beaucoup de dettes.
  Their wealth was only apparently: they had many debts.

  Dans cette phrase, "il" est un sujet *apparent*.
  In this sentence, "it" is a *formal* subject.

  La simplicité *apparente* de cette solution cache sa vraie complexité.
  The apparent simplicity of this solution hides its true complexity.

  Les symptômes sont devenus *apparents* après quelques heures.
  Symptoms became *visible* after a few hours.

  Sa ruse était trop *apparente* pour tromper qui que ce soit.
  His cunning was too clumsy to deceive anyone.

  Le défaut est *apparent* : la peinture s'écaille partout.
  The lack is *obvious*: the color peels off everywhere.

  Cette prospérité *apparente* masquait une profonde crise.
  This apparent prosperity hid a deep crisis.

  Les fissures sont devenues *apparentes* après le tremblement de terre.
  The cracks became *visible* after the earthquake.

  Son malaise n'était pas *apparent* au début de la réunion.
  His discomfort was not apparent at the beginning of the meeting.

  La contradiction *apparente* entre ces deux théories n'existe pas.
  The apparent contradiction between these two theories does not exist.

  Les changements sont *apparents* dans son comportement.
  The changes are *obvious* in his behavior.

  Le succès *apparent* de l'entreprise attire de nouveaux investisseurs.
  The apparent success of the company attracts new investors.

  Les briques *apparentes* donnent un style industriel à l'appartement.
  The *visible* bricks give the apartment an industrial style.

