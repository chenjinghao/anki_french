# Please do not change these fields.
Rang: 476
Wort: sauf
Wortart: prep, adj

# Feel free to improve these fields!
Wort mit Artikel: sauf
Femininum / Plural: sauve
IPA: \sof\
Definition: except, except for; unharmed
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Tout le monde rit *sauf* elle.
  Everybody laughs except for her.

  Je suis content de les revoir tous *sauf* mon ex-copine.
  I'm glad to see them all again except for my ex-girlfriend.

  La bibliothèque est ouverte tous les jours *sauf* le dimanche.
  The library is open every day except Sunday.

  Mon fils mange de tout *sauf* les épinards.
  My son eats everything but spinach.

  Il est très sympathique, *sauf* quand il est stressé.
  He's very nice, except when he's stressed.

  J'aime bien ce film, *sauf que* la fin est décevante.
  I love this movie, except the ending is disappointing.

  *Sauf erreur de ma part*, le rendez-vous est à 14h.
  Unless I'm mistaken, the appointment is at 2:00.

  *Sauf imprévu*, nous arriverons demain matin.
  Unless it's unexpected, we'll be there in the morning.

  "*Sauf votre respect*, je ne suis pas d'accord."
  "With all due respect, I disagree".

  Les enfants sont rentrés *sains et saufs* de leur excursion.
  The children returned safely from their excursion.

  Par miracle, ils sont tous *saufs* après l'accident.
  Miraculously, they're all safe after the accident.

  L'honneur de notre famille est resté *sauf*.
  Our family's honor was spared.

  Les pirates ont *laissé la vie sauve* aux prisonniers.
  The pirates saved the lives of the prisoners.

  Elle a *eu la vie sauve* grâce à l'intervention rapide des pompiers.
  She was saved by the quick firefighters.

  *Sauf avis contraire*, la réunion aura lieu comme prévu.
  Unless otherwise stated, the meeting will be held as scheduled.

  J'ai lu tous ses livres *sauf* le dernier.
  I've read all his books except the last one.

  Le magasin est ouvert *sauf* les jours fériés.
  The shop is open except on public holidays.

  Nous acceptons toutes les cartes bancaires *sauf* American Express.
  We accept all bank cards except American Express.

  *Sauf si* tu changes d'avis, je partirai demain.
  *Unless* you change your mind, I'll leave tomorrow.

  Il est sorti *sain et sauf* de cette situation dangereuse.
  He got out of this dangerous situation safely.

  C'est un miracle qu'elle soit *sauve* après cette chute.
  It's a miracle she survived that fall.

  Les apparences sont *sauves*, mais le problème persiste.
  Appearances are safe, but the problem persists.

  *Sauf convention contraire*, le paiement doit être effectué sous 30 jours.
  *Unless otherwise agreed*, the payment must be made within 30 days.

  Tout s'est bien passé, *sauf* un petit incident.
  Everything went well except for one small incident.

  Je viendrai à la fête *sauf* en cas de maladie.
  I'll come to the party unless I'm sick.

  *Sauf erreur ou omission*, le compte est exact.
  Except for error or omission, the count is accurate.

  Il accepte toujours mes suggestions *sauf à* les critiquer plus tard.
  He always accepts my suggestions except to criticize them later.

  Les règles sont simples *sauf* quand il y a des exceptions.
  The rules are simple except when there are exceptions.

  Tous les participants sont arrivés *saufs* à destination.
  All participants arrived safely at their destination.

  *Sauf à prouver le contraire*, il est présumé innocent.
  Unless proven otherwise, he's presumed innocent.

  *Sauf* le week-end, je me lève tôt.
  Except on weekends, I get up early.

  Je mange de tout *sauf* les fruits de mer.
  I eat everything but seafood.

  *Sauf meilleur avis*, je suggère de reporter la réunion.
  Unless I give you a better opinion, I suggest we postpone the meeting.

