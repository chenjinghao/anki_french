Beispielsätze: |-
  Seuls les piétons peuvent passer *librement*.
  Only pedestrians can pass freely.

  Dans une démocratie, les citoyens peuvent s'exprimer *librement*.
  In a democracy, citizens can express themselves freely.

  Il a *librement* choisi de quitter son emploi.
  He decided voluntarily to quit his job.

  Les oiseaux volent *librement* dans le ciel.
  The birds fly *free* in the sky.

  Après l'opération, elle peut enfin respirer plus *librement*.
  After the surgery, she can finally breathe more freely.

  "Je peux te parler *librement* ?" demanda-t-elle à son amie.
  "Can I talk to you openly?" she asked her girlfriend.

  Le traité permet aux marchandises de circuler *librement* entre les pays.
  The contract allows goods to circulate freely between countries.

  Les journalistes peuvent-ils vraiment écrire *librement* dans ce pays ?
  Can journalists really write freely in this country?

  Elle a traduit le poème assez *librement*.
  She translated the poem quite freely.

  Le film est *librement* inspiré d'événements réels.
  The film is *free* of real events.

  Nous devrions pouvoir choisir *librement* notre religion.
  We should be *free* to choose our religion.

  Le prisonnier rêvait de marcher à nouveau *librement*.
  The prisoner dreamed of being *free* again.

  Les enfants jouent *librement* dans le parc.
  The children play freely in the park.

  Il faut laisser les idées circuler *librement*.
  You have to let ideas circulate freely.

  L'artiste a *librement* interprété le thème de l'exposition.
  The artist has freely interpreted the theme of the exhibition.

  Dans ce groupe, chacun peut s'exprimer *librement*.
  In this group, everyone can express himself informally.

  Elle a avoué *librement* ses erreurs.
  She openly acknowledged her mistakes.

  Le contrat a été *librement* consenti par les deux parties.
  The contract was agreed voluntarily by both parties.

  Les électeurs ont voté *librement* lors des élections.
  The voters voted freely in the elections.

