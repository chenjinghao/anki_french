Notiz: |-
  <div class="section">
    <div class="section-title"><i>place</i>, <i>lieu</i> and <i>endroit</i></div>
    <div class="section-content">
      <p><span class="fr">Lieu</span> (#117) denotes an entire space or place. It is often used in more abstract or formal contexts.</p>
      <div class="examples">
        <div class="fr">C'est mon lieu de travail.</div>
        <div class="de spoiler">This is my place of work.</div>
        <div class="fr">L'événement aura lieu demain.</div>
        <div class="de spoiler">The event will take place tomorrow.</div>
      </div>
      <p><span class="fr">Endroit</span> refers to a certain part of a larger space. It is more specific than <span class="fr">lieu</span>.</p>
      <div class="examples">
        <div class="fr">C'est un endroit agréable.</div>
        <div class="de spoiler">This is a pleasant place.</div>
        <div class="fr">À quel endroit se trouve le marché ?</div>
        <div class="de spoiler">Where is the market located?</div>
      </div>
      <p><span class="fr">Place</span> (#129) implies an idea of order and arrangement. It is often used to designate a specific assigned place.</p>
      <div class="examples">
        <div class="fr">C'est ma place !</div>
        <div class="de spoiler">This is my place!</div>
        <div class="fr">Le téléphone n'est pas à sa place.</div>
        <div class="de spoiler">The phone's not in his place.</div>
      </div>
      <div class="tip">
        <div class="fr">On est dans le <u>lieu</u>, on cherche l'<u>endroit</u>, on occupe la <u>place</u>.</div>
        <div class="de">You are located at a <u>Ort</u>, you are looking for a certain <u>Stelle</u>, you take a <u>Platz</u> One.</div>
      </div>
    </div>
  </div>
