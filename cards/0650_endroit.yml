  <div class="section">
    <div class="section-title"><i>place</i>, <i>lieu</i> and <i>endroit</i></div>
    <div class="section-content">
      <p><span class="fr">Lieu</span> (#117) refers to an entire space or place. It is often used in abstract or more formal contexts.</p>
      <div class="examples">
        <div class="fr">C'est mon lieu de travail.</div>
        <div class="de spoiler">This is my workplace.</div>
        <div class="fr">L'événement aura lieu demain.</div>
        <div class="de spoiler">The event will take place tomorrow.</div>
      </div>
      <p><span class="fr">Endroit</span> It refers to a specific part of a larger space. <span class="fr">lieu</span>.</p>
      <div class="examples">
        <div class="fr">C'est un endroit agréable.</div>
        <div class="de spoiler">This is a pleasant place.</div>
        <div class="fr">À quel endroit se trouve le marché ?</div>
        <div class="de spoiler">Where's the market?</div>
      </div>
      <p><span class="fr">Place</span> (#129) implies an idea of order and arrangement. It is often used to refer to a specific, assigned place.</p>
      <div class="examples">
        <div class="fr">C'est ma place !</div>
        <div class="de spoiler">This is my place!</div>
        <div class="fr">Le téléphone n'est pas à sa place.</div>
        <div class="de spoiler">The phone's out of place.</div>
      </div>
