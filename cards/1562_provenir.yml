Wort mit Artikel: provenir
Femininum / Plural: ''
IPA: \pʁɔv.niʁ\
Definition: from here, come here
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  La balle *provient* d'un revolver britannique.
  The bullet came from a British revolver.

  D'où *provient* cette lettre mystérieuse ?
  Where did this mysterious letter come from?

  Ces marchandises *proviennent* principalement de Chine.
  These goods are mainly sourced from China.

  Le plastique *provient* du pétrole brut.
  The plastic *comes from* crude oil.

  Cet excellent vin rouge *provient* d'Italie.
  This excellent red wine *comes from* Italy.

  L'argent *provenait* de l'héritage de sa grand-mère.
  The money *came from* his grandmother's inheritance.

  Les pierres du château *proviennent* d'une carrière locale.
  The castle's stones *come from* a local quarry.

  Le mot « fenêtre » *provient* du latin « fenestra ».
  The word  window  *comes from* the Latin  fenestra .

  Ces magnifiques tableaux *proviennent* d'une collection privée.
  These magnificent paintings are from a private collection.

  Son mal de dos *provient* d'une mauvaise posture.
  His back aches from poor posture.

  La plupart de nos problèmes *proviennent* d'un manque de communication.
  Most of our problems *come from* a lack of communication.

  L'humus *provient* de la décomposition des feuilles mortes.
  Humus *comes from* the decomposition of dead leaves.

  Les habitudes des enfants *proviennent* souvent de leurs parents.
  Children's habits often *come from* their parents.

  Ses idées créatives *proviennent* de son imagination débordante.
  His creative ideas *come from* his overflowing imagination.

  Le malentendu *provenait* d'une simple erreur de traduction.
  The misunderstanding was caused by a simple translation error.

  Ces échantillons *proviennent* du laboratoire central.
  These samples are from the central laboratory.

  La lumière *provient* d'une source naturelle.
  Light *comes from* a natural source.

  Les fruits de ce marché *proviennent* directement des producteurs locaux.
  The fruits of this market come directly from local producers.

  Notre succès *provient* de nos efforts constants.
  Our success *comes from* our constant efforts.

