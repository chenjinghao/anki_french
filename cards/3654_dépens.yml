Beispielsätze: |-
  La Russie a affirmé ses ambitions aux *dépens* de l'Italie.
  Russia has confirmed its ambitions at the expense of Italy.

  Il s'est enrichi aux *dépens* des petits épargnants.
  He has enriched himself at the expense of the small savers.

  Le tribunal a condamné le défendeur aux *dépens*.
  The court sentenced the defendant to pay the costs of the trial.

  Cette plante grandit aux *dépens* des autres dans le jardin.
  This plant grows in the garden at the expense of others.

  J'ai malheureusement appris à mes *dépens* qu'on ne peut pas lui faire confiance.
  Unfortunately, I learned from my own painful *experience* that you can't trust him.

  "Il ne fait que vivre aux *dépens* de ses parents."
  "He lives only at the expense of his parents."

  Marie a dû payer tous les *dépens* du procès.
  Marie had to pay all the court costs of the trial.

  Les grands arbres se développent aux *dépens* des petits.
  The large trees develop at the expense of the small ones.

  Le succès de son entreprise s'est fait aux *dépens* de sa vie privée.
  The success of his company was at the expense of his private life.

  Nous avons appris à nos *dépens* que la patience est une vertu.
  We have learned from painful *experience* that patience is a virtue.

  Les *dépens* du procès s'élèvent à plusieurs milliers d'euros.
  The process costs amount to several thousand euros.

  Cette réforme s'est faite aux *dépens* des plus pauvres.
  This reform was carried out at the expense of the poorest.

  Il s'amuse toujours aux *dépens* des autres.
  He's always having fun at the expense of others.

  Le juge a compensé les *dépens* entre les parties.
  The judge divided the costs of the trial between the parties.

  Elle a sauvé son frère aux *dépens* de sa propre sécurité.
  She saved her brother with her own *security*.

  Tu apprendras à tes *dépens* que la vie n'est pas si simple.
  You will learn from your own *experience* that life is not that easy.

  Les parasites vivent aux *dépens* de leur hôte.
  Parasites live at the expense of their host.

  La partie perdante devra payer les *dépens*.
  The unsuccessful party must bear the costs of the court.

  Cette victoire s'est obtenue aux *dépens* de nombreuses vies.
  This victory was won at the expense of many lives.

