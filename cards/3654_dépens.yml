Notiz: |-
  <div class="section">
    <div class="section-title"><i>coût</i> and <i>dépens</i></div>
    <div class="section-content">
      <p><span class="fr">Coût</span> (#830) means <span class="de">"Kosten"</span> or <span class="de">"Preis"</span> and refers to the financial expense for something. It is often used in the economic or general context.</p>
      <div class="examples">
        <div class="fr">Le coût de la vie a augmenté ces dernières années.</div>
        <div class="de spoiler">The cost of living has increased in recent years.</div>
        <div class="fr">Quel est le coût total du projet?</div>
        <div class="de spoiler">What are the total cost of the project?</div>
      </div>
      <p><span class="fr">Dépens</span> (mostly used in the plural) refers to <span class="de">"Kosten"</span> or <span class="de">"Aufwendungen"</span>, often with the connotation that someone pays these costs or pays them. It is used especially frequently in legal contexts.</p>
      <div class="examples">
        <div class="fr">Elle a été condamnée aux dépens.</div>
        <div class="de spoiler">She was sentenced to take over the costs of the trial.</div>
        <div class="fr">Il s'est enrichi aux dépens des autres.</div>
        <div class="de spoiler">He has enriched himself at the expense of others.</div>
      </div>
      <p>During <span class="fr">coût</span> more neutrally refers to the price or cost of something, <span class="fr">dépens</span> often used to express that cost to someone's disadvantage or burdens arise, especially in the expression <span class="fr">aux dépens de</span> (<span class="de">"at the expense of"</span>).</p>
    </div>
  </div>
