Notiz: |-
  <div class="section">
    <div class="section-title"><i>coût</i> and <i>dépens</i></div>
    <div class="section-content">
      <p><span class="fr">Coût</span> (#830) means <span class="de">'Costs'</span> or <span class="de">"Price"</span> It's often used in an economic or general context.</p>
      <div class="examples">
        <div class="fr">Le coût de la vie a augmenté ces dernières années.</div>
        <div class="de spoiler">The cost of living has increased in recent years.</div>
        <div class="fr">Quel est le coût total du projet?</div>
        <div class="de spoiler">What is the total cost of the project?</div>
      </div>
      <p><span class="fr">Dépens</span> (usually used in the plural) refers to: <span class="de">'Costs'</span> or <span class="de">'Expenditure'</span>It is often used in legal contexts.</p>
      <div class="examples">
        <div class="fr">Elle a été condamnée aux dépens.</div>
        <div class="de spoiler">She was sentenced to bear the costs of the trial.</div>
        <div class="fr">Il s'est enrichi aux dépens des autres.</div>
        <div class="de spoiler">He got rich at the expense of others.</div>
      </div>
      <p>In the meantime <span class="fr">coût</span> is more neutral in relation to the price or cost of something, <span class="fr">dépens</span> often used to express that costs are incurred at someone's expense or expense, especially in speech <span class="fr">aux dépens de</span> (<span class="de">'At the expense of'</span>).</p>
    </div>
  </div>
