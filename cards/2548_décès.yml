Notiz: |-
  <div class="section">
    <div class="section-title"><i>mort</i> and <i>décès</i></div>
    <div class="section-content">
      <p><span class="fr">Mort</span> (#276) refers to the state of death or the concept of death in the broadest sense. It can be used to describe the death of a person, an animal, or even the end of something non-literal, such as a feeling or an era.</p>
      <div class="examples">
        <div class="fr">Elle pleure la mort de son chat.</div>
        <div class="de spoiler">She mourns the death of her cat.</div>
        <div class="fr">La mort de l'empire a marqué l'histoire.</div>
        <div class="de spoiler">The demise of the empire has shaped history.</div>
        <div class="fr">La mort lui semble moins effrayante maintenant.</div>
        <div class="de spoiler">Death now seems less scary to him.</div>
      </div>
      <p><span class="fr">Décès</span> refers specifically to the act of dying or passing away and is often used in formal or administrative contexts. It implies the process or event leading to death, not the state of death.</p>
      <div class="examples">
        <div class="fr">Le certificat de décès a été signé par le médecin.</div>
        <div class="de spoiler">The death certificate was signed by the doctor.</div>
        <div class="fr">Le nombre de décès dus à la maladie continue d'augmenter.</div>
        <div class="de spoiler">The number of deaths due to the disease continues to increase.</div>
        <div class="fr">Ils ont annoncé le décès de leur président.</div>
        <div class="de spoiler">They announced the death of their president.</div>
      </div>
    </div>
  </div>
