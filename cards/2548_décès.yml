  <div class="section">
    <div class="section-title"><i>mort</i> and <i>décès</i></div>
    <div class="section-content">
      <p><span class="fr">Mort</span> #276) refers to the state of being dead or the concept of death in the broadest sense. It can be used to describe the death of a person, an animal or even the end of something non-literal, such as a feeling or an era.</p>
      <div class="examples">
        <div class="fr">Elle pleure la mort de son chat.</div>
        <div class="de spoiler">She is mourning the death of her cat.</div>
        <div class="fr">La mort de l'empire a marqué l'histoire.</div>
        <div class="de spoiler">The fall of the empire shaped history.</div>
        <div class="fr">La mort lui semble moins effrayante maintenant.</div>
        <div class="de spoiler">Death seems less scary to him now.</div>
      </div>
      <p><span class="fr">Décès</span> It refers specifically to the act of dying or passing away and is often used in formal or administrative contexts. It implies the process or event that leads to death, not the state of being dead.</p>
      <div class="examples">
        <div class="fr">Le certificat de décès a été signé par le médecin.</div>
        <div class="de spoiler">The death certificate was signed by the doctor.</div>
        <div class="fr">Le nombre de décès dus à la maladie continue d'augmenter.</div>
        <div class="de spoiler">The number of deaths from the disease continues to rise.</div>
        <div class="fr">Ils ont annoncé le décès de leur président.</div>
