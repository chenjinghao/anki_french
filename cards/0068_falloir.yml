Notiz: |-
  <p>The verb <span class="fr">falloir</span> expresses a stronger need than <span class="fr">devoir</span> This verb is impersonal: it is only used in the 3rd person singular (il), but it can be conjugated in different time forms.</p>

  <p>One uses <span class="fr">falloir</span> + Infinitively, when talking about a necessity that refers to a group in which one is involved. Therefore, this term is used with <span class="de">we have to</span> with <span class="fr">falloir</span> + Infinitively you cannot talk about another person or yourself alone.</p>

  <div class="examples">
    <div class="fr">Il faut rentrer avant le dîner.</div>
    <div class="de spoiler">We have to come home before dinner.</div>
    <div class="fr">Il fallait traverser le fleuve pour atteindre le village.</div>
    <div class="de spoiler">We had to cross the river to reach the village.</div>
  </div>
