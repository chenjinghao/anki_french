  <p>The verb <span class="fr">falloir</span> This is not the case in the United Kingdom. <span class="fr">devoir</span> This verb is impersonal: it is used only in the third person singular (il) but it can be conjugated in different time forms.</p>

  <p>It is used <span class="fr">falloir</span> + infinitive when talking about a need that relates to a group in which you are involved. <span class="de">We have to</span> translated into English. <span class="fr">falloir</span> + infinitive you can't talk about another person or yourself alone.</p>

