Rang: 2452
Wort: inverse
Wortart: adj, nm

# Feel free to improve these fields!
Wort mit Artikel: un inverse
Femininum / Plural: ''
IPA: \ɛ̃.vɛʁs\
Definition: On the contrary
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  C'est l'*inverse* de ce que tu m'as raconté.
  It's *the opposite* of what you told me.

  Le sens de rotation de cette roue est *inverse* à celui des aiguilles d'une montre.
  The direction of rotation of this wheel is *the opposite* of that of a watch's needles.

  La relation entre l'offre et la demande est souvent *inverse*.
  The relationship between supply and demand is often *the opposite*.

  "*À l'inverse* de toi, je préfère travailler le matin."
  "Unlike you, I'd rather work in the morning".

  Les deux scientifiques ont obtenu des résultats *inverses*.
  The two scientists got the opposite results.

  L'effet de cette politique est l'*inverse* de ce qui était prévu.
  The effect of this policy is *the opposite* of what was planned.

  En mathématiques, 2 et 0,5 sont des nombres *inverses*.
  In mathematics, 2 and 0.5 are inverse numbers.

  La multiplication et la division sont des opérations *inverses*.
  Multiplication and division are inverse operations.

  L'*inverse* d'une matrice est crucial en algèbre linéaire.
  The inverse of a matrix is crucial in linear algebra.

  Le professeur a demandé aux élèves de résoudre le problème *inverse*.
  The teacher asked the students to solve the reverse problem.

  "J'ai fait exactement l'*inverse* de ce que tu m'as conseillé."
  "I did exactly *the opposite* of what you advised me to do".

  La vitesse est *inversement* proportionnelle au temps de parcours.
  The speed is inversely proportional to the journey time.

  Ce phénomène produit l'effet *inverse* de celui qu'on attendait.
  This phenomenon produces *the opposite* effect of what was expected.

  Dans ce pays, les saisons sont *inverses* aux nôtres.
  In this country, the seasons are the opposite of ours.

  L'*inverse* d'un nombre positif est toujours positif.
  The inverse of a positive number is always positive.

  Les deux équipes jouaient dans des directions *inverses*.
  Both teams played in opposite directions.

  "À l'*inverse* de mes attentes, le film était excellent."
  "Contrary to my expectations, the film was excellent".

  Le conducteur a pris la route dans le sens *inverse*.
  The driver took the road in *the opposite* direction.

  L'*inverse* d'une fonction n'est pas toujours facile à trouver.
  The inverse of a function is not always easy to find.

  Cette théorie propose l'*inverse* de ce qui est communément accepté.
  This theory proposes *the opposite* of what is commonly accepted.

  La relation entre le prix et la demande est souvent *inverse*.
  The relationship between price and demand is often *the opposite*.

  L'*inverse* du verbe "faire" est "défaire".
  *The opposite* of the verb "to do" is "to undo".

  En géométrie, les figures *inverses* ont des propriétés intéressantes.
  In geometry, inverse figures have interesting properties.

  L'entreprise a connu une évolution *inverse* à celle du marché.
  The company experienced *the opposite* development from that of the market.

  "Tu as compris l'*inverse* de ce que je voulais dire."
  "You got *the opposite* of what I meant".

  L'*inverse* additif de 5 est -5.
  The additive inverse of 5 is negative 5.

  Les deux pays ont des intérêts *inverses* dans cette négociation.
  Both countries have opposing interests in this negotiation.

  La réaction chimique a provoqué l'effet *inverse* de celui escompté.
  The chemical reaction caused *the opposite* effect.

  L'*inverse* d'un carré est toujours positif pour les nombres réels non nuls.
  The inverse of a square is always positive for non-zero real numbers.

  Cette décision *va à l'inverse* du bon sens.
  This decision goes against common sense.

  Le peintre a utilisé des couleurs *inverses* pour créer un contraste saisissant.
  The painter used reverse colors to create a striking contrast.

  En logique, la proposition *inverse* n'est pas toujours vraie.
  Logically, *the opposite* proposition is not always true.

