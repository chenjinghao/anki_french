Notiz: |-
  <div class="section">
    <div class="section-title"><i>contraire</i> and <i>inverse</i></div>
    <div class="section-content">
      <p><span class="fr">Contraire</span> (#619) means <span class="de">"Contrary"</span> And it often refers to the negation or the opposite state of a statement.</p>
      <div class="examples">
        <div class="fr">Je suis intelligent.</div>
        <div class="de spoiler">I'm smart, you know.</div>
        <div class="fr">Le <u>contraire</u> : Je ne suis pas intelligent.</div>
        <div class="de spoiler">On the contrary, I'm not intelligent.</div>
      </div>
      <p><span class="fr">Inverse</span> means <span class="de">"Reversal"</span> and often implies a change in the order or relationship between elements in a statement.</p>
      <div class="examples">
        <div class="fr">La mathématique est facile ; la philosophie est difficile.</div>
        <div class="de spoiler">Mathematics is simple; philosophy is difficult.</div>
        <div class="fr">L'<u>inverse</u> : La philosophie est facile ; la mathématique est difficile.</div>
        <div class="de spoiler">The reverse: philosophy is simple; mathematics is difficult.</div>
      </div>
      <p>For more complex statements, both interpretations may be possible:</p>
      <div class="examples">
        <div class="fr">La cuisine est facile ; le jardinage est difficile.</div>
        <div class="de spoiler">Cooking is easy; gardening is difficult.</div>
        <div class="fr">Le <u>contraire</u> : La cuisine n'est pas facile ; le jardinage n'est pas difficile.</div>
        <div class="de spoiler">On the contrary, cooking is not easy; gardening is not difficult.</div>
        <div class="fr">L'<u>inverse</u> : Le jardinage est facile ; la cuisine est difficile.</div>
        <div class="de spoiler">The reverse: gardening is easy; cooking is difficult.</div>
      </div>
    </div>
  </div>
