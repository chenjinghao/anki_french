Notiz: |-
  <div class="section">
    <div class="section-title"><i>mutuel</i> and <i>réciproque</i></div>
    <div class="section-content">
      <p><span class="fr">Mutuel</span> (#2642) means <span class="de">"gegenseitig"</span> or <span class="de">"wechselseitig"</span> and denotes something that is shared or felt by both sides; it emphasizes the shared participation.</p>
      <div class="examples">
        <div class="fr">Ils éprouvent un respect mutuel l'un pour l'autre.</div>
        <div class="de spoiler">They have mutual respect for each other.</div>
        <div class="fr">Nous avons conclu un accord d'assistance mutuelle.</div>
        <div class="de spoiler">We have concluded an agreement on mutual assistance.</div>
      </div>
      <p><span class="fr">Réciproque</span> means ebenfalls <span class="de">"gegenseitig"</span>However, it emphasizes more strongly the response or balance between the parties. It often implies a reaction or response.</p>
      <div class="examples">
        <div class="fr">Son amour n'était pas réciproque.</div>
        <div class="de spoiler">His love was not returned.</div>
        <div class="fr">La confiance doit être réciproque dans une relation.</div>
        <div class="de spoiler">Trust must be based on reciprocity in a relationship.</div>
      </div>
    </div>
  </div>
