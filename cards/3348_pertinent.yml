Wort: pertinent
Wortart: adj

# Feel free to improve these fields!
Wort mit Artikel: pertinent
Femininum / Plural: pertinente
IPA: \pɛʁ.ti.nɑ̃\
Definition: Apt, appropriate
Register: ↘fiction

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Je lui posai quelques questions *pertinentes*.
  I asked her a few pertinent questions.

  Sa réponse était très *pertinente* et m'a aidé à comprendre le problème.
  His answer was very appropriate and helped me to understand the problem.

  Il a fait une remarque *pertinente* pendant la réunion.
  He made an apt remark during the meeting.

  Cette modification n'est pas *pertinente* d'un point de vue juridique.
  This amendment is not legally significant.

  L'avocat a présenté des arguments *pertinents* pour défendre son client.
  The lawyer presented *sound* arguments in defense of his client.

  Les raisons qu'elle a données étaient tout à fait *pertinentes*.
  The reasons she mentioned were absolutely true.

  Cette analyse *pertinente* de la situation nous a ouvert les yeux.
  This accurate analysis of the situation has opened our eyes.

  Le comité ne considère pas cette information comme *pertinente*.
  The Committee does not consider this information to be *relevant*.

  Marie a toujours des commentaires très *pertinents* à faire.
  Marie always has very accurate comments to make.

  Sa critique *pertinente* m'a permis d'améliorer mon travail.
  His apt criticism helped me to improve my work.

  Nous avons besoin d'exemples *pertinents* pour illustrer cette théorie.
  We need appropriate examples to illustrate this theory.

  Les observations *pertinentes* des étudiants ont enrichi le débat.
  *The* students' accurate observations have enriched the debate.

  Cette solution me semble *pertinente* pour résoudre le problème.
  This solution seems appropriate to me to solve the problem.

  Le professeur a fait une intervention très *pertinente*.
  *The* professor made a very apt objection.

  Ces données ne sont pas *pertinentes* pour notre recherche.
  These data are not *relevant* for our research.

  L'article contient plusieurs analyses *pertinentes* de la situation politique.
  The article contains several apt analyses of the political situation.

  Votre remarque est tout à fait *pertinente*, je n'y avais pas pensé.
  Your remark is very true, I had not thought of it.

