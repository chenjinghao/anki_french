Rang: 2144
Wort: contraindre
Wortart: vt, vr

# Feel free to improve these fields!
Wort mit Artikel: contraindre
Femininum / Plural: ''
IPA: \kɔ̃.tʁɛ̃dʁ\
Definition: forcing
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  On ne peut les *contraindre* à comparaître.
  We can't force them to appear.

  Sa maladie l'a *contraint* au repos complet.
  His illness forced him to rest completely.

  Le mauvais temps nous a *contraints* d'écourter notre séjour.
  The bad weather forced us to shorten our stay.

  Elle a été *contrainte* d'accepter le poste à l'étranger.
  She was forced to accept the job abroad.

  Je suis *contraint* de renoncer à mes vacances.
  I'm forced to give up my vacation.

  La ville fut *contrainte* de se rendre après un long siège.
  The city was forced to surrender after a long siege.

  Il se *contraint* à se lever très tôt tous les matins.
  He's forced to get up early every morning.

  La nécessité le *contraint* à vendre sa propriété.
  Necessity compels him to sell his property.

  Je ne me suis jamais laissé *contraindre* dans mes goûts.
  I never let myself be constrained by my tastes.

  Elle ne signera que *contrainte et forcée*.
  She'll only sign under duress and coercion.

  Il avait peine à se *contraindre* devant son patron.
  He had a hard time compelling himself in front of his boss.

  J'ai été *contraint* à cette démarche par les circonstances.
  I was forced to do this by circumstances.

  Les parents ne devraient pas *contraindre* leurs enfants dans leurs choix professionnels.
  Parents should not force their children to choose a career.

  Il faut apprendre à se *contraindre* pour réussir.
  You have to learn to push yourself to succeed.

  Son sourire *contraint* trahissait son malaise.
  His compulsive smile betrayed his discomfort.

  Les règles sanitaires *contraignent* les restaurants à fermer plus tôt.
  Sanitary regulations require restaurants to close earlier.

  Je ne veux pas vous *contraindre*, c'est votre décision.
  I don't want to force you, it's your decision.

  Elle s'est *contrainte* à suivre un régime strict.
  She forced herself to follow a strict diet.

  La situation nous *contraint* à prendre des mesures drastiques.
  The situation forces us to take drastic measures.

  Il a dû *contraindre* ses désirs pour des raisons financières.
  He must have coerced his desires for financial reasons.

  Les événements nous ont *contraints* à revoir nos plans.
  Events have forced us to revise our plans.

  Ces nouvelles règles *contraignent* notre liberté d'action.
  These new rules restrict our freedom of action.

