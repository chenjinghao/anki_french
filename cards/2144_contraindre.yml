Notiz: |-
  <div class="section">
    <div class="section-title"><i>forcer</i> and <i>contraindre</i></div>
    <div class="section-content">
      <p><span class="fr">Forcer</span> (#758) means <span class="de">'forcing'</span> or <span class="de">"forced"</span> and is often used when someone is forced to do something against their will. It has a stronger and more aggressive connotation.</p>
      <div class="examples">
        <div class="fr">Il a forcé la porte pour entrer.</div>
        <div class="de spoiler">He broke open the door to get in.</div>
        <div class="fr">Elle a été forcée de révéler la vérité.</div>
        <div class="de spoiler">She was forced to reveal the truth.</div>
      </div>
      <p><span class="fr">Contraindre</span> has a more formal and less aggressive connotation than <b>forcer</b> and often involves external pressure or a need to force someone to do something.</p>
      <div class="examples">
        <div class="fr">Elle a été contrainte de démissionner.</div>
        <div class="de spoiler">She was forced to resign.</div>
        <div class="fr">Il a contraint son adversaire à se rendre.</div>
        <div class="de spoiler">He forced his opponent to surrender.</div>
      </div>
    </div>
  </div>
