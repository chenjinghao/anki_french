Notiz: |-
  <div class="section">
    <div class="section-title"><i>forcer</i> and <i>contraindre</i></div>
    <div class="section-content">
      <p><span class="fr">Forcer</span> (#758) means <span class="de">"zwingen"</span> or <span class="de">"erzwingen"</span> and is often used when someone is forced to do something against his will. It has a stronger and more aggressive connotation.</p>
      <div class="examples">
        <div class="fr">Il a forcé la porte pour entrer.</div>
        <div class="de spoiler">He broke the door to step in.</div>
        <div class="fr">Elle a été forcée de révéler la vérité.</div>
        <div class="de spoiler">She was forced to reveal the truth.</div>
      </div>
      <p><span class="fr">Contraindre</span> has a more formal and less aggressive connotation than <b>forcer</b> and often implies external pressure or a need that forces someone to do something.</p>
      <div class="examples">
        <div class="fr">Elle a été contrainte de démissionner.</div>
        <div class="de spoiler">She was forced to quit.</div>
        <div class="fr">Il a contraint son adversaire à se rendre.</div>
        <div class="de spoiler">He forced his opponent to do the job.</div>
      </div>
    </div>
  </div>
