Wort mit Artikel: confidentiel
Femininum / Plural: confidentielle
IPA: \kɔ̃.fi.dɑ̃.sjɛl\
Definition: Confidential
Register: ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Soyez attentif, ce message est *confidentiel*.
  Be aware, this message is *confidential*.

  *À titre confidentiel*, je dois vous informer d'un changement important dans l'entreprise.
  In *confidence*, I need to inform you about an important change in the company.

  Les documents *confidentiels* doivent être conservés dans un coffre-fort.
  The confidential documents must be kept in a safe.

  Cette réunion *confidentielle* aura lieu demain matin à huit heures.
  This confidential meeting will take place tomorrow morning at eight o'clock.

  Le journal intime est un document strictement *confidentiel*.
  The diary is a strictly confidential document.

  La diffusion *confidentielle* de ce rapport ne concerne que trois personnes.
  The confidential disclosure of this report concerns only three persons.

  Toutes les informations *confidentielles* ont été supprimées de la base de données.
  All confidential information has been deleted from the database.

  L'entretien *confidentiel* avec le directeur a duré deux heures.
  The confidential conversation with the director lasted two hours.

  Ces renseignements *confidentiels* ne doivent pas quitter ce bureau.
  This confidential information may not leave this office.

  La note *confidentielle* a été transmise uniquement aux cadres supérieurs.
  The confidential notification was only forwarded to the senior executives.

  Le dossier porte la mention "*confidentiel*" en rouge.
  The file bears the confidential note in red.

  Cette revue *confidentielle* n'est distribuée qu'à cent abonnés.
  This confidential magazine is distributed to only one hundred subscribers.

  Les détails *confidentiels* de l'accord seront révélés la semaine prochaine.
  The confidential details of the agreement will be revealed next week.

  *Le caractère confidentiel* de cette information doit être préservé.
  The *confidentiality* of this information must be respected.

  Elle a partagé des informations *confidentielles* avec son équipe.
  She shared confidential information with her team.

