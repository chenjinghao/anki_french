Wort mit Artikel: minimiser
Femininum / Plural: ''
IPA: \mi.ni.mi.ze\
Definition: play down, talk down
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Il tend donc à *minimiser* le problème.
  So he tends to talk the problem down.

  Ne *minimisez* pas vos réussites, vous avez fait un excellent travail !
  Don't *play* *down* your successes, you've done an excellent job!

  Les médias tentent de *minimiser* la gravité de la situation.
  The media are trying to downplay the severity of the situation.

  Marie a toujours tendance à *minimiser* ses talents artistiques.
  Marie always tends to talk her artistic talents down.

  Le directeur a *minimisé* l'importance de l'incident devant la presse.
  The director downplayed the significance of the incident in front of the press.

  En *minimisant* son rôle dans le projet, Pierre fait preuve de modestie excessive.
  By playing down his role in the project, Pierre shows excessive modesty.

  Les experts nous conseillent de ne pas *minimiser* les risques du changement climatique.
  The experts advise us not to reduce the risks of climate change.

  Elle a essayé de *minimiser* la valeur du travail de son collègue.
  She tried to *reduce* the value of her colleague's work.

  Le gouvernement ne devrait pas *minimiser* l'impact de cette décision.
  The government should not downplay the impact of this decision.

  Thomas *minimise* toujours l'importance de ses problèmes de santé.
  Thomas always plays *down* the importance of his health problems.

  Les parents ne devraient pas *minimiser* les inquiétudes de leurs enfants.
  Parents shouldn't talk their children's worries down.

  En *minimisant* ces accusations, vous aggravez la situation.
  By playing down these allegations, you're making the situation worse.

  L'entreprise a tenté de *minimiser* l'ampleur du scandale.
  The company has tried to reduce the scale of the scandal.

