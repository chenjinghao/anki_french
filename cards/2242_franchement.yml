  Allez-y *franchement*, n'ayez pas peur de dire ce que vous pensez.
  Go straight to it, don't be afraid to say what you think.

  À parler *franchement*, je ne suis pas satisfait du résultat.
  To be honest, I'm not happy with the result.

  Elle m'a regardé droit dans les yeux et m'a dit *franchement* la vérité.
  She looked me straight in the eye and told me the truth.

  *Franchement*, votre proposition mérite d'être examinée plus en détail.
  Frankly, your proposal deserves further consideration.

