Beispielsätze: |-
  *Franchement*, cela ne m'étonne pas.
  Frankly, I'm not surprised.

  Je vous le dis *franchement* : je n'approuve pas votre décision.
  I can tell you *frankly* that I do not agree with your decision.

  Allons, parlez-moi *franchement* de ce qui vous préoccupe.
  Come on, tell me *frankly* what you're worried about.

  Il faut aborder *franchement* le problème si nous voulons le résoudre.
  If we want to solve the problem, we have to be frank about it.

  "*Franchement*, tu aurais pu faire un effort !" s'est-elle exclamée.
  "Frankly, you could have made an effort!" she exclaimed.

  Le candidat a répondu *franchement* à toutes les questions des journalistes.
  The candidate answered all the questions of the journalists *frankly*.

  Cette situation devient *franchement* inquiétante.
  This situation is becoming *frankly* troubling.

  *Franchement*, je préfère rester chez moi ce soir.
  Frankly, I'd rather stay home tonight.

  Il faut entrer *franchement* dans le vif du sujet.
  We need to get straight to the heart of the matter.

  Le cheval a sauté l'obstacle *franchement*, sans hésitation.
  The horse jumped the obstacle *frankly*, without hesitation.

  Cette solution me paraît *franchement* mauvaise.
  This solution seems to me *frankly* wrong.

  Dites-moi *franchement* ce que vous en pensez.
  Tell me *frankly* what you think.

  Il s'est prononcé *franchement* en faveur de cette réforme.
  He was openly in favour of this reform.

  *Franchement*, je ne comprends pas votre point de vue.
  Frankly, I don't understand your point of view.

  Son attitude est devenue *franchement* désagréable ces derniers temps.
