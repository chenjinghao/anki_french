Notiz: |-
  <div class="section">
    <div class="section-title"><i>s'efforcer</i> and <i>tâcher</i></div>
    <div class="section-content">
      <p><span class="fr">S'efforcer</span> #2041) means <span class="de">"to work hard"</span> or <span class="de">"Do your best"</span> and emphasizes the effort and commitment you put into achieving something.</p>
      <div class="examples">
        <div class="fr">Elle s'efforce de parler français sans accent.</div>
        <div class="de spoiler">She strives to speak French without an accent.</div>
        <div class="fr">Nous nous efforçons de respecter les délais.</div>
        <div class="de spoiler">We strive to meet the deadlines.</div>
      </div>
      <p><span class="fr">Tâcher</span> means <span class="de">'Trying'</span> or <span class="de">"Do your best"</span> and is less intense than <span class="fr">s'efforcer</span>It expresses an intention or an attempt without putting the same emphasis on effort.</p>
      <div class="examples">
        <div class="fr">Je vais tâcher de venir avant midi.</div>
        <div class="de spoiler">I'll try to get there before noon.</div>
        <div class="fr">Tâchez de ne pas faire de bruit.</div>
        <div class="de spoiler">Try not to make any noise.</div>
      </div>
    </div>
  </div>
