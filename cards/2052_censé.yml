Wort mit Artikel: censé
Femininum / Plural: censée
IPA: \sɑ̃.se\
Definition: actually (should)
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Elle est *censée* donner une réponse.
  Tell her *to* give an answer.

  Je suis *censé* être à la réunion dans une heure.
  I *should* be at the meeting in an hour.

  Nous étions *censés* partir en vacances, mais nos plans ont changé.
  We *should actually* go on vacation, but our plans have changed.

  "*Censée* connaître la réponse, j'ai pourtant hésité."
  "Although I should have known the answer, I hesitated."

  Le train est *censé* arriver à 15h, mais il a du retard.
  The train's supposed *to* arrive at 3:00, but it's late.

  Tu n'étais pas *censé* être au courant de cette surprise !
  You shouldn't really know about this surprise!

  Les experts sont *censés* trouver une solution à ce problème.
  The experts should find a solution *to* this problem.

  Nul n'est *censé* ignorer la loi.
  No one can claim not to know the law.

  Que suis-je *censé* faire dans cette situation ?
  What should I do in this situation?

  Les étudiants sont *censés* rendre leur devoir demain.
  Tell the students *to* give up their homework tomorrow.

  Elle était *censée* m'appeler hier soir, mais je n'ai pas eu de nouvelles.
  She *should* call me last night, but I haven't heard from her.

  Ce nouveau logiciel est *censé* améliorer notre productivité.
  This new software is designed *to* improve our productivity.

  Vous êtes *censé* avoir lu le rapport avant la réunion.
  You *should* have read the report before the meeting.

