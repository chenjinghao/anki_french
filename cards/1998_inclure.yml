Wort mit Artikel: inclure
Femininum / Plural: ''
IPA: \ɛ̃.klyʁ\
Definition: including, including:
Register: ↘fiction

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  N'*incluez* pas une extension de fichier.
  Do not *add* a file extension.

  Cette offre *inclut* le petit-déjeuner et le dîner.
  This offer includes breakfast and dinner.

  Le prix *inclut* tous les frais de livraison.
  The price *includes* all shipping costs.

  Nous devons *inclure* plus de diversité dans notre équipe.
  We need to include more diversity in our team.

  J'ai *inclus* une copie de mon CV dans l'enveloppe.
  I've put a copy of my resume in the envelope.

  Le nouveau contrat *inclut* une clause de confidentialité.
  The new Treaty *contains* a confidentiality clause.

  Cette somme *inclut*-elle les taxes?
  Does this amount include taxes?

  Le festival *inclura* des artistes locaux et internationaux.
  The festival will involve local and international artists.

  "J'ai *inclus* ton nom dans la liste des invités."
  "I put your name on the guest list."

  Le forfait téléphonique *inclut* les appels illimités.
  The mobile phone tariff *includes* unlimited calls.

  Nous devons *inclure* ces données dans notre rapport final.
  We need to include this data in our final report.

  Le package logiciel *inclut* une formation gratuite.
  The software package *includes* a free training.

  Cette définition *inclut* tous les aspects du problème.
  This definition includes all aspects of the problem.

  L'œuvre complète de cet auteur *inclut* des romans et des essais.
  The complete work of this author *includes* novels and essays.

  Le gouvernement a décidé d'*inclure* les étudiants dans ce programme.
  The government has decided to involve the students in this programme.

  Pouvez-vous *inclure* ces modifications dans la prochaine version?
  Can you *record* these changes in the next version?

  Le musée a *inclus* cette peinture dans sa collection permanente.
  The museum has included this painting in its permanent exhibition.

  L'accord de paix *inclut* des dispositions pour le désarmement.
  The peace agreement *contains* provisions for disarmament.

  Cette théorie *inclut* plusieurs hypothèses controversées.
  This theory contains several controversial hypotheses.

