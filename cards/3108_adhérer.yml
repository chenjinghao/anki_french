Beispielsätze: |-
  Quoi que vous fassiez, *adhérez* à l'union.
  Whatever you do, join the union.

  La colle *adhère* parfaitement au bois.
  The glue adheres perfectly to the wood.

  Ces pneus *adhèrent* bien sur route mouillée.
  These tires stick well on wet roads.

  Les moules *adhèrent* fortement aux rochers.
  The molds adhere tightly to the rocks.

  Le lierre *adhère* au mur depuis des années.
  The liger has been sticking to the wall for years.

  La pâte n'*adhère* pas à cette nouvelle poêle antiadhésive.
  The dough doesn't stick to this new sticky stove.

  Marie *adhère* totalement à notre point de vue.
  Marie fully agrees with our view.

  Je n'*adhère* pas du tout à cette façon de penser.
  I don't agree with that way of thinking at all.

  De plus en plus de jeunes *adhèrent* à ce mouvement écologique.
  More and more young people are joining this ecological movement.

  Notre équipe *adhère* pleinement aux nouveaux objectifs.
  Our team is fully committed to the new goals.

  Paul *adhère* depuis longtemps aux idées socialistes.
  Paul has long been a supporter of socialist ideas.

  La voiture *adhère* parfaitement dans les virages serrés.
  The car fits perfectly in tight corners.

  Des milliers de personnes ont *adhéré* à cette association caritative.
  Thousands of people have *joined* this charitable organization.

  Les étudiants peuvent *adhérer* gratuitement à la bibliothèque.
  Students can join the library free of charge.

  Je vais *adhérer* au club de sport la semaine prochaine.
  I'm *joining* the sports club next week.

  La suie *adhérait* si fortement à la cheminée qu'il fallait la gratter.
  The silk stuck so tightly to the chimney that it had to be scratched.

  Thomas *adhère* sans réserve à notre proposition.
  Thomas fully supports our proposal.

  Les coquillages *adhèrent* fermement à la coque du bateau.
  The shells adhere tightly to the hull of the ship.

  De nombreux pays ont *adhéré* à ce traité international.
  Many countries have *joined* this international treaty.

