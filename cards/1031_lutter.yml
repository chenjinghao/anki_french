Notiz: |-
  <div class="section">
    <div class="section-title"><i>battre</i> and <i>lutter</i></div>
    <div class="section-content">
      <p><span class="fr">Se battre</span> (#742) refers to fighting in the physical or metaphorical sense and often implies a personal struggle or confrontation.</p>
      <div class="examples">
        <div class="fr">Il se bat pour justifier ses droits.</div>
        <div class="de spoiler">He fights to justify his rights.</div>
        <div class="fr">Les deux hommes se sont battus en plein rue.</div>
        <div class="de spoiler">The two men fought in the middle of the street.</div>
      </div>
      <p><span class="fr">Lutter</span> often has the connotation to fight against difficult circumstances or to resist a form of adversity. It can be used for both tangible and incomprehensible challenges.</p>
      <div class="examples">
        <div class="fr">Il lutte contre le courant pour atteindre l'autre rive.</div>
        <div class="de spoiler">He fights against the current to reach the other shore.</div>
        <div class="fr">Nous devons lutter contre l'injustice sociale.</div>
        <div class="de spoiler">We must fight against social injustice.</div>
      </div>
    </div>
  </div>
