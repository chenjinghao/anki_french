Notiz: |-
  <div class="section">
    <div class="section-title"><i>histoire</i> and <i>récit</i></div>
    <div class="section-content">
      <p><span class="fr">Histoire</span> (#263) is used for various types of stories, including historical events, myths, personal reports or fictional narratives. It can also specifically mean "history" in terms of academic discipline or actual past events.</p>
      <div class="examples">
        <div class="fr">L'histoire de la Révolution française est fascinante.</div>
        <div class="de spoiler">The history of the French Revolution is fascinating.</div>
        <div class="fr">Mon grand-père aime raconter des histoires de sa jeunesse.</div>
        <div class="de spoiler">My grandfather likes to tell stories from his youth.</div>
      </div>
      <p><span class="fr">Récit</span> refers to a narrative or a report of events and emphasizes the act of narration or reporting. It can be fictitious or non-fictitious and often offers more details about situations or actions.</p>
      <div class="examples">
        <div class="fr">Le récit de son voyage en Asie était captivant et plein de détails.</div>
        <div class="de spoiler">The account of his journey through Asia was captivating and full of details.</div>
        <div class="fr">Le témoignage qu'elle a donné au procès constituait un récit poignant et sincère des événements.</div>
        <div class="de spoiler">Her testimony in court was a poignant and sincere account of the events.</div>
      </div>
    </div>
  </div>
