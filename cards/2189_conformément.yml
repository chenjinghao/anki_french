Beispielsätze: |-
  Le débat se déroulera *conformément* au règlement.
  The debate will take place in accordance with the Rules of Procedure.

  J'ai agi *conformément* aux ordres reçus.
  I did as I was told.

  Nous devons vivre *conformément* à nos moyens.
  We must live according to our means.

  Les élèves doivent se comporter *conformément* au règlement de l'école.
  Students must behave in accordance with the school regulations.

  La réunion a été organisée *conformément* à vos désirs.
  The meeting was arranged according to your wishes.

  *Conformément* à nos attentes, les résultats sont excellents.
  In line with our expectations, the results are excellent.

  Le restaurant change son menu *conformément* à la saison.
  The restaurant changes its menu according to the season.

  *Conformément* à la loi, nous devons porter un casque à moto.
  According to the law, we have to wear a motorcycle helmet.

  Le conseil a voté *conformément* à la demande des citoyens.
  The Council voted in accordance with the citizens' request.

  *Conformément* aux instructions, j'ai rempli tous les formulaires.
  In accordance with the instructions, I filled out all the forms.

  Nous avons procédé *conformément* aux règles de sécurité.
  We have acted in accordance with the safety rules.

  Le bâtiment a été construit *conformément* aux plans.
  The building was built according to the plans.

  *Conformément* à votre demande, nous vous envoyons les documents.
  In accordance with your request, we will send you the documents.

  Les examens se dérouleront *conformément* au calendrier prévu.
  The examinations will take place in accordance with the planned timetable.

  Le projet avance *conformément* au planning établi.
  The project is progressing according to the established timetable.

  *Conformément* à la tradition, nous célébrons cette fête chaque année.
  According to tradition, we celebrate this holiday every year.

  Les travaux seront réalisés *conformément* au devis.
  The work will be carried out in accordance with the quotation.

  Veuillez agir *conformément* aux directives fournies.
  Please act in accordance with the instructions given.

