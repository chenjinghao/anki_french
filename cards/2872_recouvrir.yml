Notiz: |-
  <div class="section">
    <div class="section-title"><i>couvrir</i> and <i>recouvrir</i></div>
    <div class="section-content">
      <p><span class="fr">Couvrir</span> (#682) means allgemein <span class="de">"bedecken"</span> or <span class="de">"abdecken"</span>It is used to describe the concealment, protecting or concealing of something.</p>
      <div class="examples">
        <div class="fr">Elle a couvert le bébé d'une couverture.</div>
        <div class="de spoiler">She covered the baby with a blanket.</div>
        <div class="fr">Les nuages couvrent le ciel.</div>
        <div class="de spoiler">The clouds cover the sky.</div>
      </div>

      <p><span class="fr">Recouvrir</span> means <span class="de">"cover"</span> or <span class="de">"Draw over"</span>. It often implies a more complete or intense covering than <span class="fr">couvrir</span>.</p>
      <div class="examples">
        <div class="fr">La neige recouvre entièrement le sol.</div>
        <div class="de spoiler">The snow completely covers the ground.</div>
        <div class="fr">Il a recouvert le mur de papier peint.</div>
        <div class="de spoiler">He covered the wall with wallpaper.</div>
      </div>

      <p>The main difference lies in the intensity and completeness of the covering:</p>
      <ul>
        <li><span class="fr">Couvrir</span> may mean partial or complete covering.</li>
        <li><span class="fr">Recouvrir</span> normally implies a complete or more thorough covering.</li>
      </ul>

      <p>Both verbs can be used both literally and figuratively:</p>
      <div class="examples">
        <div class="fr">Cette assurance couvre les dégâts.</div>
        <div class="de spoiler">This insurance covers the damage.</div>
        <div class="fr">Son mensonge recouvre une vérité plus complexe.</div>
        <div class="de spoiler">His lie conceals a more complex truth.</div>
      </div>
    </div>
  </div>
