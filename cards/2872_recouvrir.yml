Notiz: |-
  <div class="section">
    <div class="section-title"><i>couvrir</i> and <i>recouvrir</i></div>
    <div class="section-content">
      <p><span class="fr">Couvrir</span> (#682) means general <span class="de">'Covered'</span> or <span class="de">'Covered'</span>It is used to describe concealing, protecting or concealing something.</p>
      <div class="examples">
        <div class="fr">Elle a couvert le bébé d'une couverture.</div>
        <div class="de spoiler">She covered the baby with a blanket.</div>
        <div class="fr">Les nuages couvrent le ciel.</div>
        <div class="de spoiler">The clouds cover the sky.</div>
      </div>

      <p><span class="fr">Recouvrir</span> means <span class="de">'Covered'</span> or <span class="de">'transition' means the transition from one state to another;</span>It often implies more complete or intensive coverage than <span class="fr">couvrir</span>.</p>
      <div class="examples">
        <div class="fr">La neige recouvre entièrement le sol.</div>
        <div class="de spoiler">The snow completely covers the ground.</div>
        <div class="fr">Il a recouvert le mur de papier peint.</div>
        <div class="de spoiler">He covered the wall with wallpaper.</div>
      </div>

      <p>The main difference lies in the intensity and completeness of the coverage:</p>
      <ul>
        <li><span class="fr">Couvrir</span> can mean partial or full coverage.</li>
        <li><span class="fr">Recouvrir</span> This is usually a complete or more thorough coverage.</li>
      </ul>

      <p>Both verbs can be used both literally and figuratively:</p>
      <div class="examples">
        <div class="fr">Cette assurance couvre les dégâts.</div>
        <div class="de spoiler">This insurance covers the damage.</div>
        <div class="fr">Son mensonge recouvre une vérité plus complexe.</div>
        <div class="de spoiler">His lie hides a more complex truth.</div>
      </div>
    </div>
