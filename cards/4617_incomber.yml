Rang: 4617
Wort: incomber
Wortart: vi

# Feel free to improve these fields!
Wort mit Artikel: incomber
Femininum / Plural: ''
IPA: \ɛ̃.kɔ̃.be\
Definition: to fall within the scope of this Regulation
Register: ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Ce rôle leur *incombe* maintenant.
  That's their role now.

  Cette tâche *incombe* à Marie depuis son arrivée.
  This task has been on Marie since she arrived.

  Il *incombe* au président de prendre la décision finale.
  It is up to the President to make the final decision.

  La responsabilité *incombe* aux parents de surveiller leurs enfants.
  It is the responsibility of parents to supervise their children.

  Les frais de réparation *incombent* au propriétaire.
  Repair costs are borne by the owner.

  C'est à vous qu'*incombe* la tâche de former les nouveaux employés.
  It is up to you to train the new employees.

  La sécurité des données *incombe* à notre équipe technique.
  Data security is the responsibility of our technical team.

  Ces obligations *incombent* désormais à notre département.
  These obligations are now the responsibility of our department.

  L'entretien du jardin *incombe* au locataire selon le contrat.
  Maintenance of the garden is the tenant's responsibility according to the contract.

  C'est au directeur qu'*incombe* la décision finale.
  It's up to the director to make the final decision.

  Les coûts supplémentaires *incombent* à l'entreprise.
  The additional costs shall be borne by the undertaking.

  Cette mission délicate *incombe* à notre meilleur agent.
  This delicate task is up to our best agent.

  La supervision du projet *incombe* à Thomas depuis hier.
  Thomas has been overseeing the project since yesterday.

  L'organisation de l'événement *incombe* à notre équipe.
  It's up to our team to organize the event.

