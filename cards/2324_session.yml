  <div class="section">
    <div class="section-title"><i>session</i> and <i>séance</i></div>
    <div class="section-content">
      <p><span class="fr">Session</span> describes a series of meetings or events over a certain period of time. It often corresponds in German to the term <span class="de">"Sitzungsperiode"</span> or <span class="de">"Tagungsperiode"</span>.</p>
      <div class="examples">
        <div class="fr">La session des examens s'étendra du 5 au 12 décembre.</div>
        <div class="de spoiler">The examination period is from 5 to 12 December.</div>
        <div class="fr">La session parlementaire reprendra sous peu.</div>
        <div class="de spoiler">The session of Parliament will resume shortly.</div>
      </div>
      <p><span class="fr">Séance</span> (#1463) refers to a single session or event. It corresponds in German to the term <span class="de">"Sitzung"</span> or <span class="de">"Veranstaltung"</span>.</p>
      <div class="examples">
        <div class="fr">Les séances de formation débutent la semaine prochaine.</div>
        <div class="de spoiler">The training sessions will start next week.</div>
        <div class="fr">Les séances du comité reprendront en septembre.</div>
        <div class="de spoiler">Committee meetings will be resumed in September.</div>
      </div>
      <p class="tip">The use of <span class="fr">session</span> for a single session is an anglicism and should be avoided.</p>
    </div>
  </div>
