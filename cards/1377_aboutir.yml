Notiz: |-
  <div class="section">
    <div class="section-title"><i>réussir</i> and <i>aboutir</i></div>
    <div class="section-content">
      <p><span class="fr">Réussir</span> (#279) can be used both with an object as a subject (typically in projects or projects) and with a person as a subject.</p>
      <div class="examples">
        <div class="fr">Son projet a enfin réussi.</div>
        <div class="de spoiler">His project was finally successful.</div>
        <div class="fr">Il a réussi son examen.</div>
        <div class="de spoiler">He passed his exam.</div>
        <div class="fr">Elle a réussi à les convaincre.</div>
        <div class="de spoiler">She managed to convince her.</div>
      </div>
      <p><span class="fr">Aboutir</span> In some contexts it can be used synonymously with <b>réussir</b> In addition, it is important to note that the Commission's proposal for a regulation of the European Parliament and of the Council <span class="de">"come to an end"</span> or <span class="de">"leading to something"</span>It has two main meanings: to finish something and to end something somewhere.</p>
      <div class="examples">
        <div class="fr">Son projet a enfin abouti.</div>
        <div class="de spoiler">His project has finally come to an end.</div>
        <div class="fr">La séance n'a abouti à aucun résultat.</div>
        <div class="de spoiler">The meeting did not lead to any outcome.</div>
        <div class="fr">La voiture a heurté un arbre avant d'aboutir dans une prairie.</div>
        <div class="de spoiler">The car hit a tree before it stopped on a meadow.</div>
      </div>
    </div>
  </div>
