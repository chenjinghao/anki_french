Notiz: |-
  <div class="section">
    <div class="section-title"><i>réussir</i> and <i>aboutir</i></div>
    <div class="section-content">
      <p><span class="fr">Réussir</span> (#279) can be used with an object as a subject (typically in projects or projects) as well as with a person as a subject. It generally means being successful or creating something.</p>
      <div class="examples">
        <div class="fr">Son projet a enfin réussi.</div>
        <div class="de spoiler">His project was finally successful.</div>
        <div class="fr">Il a réussi son examen.</div>
        <div class="de spoiler">He passed his exam.</div>
        <div class="fr">Elle a réussi à les convaincre.</div>
        <div class="de spoiler">She managed to convince her.</div>
      </div>
      <p><span class="fr">Aboutir</span> can be synonymous in some contexts to <b>réussir</b> the use, but additionally carries the meaning of <span class="de">"To end"</span> or <span class="de">"to lead to something"</span>. It has two main meanings: something complete/complete and somewhere end/lead.</p>
      <div class="examples">
        <div class="fr">Son projet a enfin abouti.</div>
        <div class="de spoiler">His project finally came to an end.</div>
        <div class="fr">La séance n'a abouti à aucun résultat.</div>
        <div class="de spoiler">The meeting did not produce any result.</div>
        <div class="fr">La voiture a heurté un arbre avant d'aboutir dans une prairie.</div>
        <div class="de spoiler">The car hit a tree before it stopped on a meadow.</div>
      </div>
    </div>
  </div>
