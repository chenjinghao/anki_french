Rang: 2551
Wort: réviser
Wortart: vt, vi

# Feel free to improve these fields!
Wort mit Artikel: réviser
Femininum / Plural: ''
IPA: \ʁe.vi.ze\
Definition: Revising and reviewing
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  J'ai *révisé* votre plan de vol.
  I've *reviewed* your flight plan.

  Le gouvernement veut *réviser* la Constitution pour y inclure de nouveaux droits.
  The government wants to revise the Constitution to include new rights.

  Il faut *réviser* ce manuscrit avant de l'envoyer à l'éditeur.
  This manuscript must be reviewed before being sent to the publisher.

  Après cette conversation, j'ai dû *réviser* mon jugement sur lui.
  After that conversation, I had to revise my judgment on him.

  Les prix ont été *révisés* à la hausse en raison de l'inflation.
  Prices have been revised upwards due to inflation.

  "Tu devrais *réviser* ton français avant l'examen."
  "You should check your French before the exam".

  Le mécanicien va *réviser* le moteur de ma voiture demain.
  The mechanic will check the engine of my car tomorrow.

  Les étudiants passent la nuit à *réviser* leurs cours d'histoire.
  Students spend the night *reviewing* their history classes.

  Le comité a décidé de *réviser* la liste des candidats.
  The committee decided to revise the list of candidates.

  Il faut *réviser* ce traité pour l'adapter aux nouvelles réalités internationales.
  This Treaty must be revised in order to adapt it to the new international realities.

  Nous devons *réviser* notre stratégie marketing pour l'année prochaine.
  We need to revise our marketing strategy for next year.

  L'avocat a demandé à *réviser* le procès de son client.
  The lawyer asked to review his client's case.

  Je vais *réviser* mes leçons de mathématiques ce week-end.
  I'm going to review my math lessons this weekend.

  L'entreprise a *révisé* à la baisse ses prévisions de croissance.
  The company has revised its growth forecasts downwards.

  Le plombier viendra *réviser* l'installation de chauffage la semaine prochaine.
  The plumber's coming over next week to review the heating system.

  Les experts ont *révisé* leur estimation des dommages causés par l'ouragan.
  Experts have revised their estimate of the damage caused by the hurricane.

  "N'oublie pas de *réviser* ton rôle avant la représentation de ce soir."
  "Don't forget to review your role before tonight's performance".

  L'éditeur m'a demandé de *réviser* certains passages du livre.
  The publisher asked me to review some passages in the book.

  Les comptables sont en train de *réviser* les comptes de l'entreprise.
  The accountants are *reviewing* the company's accounts.

  Il faut *réviser* régulièrement sa voiture pour éviter les pannes.
  Your car needs to be checked regularly to avoid breakdowns.

  Nous allons *réviser* le règlement intérieur de l'école.
  We're going to review the school's rules.

  Les scientifiques ont dû *réviser* leur théorie à la lumière des nouvelles découvertes.
  Scientists had to revise their theory in light of new discoveries.

  "J'ai *révisé* mon opinion sur ce sujet après avoir lu cet article."
  "I revised my view on the subject after reading this article".

  Le correcteur est en train de *réviser* les épreuves avant l'impression du journal.
  The proofreader is *reviewing* the tests before the newspaper is printed.

  Les diplomates se sont réunis pour *réviser* les termes de l'accord.
  The diplomats met to review the terms of the agreement.

