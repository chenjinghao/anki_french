# Please do not change these fields.
Rang: 1682
Wort: persuader
Wortart: vt, vr

# Feel free to improve these fields!
Wort mit Artikel: persuader
Femininum / Plural: ''
IPA: \pɛʁ.sɥa.de\
Definition: Convince, Convince
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Il était *persuadé* que j'avais un talent.
  He was *convinced* I had a talent.

  Son comportement m'a *persuadé* de son innocence.
  His behavior *convinced* me of his innocence.

  Je suis intimement *persuadée* qu'il dit la vérité.
  I'm sure he's telling the truth.

  Les parents ont *persuadé* leur fille de continuer ses études.
  The parents persuaded her daughter to continue her studies.

  Elle s'est *persuadée* que tout le monde la détestait.
  She's *convinced* herself that everyone hated her.

  J'ai essayé de *persuader* Marie de venir à la fête.
  I tried to persuade Marie to come to the party.

  Le professeur a *persuadé* l'étudiant de repasser l'examen.
  The professor *convinced* the student to repeat the exam.

  Nous nous sommes *persuadés* de notre bon droit.
  We were *convinced* of our right.

  Son discours a *persuadé* même les plus sceptiques.
  His speech *convinced* even the most skeptical.

  Elle s'est facilement laissé *persuader* de changer d'avis.
  She was easily persuaded to change her mind.

  Les faits ont fini par me *persuader* de mon erreur.
  The facts have finally *convinced* me of my mistake.

  Il a *persuadé* le jury de sa bonne foi.
  He *convinced* the jury of his sincerity.

  Les exemples *persuadent* mieux que les mots.
  Examples convince better than words.

  Je me suis *persuadé* qu'il reviendrait un jour.
  I made myself believe that one day he would come back.

  Nous l'avons *persuadée* de présenter ses excuses.
  We persuaded her to apologize.

  Thomas s'est *persuadé* de pouvoir réussir seul.
  Thomas *convinced* himself that he could do it alone.

  L'avocat a *persuadé* le juge de l'innocence de son client.
  The lawyer *convinced* the judge of his client's innocence.

  Elle m'a *persuadé* de sa sincérité.
  She *convinced* me of her sincerity.

  Il faut le *persuader* d'abandonner ce projet risqué.
  You have to persuade him to abandon this risky project.

  Je suis *persuadé* que nous réussirons.
  I'm sure we'll make it.

  Ils se sont mutuellement *persuadés* de leur amour.
  They *convinced* each other of their love.

  Les arguments ont fini par *persuader* l'assemblée.
  The arguments have finally *convinced* the Assembly.

  Son sourire m'a *persuadé* de lui faire confiance.
  His smile *convinced* me to trust him.

