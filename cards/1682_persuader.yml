Notiz: |-
  <div class="section">
    <div class="section-title"><i>convaincre</i> and <i>persuader</i></div>
    <div class="section-content">
      <p>The verb <span class="fr">convaincre</span> (#575) means to convince someone of a truth or truth through arguments and logic.</p>

      <p>The verb <span class="fr">persuader</span> However, by appealing to the emotions or desires, it means getting someone to do something (even if it may contradict their beliefs).</p>

      <div class="examples">
        <div class="fr">J'ai réussi à convaincre mon frère que fumer est mauvais pour la santé.</div>
        <div class="de spoiler">I managed to convince my brother that smoking is unhealthy.</div>

        <div class="fr">Le vendeur m'a persuadé d'acheter cette voiture grâce à son discours séduisant.</div>
        <div class="de spoiler">The salesman persuaded me to buy this car with his charming speech.</div>
      </div>
    </div>
  </div>
