Notiz: |-
  <div class="section">
    <div class="section-title"><i>convaincre</i> and <i>persuader</i></div>
    <div class="section-content">
      <p>The verb <span class="fr">convaincre</span> #575) means convincing someone of a truth or truth through argument and logic.</p>

      <p>The verb <span class="fr">persuader</span> On the contrary, it means appealing to one's emotions or desires to make one do something (even if it may contradict one's beliefs).</p>

      <div class="examples">
        <div class="fr">J'ai réussi à convaincre mon frère que fumer est mauvais pour la santé.</div>
        <div class="de spoiler">I managed to convince my brother that smoking was unhealthy.</div>

        <div class="fr">Le vendeur m'a persuadé d'acheter cette voiture grâce à son discours séduisant.</div>
        <div class="de spoiler">The seller talked me into buying this car with his charming speech.</div>
      </div>
    </div>
  </div>
