Beispielsätze: |-
  Cela *requiert* sans doute un certain effort.
  This undoubtedly requires some effort.

  Le procureur a *requis* une peine de prison ferme contre l'accusé.
  The prosecutor has applied for a prison sentence without parole against the defendant.

  Cette tâche délicate *requiert* beaucoup d'attention et de précision.
  This delicate task requires a lot of attention and precision.

  Le maire a dû *requérir* l'aide de la police pour maintenir l'ordre.
  The mayor had to *request* police help to maintain order.

  "Je *requiers* votre assistance immédiate dans cette affaire urgente."
  "I *request* your immediate support in this urgent matter."

  L'avocat général a *requis* la perpétuité contre le criminel.
  The Attorney General called for life imprisonment against the criminal.

  La situation *requiert* que nous agissions rapidement.
  The situation requires that we act quickly.

  Le juge a *requis* l'avis d'un expert en balistique.
  The judge *requested* an expert report from a ballistics expert.

  Cette position *requiert* au moins cinq ans d'expérience.
  This position requires at least five years of experience.

  Les pompiers ont été *requis* pour aider à l'évacuation.
  The fire department was *requested* to assist with the evacuation.

  Le préfet a *requis* des civils pour aider à lutter contre l'incendie.
  The prefect called for civilians to help combat fire.

  Cette mission *requiert* des compétences spécifiques en informatique.
  This mission requires specific computer skills.

  L'avocat a *requis* l'annulation de la procédure pour vice de forme.
  The lawyer has *requested* the annulment of the formal error proceedings.

  Le médecin a *requis* une ambulance d'urgence pour le patient.
  The doctor urgently *requested* an ambulance for the patient.

  Ce poste *requiert* une grande disponibilité et de la flexibilité.
  This unit requires high availability and flexibility.

  Les autorités ont *requis* la fermeture temporaire de l'établissement.
  The authorities have ordered the temporary closure of the facility.

  Le problème *requiert* une solution innovante et rapide.
  The problem requires an innovative and fast solution.

  L'officier a *requis* des renforts face à la situation tendue.
  The officer called for reinforcements in the face of the tense situation.

  Ce projet ambitieux *requiert* un budget conséquent.
  This ambitious project requires a considerable budget.

  Le président a *requis* la présence de tous les ministres à la réunion.
  The President *requested* the presence of all ministers at the meeting.

  La loi *requiert* que tous les citoyens paient leurs impôts.
  The law requires that all citizens pay their taxes.

  Cette recette *requiert* des ingrédients frais et de qualité.
  This recipe requires fresh and high quality ingredients.

