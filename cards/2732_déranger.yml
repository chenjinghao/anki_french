  <div class="section">
    <div class="section-title"><i>déranger</i> and <i>gêner</i></div>
    <div class="section-content">
      <p><span class="fr">Déranger</span> In general, it means disturbing or interrupting someone, often in connection with an activity or occupation.</p>
      <div class="examples">
        <div class="fr">Ne me téléphone pas au bureau, ça me dérange.</div>
        <div class="de spoiler">Don't call me in the office, it bothers me.</div>
        <div class="fr">Il a dérangé mon bureau.</div>
        <div class="de spoiler">He messed up my desk.</div>
      </div>
      <p><span class="fr">Gêner</span> (#2460) refers more to causing discomfort, embarrassment or discomfort.</p>
      <div class="examples">
        <div class="fr">Le soleil dans les yeux me gêne pour travailler.</div>
        <div class="de spoiler">The sun in my eyes is bothering me at work.</div>
        <div class="fr">Ne m'offre pas le repas, ça me gêne.</div>
        <div class="de spoiler">Don't invite me to dinner. I'm not comfortable with that.</div>
