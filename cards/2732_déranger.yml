Notiz: |-
  <div class="section">
    <div class="section-title"><i>déranger</i> and <i>gêner</i></div>
    <div class="section-content">
      <p><span class="fr">Déranger</span> In general, means to disturb or interrupt someone, often in relation to an activity or occupation. It implies an interruption of the normal process or order.</p>
      <div class="examples">
        <div class="fr">Ne me téléphone pas au bureau, ça me dérange.</div>
        <div class="de spoiler">Don't call me in the office, that bothers me.</div>
        <div class="fr">Il a dérangé mon bureau.</div>
        <div class="de spoiler">He messed up my desk.</div>
      </div>
      <p><span class="fr">Gêner</span> (#2460) refers more to causing discomfort, embarrassment or discomfort. It can express both physical and emotional discomfort.</p>
      <div class="examples">
        <div class="fr">Le soleil dans les yeux me gêne pour travailler.</div>
        <div class="de spoiler">The sun in my eyes bothers me when I'm working.</div>
        <div class="fr">Ne m'offre pas le repas, ça me gêne.</div>
        <div class="de spoiler">Don't invite me to dinner, I'm uncomfortable.</div>
      </div>
    </div>
  </div>
