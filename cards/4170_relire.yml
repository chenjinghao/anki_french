# Feel free to improve these fields!
Wort mit Artikel: relire
Femininum / Plural: ''
IPA: \ʁə.liʁ\
Definition: Read again
Register: ↘nonfiction

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Il *relisait*, corrigeait et reprenait le travail du jour.
  He *read* through the day's work, corrected it, and started over.

  Pendant les vacances, j'ai *relu* tous mes livres préférés.
  During the holidays I read all my favorite books again.

  Je vais *relire* ton rapport avant de l'envoyer au client.
  I'll check your report before I send it to the client.

  Le professeur *relit* attentivement chaque copie d'examen.
  The teacher sees through every examination work carefully.

  Il faut toujours se *relire* avant d'envoyer un e-mail important.
  You should still read important e-mails before sending them.

  Marie a *relu* trois fois la lettre de son ami.
  Marie read her friend's letter three times.

  Les étudiants doivent *relire* leurs notes avant l'examen.
  Students must review their notes before the exam.

  Je devrais *relire* ce passage pour mieux le comprendre.
  I should read this passage again to better understand it.

  Le correcteur *relit* chaque article avant sa publication.
  The proofreader *reads* each article before publication *correction*.

  Elle ne peut pas se *relire* tant son écriture est illisible.
  She can't *read* what she wrote, so illegible is her handwriting.

  Paul *relit* toujours ses messages avant de les poster sur les réseaux sociaux.
  Paul *reads* his messages always *correction* before posting them on social media.

  Les auteurs doivent *relire* leurs manuscrits plusieurs fois.
  The authors have to look through their manuscripts several times.

  Je vais *relire* ce roman que j'ai tant aimé il y a dix ans.
  I will read this novel that I loved so much ten years ago.

  N'oubliez pas de *relire* votre dissertation pour corriger les fautes.
  Do not forget to read your essay to correct the errors.

  Sophie *relit* ses vieux journaux intimes de temps en temps.
  Sophie *reads* her old diaries again from time to time.

  Le rédacteur en chef doit *relire* tous les articles avant l'impression.
  The editor-in-chief has to look through all the articles before printing.

  Il faudrait *relire* ce contrat avant de le signer.
  You should read this contract before you sign it.

  Après avoir écrit mon texte, je me suis *relu* trois fois.
  After writing my text, I read it three times.

