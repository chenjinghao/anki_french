# Feel free to improve these fields!
Wort mit Artikel: enclin
Femininum / Plural: encline
IPA: \ɑ̃.klɛ̃\
Definition: inclined, willing
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Je suis *enclin* à les laisser pourrir.
  I tend to let them rot.

  Il est naturellement *enclin* à la méfiance envers les étrangers.
  He tends by nature to distrust strangers.

  Cette entreprise est particulièrement *encline* aux réformes.
  This company is particularly *willing* to reform.

  Les adolescents sont souvent *enclins* à la mélancolie.
  Teenagers often *tend* to melancholy.

  Elle n'est pas *encline* à pardonner facilement.
  She doesn't tend to forgive easily.

  Mon frère a toujours été *enclin* à la paresse.
  My brother was always *inclined* to laziness.

  Ces politiciens semblent *enclins* à médire de leurs adversaires.
  These politicians seem to be inclined to speak badly about their opponents.

  Je ne suis pas vraiment *encline* à accepter cette proposition.
  I am not really *inclined* to accept this proposal.

  Son âme *encline* à l'exaltation la pousse souvent à l'excès.
  Her soul, which is prone to exuberance, often drives her to exuberance.

  Les enfants sont naturellement *enclins* à faire confiance aux autres.
  Children *tend* by nature to trust others.

  Elle est *encline* à s'irriter pour des détails.
  She tends to get upset about little things.

  Ces chercheurs sont *enclins* à remettre en question les théories existantes.
  These researchers *tend* to question existing theories.

  Ma grand-mère est *encline* à raconter les mêmes histoires.
  My grandmother tends to tell the same stories.

