Rang: 4575
Wort: borner
Wortart: vt, vr

# Feel free to improve these fields!
Wort mit Artikel: borner
Femininum / Plural: ''
IPA: \bɔʁ.ne\
Definition: limit, limit
Register: ↘spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Nous nous *bornons* à faire notre travail.
  We are limited to doing our work.

  Le jardinier a *borné* notre terrain avec une haie.
  The gardener has *limited* our property with a hedge.

  Les hautes montagnes *bornent* l'horizon à l'est.
  The high mountains *limit* the horizon in the east.

  Il faut savoir *borner* ses désirs dans la vie.
  One must know how to *limit* one's desires in life.

  Le petit lac est *borné* par des collines verdoyantes.
  The small lake is bordered by green hills.

  Elle s'est *bornée* à hocher la tête sans rien dire.
  She was *limited* to nodding silently.

  Mon rôle se *borne* à surveiller les enfants pendant la récréation.
  My role is *limited* to overseeing the children during the break.

  La rivière *borne* notre propriété au sud.
  The river limits our property to the south.

  Les arbres *bornent* la vue depuis ma fenêtre.
  The trees *limit* the view from my window.

  Il a *borné* son intervention à quelques remarques.
  He has *limited* his contribution to a few remarks.

  Cette clôture *borne* parfaitement le jardin.
  This fence limits the garden perfectly.

  Je me *borne* à vous rappeler les règles essentielles.
  I limit myself to reminding you of the most important rules.

  Les falaises *bornent* la plage sur toute sa longueur.
  The cliffs *limit* the entire length of the beach.

  Son téléphone a *borné* près de la gare hier soir.
  His cell phone *logged in* near the station last night.

  Elle *bornait* ses dépenses au strict nécessaire.
  It *limited* its expenditure to what was absolutely necessary.

  La forêt *borne* notre village à l'ouest.
  The forest limits our village to the west.

  L'expert s'est *borné* à un examen rapide de la situation.
  The expert has *limited* himself to a quick examination of the situation.

  Les buissons *bornent* l'allée du jardin.
  The bushes *limit* the garden path.

  Il faut *borner* l'accès à cette zone dangereuse.
  We must *limit* access to this dangerous area.

  Le propriétaire a fait *borner* son terrain par un géomètre.
  The owner had his property delimited by a surveyor.

  Elle s'est *bornée* à sourire poliment.
  She's just being politely smiling.

  La discussion s'est *bornée* aux sujets essentiels.
  The discussion has been *limited* to the main issues.

  Les murs *bornent* la cour de récréation.
  The walls *limit* the schoolyard.

  Nous avons *borné* notre recherche à trois domaines principaux.
  We have *limited* our research to three main areas.

  Son influence se *borne* à son cercle d'amis.
  His influence is *limited* to his circle of friends.

  Le petit muret *borne* notre terrasse.
  The small wall limits our terrace.

