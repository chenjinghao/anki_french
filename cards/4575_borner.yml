Notiz: |-
  <div class="section">
    <div class="section-title"><i>borner</i> and <i>limiter</i></div>
    <div class="section-content">
      <p><span class="fr">Borner</span> means <span class="de">"begrenzen"</span> or <span class="de">"abstecken"</span> and is often used for setting limits or limiting them to a particular area. It is often used reflexively (<span class="fr">se borner à</span>).</p>
      <div class="examples">
        <div class="fr">Ce mur borne notre propriété.</div>
        <div class="de spoiler">This wall limits our property.</div>
        <div class="fr">Il se borne à répéter ce qu'on lui a dit.</div>
        <div class="de spoiler">He's limited to repeating what he's been told.</div>
      </div>
      <p><span class="fr">Limiter</span> (#883) means <span class="de">"limit"</span> or <span class="de">"restrict"</span> and refers to setting an upper limit or reducing something. It is used in more diverse contexts.</p>
      <div class="examples">
        <div class="fr">Nous devons limiter nos dépenses ce mois-ci.</div>
        <div class="de spoiler">We have to limit our spending this month.</div>
        <div class="fr">La vitesse est limitée à 50 km/h en ville.</div>
        <div class="de spoiler">The speed in the city is limited to 50 km/h.</div>
      </div>
    </div>
  </div>
