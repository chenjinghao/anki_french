Notiz: |-
  <div class="section">
    <div class="section-title"><i>réellement</i> and <i>véritablement</i></div>
    <div class="section-content">
      <p><span class="fr">Réellement</span> (#1563) emphasizes the concrete reality or existence of something. It is often used to highlight the contrast between the real and the imaginary or hypothetical.</p>
      <div class="examples">
        <div class="fr">Est-ce que cela s'est réellement passé?</div>
        <div class="de spoiler">Did this really happen?</div>
        <div class="fr">Je ne sais pas s'il est réellement malade ou s'il fait semblant.</div>
        <div class="de spoiler">I don't know if he's really sick or just acting.</div>
      </div>

      <p><span class="fr">Véritablement</span> It is often used to emphasize the authenticity or deeper truth of a situation.</p>
      <div class="examples">
        <div class="fr">C'est un artiste véritablement talentueux.</div>
        <div class="de spoiler">He's a truly talented artist.</div>
        <div class="fr">Elle est véritablement passionnée par son travail.</div>
        <div class="de spoiler">She is truly enthusiastic about her work.</div>
      </div>
    </div>
  </div>
