  La pédagogie moderne favorise l'apprentissage par des activités *concrètes*.
  Modern teaching promotes learning through practical activities.

  Cette essence *concrète* est utilisée en parfumerie pour sa richesse olfactive.
  This *concrete* essence is used in perfumery for its rich olfactory properties.

