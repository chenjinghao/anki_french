Beispielsätze: |-
  Que proposez-vous comme solutions *concrètes* ?
  What do you propose as concrete solutions?

  Cet exemple *concret* illustre parfaitement mon point de vue.
  This concrete example perfectly illustrates my point of view.

  Le professeur a demandé aux élèves de donner des exemples *concrets*.
  The teacher asked the students to give concrete examples.

  Les mathématiques abstraites m'ennuient ; je préfère les applications *concrètes*.
  I'm bored with abstract mathematics; I prefer concrete applications.

  Il faut passer de la théorie à la pratique *concrète*.
  We need to move from theory to practical practice.

  Cette exposition d'art *concret* m'a beaucoup impressionné.
  I was very impressed with this concrete art exhibition.

  J'ai besoin de voir des résultats *concrets* avant de prendre une décision.
  I need to see some concrete results before I make a decision.

  La musique *concrète* utilise des sons du quotidien comme matériau sonore.
  *Concrete* music uses everyday sounds as sound material.

  Son esprit *concret* l'aide à résoudre rapidement des problèmes pratiques.
  His practical spirit helps him to resolve practical problems quickly.

  Pouvez-vous me donner un exemple *concret* de ce que vous voulez dire ?
  Can you give me a concrete example of what you mean?

  Les enfants apprennent mieux avec des objets *concrets* qu'avec des concepts abstraits.
  Children learn better with concrete objects than with abstract concepts.

  Cette huile essentielle se présente sous forme *concrète* à température ambiante.
