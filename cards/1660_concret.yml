  The concrete is often contrasted with the abstract in philosophical discussions.

  Nous avons besoin d'un plan d'action *concret* pour atteindre nos objectifs.
  We need a concrete action plan to achieve our objectives.

  Les politiciens devraient proposer des mesures *concrètes* plutôt que des promesses vagues.
  Politicians should propose concrete measures rather than vague promises.

  Cette expérience *concrète* m'a fait changer d'avis sur la question.
