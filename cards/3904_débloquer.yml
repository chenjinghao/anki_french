Notiz: |-
  <div class="section">
    <div class="section-title"><i>débloquer</i> and <i>déboucher</i></div>
    <div class="section-content">
      <p><span class="fr">Débloquer</span> means, in principle, <span class="de">'Lock and unlock'</span>, <span class="de">"release"</span> or <span class="de">'resolve'</span>It is used when something that has been blocked is restored to function.</p>
      <div class="examples">
        <div class="fr">Il faut débloquer la porte.</div>
        <div class="de spoiler">The door needs to be unlocked.</div>
        <div class="fr">Le gouvernement va débloquer des fonds pour la reconstruction.</div>
        <div class="de spoiler">The government will release funds for reconstruction.</div>
        <div class="fr">Tu débloques complètement !</div>
        <div class="de spoiler">You are talking total nonsense!</div>
      </div>
      <p><span class="fr">Déboucher</span> #2639) means, on the other hand, <span class="de">"de-clogging"</span>, <span class="de">"must have"</span> or <span class="de">"corked out"</span>It refers to freeing from a blockage or opening the mouth in an open space.</p>
      <div class="examples">
        <div class="fr">Il faut déboucher l'évier.</div>
        <div class="de spoiler">The sink needs to be cleared.</div>
        <div class="fr">La route débouche sur une grande place.</div>
        <div class="de spoiler">The street ends in a large square.</div>
        <div class="fr">Elle a débouché une bouteille de vin.</div>
        <div class="de spoiler">She spilled a bottle of wine.</div>
      </div>
    </div>
  </div>
