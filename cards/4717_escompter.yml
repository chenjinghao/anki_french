Wort mit Artikel: escompter
Femininum / Plural: ''
IPA: \ɛs.kɔ̃.te\
Definition: Hope, expect,
Register: ↗nonfiction

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Cela n'a pas eu les résultats *escomptés*.
  This did not produce the results *hoped for*.

  J'*escompte* pouvoir partir en vacances le mois prochain.
  I'm planning on going on vacation next month.

  Nous n'avions pas *escompté* qu'il pleuvrait aujourd'hui.
  We didn't expect it to rain today.

  Marie *escompte* que son fils réussira ses examens.
  Marie *hopes* that her son will pass the tests.

  Il *escomptait* une augmentation de salaire après son projet.
  He expected a salary increase after his project.

  Personne n'*escomptait* une telle réussite.
  No one had expected such success.

  Les investisseurs *escomptent* une hausse des prix.
  Investors expect prices to rise.

  Nous *escomptons* votre présence à la réunion.
  We expect your presence at the meeting.

  J'*escompte* bien recevoir une réponse d'ici demain.
  I very much *hope* to get an answer by tomorrow.

  Le parti *escompte* gagner les élections.
  The party expects to win the elections.

  Il n'avait pas *escompté* les difficultés du projet.
  He had not expected the difficulties of the project.

  Les scientifiques *escomptent* faire une découverte importante.
  The scientists *hope* to make an important discovery.

  L'équipe a obtenu exactement le résultat *escompté*.
  The team achieved exactly the *expected* result.

  Elle *escomptait* que tout serait prêt à temps.
  She expected everything to be ready in time.

  Nous *escomptons* sur votre aide pour ce projet.
  We expect your help with this project.

