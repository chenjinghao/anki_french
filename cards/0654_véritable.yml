Notiz: |-
  <div class="section">
    <div class="section-title"><i>vrai</i> and <i>véritable</i></div>
    <div class="section-content">
      <p>During <span class="fr">vrai</span> often used for factual truth, emphasizes <span class="fr">véritable</span> often the authenticity or essence of a thing.</p>
      <p><span class="fr">Vrai</span> (#292) comes from the Latin <i>veracus</i> (True) and is used to describe something that is true, real, or essential. <span class="de">"echt"</span> or <span class="de">"aufrichtig"</span> bedeuten.</p>
      <div class="examples">
        <div class="fr">C'est incroyable, mais vrai : cette promotion, elle l'a obtenue!</div>
        <div class="de spoiler">It's incredible, but true: she got this promotion!</div>
        <div class="fr">Ses vrais amis se comptent sur les doigts d'une main.</div>
        <div class="de spoiler">You can count your true friends on one hand.</div>
      </div>
      <p><span class="fr">Véritable</span> comes from the word <i>vérité</i> (Truth) and describes something that really corresponds to its definition or has the essential characteristics of a thing. It also means <span class="de">"echt"</span> or <span class="de">"authentic"</span>.</p>
      <div class="examples">
        <div class="fr">J'hésite à m'inscrire sous mon véritable nom dans un site de clavardage.</div>
        <div class="de spoiler">I hesitate to sign up under my real name on a chat site.</div>
        <div class="fr">Il a été un véritable ami pour moi du début à la fin.</div>
        <div class="de spoiler">He was a true friend to me from beginning to end.</div>
      </div>
    </div>
  </div>
