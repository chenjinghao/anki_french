Wort mit Artikel: révolter
Femininum / Plural: ''
IPA: \ʁe.vɔl.te\
Definition: to rebel
Register: ↗Fiktion ↘Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Ils se *révolteront* avec colère, une colère implacable.
  *They will rebel* in anger, in unrelenting anger.

  La corruption du gouvernement a *révolté* les citoyens.
  Government corruption has revolted citizens.

  Les prisonniers se sont *révoltés* contre leurs conditions de détention.
  The prisoners rebelled against their conditions of detention.

  Son attitude méprisante *révolte* tout le monde.
  His contemptuous attitude is upsetting everyone.

  Les paysans se sont *révoltés* contre les nouveaux impôts.
  The peasants rebelled against the new taxes.

  Je suis *révolté* par tant d'injustice sociale.
  I'm upset by so much social injustice.

  Les ouvriers se sont *révoltés* contre leurs mauvaises conditions de travail.
  The workers revolted against their poor working conditions.

  Cette décision arbitraire m'a profondément *révolté*.
  I was deeply disturbed by this arbitrary decision.

  Les étudiants se *révoltent* contre la hausse des frais d'inscription.
  Students are protesting the increase in tuition fees.

  Son comportement irrespectueux *révolte* ses collègues.
  His disrespectful behaviour is disgusting to his colleagues.

  L'adolescent se *révolte* contre l'autorité de ses parents.
  The teenager rebels against the authority of his parents.

  Ces accusations mensongères ont *révolté* toute la communauté.
  The whole community was upset by these false accusations.

  Le peuple s'est *révolté* contre le dictateur.
  The people rebelled against the dictator.

  Les conditions de vie misérables *révoltent* ma conscience.
  The miserable living conditions disturb my conscience.

  Marie se *révolte* contre son destin.
  Marie rebels against her destiny.

  Sa désinvolture face à la tragédie m'a *révolté*.
  I was appalled by his ruthlessness in the face of tragedy.

  Les jeunes se *révoltent* contre les règles établies.
  Young people are rebelling against established rules.

  Cette injustice flagrante *révolte* le bon sens.
  This blatant injustice disturbs common sense.

  Tout le pays s'est *révolté* contre la tyrannie.
  The whole country revolted against tyranny.

  Les habitants se sont *révoltés* contre la destruction de leur quartier.
  Residents rebelled against the destruction of their neighborhood.

  Son manque total d'empathie me *révolte*.
  I'm appalled by his total lack of empathy.

