Notiz: |-
  The Word <b>sillage</b> Originally from seafaring, Sillage describes the keel-water-track that leaves a ship in the water. In the figurative sense, it describes the trace or the impression that someone or something leaves behind. The term has extended to various types of traces: visible traces in the air such as condensation strips of airplanes, the aftereffect of movements in general, and especially to the scent of a perfume that a person leaves when passing by. In the perfumery, Sillage describes concretely how far and how intense a fragrance around the wearer is perceptible and how long this scent-track lingers in the air.
