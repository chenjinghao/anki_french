Notiz: |-
  The Word <b>sillage</b> Originally derived from maritime navigation, it refers to the water footprint that a ship leaves in the water. In a metaphorical sense, it describes the footprint or impression that someone or something leaves. The term has expanded to include various types of footprint: visible footprints in the air, such as airplane condensation strips, the effect of movement in general, and especially the fragrance of a perfume that a person leaves behind when passing by. In the perfume, Sillage specifically describes how and how intense a scent can be perceived around the wearer and how long that scent remains in the air.
