  <div class="section">
    <div class="section-title"><i>édifice</i> and <i>bâtiment</i></div>
    <div class="section-content">
      <p><b>Édifice</b> is often used specifically for large, imposing buildings or structures, especially for those considered to be architecturally significant or monumental. The term conveys a sense of grandeur and can be applied to religious, public or historical buildings. <span class="fr">Bâtiment</span> (#1952) is more general.</p>
      <div class="examples">
        <div class="fr">La cathédrale Notre-Dame de Paris est un édifice magnifique.</div>
        <div class="de spoiler">Notre-Dame Cathedral in Paris is a magnificent building.</div>
        <div class="fr">Le nouveau bâtiment de bureaux sera construit l'année prochaine.</div>
        <div class="de spoiler">The new office building will be built next year.</div>
      </div>
