IPA: \a.tɛs.te\
Definition: certify, testify
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Comme l'*attesteront* les amis qui me connaissent bien.
  As my friends who know me well will testify.

  Le médecin a *attesté* que Marie était en bonne santé.
  The doctor has *certified* that Marie is healthy.

  Ces documents juridiques *attestent* la propriété du terrain.
  These legal documents *confirm* the ownership of the property.

  Les découvertes archéologiques *attestent* l'existence d'une civilisation ancienne.
  *The* archaeological finds prove the existence of an ancient civilization.

  Je peux *attester* personnellement de son honnêteté.
  I can personally testify to his honesty.

  La signature du directeur *atteste* l'authenticité du document.
  The director's signature confirms the authenticity of the document.

  Ces photographies *attestent* la présence de Thomas à la réunion.
  These photos *prove* Thomas' presence at the meeting.

  Le professeur doit *attester* la présence des étudiants aux examens.
  The professor must *certify* the presence of the students in the exams.

  Son diplôme *atteste* qu'il a terminé ses études avec succès.
  His diploma confirms that he has successfully completed his studies.

  Les témoins ont *attesté* avoir vu l'accident.
  The witnesses *confirmed* that they saw the accident.

  Ces statistiques *attestent de* l'amélioration de la situation.
  These statistics are proof of the improvement of the situation.

  Le certificat médical *atteste* son incapacité de travail.
  The medical certificate certifies his incapacity to work.

  Cette signature *atteste* que vous avez lu le règlement.
  This signature confirms that you have read the regulations.

  L'expert a *attesté* l'authenticité du tableau.
  The expert *confirmed* the authenticity of the painting.

  Les rapports scientifiques *attestent* du changement climatique.
  *The* scientific reports demonstrate climate change.

  Ce mot est *attesté* dans les textes depuis le Moyen Âge.
  This word has been used in texts since the Middle Ages.

  J'*atteste* sur l'honneur que ces informations sont exactes.
  I assure you that this information is correct.

  Les fouilles *attestent* que la ville existait déjà au IX<sup>e</sup> siècle.
  The excavations testify that the city existed already in the 9th century.

  Cette tradition est *attestée* dans de nombreuses cultures.
  This tradition is documented in many cultures.

