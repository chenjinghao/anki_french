  Chaque pays définit ses propres *normes* alimentaires.
  Each country sets its own food *standards*.

  Cette machine est conforme aux *normes* en vigueur.
  This machine complies with the applicable *standards*.

  Les *normes* d'hygiène sont très strictes dans les hôpitaux.
  Hygiene *standards* are very strict in hospitals.

