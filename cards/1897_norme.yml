Beispielsätze: |-
  Nous appliquons désormais les *normes* d'hygiène.
  We are now following the hygiene *standards*.

  La *norme* sociale veut qu'on se serre la main pour se saluer.
  The social norm requires that you give yourself the hand to greet.

  Cette voiture ne respecte pas les *normes* anti-pollution actuelles.
  This car does not meet the current exhaust emission *standards*.

  La *norme* linguistique évolue avec le temps.
