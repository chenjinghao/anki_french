  Marie refuse de suivre la *norme* vestimentaire au bureau.
  Marie refuses to follow the dress *standard* in the office.

  La *norme* ISO garantit la qualité des produits.
  The ISO *standard* guarantees the quality of the products.

  Ces comportements s'écartent de la *norme* habituelle.
  These behaviours differ from the usual norm.

  Les *normes* environnementales deviennent de plus en plus strictes.
  Environmental *standards* are becoming increasingly stringent.

  Il faut mettre l'installation électrique aux *normes*.
