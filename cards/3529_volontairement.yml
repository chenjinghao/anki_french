Wort: volontairement
Wortart: adv

# Feel free to improve these fields!
Wort mit Artikel: volontairement
Femininum / Plural: ''
IPA: \vɔ.lɔ̃.tɛʁ.mɑ̃\
Definition: voluntary, intentional
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  *Volontairement*, je fermai les yeux.
  I deliberately closed my eyes.

  Il a *volontairement* omis certains détails de l'histoire.
  He deliberately omitted certain details of the story.

  Elle s'est inscrite *volontairement* à ce cours de langue.
  She volunteered for this language course.

  Les deux parties ont *volontairement* mis fin au contrat.
  The two parties have terminated the contract *by mutual agreement*.

  Il a *volontairement* choisi de ne pas répondre à mes messages.
  He deliberately decided not to respond to my messages.

  Marie s'est *volontairement* proposée pour organiser la fête.
  Marie volunteered to organize the party.

  As-tu *volontairement* cassé ce vase ?
  Did you break that vase on purpose?

  Les pompiers se sont *volontairement* engagés dans cette mission dangereuse.
  The firemen volunteered for this dangerous operation.

  Nous avons *volontairement* simplifié l'explication pour les débutants.
  We deliberately simplified the explanation for the beginners.

  Pierre s'est *volontairement* exclu du groupe.
  Pierre has voluntarily excluded himself from the group.

  Le suspect s'est *volontairement* rendu au commissariat.
  The suspect volunteered to the police station.

  J'ai *volontairement* ignoré ses remarques désagréables.
  I deliberately ignored his unpleasant remarks.

  Les étudiants ont participé *volontairement* au projet de recherche.
  The students volunteered to participate in the research project.

  Elle a *volontairement* baissé sa voix pour ne pas réveiller le bébé.
  She deliberately lowered her voice so she wouldn't wake the baby.

  Ils ont *volontairement* choisi un horaire tard le soir.
  You deliberately chose a late evening appointment.

