Notiz: |-
  <div class="section">
    <div class="section-title"><i>attaque</i> and <i>assaut</i></div>
    <div class="section-content">
      <p><span class="fr">Attaque</span> (#1655) means <span class="de">"Angriff"</span> in the general sense and can refer to both physical and metaphorical attacks. It is the broader and more frequently used term.</p>
      <div class="examples">
        <div class="fr">L'attaque surprise a déstabilisé l'ennemi.</div>
        <div class="de spoiler">The surprise attack has destabilized the enemy.</div>
        <div class="fr">Il a subi une attaque cardiaque hier soir.</div>
        <div class="de spoiler">He suffered a heart attack last night.</div>
        <div class="fr">Cette attaque contre sa réputation était injuste.</div>
        <div class="de spoiler">This attack on his reputation was unfair.</div>
      </div>
      <p><span class="fr">Assaut</span> means <span class="de">"Sturmangriff"</span> or <span class="de">"Ansturm"</span> and denotes an intense, often direct and physical attack. It usually implies a violent, concentrated action.</p>
      <div class="examples">
        <div class="fr">Les soldats ont donné l'assaut à la forteresse.</div>
        <div class="de spoiler">The soldiers stormed the fortress.</div>
        <div class="fr">Il a résisté à l'assaut des critiques.</div>
        <div class="de spoiler">He resisted the onslaught of criticism.</div>
        <div class="fr">L'assaut final a duré trois heures.</div>
        <div class="de spoiler">The final assault lasted three hours.</div>
      </div>
    </div>
  </div>
