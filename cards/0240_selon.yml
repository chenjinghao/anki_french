Beispielsätze: |-
  Tout est prêt *selon* vos désirs.
  Everything is prepared according to your wishes.

  J'ai organisé la fête *selon* les instructions de mes parents.
  I organized the party according to my parents' instructions.

  Son humeur change *selon* la météo.
  His mood changes *depending on the* weather.

  Les élèves sont répartis dans les classes *selon* leur âge.
  Students are divided into classes according to their age.

  Je voyage *selon* mes moyens.
  I travel as far as my financial resources allow.

  - "Tu veux aller au cinéma ?"<br>- "*C'est selon*, ça dépend du film."
  - "Do you want to go to the movies?" - "Regards which movie is going on."

  *Selon* les journaux d'hier, il y aura une grève demain.
  *According to* yesterday's newspapers, there will be a strike tomorrow.

  *Selon* les experts, le changement climatique s'accélère.
  According to experts, climate change is accelerating.

  *Selon* moi, cette décision est une erreur.
  I believe that this decision is a mistake.

  Ton salaire variera *selon que* tu travailleras à temps plein ou partiel.
  Your salary will depend on whether you work full time or part time.

  Il faut toujours agir *selon* les règles établies.
  You always have to act according to the established rules.

  La Lune tourne *selon* une orbite elliptique autour de la Terre.
  The moon orbits around the Earth *on* an elliptical orbit.

  Les récompenses seront distribuées *selon* les mérites de chacun.
  Rewards are distributed according to the merits of each individual.

  *Selon* l'expression consacrée, mieux vaut tard que jamais.
  As the usual phrase says: better late than never.

  *Selon* toute vraisemblance, il ne viendra pas à la réunion.
  He's probably not coming to the meeting.

  La difficulté varie *selon* les cas.
  The difficulty varies *depending on the* case.

  Son comportement change *selon* l'humeur du jour.
  His behavior changes *depending on the* mood of the day.

  *Selon* les traditions locales, on mange du poisson le vendredi.
  According to local traditions, you eat fish on Fridays.

  Elle dépense toujours *selon* ses moyens.
  It only spends what its financial resources *allow*.

  Nous devons nous adapter *selon* les circonstances.
  We need to adapt to the circumstances.

  *Selon* la rumeur, ils vont se marier bientôt.
  Rumor has it they'll be getting married soon.

  *Selon* toute apparence, il pleuvra demain.
  It seems to be raining tomorrow.

  Le prix varie *selon* la qualité du produit.
  The price varies according to the quality of the product.

  *Selon* les sondages, le candidat de gauche est favori.
  According to the polls, the left candidate is the favorite.

  Les médicaments sont prescrits *selon* les symptômes.
  The medications are prescribed according to the symptoms.

  *Selon* les dernières études, le café peut être bon pour la santé.
  *According to* recent studies, coffee can be healthy.

  Le traitement diffère *selon* l'âge du patient.
  Treatment varies according to the age of the patient.

  *Selon* les prévisions météo, l'été sera très chaud.
  According to the weather forecasts, summer is getting very hot.

  Les tarifs changent *selon* la saison.
  Prices vary *depending on the* season.

  *Selon* mon expérience, il vaut mieux partir tôt.
  In my experience, it's better to start early.

  Le menu change *selon* les produits de saison.
  The menu changes depending on seasonal products.

  Chacun sera récompensé *selon* ses efforts.
  Everyone will be rewarded according to their efforts.

  *Selon* les témoins, l'accident s'est produit vers midi.
  According to the Witnesses, the accident occurred around noon.

