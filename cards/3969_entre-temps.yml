Wort mit Artikel: entre-temps
Femininum / Plural: ''
IPA: \ɑ̃.tʁə.tɑ̃\
Definition: in the meantime,
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  *Entre-temps*, la population vieillit et augmente.
  Meanwhile, the population is ageing and growing.

  *Entre-temps*, il a obtenu son diplôme et trouvé un travail.
  *In the meantime*, he graduated and found a job.

  "*Entre-temps*, je vais prendre un café."
  "In between, I'll have a coffee."

  Les enfants sont partis jouer dehors et *entre-temps*, je range la maison.
  The kids went out to play and now I'm cleaning up the house.

  *Entre-temps*, la situation s'est considérablement améliorée.
  *In the meantime*, the situation has improved considerably.

  "On peut faire une pause *entre-temps*."
  "We can take a break *between* them."

  *Entre-temps*, la neige avait tout recouvert.
  Meanwhile, the snow had covered everything.

  J'ai préparé le dîner et *entre-temps*, Marie est rentrée du travail.
  I prepared dinner and *in the meantime* Marie came home from work.

  *Entre-temps*, as-tu réfléchi à ma proposition ?
  Have you thought about my proposal *by now*?

  "Je dois terminer ce rapport, mais je peux t'aider *entre-temps*."
  "I have to finish this report, but I can help you in the meantime."

  *Entre-temps*, le soleil s'était couché et la température avait baissé.
  Meanwhile, the sun had set and the temperature had fallen.

  Pierre arrivera dans deux heures, *entre-temps* nous pouvons préparer la fête.
  Pierre's coming in two hours, so we can prepare the party by then.

  Les vacances approchent et *entre-temps*, il y a encore beaucoup à faire.
  The holidays are approaching and *in the meantime* there is still a lot to do.

  *Entre-temps*, le médecin est arrivé et a commencé l'examen.
  Meanwhile, the doctor has arrived and started the examination.

