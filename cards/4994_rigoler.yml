        <div class="de spoiler">She laughed at this joke.</div>
        <div class="fr">Il ne faut pas rire de ses malheurs.</div>
        <div class="de spoiler">You shouldn't laugh at your misfortune.</div>
      </div>
      <p><span class="fr">Rigoler</span> means ebenfalls <span class="de">"lachen"</span>However, it is more colloquial and informal. It is mainly used in the spoken language and often has a more playful connotation.</p>
      <div class="examples">
        <div class="fr">On a bien rigolé hier soir chez Pierre.</div>
        <div class="de spoiler">We had a good laugh at Pierre's last night.</div>
        <div class="fr">Tu rigoles ou tu es sérieux?</div>
        <div class="de spoiler">Are you kidding or are you serious?</div>
      </div>
      <p><span class="fr">Rigoler</span> may also <span class="de">"Have fun"</span> or <span class="de">"scherzen"</span> the <span class="fr">rire</span> more specifically refers to laughter as an action.</p>
      <div class="examples">
        <div class="fr">Les enfants ont rigolé toute la journée au parc.</div>
        <div class="de spoiler">The children had fun all day in the park.</div>
      </div>
