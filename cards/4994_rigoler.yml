  <div class="section">
    <div class="section-title"><i>rire</i> and <i>rigoler</i></div>
    <div class="section-content">
      <p><span class="fr">Rire</span> (#1193) means <span class="de">"lachen"</span> and is the standard-language, neutral verb for laughter. It is used in all registers, from formal to informal.</p>
      <div class="examples">
