Rang: 3525
Wort: adéquat
Wortart: adj

# Feel free to improve these fields!
Wort mit Artikel: adéquat
Femininum / Plural: adéquate
IPA: \a.de.kwa\
Definition: appropriately, accordingly
Register: ↘Fiktion

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  La protection sociale n'est pas *adéquate*.
  Social protection is not *adequate*.

  Cette définition n'est pas *adéquate* car elle ne couvre pas tous les aspects.
  This definition is not *adequate* because it does not cover all aspects.

  Pour ce poste, elle a la formation *adéquate*.
  For this position, she has the proper training.

  Le chef n'a pas donné une réponse *adéquate* à nos questions.
  The chief didn't give an *adequate* answer to our questions.

  Nous devons trouver l'endroit *adéquat* pour installer le nouveau bureau.
  We need to find the right place to install the new office.

  Sa tenue n'était pas *adéquate* pour un entretien d'embauche.
  His outfit wasn't good enough for a job interview.

  As-tu trouvé les mots *adéquats* pour exprimer tes sentiments ?
  Have you found the right words to express your feelings?

  Le budget n'est pas *adéquat* pour réaliser ce projet.
  The budget is not *adequate* to carry out this project.

  Cette salle est parfaitement *adéquate* pour notre réunion.
  This room is perfectly suited for our meeting.

  Il nous faut trouver une solution *adéquate* à ce problème.
  We must find an *adequate* solution to this problem.

  Les conditions ne sont pas *adéquates* pour planter ces fleurs maintenant.
  The conditions are not *adequate* to plant these flowers now.

  Marie a toujours la réaction *adéquate* dans les situations difficiles.
  Marie always responds appropriately in difficult situations.

  Le niveau de ventilation n'est pas *adéquat* dans cette pièce.
  The ventilation level is not *adequate* in this room.

