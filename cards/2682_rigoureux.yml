  <div class="section">
    <div class="section-title"><i>rigoureux</i>, <i>sévère</i> and <i>strict</i></div>
    <div class="section-content">
      <p><span class="fr">Rigoureux</span> means <span class="de">"streng"</span> or <span class="de">"gewissenhaft"</span> and refers to accuracy, precision and methodological approach.</p>
      <div class="examples">
        <div class="fr">Il faut appliquer une méthode rigoureuse dans cette recherche.</div>
        <div class="de spoiler">One must use a strict method in this research.</div>
        <div class="fr">Son analyse rigoureuse a permis de découvrir l'erreur.</div>
        <div class="de spoiler">His conscientious analysis made it possible to discover the error.</div>
      </div>
      <p><span class="fr">Sévère</span> (#1733) means <span class="de">"streng"</span> or <span class="de">"hart"</span> and often has a negative connotation of hardness or lack of indulgence.</p>
      <div class="examples">
        <div class="fr">Le professeur est très sévère avec les élèves qui arrivent en retard.</div>
        <div class="de spoiler">The teacher is very strict with students who are late.</div>
        <div class="fr">Elle a reçu une punition sévère pour sa faute.</div>
        <div class="de spoiler">She received a severe punishment for her mistake.</div>
      </div>
      <p><span class="fr">Strict</span> (#1859) means <span class="de">"strikt"</span> or <span class="de">"genau"</span> and refers to the exact compliance with rules or regulations.</p>
      <div class="examples">
        <div class="fr">Il respecte les règles de façon stricte.</div>
        <div class="de spoiler">He's strictly following the rules.</div>
        <div class="fr">Au sens strict du terme, ce n'est pas correct.</div>
        <div class="de spoiler">In the strict sense of the word, that is not correct.</div>
