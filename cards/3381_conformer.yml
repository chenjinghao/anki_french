Wort mit Artikel: conformer
Femininum / Plural: ''
IPA: \kɔ̃.fɔʁ.me\
Definition: to adapt; [to adhere to, etc.]
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
