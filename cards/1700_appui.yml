Notiz: |-
  <div class="section">
    <div class="section-title"><i>soutien</i> and <i>appui</i></div>
    <div class="section-content">
      <p><span class="fr">Soutien</span> (#1198) refers to support in the broadest sense. It can include moral, emotional or practical help and is often used in interpersonal or general contexts.</p>
      <div class="examples">
        <div class="fr">Le président a le soutien du peuple.</div>
        <div class="de spoiler">The President has the support of the people.</div>
        <div class="fr">Elle a besoin du soutien de sa famille pendant cette période difficile.</div>
        <div class="de spoiler">She needs the support of her family in this difficult time.</div>
      </div>
      <p><span class="fr">Appui</span> has two main meanings:</p>
      <ul>
        <li>Support based on a position of power or authority goes beyond moral support and often points to concrete help or endorsement.</li>
        <div class="examples">
          <div class="fr">Avec l'appui de mon manager, j'ai pu obtenir une augmentation.</div>
          <div class="de spoiler">With the support of my manager, I was able to raise my salary.</div>
        </div>
        <li>Hold or support in the physical sense.</li>
        <div class="examples">
          <div class="fr">Il s'est appuyé contre le mur pour reprendre son souffle.</div>
          <div class="de spoiler">He leaned against the wall to breathe again.</div>
          <div class="fr">Cette poutre sert d'appui à toute la structure.</div>
          <div class="de spoiler">This beam serves as a support for the entire structure.</div>
        </div>
      </ul>
    </div>
  </div>
