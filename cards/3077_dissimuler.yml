Notiz: |-
  <div class="section">
    <div class="section-title"><i>cacher</i> and <i>dissimuler</i></div>
    <div class="section-content">
      <p><span class="fr">Cacher</span> (#914) means mainly: <span class="de">"verstecken"</span> or <span class="de">"verbergen"</span>, mostly in the physical sense. It is used when something is specifically removed from sight or kept secret.</p>
      <div class="examples">
        <div class="fr">Elle a caché les clés sous le paillasson.</div>
        <div class="de spoiler">She hid the keys under the mat.</div>
        <div class="fr">Je cache mes économies dans une boîte à chaussures.</div>
        <div class="de spoiler">I'm hiding my savings in a shoebox.</div>
        <div class="fr">Il faut cacher cette information à la presse.</div>
        <div class="de spoiler">This information must be kept secret from the press.</div>
      </div>
      <p><span class="fr">Dissimuler</span> means <span class="de">"verschleiern"</span> or <span class="de">"verbergen"</span> In the more abstract sense. It often implies deception or masking feelings and is often used for non-physical things.</p>
      <div class="examples">
        <div class="fr">Il dissimule son inquiétude derrière un sourire.</div>
        <div class="de spoiler">He hides his concern behind a smile.</div>
        <div class="fr">Elle dissimule ses véritables intentions à ses collègues.</div>
        <div class="de spoiler">She hides her true intentions from her colleagues.</div>
        <div class="fr">L'entreprise a tenté de dissimuler ses pertes financières.</div>
        <div class="de spoiler">The company tried to cover up its financial losses.</div>
      </div>
    </div>
