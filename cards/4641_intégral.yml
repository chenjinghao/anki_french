Notiz: |-
  <div class="section">
    <div class="section-title"><i>total</i> and <i>intégral</i></div>
    <div class="section-content">
      <p><span class="fr">Total</span> (#658) means <span class="de">"gesamt"</span> or <span class="de">"complete"</span> and refers to the totality of a quantity or the full extent of something.</p>
      <div class="examples">
        <div class="fr">Le coût total du projet s'élève à 50 000 euros.</div>
        <div class="de spoiler">The total cost of the project is 50,000 euros.</div>
        <div class="fr">Il y a eu un silence total dans la salle.</div>
        <div class="de spoiler">There was complete silence in the hall.</div>
      </div>
      <p><span class="fr">Intégral</span> means <span class="de">"complete"</span> or <span class="de">"uncut"</span> and emphasizes that nothing has been omitted or changed - something in its original, unchanged form.</p>
      <div class="examples">
        <div class="fr">Nous avons regardé le film en version intégrale.</div>
        <div class="de spoiler">We watched the film in the unshortened version.</div>
        <div class="fr">Le remboursement intégral des frais est garanti.</div>
        <div class="de spoiler">Full reimbursement of costs is guaranteed.</div>
      </div>
    </div>
  </div>
