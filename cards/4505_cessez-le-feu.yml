  <div class="section">
    <div class="section-title"><i>cessez-le-feu</i> and <i>trêve</i></div>
    <div class="section-content">
      <p><span class="fr">Cessez-le-feu</span> means <span class="de">"Waffenstillstand"</span> It is usually a short-term, temporary measure to end active violence.</p>
      <div class="examples">
        <div class="fr">Les deux armées ont observé un cessez-le-feu de vingt-quatre heures.</div>
        <div class="de spoiler">The two armies held a twenty-four-hour ceasefire.</div>
        <div class="fr">Le cessez-le-feu a été violé après seulement trois heures.</div>
        <div class="de spoiler">The ceasefire was broken after only three hours.</div>
      </div>
      <p><span class="fr">Trêve</span> (#4455) means <span class="de">"Waffenruhe"</span> or <span class="de">"Waffenstillstand"</span> and often implies a prolonged interruption of hostilities, sometimes with intent to negotiate or on certain occasions.</p>
      <div class="examples">
        <div class="fr">Une trêve de Noël a été déclarée pendant la guerre.</div>
        <div class="de spoiler">A Christmas peace was declared during the war.</div>
        <div class="fr">Les négociateurs espèrent prolonger la trêve actuelle.</div>
        <div class="de spoiler">The negotiators hope to extend the current ceasefire.</div>
      </div>
      <p>During <span class="fr">cessez-le-feu</span> is more technical and immediate, has <span class="fr">trêve</span> often a more solemn or formal connotation and can also be used in the figurative sense for a pause in conflicts.</p>
