Rang: 1523
Wort: accroître
Wortart: vt, vr

# Feel free to improve these fields!
Wort mit Artikel: accroître
Femininum / Plural: ''
IPA: \a.kʁwatʁ\
Definition: to increase; grow
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  La tension dans l'entreprise ne fait que s'*accroître* depuis l'annonce des restructurations.
  Tensions in the company have only increased since the announcement of the restructuring.

  Évidemment, cela *accroît* le climat de tension.
  Of course, this adds to the tension.

  Le nombre de visiteurs s'*est accru* de 50% par rapport à l'année dernière.
  The number of visitors increased by 50% compared to last year.

  Cette nouvelle technologie permet d'*accroître* la productivité de manière significative.
  This new technology makes it possible to *increase* productivity significantly.

  Son anxiété s'*accroît* d'heure en heure avant l'examen.
  Her anxiety *increases* hour by hour before the exam.

  Les exercices réguliers *accroissent* vos chances de réussite.
  Regular exercise increases your chances of success.

  La chaleur *accrue* rend le travail plus difficile aujourd'hui.
  *Increased* heat makes work more difficult today.

  Il cherche à *accroître* son influence dans l'entreprise.
  He's trying to *increase* his influence in the company.

  Ses connaissances *se sont considérablement accrues* pendant son séjour à l'étranger.
  His knowledge grew considerably during his time abroad.

  La population de la ville s'*accroît* chaque année.
  The city's population is growing every year.

  Ces mesures vont *accroître* le mécontentement des employés.
  These measures will *increase* employee discontent.

  Marie a réussi à *accroître* son patrimoine grâce à de bons investissements.
  Marie was able to *increase* her heritage through good investments.

  Le bruit *accroissant* de la circulation devient insupportable.
  Increasing traffic noise is becoming unbearable.

  Les responsabilités *accrues* s'accompagnent d'une augmentation de salaire.
  *Increased* responsibilities are accompanied by higher wages.

  Cette décision risque d'*accroître* la confusion générale.
  This decision may add to the general confusion.

  Sa réputation s'*est considérablement accrue* après ce succès.
  His reputation grew dramatically after this success.

  Le temps passé sur les réseaux sociaux ne fait que s'*accroître*.
  The amount of time spent on social media is only increasing.

  Ces exercices vont *accroître* ta confiance en toi.
  These exercises will *increase* your self-confidence.

  La douleur s'*accroît* progressivement depuis ce matin.
  The pain has been increasing gradually since this morning.

  Les nouveaux projets *ont accru* notre charge de travail.
  The new projects *have increased* our workload.

