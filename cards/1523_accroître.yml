Notiz: |-
  <div class="section">
    <div class="section-title"><i>augmenter</i> and <i>accroître</i></div>
    <div class="section-content">

      <p><span class="fr">Augmenter</span> (#823) is used to indicate an increase in size, quantity or degree in different contexts.</p>
      <div class="examples">
        <div class="fr">Le prix du lait a augmenté.</div>
        <div class="de spoiler">The price of milk has gone up.</div>
        <div class="fr">Nous devons augmenter la production pour répondre à la demande.</div>
        <div class="de spoiler">We need to increase production to meet demand.</div>
      </div>

      <p><span class="fr">Accroître</span> It means to enlarge, grow or expand, usually in abstract terms such as wealth, influence or prestige, but it can also be applied to physical things such as areas or quantities.</p>
      <div class="examples">
        <div class="fr">Nous devons accroître notre présence sur les marchés internationaux.</div>
        <div class="de spoiler">We need to expand our presence in international markets.</div>
        <div class="fr">L'entreprise cherche à accroître ses profits chaque année.</div>
        <div class="de spoiler">The company strives to increase its profits every year.</div>
      </div>
    </div>
  </div>
