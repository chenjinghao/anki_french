# Feel free to improve these fields!
Wort mit Artikel: suffisamment
Femininum / Plural: ''
IPA: \sy.fi.za.mɑ̃\
Definition: Enough
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Je ne l'ai pas dit *suffisamment*.
  I didn't say it *enough*.

  Cette boîte est-elle *suffisamment* grande pour tout ranger ?
  Is this box big *enough* to store everything?

  Votre lettre n'était pas *suffisamment* affranchie pour l'envoi à l'étranger.
  Your letter wasn't clear *enough* to send overseas.

  As-tu *suffisamment* de temps pour finir ce projet ?
  Do you have *enough* time to finish this project?

  Il n'y avait pas *suffisamment* à boire pour tout le monde à la fête.
  There wasn't *enough* to drink for everyone at the party.

  Nous avons été *suffisamment* patients avec les enfants aujourd'hui.
  We've been patient *enough* with the kids today.

  Le professeur a-t-il *suffisamment* expliqué la leçon ?
  Has the teacher explained the lesson well *enough*?

  Elle gagne *suffisamment* d'argent pour partir en vacances deux fois par an.
  She earns *enough* money to go on vacation twice a year.

  Les fenêtres ne sont pas *suffisamment* isolées contre le bruit.
  The windows are not sufficiently insulated from noise.

  Avez-vous *suffisamment* de place dans votre valise ?
  Do you have *enough* room in your suitcase?

  Marc n'a pas *suffisamment* réfléchi avant de prendre sa décision.
  Mark did not think well *enough* before making his decision.

  La salle est-elle *suffisamment* chauffée pour les bébés ?
  Is the room warm *enough* for the babies?

  Les élèves ont *suffisamment* de livres pour commencer le cours.
  The students have *enough* books to start the class.

  Je suis *suffisamment* préparée pour l'examen de demain.
  I'm sufficiently prepared for tomorrow's exam.

