        <div class="de spoiler">I wrote his phone number in my address book.</div>
        <div class="fr">Le journaliste sort toujours avec un carnet pour prendre des notes.</div>
        <div class="de spoiler">The journalist always goes out with a notebook to take notes.</div>
      </div>
      <p><span class="fr">Cahier</span> means <span class="de">"Have"</span> It refers to a larger format that is often used for educational or professional purposes. <span class="fr">carnet</span> and is used for longer texts or exercises.</p>
      <div class="examples">
        <div class="fr">Les élèves écrivent leurs devoirs dans leurs cahiers.</div>
        <div class="de spoiler">The students write their homework in their notebooks.</div>
