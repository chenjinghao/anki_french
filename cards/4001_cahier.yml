Notiz: |-
  <div class="section">
    <div class="section-title"><i>carnet</i> and <i>cahier</i></div>
    <div class="section-content">
      <p><span class="fr">Carnet</span> (#3723) means <span class="de">"Notizbuch"</span> or <span class="de">"Heft"</span> and typically denotes a smaller, often portable notebook, which is used for short notes, addresses or small sketches.</p>
      <div class="examples">
        <div class="fr">J'ai noté son numéro de téléphone dans mon carnet d'adresses.</div>
        <div class="de spoiler">I put his phone number in my address book.</div>
        <div class="fr">Le journaliste sort toujours avec un carnet pour prendre des notes.</div>
        <div class="de spoiler">The journalist always goes out with a notebook to make notes.</div>
      </div>
      <p><span class="fr">Cahier</span> means <span class="de">"Heft"</span> It usually contains more pages than a single page, and refers to a larger format that is often used for school or professional purposes. <span class="fr">carnet</span> and is used for longer texts or exercises.</p>
      <div class="examples">
        <div class="fr">Les élèves écrivent leurs devoirs dans leurs cahiers.</div>
        <div class="de spoiler">The students write their homework in their notebooks.</div>
        <div class="fr">J'ai acheté un cahier de 200 pages pour mes cours de français.</div>
        <div class="de spoiler">I bought a 200-page booklet for my French class.</div>
      </div>
    </div>
  </div>
