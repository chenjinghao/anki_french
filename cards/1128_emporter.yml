Notiz: |-
  <div class="section">
    <div class="section-title"><i>emporter</i> and <i>apporter</i></div>
    <div class="section-content">
      <p><span class="fr">Emporter</span> means <span class="de">"mitnehmen"</span> or <span class="de">"wegbringen"</span> for objects. The focus is on leaving a place with something.</p>
      <div class="examples">
        <div class="fr">J'emporte mes livres pour étudier.</div>
        <div class="de spoiler">I'm taking my books to study.</div>
        <div class="fr">Le restaurant propose des repas à emporter.</div>
        <div class="de spoiler">The restaurant offers take-away food.</div>
      </div>
      <p><span class="fr">Apporter</span> (#339) means <span class="de">"mitbringen"</span> or <span class="de">"herbringen"</span> for objects. The focus is on arriving with something at a destination.</p>
      <div class="examples">
        <div class="fr">J'apporterai des cadeaux aux enfants de ma famille.</div>
        <div class="de spoiler">I'll bring presents to my family's children.</div>
        <div class="fr">Si tu viens, apporte une bouteille de vin !</div>
        <div class="de spoiler">When you come, bring a bottle of wine!</div>
      </div>
      <p>Both verbs refer to the transport of objects that can be carried in the hands or arms.</p>
      <p class="tip">Merkhilfe: <span class="fr">Apporter</span> begins with A as arrival.</p>
    </div>
  </div>
  <!-- Grammar automatically added -->
