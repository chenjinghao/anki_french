Wort mit Artikel: contenter
Femininum / Plural: ''
IPA: \kɔ̃.tɑ̃.te\
Definition: Satisfying
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Tu te *contenteras* d'être le chauffeur.
  You'll have to be content to be the driver.

  Pour *contenter* sa curiosité, Marie a ouvert la lettre en cachette.
  In order to satisfy her curiosity, Marie secretly opened the letter.

  Les enfants se sont *contentés* de jouer dans le jardin toute l'après-midi.
  The children were content to play in the garden all afternoon.

  Cette augmentation de salaire devrait *contenter* les employés.
  This increase in salary should satisfy the employees.

  Il s'est *contenté* de hausser les épaules au lieu de répondre.
  He was content to shrug his shoulders instead of answering.

  Je ne peux pas *contenter* tous mes clients en même temps.
  I can't satisfy all my customers at the same time.

  Elle se *contente* d'un petit appartement en centre-ville.
  She is *satisfied* with a small apartment in the city center.

  Pour *contenter* son appétit, il a mangé deux assiettes de pâtes.
  To satisfy his hunger, he ate two plates of pasta.

  Ces explications ne me *contentent* pas du tout.
  These explanations do not satisfy me at all.

  L'entreprise n'a pas réussi à *contenter* les exigences des investisseurs.
  The company could not *meet* the requirements of the investors.

  Je me suis *contenté* d'un café pour le petit-déjeuner.
  I was content with a coffee for breakfast.

  Cette solution simple devrait *contenter* tout le monde.
  This simple solution should satisfy everyone.

  Il faudra vous *contenter* de ce que nous avons pour l'instant.
  They will have to be content with what we have for the time being.

  Les parents sont difficiles à *contenter* quand il s'agit de l'éducation.
  Parents are hard to satisfy when it comes to upbringing.

  Elle s'est *contentée* d'observer la scène sans intervenir.
  She was content to watch the scene without interfering.

  Cette réponse vague ne *contentera* pas le jury.
  This vague answer will not satisfy the jury.

  Pour *contenter* son besoin d'aventure, il voyage chaque été.
  To satisfy his need for adventure, he travels every summer.

  Le petit garçon se *contente* de peu pour être heureux.
  The little boy is content with little to be happy.

  Nous devons *contenter* les attentes de nos supérieurs.
  We have to *meet* our superiors' expectations.

  Paul s'est *contenté* d'un sandwich pour le déjeuner.
  Paul was content with a sandwich for lunch.

