  <div class="section">
    <div class="section-title"><i>satisfaire</i> and <i>contenter</i></div>
    <div class="section-content">
      <p><span class="fr">Satisfaire</span> (#781) means <span class="de">"befriedigen"</span> or <span class="de">"zufriedenstellen"</span> and refers to the complete fulfilment of needs, expectations or requirements.</p>
      <div class="examples">
        <div class="fr">Ce repas a satisfait tous mes invités.</div>
        <div class="de spoiler">This food satisfied all my guests.</div>
        <div class="fr">Il faut satisfaire aux exigences du client.</div>
        <div class="de spoiler">You have to meet the customer's requirements.</div>
      </div>
      <p><span class="fr">Contenter</span> means <span class="de">"zufriedenstellen"</span> or <span class="de">"erfreuen"</span> and often implies a simpler or more superficial form of satisfaction.</p>
      <div class="examples">
        <div class="fr">Un petit cadeau suffit à contenter un enfant.</div>
        <div class="de spoiler">A small gift is enough to satisfy a child.</div>
        <div class="fr">Elle se contente de peu.</div>
        <div class="de spoiler">She is content with little.</div>
      </div>
      <p><span class="fr">Satisfaire</span> is often used in more formal contexts and implies a deeper, more complete fulfillment, while <span class="fr">contenter</span> It is a more simple, more modest satisfaction.</p>
