Notiz: |-
  <div class="section">
    <div class="section-title"><i>présumer</i> and <i>supposer</i></div>
    <div class="section-content">
      <p><span class="fr">Présumer</span> means <span class="de">"vermuten"</span> or <span class="de">"annehmen"</span>It is used when you think something is likely or very likely, but acknowledges that it is a probability and could be wrong.</p>
      <div class="examples">
        <div class="fr">Je présume qu'il viendra à la fête, mais je n'en suis pas certain.</div>
        <div class="de spoiler">I suspect he'll come to the party, but I'm not sure.</div>
      </div>

      <p><span class="fr">Supposer</span> (#730) means <span class="de">"annehmen"</span> or <span class="de">"voraussetzen"</span> in the sense of a hypothesis or premise for a reasoning or demonstration. It is often used in mathematical or logical contexts, where one assumes an assumption to arrive at further conclusions.</p>
      <div class="examples">
        <div class="fr">Supposons que x est égal à 5, nous pouvons alors calculer y.</div>
        <div class="de spoiler">Suppose x is equal to 5, then we can calculate y.</div>
      </div>

      <p>The main difference is that in the case of <span class="fr">présumer</span> the risk of error remains in the consciousness, while <span class="fr">supposer</span> This risk is avoided (at least temporarily) in order to use the adoption as a tool for further conclusions.</p>

      <p>The English word <span class="de">"assume"</span> entspricht eher <span class="fr">supposer</span>, especially in mathematical contexts.</p>
    </div>
  </div>
