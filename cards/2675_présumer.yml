Notiz: |-
  <div class="section">
    <div class="section-title"><i>présumer</i> and <i>supposer</i></div>
    <div class="section-content">
      <p><span class="fr">Présumer</span> means <span class="de">'Missed'</span> or <span class="de">"acceptance"</span>It's used when you think something is likely or very likely, but you recognize that it's a probability and it could be wrong.</p>
      <div class="examples">
        <div class="fr">Je présume qu'il viendra à la fête, mais je n'en suis pas certain.</div>
        <div class="de spoiler">I'm guessing he'll come to the party, but I'm not sure.</div>
      </div>

      <p><span class="fr">Supposer</span> (#730) means <span class="de">"acceptance"</span> or <span class="de">'foreseeable'</span> in the sense of a hypothesis or a premise for an argument or demonstration. It is often used in mathematical or logical contexts where one starts from an assumption to come to further conclusions.</p>
      <div class="examples">
        <div class="fr">Supposons que x est égal à 5, nous pouvons alors calculer y.</div>
        <div class="de spoiler">Let's say x is equal to 5, then we can calculate y.</div>
      </div>

      <p>The main difference is that in <span class="fr">présumer</span> the risk of error remains in consciousness while <span class="fr">supposer</span> This risk is omitted (at least temporarily) in order to use the assumption as a tool for further conclusions.</p>

      <p>The English word <span class="de">"assume"</span> corresponds more <span class="fr">supposer</span>In particular in mathematical contexts.</p>
    </div>
  </div>
