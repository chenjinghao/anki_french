Rang: 2675
Wort: présumer
Wortart: vt, vi

# Feel free to improve these fields!
Wort mit Artikel: présumer
Femininum / Plural: ''
IPA: \pʁe.zy.me\
Definition: suspected or assumed
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Je *présume* que vous êtes carnivore.
  I suppose you're a carnivore.

  On peut *présumer* une issue heureuse de cette négociation.
  We can assume a happy outcome from this negotiation.

  Les parents *présumaient* leur fille morte après sa longue disparition.
  The parents assumed their daughter was dead after her long disappearance.

  "Je *présume* que tu es d'accord avec cette décision ?"
  "I assume you agree with that decision?"

  Elle a trop *présumé* de ses forces et n'a pas pu terminer le marathon.
  She overestimated her strength and couldn't finish the marathon.

  Les auteurs *présumés* du vol ont été arrêtés hier soir.
  The alleged perpetrators of the robbery were arrested last night.

  Tout accusé est *présumé* innocent jusqu'à preuve du contraire.
  Any accused is *presumed* innocent until proven guilty.

  Je *présume* d'après votre accent que vous venez du sud de la France.
  I assume from your accent that you're from the south of France.

  On *présume* qu'il réussira son examen, vu ses excellentes notes.
  It is assumed that he will pass his exam, given his excellent grades.

  "Il a quitté la fête tôt, je *présume*."
  "He left the party early, I suppose".

  Dans un couple marié, le mari est *présumé* être le père de l'enfant.
  In a married couple, the husband is *presumed* to be the father of the child.

  Ne *présumez* pas trop de vos capacités, cela pourrait vous jouer des tours.
  Don't assume too much about your abilities, it could be tricky.

  Les premiers résultats ne permettent pas de *présumer* de l'issue finale.
  The initial results do not suggest the final outcome.

  Il est à *présumer* que le temps s'améliorera demain.
  It is to be assumed that the weather will improve tomorrow.

  Les enquêteurs poursuivent leurs recherches sans rien *présumer*.
  Investigators are continuing their investigations without suspecting anything.

  On ne peut pas *présumer* des intentions de quelqu'un sans preuve.
  You can't assume someone's intentions without proof.

  "C'est une erreur, je *présume* ?"
  "This is a mistake, I suppose?"

  Le suspect a été arrêté car il était *présumé* coupable du crime.
  The suspect was arrested on suspicion of being guilty of the crime.

  Ne *présumez* pas que tout le monde partage votre opinion.
  Don't assume that everyone agrees with you.

  Les experts *présument* que le tableau est une œuvre de Rembrandt.
  Experts assume that the painting is a work of Rembrandt.

  On peut *présumer* de bons résultats si l'on travaille dur.
  You can expect good results if you work hard.

  Il a *présumé* de son influence et s'est retrouvé dans une situation délicate.
  He assumed his influence and found himself in a difficult situation.

  La police a identifié un suspect *présumé* dans l'affaire du cambriolage.
  Police have identified a suspect in the robbery case.

