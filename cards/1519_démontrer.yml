  Il s'est *démontré* que leurs hypothèses étaient correctes.
  It has proved that their hypotheses were correct.

  Les résultats *démontrent* la nécessité d'agir rapidement.
  The results *show* the need to act quickly.

  Je lui ai *démontré* ma confiance en lui confiant ce projet important.
  I have shown my trust in him by entrusting him with this important project.

  Ce qu'il *démontre* n'est pas nouveau, mais c'est toujours pertinent.
  What he *proves* is not new, but still relevant.

  Comment *démontrer* l'égalité de ces deux triangles ?
  How can the equality of these two triangles be demonstrated?

  Son comportement *démontre* un manque total de respect.
  His behavior shows a total lack of respect.

  L'expérience a *démontré* que cette méthode est inefficace.
  The experiment has *shown* that this method is ineffective.

  Nous devons *démontrer* notre engagement envers ce projet.
  We must demonstrate our commitment to this project.

  La preuve reste à *démontrer*.
  The evidence has yet to be provided.

  Ces chiffres *démontrent* clairement l'ampleur du problème.
  These figures clearly show *the* scale of the problem.

  Il faut *démontrer* cette proposition mathématique pas à pas.
  You have to *prove* this mathematical sentence step by step.

