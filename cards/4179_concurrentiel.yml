Notiz: |-
  <div class="section">
    <div class="section-title"><i>compétitif</i> and <i>concurrentiel</i></div>
    <div class="section-content">
      <p><span class="fr">Compétitif</span> (#4173) means <span class="de">"competitive"</span> and refers to the ability to compete successfully. It emphasizes the qualities or characteristics that make someone or something strong in the competition.</p>
      <div class="examples">
        <div class="fr">Cette entreprise propose des prix très compétitifs.</div>
        <div class="de spoiler">This company offers very competitive prices.</div>
        <div class="fr">Il a un esprit compétitif qui l'aide à réussir.</div>
        <div class="de spoiler">He has a competitive spirit that helps him succeed.</div>
      </div>
      <p><span class="fr">Concurrentiel</span> means <span class="de">"konkurrierend"</span> or <span class="de">"Konkurrenz-"</span> and describes something that has to do with competition or competition without necessarily implying an assessment of strength.</p>
      <div class="examples">
        <div class="fr">Le marché concurrentiel est très difficile cette année.</div>
        <div class="de spoiler">The competition market is very difficult this year.</div>
        <div class="fr">Ils ont mené une analyse concurrentielle approfondie.</div>
        <div class="de spoiler">You've done a thorough competition analysis.</div>
      </div>
      <p><span class="fr">Compétitif</span> stresses the competitiveness performance, while <span class="fr">concurrentiel</span> the existence or context of competition.</p>
    </div>
  </div>
