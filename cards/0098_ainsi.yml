Notiz: |-
  <div class="section">
    <div class="section-title">Constructing sentences</div>
    <div class="section-content">
      <p>When <span class="fr">ainsi</span> When a sentence begins, it is usually separated by a comma, but this is not the case when the subject is inverted.</p>
      <div class="examples">
        <div class="fr"><u>Ainsi</u>, vous avez réussi à le convaincre.</div>
        <div class="de spoiler"><u>That 's it .</u>You managed to convince him.</div>
      </div>
      <div class="examples">
        <div class="fr"><u>Ainsi</u> avez-vous réussi à le convaincre.</div>
        <div class="de spoiler"><u>That 's it .</u> You've managed to convince him.</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Usage</div>
    <div class="section-content">
      <p>The expression <span class="fr">ainsi donc</span> is used to express surprise or dissatisfaction.</p>
      <div class="examples">
        <div class="fr"><u>Ainsi donc</u>, il a refusé de me rencontrer !</div>
        <div class="de spoiler"><u>So what ?</u> He refused to meet me!</div>
      </div>
      <p class="tip">The Word <span class="fr">ainsi</span> means already <span class="de">"successful"</span> or <span class="de">"for example"</span>Therefore, you should use phrases such as <span class="fr">ainsi par conséquent</span> or <span class="fr">ainsi par exemple</span> to avoid it.</p>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Alignment</div>
    <div class="section-content">
      <p>The expression <span class="fr">ainsi que</span> It has two different meanings which affect the approximation in the sentence.</p>
      <p>When <span class="fr">ainsi que</span> <span class="de">"in the same way as"</span> This means that the first term is approximated to the first term in comparison. <span class="fr">ainsi que</span> separated by a comma.</p>
      <div class="examples">
        <div class="fr">Magali, <u>ainsi qu'</u>une enfant, ne pouvait cacher son enthousiasme.</div>
        <div class="de spoiler">Magali, <u>It 's back .</u> As a child, she couldn't hide her enthusiasm.</div>
      </div>
      <p>When <span class="fr">ainsi que</span> <span class="de">"and"</span> This means that the approximation takes place in the plural. <span class="fr">ainsi que</span> not separated by a comma.</p>
      <div class="examples">
        <div class="fr">Il tient cachés sous son manteau un litre de vin <u>ainsi qu'</u>un demi-pain.</div>
        <div class="de spoiler">He hides under his coat a liter of wine <u>and</u> half a loaf of bread.</div>
      </div>
      <p class="attention">The meaning of the sentence often determines whether the approximation takes place in singular or plural.</p>
      <div class="examples">
        <div class="fr">L'adjectif brave, <u>ainsi que l'</u>adjectif barbare, se rattache à la famille du grec barbaros.</div>
        <div class="de spoiler">The adjective "courageous" <u>and</u> The adjective "barbarian" belongs to the family of the Greek "barbaros".</div>
      </div>
      <div class="examples">
        <div class="fr">L'adjectif brave <u>ainsi que l'</u>adjectif barbare se rattachent à la famille du grec barbaros.</div>
        <div class="de spoiler">The adjective "courageous" <u>and</u> The adjective "barbarian" belongs to the family of the Greek "barbaros".</div>
      </div>
    </div>
  </div>
