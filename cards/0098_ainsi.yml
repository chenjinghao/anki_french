# Please do not change these fields.
Rang: 98
Wort: ainsi
Wortart: adv

# Feel free to improve these fields!
Wort mit Artikel: ainsi
Femininum / Plural: ''
IPA: \ɛ̃.si\
Definition: so, in this way
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Qu'est-ce qui le pousse à agir *ainsi* ?
  What makes him do that?

  C'est *ainsi* que nous avons toujours fait les choses.
  That's how we've always done things.

  *Ainsi*, tu as finalement décidé de partir ?
  *So* you finally decided to leave?

  *Ainsi que* vous pouvez le constater, les résultats sont excellents.
  As you can see, the results are excellent.

  Les enfants, *ainsi que* les adultes, doivent respecter ces règles.
  Both children *and* adults must follow these rules.

  C'est mieux *ainsi*, croyez-moi.
  It's better that way, believe me.

  *Ainsi* va la vie, mon ami.
  That's life, my friend.

  S'il en est *ainsi*, nous devrons changer nos plans.
  In that case, we have to change our plans.

  Je suis *ainsi* fait : je ne peux pas mentir.
  I'm like this: I can't lie.

  *Pour ainsi dire*, il ne me reste plus rien.
  I don't have anything left, *so to speak*.

  Et *ainsi de suite* jusqu'à la fin du mois.
  And *so on* until the end of the month.

  *Ainsi soit-il* ! a dit le prêtre à la fin de la prière.
  *Amen*! said the priest at the end of the prayer.

  *Ainsi*, mon frère a déjà visité ce pays trois fois.
  *For example*, my brother has been in this country three times.

  *Ainsi donc*, vous refusez notre proposition ?
  *So* you're rejecting our proposal?

  Ayant *ainsi* parlé, elle quitta la pièce.
  After speaking like this, she left the room.

  La chose s'est passée *ainsi*, je vous assure.
  This is how it happened, I assure you.

  *Ainsi* l'a voulu le destin.
  That's what fate wanted.

  Si j'ose m'exprimer *ainsi*, je trouve ce comportement inapproprié.
  If I may put myself that way, I find this behavior inappropriate.

  Puisqu'il en est *ainsi*, nous n'avons plus le choix.
  Since it is, we have no choice.

  *Ainsi* périssent tous les tyrans !
  Let all the tyrants perish!

  Comme le soleil se lève chaque matin, *ainsi* l'espoir renaît chaque jour.
  Just as the sun rises every morning, so does hope wake up every day.

  Tout est temporaire ; *ainsi de* nous.
  Everything is transitory; so are we.

  Il ne lui reste, *pour ainsi dire*, que les yeux pour pleurer.
  He's got the shirt on his body.

  *Ainsi*, rien n'a changé depuis mon départ.
  *So* nothing's changed since I left.

  Les choses se sont déroulées *ainsi que* je vous l'ai expliqué.
  Things have happened as I explained to you.

  C'est *ainsi* qu'il faut préparer ce plat traditionnel.
  *So* you have to prepare this traditional dish.

  *Ainsi que* prévu, le train est arrivé à l'heure.
  As planned, the train arrived on time.

  Ce pays, *ainsi que* ses voisins, connaît une période difficile.
  This country, like its neighbours, is experiencing a difficult time.

  Je ne saurais pas faire autrement, je suis *ainsi*.
  I couldn't do anything else, I'm like that.

  La patience, *ainsi que* la persévérance, sont des qualités essentielles.
  Both patience *and* perseverance are essential qualities.

