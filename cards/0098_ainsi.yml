Notiz: |-
  <div class="section">
    <div class="section-title">Satzbau</div>
    <div class="section-content">
      <p>If: <span class="fr">ainsi</span> at the beginning of a sentence, it is usually separated by a comma. However, this does not apply if the subject is inverted.</p>
      <div class="examples">
        <div class="fr"><u>Ainsi</u>, vous avez réussi à le convaincre.</div>
        <div class="de spoiler"><u>So</u>You managed to convince him.</div>
      </div>
      <div class="examples">
        <div class="fr"><u>Ainsi</u> avez-vous réussi à le convaincre.</div>
        <div class="de spoiler"><u>So</u> You managed to convince him.</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Usage</div>
    <div class="section-content">
      <p>The expression <span class="fr">ainsi donc</span> is used to express surprise or dissatisfaction.</p>
      <div class="examples">
        <div class="fr"><u>Ainsi donc</u>, il a refusé de me rencontrer !</div>
        <div class="de spoiler"><u>Also</u> He refused to meet me!</div>
      </div>
      <p class="tip">The Word <span class="fr">ainsi</span> already means <span class="de">"Successful"</span> or <span class="de">"For example"</span>. Therefore, expressions such as <span class="fr">ainsi par conséquent</span> or <span class="fr">ainsi par exemple</span> vermeiden.</p>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Angleichung</div>
    <div class="section-content">
      <p>The expression <span class="fr">ainsi que</span> has two different meanings which affect the alignment in the sentence.</p>
      <p>If: <span class="fr">ainsi que</span> <span class="de">"in the same way as"</span> In this case, the first term is used to refer to the first term. <span class="fr">ainsi que</span> separated by a comma.</p>
      <div class="examples">
        <div class="fr">Magali, <u>ainsi qu'</u>une enfant, ne pouvait cacher son enthousiasme.</div>
        <div class="de spoiler">Magali, <u>again</u> a child, could not hide her enthusiasm.</div>
      </div>
      <p>If: <span class="fr">ainsi que</span> <span class="de">"and"</span> In this case, the <span class="fr">ainsi que</span> not separated by a comma.</p>
      <div class="examples">
        <div class="fr">Il tient cachés sous son manteau un litre de vin <u>ainsi qu'</u>un demi-pain.</div>
        <div class="de spoiler">He hides a liter of wine under his coat <u>and</u> half a bread.</div>
      </div>
      <p class="attention">The meaning of the sentence often decides whether the alignment is done in the singular or plural. This also influences the punctuation.</p>
      <div class="examples">
        <div class="fr">L'adjectif brave, <u>ainsi que l'</u>adjectif barbare, se rattache à la famille du grec barbaros.</div>
        <div class="de spoiler">The adjective "tapper" <u>sowie</u> The adjective "barbaric" belong to the family of the Greek "barbaros".</div>
      </div>
      <div class="examples">
        <div class="fr">L'adjectif brave <u>ainsi que l'</u>adjectif barbare se rattachent à la famille du grec barbaros.</div>
        <div class="de spoiler">The adjective "tapper" <u>and</u> The adjective "barbaric" belong to the family of the Greek "barbaros".</div>
      </div>
    </div>
  </div>
