Notiz: |-
  <div class="section">
    <div class="section-title"><i>destin</i> and <i>sort</i></div>
    <div class="section-content">
      <p><span class="fr">Destin</span> refers to the predetermined fate or the <span class="de">"Bestimmung"</span> a person, a group or a line of individuals defined by a higher instance. It corresponds to the German term <span class="de">"Schicksal"</span> in the broad sense.</p>
      <div class="examples">
        <div class="fr">Il croit que son destin est d'être un grand artiste.</div>
        <div class="de spoiler">He believes that it is his destiny to become a great artist.</div>
        <div class="fr">Quel que soit notre destin, nous devons l'accepter.</div>
        <div class="de spoiler">Whatever our fate is, we must accept it.</div>
      </div>
      <p><span class="fr">Sort</span> (#1780) refers more to individual events or circumstances that appear to be accidental or determined by fate. It may have both positive and negative meanings, but is often used for adverse situations.</p>
      <div class="examples">
        <div class="fr">Il a subi un sort cruel.</div>
        <div class="de spoiler">He suffered a cruel fate.</div>
        <div class="fr">Le sort en est jeté.</div>
        <div class="de spoiler">The lot has fallen.</div>
      </div>
    </div>
  </div>
