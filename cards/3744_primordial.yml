Notiz: |-
  <div class="section">
    <div class="section-title"><i>primordial</i> and <i>fondamental</i></div>
    <div class="section-content">
      <p><span class="fr">Primordial</span> means <span class="de">"Strictly"</span> or <span class="de">'Originally'</span> It often refers to something that is at the beginning or fundamental to further developments.</p>
      <div class="examples">
        <div class="fr">La confiance est un élément primordial dans toute relation.</div>
        <div class="de spoiler">Trust is an essential element in any relationship.</div>
        <div class="fr">Il est primordial de protéger l'environnement pour les générations futures.</div>
        <div class="de spoiler">It is of the utmost importance to protect the environment for future generations.</div>
      </div>
      <p><span class="fr">Fondamental</span> means <span class="de">'Basic'</span> or <span class="de">"substantial"</span> It emphasizes the structural or conceptual significance.</p>
      <div class="examples">
        <div class="fr">Ces principes sont fondamentaux pour comprendre la théorie.</div>
        <div class="de spoiler">These principles are fundamental to understanding the theory.</div>
        <div class="fr">Le respect des droits humains est une valeur fondamentale de notre société.</div>
        <div class="de spoiler">Respect for human rights is a fundamental value of our society.</div>
      </div>
      <p>Both adjectives are of great importance, but <span class="fr">primordial</span> emphasizes the priority of time or the critical necessity, while <span class="fr">fondamental</span> the structural significance as a basis or basis.</p>
    </div>
  </div>
