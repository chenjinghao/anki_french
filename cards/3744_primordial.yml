Notiz: |-
  <div class="section">
    <div class="section-title"><i>primordial</i> and <i>fondamental</i></div>
    <div class="section-content">
      <p><span class="fr">Primordial</span> means <span class="de">"erstrangig"</span> or <span class="de">"originally"</span> It often refers to something that is at the beginning or fundamental to further developments.</p>
      <div class="examples">
        <div class="fr">La confiance est un élément primordial dans toute relation.</div>
        <div class="de spoiler">Trust is a primary element in every relationship.</div>
        <div class="fr">Il est primordial de protéger l'environnement pour les générations futures.</div>
        <div class="de spoiler">It is of the utmost importance to protect the environment for future generations.</div>
      </div>
      <p><span class="fr">Fondamental</span> means <span class="de">"grundlegend"</span> or <span class="de">"substantial"</span> and refers to what forms the basis or foundation. It emphasizes the structural or conceptual meaning.</p>
      <div class="examples">
        <div class="fr">Ces principes sont fondamentaux pour comprendre la théorie.</div>
        <div class="de spoiler">These principles are fundamental to the understanding of theory.</div>
        <div class="fr">Le respect des droits humains est une valeur fondamentale de notre société.</div>
        <div class="de spoiler">Respect for human rights is a fundamental value of our society.</div>
      </div>
      <p>Both adjectives express great importance, but <span class="fr">primordial</span> stresses more the temporal priority or critical need, while <span class="fr">fondamental</span> It is important to note that there is a need for a more systematic approach to the question of the structural importance of the system as a basis or basis.</p>
    </div>
  </div>
