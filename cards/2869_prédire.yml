Notiz: |-
  <div class="section">
    <div class="section-title"><i>prédire</i> and <i>prévoir</i></div>
    <div class="section-content">
      <p><span class="fr">Prévoir</span> #437) (literally: <span class="de">'foreseeable'</span>) is used for realistic, rational or scientific predictions based on calculations or statistics.</p>
      <div class="examples">
        <div class="fr">Les économistes prévoient une reprise économique.</div>
        <div class="de spoiler">Economists anticipate an economic recovery.</div>
        <div class="fr">Elle prévoit avoir besoin d'aide.</div>
        <div class="de spoiler">She anticipates that she will need help.</div>
      </div>

      <p><span class="fr">Prédire</span> (literally: <span class="de">'Prediction'</span>) also implies an announcement and is more commonly used for intuitive, supernatural or predictive predictions.</p>
      <div class="examples">
        <div class="fr">Cette voyante prédit l'avenir.</div>
        <div class="de spoiler">This fortune teller foretells the future.</div>
        <div class="fr">Tous lui avaient prédit un brillant avenir.</div>
        <div class="de spoiler">Everyone had predicted a bright future for him.</div>
      </div>

      <p>In some contexts, both verbs may be interchangeable, especially when predictions are based on assumptions or considerations:</p>
      <div class="examples">
        <div class="fr">Les experts prévoient/prédisent une crise économique.</div>
        <div class="de spoiler">The experts predict an economic crisis.</div>
      </div>
    </div>
  </div>
