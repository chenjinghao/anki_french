Rang: 347
Wort: tenter
Wortart: vt

# Feel free to improve these fields!
Wort mit Artikel: tenter
Femininum / Plural: ''
IPA: \tɑ̃.te\
Definition: try to irritate
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Il *tente* de sortir de l'Italie.
  He's trying to leave Italy.

  Les soldes *tentent* toujours les acheteurs.
  The retail sales always appeal to the buyers.

  J'ai été *tenté* d'abandonner, mais j'ai persévéré.
  I was trying to give up, but I held out.

  Elle *tente* sa chance au loto chaque semaine.
  She tries her luck in the lottery every week.

  "Ne vous laissez pas *tenter* par ces gâteaux !"
  "Don't let these cakes seduce you!"

  Le jeune homme *tenta* de séduire la jolie serveuse.
  The young man *tried* to seduce the pretty waitress.

  Nous *tenterons* de résoudre ce problème demain.
  We will *try* to solve this problem tomorrow.

  Cette offre d'emploi ne me *tente* pas du tout.
  This job offer doesn't appeal to me at all.

  Le diable *tenta* Ève avec une pomme.
  The devil *tried* Eve with an apple.

  Les enfants *tentèrent* de grimper à l'arbre.
  The children *tried* to climb the tree.

  Je suis *tenté* de penser qu'il nous ment.
  I'm tempted to believe he's lying to us.

  Elle a *tenté* l'impossible pour sauver son entreprise.
  She *tried* the impossible to save her business.

  Les scientifiques *tentent* de trouver un remède.
  The scientists are trying to find a cure.

  "Ce nouveau restaurant me *tente* beaucoup !"
  "This new restaurant is very appealing to me!"

  Nous avons *tenté* une approche différente cette fois-ci.
  We *tried* another approach this time.

  Le parfum *tentant* attirait les clients dans la boutique.
  The *enticing* scent lured the customers into the shop.

  Il ne faut pas *tenter* le diable en conduisant trop vite.
  You shouldn't *challenge* the devil by driving too fast.

  Les publicités *tentent* de nous faire acheter des produits inutiles.
  The commercials are trying to let us buy useless products.

  Je suis *tenté* de partir en vacances plus tôt que prévu.
  I'm tempted to go on vacation earlier than I planned.

  L'alpiniste *tenta* l'ascension du sommet malgré le mauvais temps.
  The climber dared to climb to the summit despite the bad weather.

  "Ne me *tentez* pas avec ce délicieux gâteau au chocolat !"
  "Don't seduce me with this delicious chocolate cake!"

  Les voleurs ont *tenté* de forcer la serrure sans succès.
  The thieves *tried* to break the lock, but without success.

  Elle *tente* toujours de voir le bon côté des choses.
  She always tries to see the good side of things.

  Le petit garçon était *tenté* de goûter le gâteau avant le dîner.
  The little boy was tempted to taste the cake before dinner.

  Nous *tenterons* notre chance au concours l'année prochaine.
  We'll *try* our luck next year at the competition.

  Le politicien a *tenté* de convaincre les électeurs avec de belles promesses.
  The politician *tried* to convince the voters with nice promises.

