Rang: 1703
Wort: conséquent
Wortart: adj

# Feel free to improve these fields!
Wort mit Artikel: conséquent
Femininum / Plural: conséquente
IPA: \kɔ̃.se.kɑ̃\
Definition: consistent
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Il semble, *par conséquent*, que nous soyons face à une contradiction.
  It seems, *therefore*, that we are faced with a contradiction.

  Pour être un bon leader, il faut être *conséquent* dans ses décisions.
  To be a good leader, you have to be *consistent* in your decisions.

  Elle a toujours été *conséquente* avec ses principes moraux.
  She has always remained true to her moral principles.

  "Une somme *conséquente* a été versée sur son compte bancaire."
  "A considerable sum was transferred to his bank account."

  Cette décision aura, *par conséquent*, des répercussions importantes.
  This decision will *therefore* have an important impact.

  Il n'a pas été très *conséquent* dans sa façon d'éduquer ses enfants.
  He was not very *consistent* in his way of raising his children.

  Son comportement n'était pas *conséquent* avec ses paroles.
  His behavior was not *consistent* with his words.

  *Par conséquent*, nous devons reporter la réunion à la semaine prochaine.
  *Consequently*, we must postpone the meeting until next week.

  Marie est une personne très *conséquente* : elle fait toujours ce qu'elle dit.
  Marie is a very *consistent* person: she always does what she says.

  L'entreprise a réalisé un chiffre d'affaires *conséquent* cette année.
  The company has achieved a considerable turnover this year.

  Soyez *conséquent* avec vous-même et n'abandonnez pas vos objectifs.
  Stay true to yourself and do not give up your goals.

  *Par conséquent*, nous n'avons plus d'autre choix que d'annuler l'événement.
  *As a result*, we have no choice but to cancel the event.

  Il faut être *conséquent* dans la vie et assumer ses choix.
  You have to be *consistent* in life and stand by your decisions.

  Son travail a demandé un effort *conséquent*.
  His work required a considerable effort.

  Les parents doivent être *conséquents* dans l'éducation de leurs enfants.
  Parents must be *consistent* in raising their children.

  Cette erreur aura, *par conséquent*, des conséquences graves.
  This error will *therefore* have serious consequences.

  Il n'est pas très *conséquent* dans ses opinions politiques.
  He is not very *consistent* in his political views.

  Un budget *conséquent* a été alloué à ce projet.
  A considerable budget has been allocated to this project.

  Elle s'est montrée *conséquente* avec ses engagements.
  It has shown itself to be *consistent* with its obligations.

  *Par conséquent*, nous devons revoir notre stratégie.
  *Consequently*, we need to rethink our strategy.

  Son attitude n'était pas *conséquente* avec ses promesses.
  His attitude was not *consistent* with his promises.

  Les résultats ont montré une amélioration *conséquente*.
  The results showed a considerable improvement.

