Wort mit Artikel: aviser
Femininum / Plural: ''
IPA: \a.vi.ze\
Definition: to notify; to be subject; to come up with ideas
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
