  Les enfants doivent se brosser les dents *quotidiennement*.
  Children have to brush their teeth every day.

  Notre équipe travaille *quotidiennement* pour améliorer nos services.
  Our team works *daily* to improve our services.

  Je vérifie *quotidiennement* mes e-mails professionnels.
  I check my work emails every day.

  Les journalistes publient *quotidiennement* des articles sur ce sujet.
  Journalists publish articles on this topic every day.

  Le boulanger prépare *quotidiennement* du pain frais dès 4 heures du matin.
  The baker prepares fresh bread every day from 4 a.m.

