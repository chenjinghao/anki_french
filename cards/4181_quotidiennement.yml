  Les gangs font la manchette presque *quotidiennement*.
  The gangs make headlines almost every day.

  Je prends *quotidiennement* mes médicaments après le petit-déjeuner.
  I take my medication every day after breakfast.

  Cette application est mise à jour *quotidiennement* pour assurer votre sécurité.
  This app is updated *daily* to ensure your safety.

  Il faut nettoyer la cage du hamster *quotidiennement*.
  The hamster cage must be cleaned *daily*.

  Marie et Thomas se parlent *quotidiennement* au téléphone depuis qu'ils sont à distance.
  Marie and Thomas have been calling each other every day since they were separated.

  Le prix de l'essence change *quotidiennement* à la station-service.
