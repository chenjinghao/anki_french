Notiz: |-
  <div class="section">
    <div class="section-title"><i>partage</i> and <i>répartition</i></div>
    <div class="section-content">
      <p><span class="fr">Partage</span> (#2775) refers to the act of sharing or dividing something, often with the implication of equality or fairness. It can affect both material and intangible things.</p>
      <div class="examples">
        <div class="fr">Le partage des biens après le divorce était équitable.</div>
        <div class="de spoiler">The division of the property after the divorce was just.</div>
        <div class="fr">Nous avons fait un partage des tâches ménagères.</div>
        <div class="de spoiler">We split up the housework.</div>
      </div>
      <p><span class="fr">Répartition</span> (#2648) means the distribution or allocation of resources, tasks or responsibilities. It often implies a more systematic or organised form of distribution.</p>
      <div class="examples">
        <div class="fr">La répartition des fonds entre les différents départements a été décidée.</div>
        <div class="de spoiler">The distribution of funds between the various departments was decided.</div>
        <div class="fr">Il faut revoir la répartition des élèves dans les classes.</div>
        <div class="de spoiler">The distribution of pupils among the classes must be checked.</div>
      </div>
      <p>During <span class="fr">partage</span> often suggests an even division between parties, refers to <span class="fr">répartition</span> more on the assignment or distribution within a system or structure. <span class="fr">Partage</span> can also include an emotional component of sharing while <span class="fr">répartition</span> The Commission is also aware of the importance of this issue.</p>
    </div>
  </div>
