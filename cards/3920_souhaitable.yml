Beispielsätze: |-
  Une dictature militaire n'est pas *souhaitable* dans ce pays.
  A military dictatorship is not *desirable* in this country.

  Il serait *souhaitable* que tout le monde arrive à l'heure demain.
  It would be *desirable* for everyone to arrive on time tomorrow.

  La candidature de Marie présente toutes les qualités *souhaitables* pour ce poste.
  Marie's application has all the *desirable* features for this job.

  Un changement de stratégie serait *souhaitable* dans cette situation.
  A change of strategy would be desirable in this situation.

  Est-ce vraiment *souhaitable* d'organiser une fête maintenant ?
  Is it really *desirable* to organize a party now?

  Les conditions météorologiques ne sont pas *souhaitables* pour notre randonnée.
  The weather conditions are not *desirable* for our hike.

  Il serait *souhaitable* que vous preniez des notes pendant la conférence.
  It would be *desirable* for you to write along during the lecture.

  Cette solution me semble la plus *souhaitable* parmi toutes les options.
  This solution seems to me to be the *most desirable* in all options.

  Pour un développement durable, des changements *souhaitables* sont nécessaires.
  Sustainable development requires *desirable* changes.

  Le résultat n'était pas aussi *souhaitable* que nous l'espérions.
  The result was not as *desirable* as we had hoped.

  Une rénovation complète serait *souhaitable* avant l'hiver.
  A complete renovation would be *desirable* before winter.

  Les effets *souhaitables* du médicament se font sentir après quelques jours.
  The *desired* effects of the drug are apparent after a few days.

  Il n'est pas *souhaitable* de reporter cette décision importante.
  It is not advisable to postpone this important decision.

