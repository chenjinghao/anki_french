Beispielsätze: |-
  Je vous ai vu *lors* de votre dernière visite.
  I saw you on your last visit.

  *Lors* de notre arrivée, il pleuvait à verse.
  On our arrival, it rained.

  Nous nous sommes rencontrés *lors* d'un congrès scientifique.
