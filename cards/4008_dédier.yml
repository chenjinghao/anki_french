Beispielsätze: |-
  Ce livre est *dédié* à ma sœur qui est décédée.
  This book is *dedicated* to my deceased sister.

  Elle a *dédié* sa thèse à son directeur de recherche.
  She *dedicated* her doctoral thesis to her supervisor.

  Le poète *dédie* ses vers à sa bien-aimée.
  The poet dedicates his verses to his lover.

  Notre équipe a *dédié* trois ans au développement de ce projet.
  Our team *dedicated* three years to the project.

  Cette cathédrale est *dédiée* à Saint-Pierre.
  This cathedral is dedicated to St. Peter.

  L'artiste a *dédié* cette sculpture à la mémoire des victimes.
  The artist has *dedicated* this sculpture to the memory of the victims.

  Je *dédie* cette chanson à tous ceux qui m'ont soutenu.
  I dedicate this song to everyone who supported me.

  Il a *dédié* sa vie à aider les autres.
  He has dedicated his life to helping others.

  Cette chapelle fut *dédiée* à la Vierge au XII<sup>e</sup> siècle.
  This chapel was *consecrated* to the Virgin Mary in the 12th century.

  L'auteur a *dédié* son premier roman à ses parents.
  The author *dedicated* her first novel to her parents.

  Les bénévoles ont *dédié* leur temps libre à cette cause.
  The volunteers have *dedicated* their free time to this matter.

  Le musée a *dédié* une salle entière à ce peintre célèbre.
  The museum has *dedicated* an entire hall to this famous painter.

  Cette fondation est *dédiée* à la recherche contre le cancer.
  This foundation is dedicated to cancer research.

  Elle a *dédié* ses efforts à l'éducation des enfants défavorisés.
  It has devoted its efforts to the education of disadvantaged children.

  Le temple antique était *dédié* à Apollon.
  The ancient temple was dedicated to Apollo.

  Je voudrais *dédier* cette victoire à mon entraîneur.
  I want to dedicate this victory to my coach.

  Les scientifiques ont *dédié* leurs recherches au bien de l'humanité.
  The scientists have *dedicated* their research to the good of mankind.

