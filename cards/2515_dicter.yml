# Feel free to improve these fields!
Wort mit Artikel: dicter
Femininum / Plural: ''
IPA: \dik.te\
Definition: to dictate
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Écris ce que je te *dicte*, mot pour mot.
  Write down what I tell you, word for word.

  Le professeur *dictait* lentement pour que tous les élèves puissent suivre.
  The teacher *dictated* slowly so that all the students could follow.

  "Ne me *dictez* pas ce que je dois faire !" s'est-elle exclamée.
  "Don't tell me what to do!" she exclaimed.

  Les circonstances nous ont *dicté* notre décision.
  Circumstances *dictated* our decision.

  Il *dictait* son courrier à sa secrétaire chaque matin.
  He *dictated* his letter to his secretary every morning.

  La raison d'État *dicte* parfois des choix difficiles.
  State reason sometimes dictates difficult choices.

  Les parents ne devraient pas *dicter* tous les choix de leurs enfants.
  Parents should not dictate all choices to their children.

  Elle a *dicté* ses dernières volontés à son avocat.
  She *dictated* her last wishes to her lawyer.

  La mode *dicte* souvent les tendances vestimentaires.
  Fashion often dictates clothing trends.

  Le jury a *dicté* son verdict après une longue délibération.
  The jury has given its verdict after a long deliberation.

  "*Dictez*-moi votre numéro de téléphone, s'il vous plaît."
  "Tell me your phone number, please".

  La peur ne devrait pas *dicter* nos actions.
  Fear should not dictate our actions.

  L'entreprise a *dicté* de nouvelles règles à ses employés.
  The company has *dictated* new rules to its employees.

  Le médecin lui a *dicté* un régime strict à suivre.
  The doctor *dictated* a strict diet.

  Les événements récents ont *dicté* la politique étrangère du pays.
  Recent events have *dictated* the country's foreign policy.

  "Je vais vous *dicter* la liste des ingrédients nécessaires."
  "I'll dictate to you the list of ingredients".

  Son instinct lui *dictait* de fuir le danger.
  His instincts told him to run away from danger.

  Le chef d'orchestre *dictait* le tempo aux musiciens.
  The conductor *dictated* the tempo to the musicians.

  Les conditions météorologiques *dictent* souvent le déroulement d'un match.
  Weather conditions often *dictate* the course of a game.

  "Ne laissez pas vos émotions vous *dicter* vos décisions."
  "Don't let your emotions dictate your decisions".

