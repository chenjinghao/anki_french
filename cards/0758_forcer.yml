      <p><span class="fr">Forcer</span> means <span class="de">"zwingen"</span> or <span class="de">"erzwingen"</span> and is often used when someone is forced to do something against his will. It has a stronger and more aggressive connotation.</p>
      <div class="examples">
        <div class="fr">Il a forcé la porte pour entrer.</div>
        <div class="de spoiler">He broke the door to step in.</div>
        <div class="fr">Elle a été forcée de révéler la vérité.</div>
