      </div>
      <p><span class="fr">Obliger</span> (#499) means <span class="de">"zwingen"</span> In the sense of <span class="de">"verpflichten"</span> and can imply a moral obligation or necessity. It has a milder connotation and can often include positive obligations.</p>
      <div class="examples">
        <div class="fr">Il est obligé de payer ses dettes.</div>
