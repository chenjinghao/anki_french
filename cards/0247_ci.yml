Notiz: |-
  <p>In comparisons or comparisons of two things, the <b>Particles attached</b> <span class="fr">–ci</span> or <span class="fr">–là</span> presses on. <span class="fr">–ci</span> the spatial proximity, <span class="fr">-là</span> a greater distance.</p>

  <div class="examples">
    <div class="fr">Quel pantalon est-ce que tu aimes mieux – ce pantalon-ci ou ce pantalon-là ?</div>
    <div class="de spoiler">Which pants do you like better  these pants here or those pants over there?</div>
    <div class="fr">Lequel ? Celui-ci ou celui-là ?</div>
    <div class="de spoiler">Which one, this one or that one?</div>
  </div>
