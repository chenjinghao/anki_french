Rang: 247
Wort: ci
Wortart: adv

# Feel free to improve these fields!
Wort mit Artikel: ci
Femininum / Plural: ''
IPA: \si\
Definition: here [Suffix]
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Et *celui-ci*? Oui, il est vraiment super.
  Yeah, he's really great.

  Veuillez trouver *ci-joint* mon CV et ma lettre de motivation.
  Here you will find my CV and cover letter.

  - "Comment vas-tu?"<br>- "*Comme ci, comme ça*."
  - "How are you?" - "*So lala*."

  Nous discuterons de ce sujet-*ci* plus tard.
  We'll talk about this later.

  Les événements décrits *ci-dessous* sont véridiques.
  The events listed below are true.

  Les fleurs poussent *par-ci par-là* dans le jardin.
  The flowers grow *here and there* in the garden.

  Vous trouverez les informations importantes *ci-dessus*.
  The important information can be found above.

  *Ci-gît* Marie Dupont, bien-aimée mère et grand-mère.
  *Here rests* Marie Dupont, beloved mother and grandmother.

  Il a demandé *ci et ça* pendant toute la journée.
  He's been asking all day about this and that.

  Ces temps-*ci*, je suis très occupé.
  During this time I am very busy.

  Le document *ci-inclus* contient toutes les informations nécessaires.
  The attached document contains all the necessary information.

  Les feuilles mortes volent *de-ci de-là* dans le vent d'automne.
  The dead leaves fly *here and there* in the autumn wind.

  Prenez cette route-*ci*, c'est plus court.
  Take this road here, it's shorter.

  Il y a *ci-contre* un tableau explicatif.
  A supporting table is provided.

  Elle préfère cette maison-*ci* à celle-là.
  She prefers this house over that one.

  Les prix indiqués *ci-dessous* sont en euros.
  The prices given below are in Euro.

  On trouve des champignons *par-ci par-là* dans la forêt.
  You can find mushrooms in the woods *here and there*.

  Cette semaine-*ci* sera décisive pour notre projet.
  This week will be crucial to our project.

  Veuillez lire attentivement les conditions *ci-jointes*.
  Please read *the* attached conditions carefully.

  Les enfants courent *de-ci de-là* dans le parc.
  The children run crisscross the park.

  Regardez ce modèle-*ci*, il est plus récent.
  Look at this *model here*, it's newer.

  Les détails sont expliqués *ci-après*.
  The details are explained *below*.

  J'ai remarqué quelques erreurs *par-ci par-là* dans le texte.
  I have noticed some errors in the text *here and there*.

  Cette année-*ci* a été particulièrement difficile.
  This year was particularly difficult.

