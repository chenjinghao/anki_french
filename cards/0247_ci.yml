Notiz: |-
  <p>In contrasts or comparisons of two things, the <b>Attachments</b> <span class="fr">–ci</span> or <span class="fr">–là</span> on. Pressing <span class="fr">–ci</span> the spatial proximity; <span class="fr">-là</span> a greater distance.</p>

  <div class="examples">
    <div class="fr">Quel pantalon est-ce que tu aimes mieux – ce pantalon-ci ou ce pantalon-là ?</div>
    <div class="de spoiler">Which pants do you prefer – these pants here or the pants there?</div>
    <div class="fr">Lequel ? Celui-ci ou celui-là ?</div>
    <div class="de spoiler">This one or this one?</div>
  </div>
