  <div class="section">
    <div class="section-title"><i>terrible</i> and <i>horrible</i></div>
    <div class="section-content">
      <p><span class="fr">Terrible</span> (#1310) means <span class="de">"Frightful"</span> or <span class="de">"furchtbar"</span> and can express both negative and positive intensity. It is often used to describe something very strong or extreme.</p>
      <div class="examples">
        <div class="fr">Il y a eu un terrible accident sur l'autoroute.</div>
        <div class="de spoiler">There was a terrible accident on the highway.</div>
        <div class="fr">Elle a une terrible envie de chocolat.</div>
        <div class="de spoiler">She's in a terrible mood for chocolate.</div>
      </div>
      <p><span class="fr">Horrible</span> means <span class="de">"Frightful"</span> or <span class="de">"grauenhaft"</span> and has almost exclusively negative connotations. It describes something that causes disgust or horror.</p>
      <div class="examples">
        <div class="fr">Ce crime horrible a choqué toute la ville.</div>
        <div class="de spoiler">This terrible crime has shocked the whole city.</div>
        <div class="fr">Le temps est horrible aujourd'hui.</div>
        <div class="de spoiler">The weather is terrible today.</div>
      </div>
    </div>
  </div>
