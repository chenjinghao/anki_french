  Tous frais *déduits*, il nous reste 500 euros.
  After *deduction* of all costs, we will have 500 euros.

  On peut *déduire* son âge d'après son apparence.
  You can deduce your age from your appearance.

  L'entreprise a *déduit* les acomptes versés de la facture finale.
  The company has *deducted* the paid down payments from the final invoice.

  Cette théorie se *déduit* naturellement des observations.
