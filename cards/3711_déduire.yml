Beispielsätze: |-
  J'en ai *déduit* de façon certaine que je l'avais perdue.
  I certainly concluded that I had lost her.

  Les frais de transport seront *déduits* du montant total.
  Transport costs are *deducted* from the total amount.

  De ses paroles ambiguës, on peut *déduire* qu'il cache quelque chose.
  From his ambiguous words it can be concluded that he is hiding something.

