    <div class="section-title">The Genus of <i>après-midi</i></div>
    <div class="section-content">
      <p><span class="fr">Après-midi</span> can be used both masculine and feminine, with fine differences in meaning and style.</p>
      <p><span class="fr">un après-midi</span> is from the <i>Académie française</i> preferred for two reasons:</p>
      <ul>
        <li>It is the more common form in everyday use.</li>
        <li>Since the word <span class="fr">midi</span> masculine is, this gene is logically retained in the compound word.</li>
      </ul>
      <p><span class="fr">une après-midi</span> is used in two main contexts:</p>
      <ul>
        <li>In order to emphasize the duration, similar to that of <span class="fr">matinée</span> (morning) vs. <span class="fr">matin</span> or <span class="fr">soirée</span> (The evening) vs. <span class="fr">soir</span>:</li>
        <div class="examples">
          <div class="fr">Je t'ai attendu toute l'après-midi!</div>
          <div class="de spoiler">I've been waiting for you all afternoon!</div>
        </div>
        <li>In the literary and poetic language, as with Zola:</li>
        <div class="examples">
          <div class="fr">Par une après-midi grise et douce de novembre.</div>
          <div class="de spoiler">On a grey and mild November afternoon.</div>
        </div>
      </ul>
      <ul>
      </ul>
      <p>It is important to note that both forms are correct, but the choice of gender can convey subtle differences in meaning.</p>
