Notiz: |-
  <div class="section">
    <div class="section-title"><i>histoire</i>, <i>récit</i> and <i>conte</i></div>
    <div class="section-content">
      <p><span class="fr">Histoire</span> (#263) is used for various types of stories, including historical events, myths, personal accounts or fictional narratives.</p>
      <div class="examples">
        <div class="fr">L'histoire de la Révolution française est fascinante.</div>
        <div class="de spoiler">The history of the French Revolution is fascinating.</div>
        <div class="fr">Mon grand-père aime raconter des histoires de sa jeunesse.</div>
        <div class="de spoiler">My grandfather likes to tell stories from his youth.</div>
      </div>
      <p><span class="fr">Récit</span> (#2229) refers to a narrative or account of events and emphasizes the act of telling or reporting. It can be fictional or non-fictional and often provides more detail about situations or actions.</p>
      <div class="examples">
        <div class="fr">Le récit de son voyage en Asie était captivant et plein de détails.</div>
        <div class="de spoiler">The account of his trip through Asia was captivating and full of details.</div>
        <div class="fr">Le témoignage qu'elle a donné au procès constituait un récit poignant et sincère des événements.</div>
        <div class="de spoiler">Her testimony in court was a gripping and truthful account of the events.</div>
      </div>
      <p><span class="fr">Conte</span> It typically has a clear structure with a beginning, middle and end and often conveys a moral message. <b>Contes</b> They're especially popular as good-night stories for kids.</p>
      <div class="examples">
        <div class="fr">Le Petit Chaperon Rouge est un conte populaire pour enfants.</div>
        <div class="de spoiler">Little Red Riding Hood is a popular children's fairy tale.</div>
        <div class="fr">Il inventait un conte chaque soir pour endormir ses enfants.</div>
        <div class="de spoiler">He invented a fairy tale every night to put his children to sleep.</div>
      </div>
    </div>
