  Sophie has written a satirical fairy tale about the dependence on social media.

  Le nouveau film est basé sur un ancien *conte* oriental.
  The new film is based on an old oriental fairy tale.

  Ce *conte* réaliste aborde des thèmes sociaux importants.
  This realistic fairy tale deals with important social issues.

  Les illustrations de ce *conte* pour enfants sont magnifiques.
  The illustrations in this children's *fairy* tale are beautiful.

