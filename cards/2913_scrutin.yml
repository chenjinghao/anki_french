  Le Conseil constitutionnel a validé les résultats du *scrutin* législatif.
  The Constitutional Council has confirmed the results of the parliamentary elections.

  L'introduction du vote électronique a modifié l'organisation du *scrutin*.
  The introduction of electronic voting has changed the voting process.

