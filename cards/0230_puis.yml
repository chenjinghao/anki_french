Rang: 230
Wort: puis
Wortart: adv

# Feel free to improve these fields!
Wort mit Artikel: puis
Femininum / Plural: ''
IPA: \pɥi\
Definition: and then
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Elle a tenté de me tuer, *puis* elle m'a chassée.
  She tried to kill me, then she kicked me out.

  Il leur a parlé pendant une heure, *puis* il est parti sans dire au revoir.
  He talked to them for an hour, then left without saying goodbye.

  "Et *puis* après, si je suis en retard ?"
  "*And then* what if I'm late?"

  On va d'abord à Paris, *puis* à Londres, et enfin à Berlin.
  We're going to Paris first, then London, and finally Berlin.

  Elle a préparé le repas, *puis* elle a mis la table.
  She prepared the meal, *and then* she set the table.

  "Et *puis* quoi encore !? Tu veux que je fasse tout le travail ?"
  "What else do you want me to do?"

  J'ai lu le livre, et *puis* je l'ai prêté à Marie.
  I read the book, *and then* I lent it to Marie.

  Il y avait Pierre, Jean, et *puis* Sophie qui est arrivée en dernier.
  There was Pierre, Jean, *and then* Sophie who arrived last.

  Je n'aime pas ce film, et *puis* il est trop long.
  I don't like this movie, and it's too long.

  Le guide nous a montré le musée, *puis* le jardin botanique.
  The guide showed us the museum *and then* the botanical garden.

  Ajoutez le sel, *puis* le poivre selon votre goût.
  Add salt, then pepper as you like.

  Elle est devenue pâle, *puis* rouge de colère.
  She turned pale, then red with anger.

  "Et *puis*, qu'est-ce que tu en penses ?"
  "*And then*, what do you think?"

  Je vais faire mes devoirs, *puis* je pourrai jouer.
  I'll do my homework, then I can play.

  Il a hésité, *puis* il a accepté l'offre.
  He hesitated, *and then* he accepted the offer.

  D'abord la théorie, *puis* la pratique.
  First theory, then practice.

  "Je ne peux pas venir, et *puis* c'est tout !"
  "I can't come, *and then* that's it!"

  On traverse la rivière, *puis* on tourne à droite.
  We cross the river, then turn right.

  Nous visiterons la cathédrale, *puis* nous irons déjeuner.
  We'll visit the cathedral, then we'll have lunch.

  Elle m'a regardé, *puis* elle a souri.
  She looked at me, then she smiled.

