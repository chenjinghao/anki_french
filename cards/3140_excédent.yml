    <div class="section-content">
      <p><span class="fr">Surplus</span> means <span class="de">"Excess"</span> (#3104) and is often used in the economic context. It denotes a quantity that goes beyond what is necessary or expected.</p>
      <div class="examples">
        <div class="fr">Le surplus de production sera vendu à l'étranger.</div>
        <div class="de spoiler">The production surplus will be sold abroad.</div>
        <div class="fr">Il y a un surplus de personnel dans cette entreprise.</div>
        <div class="de spoiler">There is a surplus of staff in this company.</div>
      </div>
      <p><span class="fr">Excédent</span> means ebenfalls <span class="de">"Excess"</span>However, it is used more technically and formally, especially in accounting and administration. It describes the exact difference between two values.</p>
      <div class="examples">
        <div class="fr">L'excédent budgétaire atteint 2 millions d'euros.</div>
        <div class="de spoiler">The budget surplus is 2 million euros.</div>
