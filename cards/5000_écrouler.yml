        <div class="de spoiler">The roof collapsed under the weight of the snow.</div>
        <div class="fr">L'économie du pays s'est effondrée en quelques mois.</div>
        <div class="de spoiler">The country's economy has collapsed in a few months.</div>
        <div class="fr">Elle s'est effondrée en larmes en apprenant la nouvelle.</div>
        <div class="de spoiler">She burst into tears when she heard the news.</div>
      </div>
      <p><span class="fr">S'écrouler</span> means ebenfalls <span class="de">"to collapse"</span> or <span class="de">"falling down"</span>However, it is mainly used for physical structures and emphasizes more the aspect of fall or fall.</p>
      <div class="examples">
        <div class="fr">Le vieux mur s'est écroulé pendant la tempête.</div>
        <div class="de spoiler">The old wall collapsed during the storm.</div>
        <div class="fr">Il s'est écroulé de fatigue après sa longue journée de travail.</div>
        <div class="de spoiler">He collapsed from exhaustion after his long working day.</div>
      </div>
      <p>Both verbs describe a breakdown, but <span class="fr">s'effondrer</span> has a wider application and is more frequently used for abstract concepts, while <span class="fr">s'écrouler</span> traditionally reserved for concrete, physical collisions.</p>
