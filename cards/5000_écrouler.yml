    <div class="section-title"><i>effondrer</i> and <i>écrouler</i></div>
    <div class="section-content">
      <p><span class="fr">S'effondrer</span> means <span class="de">"zusammenbrechen"</span> or <span class="de">"falling down"</span> and can be used for both physical structures and abstract concepts. It often implies a sudden or dramatic collapse.</p>
