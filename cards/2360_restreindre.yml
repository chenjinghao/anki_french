Notiz: |-
  <div class="section">
    <div class="section-title"><i>limiter</i> and <i>restreindre</i></div>
    <div class="section-content">
      <p><span class="fr">Limiter</span> #883 means <span class="de">'restricted'</span> or <span class="de">'restrictions'</span>It is used to set a boundary or to define the scope of something, both physically and figuratively.</p>
      <div class="examples">
        <div class="fr">Nous devons limiter l'accès à cette zone pour des raisons de sécurité.</div>
        <div class="de spoiler">We need to restrict access to this area for security reasons.</div>
        <div class="fr">Je cherche à limiter mes dépenses ce mois-ci.</div>
        <div class="de spoiler">I'm trying to limit my expenses this month.</div>
      </div>
      <p><span class="fr">Restreindre</span> means <span class="de">'restrictions'</span> or <span class="de">'restrictions'</span> It often implies a stronger restriction than the <span class="fr">limiter</span> and may indicate a reduction in the usual or previously available.</p>
      <div class="examples">
        <div class="fr">Le gouvernement a restreint les droits de certaines organisations.</div>
        <div class="de spoiler">The government has restricted the rights of certain organizations.</div>
        <div class="fr">Restreindre sa consommation d'alcool peut être bénéfique pour la santé.</div>
        <div class="de spoiler">Limiting alcohol consumption can be health-promoting.</div>
      </div>
    </div>
  </div>
