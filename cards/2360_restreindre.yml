# Feel free to improve these fields!
Wort mit Artikel: restreindre
Femininum / Plural: ''
IPA: \ʁɛs.tʁɛ̃dʁ\
Definition: limit, limit
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Il a *restreint* les travaux du comité à trois jours.
  It has *limited* the work of the Committee to three days.

  Le gouvernement a décidé de *restreindre* l'accès aux plages pendant la canicule.
  The government has decided to restrict access to the beaches during the heat wave.

  Nous devons *restreindre* notre consommation d'eau pendant la sécheresse.
  We must *limit* our water consumption during the drought.

  L'entreprise a dû *restreindre* sa production en raison de la pénurie de matières premières.
  The company had to *reduce* its production due to the shortage of raw materials.

  Il faut *restreindre* nos ambitions à ce qui est réalisable.
  We need to get our ambitions back to what's possible.

  "Je vais devoir me *restreindre* sur les sorties ce mois-ci."
  "I'll have to *limit* myself at the exits this month."

  Ils se sont *restreints* dans leurs dépenses pour pouvoir économiser.
  They have restricted their spending to save.

  Le champ d'action de l'association s'est *restreint* au fil des années.
  The club's scope for action has *narrowed* over the years.

  La production de l'usine s'est considérablement *restreinte* depuis l'année dernière.
  Production of the plant has declined significantly since last year.

  Le sens de ce mot s'est *restreint* avec le temps.
  The meaning of this word was *limited* over time.

  Nous devons *restreindre* nos dépenses pour équilibrer le budget.
  We must *reduce* our expenditure to balance the budget.

  Le directeur a décidé de *restreindre* les horaires d'ouverture du magasin.
  The managing director has decided to *shorten* the opening hours of the shop.

  Les nouvelles règles *restreignent* considérablement la liberté de la presse.
  The new rules significantly restrict freedom of the press.

  Il faut *restreindre* l'utilisation des pesticides pour protéger l'environnement.
  The use of pesticides must be restricted to protect the environment.

  La pandémie a *restreint* nos possibilités de voyage.
  The pandemic has restricted our travel options.

  Le médecin lui a conseillé de *restreindre* sa consommation de sel.
  The doctor advised him to *reduce* his salt consumption.

  Les parents ont dû *restreindre* le temps d'écran de leurs enfants.
  Parents had to *limit* their children's screen time.

  L'inflation nous oblige à nous *restreindre* dans nos achats quotidiens.
  Inflation forces us to restrict our daily purchases.

  Le comité a décidé de *restreindre* l'accès à cette information confidentielle.
  The Committee has decided to restrict access to this confidential information.

  Les autorités ont *restreint* la circulation dans le centre-ville pendant le festival.
  The authorities have restricted traffic in the city centre during the festival.

  La nouvelle loi *restreint* le droit de manifester dans certains lieux publics.
  The new law restricts the right to demonstrate in certain public places.

  L'entreprise a dû *restreindre* ses effectifs en raison de difficultés économiques.
  The company had to *reduce* its workforce due to economic difficulties.

  Il faut *restreindre* l'usage des antibiotiques pour éviter les résistances bactériennes.
  The use of antibiotics must be restricted in order to avoid bacterial resistance.

  Le juge a décidé de *restreindre* les droits de visite du parent non gardien.
  The judge has decided to restrict the rights of the non-carried parent to visit.

