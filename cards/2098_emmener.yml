Notiz: |-
  <div class="section">
    <div class="section-title"><i>emmener</i> and <i>amener</i></div>
    <div class="section-content">
      <p><span class="fr">Emmener</span> means <span class="de">"mitnehmen"</span> or <span class="de">"wegbringen"</span>. The focus is on starting or leaving a place.</p>
      <div class="examples">
        <div class="fr">C'est l'heure de partir. Allez ! Je t'emmène maintenant.</div>
        <div class="de spoiler">It's time to go.</div>
        <div class="fr">Quand je voyage, j'emmène toujours mon chien avec moi !</div>
        <div class="de spoiler">When I travel, I always take my dog with me!</div>
      </div>
      <p><span class="fr">Amener</span> (#655) means <span class="de">"hinbringen"</span> or <span class="de">"herbeibringen"</span>. The focus is on the destination or arrival.</p>
      <div class="examples">
        <div class="fr">Je peux t'amener à l'aéroport si tu veux !</div>
        <div class="de spoiler">I can take you to the airport if you want!</div>
        <div class="fr">Amène ton petit chat quand tu viendras. Les enfants l'adorent !</div>
        <div class="de spoiler">Bring your little cat with you when you come.</div>
      </div>
      <p>Both verbs can be used colloquially for objects, although this is considered informal.</p>
      <p class="tip">Merkhilfe: <span class="fr">Amener</span> begins with A as arrival.</p>
    </div>
  </div>
  <!-- Grammar automatically added -->
