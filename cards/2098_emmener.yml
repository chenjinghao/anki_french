# Feel free to improve these fields!
Wort mit Artikel: emmener
Femininum / Plural: ''
IPA: \ɑ̃.mə.ne\
Definition: 'Take [someone] away, take away'
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Maman et papa ont dû l'*emmener* à l'hôpital.
  Mom and Dad had to take him to the hospital.

  Je vais t'*emmener* au cinéma ce soir.
  I'll take you to the movies tonight.

  La police l'a *emmené* en prison après son arrestation.
  The police took him to prison after he was arrested.

  "Tu peux *emmener* ton chien avec toi, si tu veux."
  "You can take your dog with you if you want."

  Les terroristes ont *emmené* plusieurs otages.
  The terrorists have kidnapped several hostages.

  "Je pars au supermarché. Je vous *emmène* ?"
  "I'm going to the supermarket. Should I take you?"

  Elle a *emmené* ses enfants en vacances à la mer.
  She took her children on vacation to the sea.

  Le bus scolaire *emmène* les élèves tous les matins.
  *The* school bus takes the students to school every morning.

  Le capitaine a bien *emmené* son équipe vers la victoire.
  The captain has led his team well to victory.

  "*Emmène*-moi danser ce soir, s'il te plaît !"
  "*Take* me to dance tonight, please!"

  Les secouristes ont *emmené* les blessés à l'hôpital.
  The rescue forces have taken the injured to the hospital.

  J'ai dû *emmener* ma voiture au garage pour des réparations.
  I had to get my car to the garage for repair.

  Le train nous *emmènera* à Paris en seulement deux heures.
  The train will take us to Paris in just two hours.

  "Où m'*emmènes*-tu pour notre anniversaire ?"
  "Where are you taking me to our anniversary?"

  Les parents *emmènent* leurs enfants à l'école tous les jours.
  The parents take their children to school every day.

  Le guide touristique nous a *emmenés* visiter les monuments historiques.
  The guide took us to the historical sights.

  Après le divorce, elle a *emmené* les enfants vivre chez sa mère.
  After the divorce, she took the children to live with her mother.

  "Je t'*emmène* faire un tour en voiture ?"
  "Should I take you on a ride in the car?"

  Les astronautes *emmèneront* des équipements spéciaux sur la Lune.
  The astronauts will take special equipment to the moon.

  Le courant a *emmené* le bateau loin de la côte.
  The current drove the boat far away from the coast.

  "N'oublie pas d'*emmener* ton parapluie, il va pleuvoir."
  "Don't forget to take your umbrella, it'll rain."

  Son imagination l'*emmène* souvent dans des mondes fantastiques.
  His imagination often takes him to fantastic worlds.

  Les gendarmes ont dû *emmener* le suspect pour l'interroger.
  The police had to take the suspect away for interrogation.

