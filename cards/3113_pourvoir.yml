  <div class="section">
    <div class="section-title"><i>doter</i> and <i>pourvoir</i></div>
    <div class="section-content">
      <p><span class="fr">Doter</span> #1784) means <span class="de">'Equipment'</span> or <span class="de">"wrong"</span> And it's used when someone or something is equipped with something useful or valuable.</p>
      <div class="examples">
        <div class="fr">La nouvelle école a été dotée d'équipements informatiques modernes.</div>
        <div class="de spoiler">The new school was equipped with modern computer equipment.</div>
        <div class="fr">La nature l'a doté d'une intelligence remarquable.</div>
        <div class="de spoiler">Nature has endowed him with remarkable intelligence.</div>
      </div>
      <p><span class="fr">Pourvoir</span> means <span class="de">'supply'</span> or <span class="de">'occupied'</span> and refers to fulfilling a need or occupying a position.</p>
      <div class="examples">
        <div class="fr">Il faut pourvoir aux besoins des réfugiés.</div>
        <div class="de spoiler">You have to take care of the needs of the refugees.</div>
        <div class="fr">Le poste vacant a été pourvu rapidement.</div>
        <div class="de spoiler">The vacancy was quickly filled.</div>
      </div>
      <p>Both verbs refer to the provision of something, but <span class="fr">doter</span> emphasizes more on equipping with properties or resources, while <span class="fr">pourvoir</span> The Commission's proposal for a Council Directive on the approximation of the laws, regulations and administrative provisions of the Member States relating to the protection of individuals with regard to the processing of personal data and on the free movement of such data shall be adopted in accordance with the opinion of the Standing Committee on External Economic Relations.</p>
