Notiz: |-
  <div class="section">
    <div class="section-title"><i>doter</i> and <i>pourvoir</i></div>
    <div class="section-content">
      <p><span class="fr">Doter</span> (#1784) means <span class="de">"ausstatten"</span> or <span class="de">"versehen"</span> and is used when someone or something is equipped with something beneficial or valuable.</p>
      <div class="examples">
        <div class="fr">La nouvelle école a été dotée d'équipements informatiques modernes.</div>
        <div class="de spoiler">The new school was equipped with modern computer equipment.</div>
        <div class="fr">La nature l'a doté d'une intelligence remarquable.</div>
        <div class="de spoiler">Nature has endowed him with remarkable intelligence.</div>
      </div>
      <p><span class="fr">Pourvoir</span> means <span class="de">"versorgen"</span> or <span class="de">"besetzen"</span> and refers to meeting a requirement or occupying a position.</p>
      <div class="examples">
        <div class="fr">Il faut pourvoir aux besoins des réfugiés.</div>
        <div class="de spoiler">We must provide for the needs of the refugees.</div>
        <div class="fr">Le poste vacant a été pourvu rapidement.</div>
        <div class="de spoiler">The vacancy was quickly filled.</div>
      </div>
      <p>Both verbs refer to the provision of something, but <span class="fr">doter</span> emphasizes more the equipment with features or resources, while <span class="fr">pourvoir</span> more stressing the aspect of care or employment.</p>
    </div>
  </div>
