Wort mit Artikel: quelques-uns
Femininum / Plural: quelques-unes
IPA: \kɛl.kœ̃\
Definition: some, a few
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
