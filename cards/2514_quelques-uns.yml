Notiz: |-
  <div class="section">
    <div class="section-title"><i>quelque(s)</i> and <i>quelques-un(e)s</i></div>
    <div class="section-content">
      <p><span class="fr">Quelque(s)</span> is an indeterminate article that <span class="de">"einige"</span> or <span class="de">"A few"</span> It is always connected to a nominal phrase:</p>
      <div class="examples">
        <div class="fr">J'ai bien <u>quelques</u> idées, mais...</div>
        <div class="de spoiler">I've got some ideas, but...</div>
        <div class="fr">Je suis parti en vacances avec <u>quelques</u> amies.</div>
        <div class="de spoiler">I went on vacation with some friends.</div>
      </div>
      <p><span class="fr">Quelques-un(e)s</span> is an indefinite pronoun. It stands alone, instead of a nominal phrase, and can refer to both the inanimate and the inanimate:</p>
      <div class="examples">
        <div class="fr">Il y en a toujours <u>quelques-uns</u> qui n'ont pas d'appétit.</div>
        <div class="de spoiler">There are always some who have no appetite.</div>
        <div class="fr">Des voitures sans plaques ? J'en ai vu <u>quelques-unes</u>, mais pas tant que ça.</div>
        <div class="de spoiler">I've seen some cars, but not so many.</div>
      </div>
      <p>The singular shape is <span class="fr">quelqu'un</span>, which can only be used for humans. Otherwise you simply use <span class="fr">un(e)</span>.</p>
      <p class="tip"><span class="fr">Chaque</span> and <span class="fr">chacun</span>, sowie <span class="fr">mon</span> and <span class="fr">le mien</span> (and the other possessive pronouns) have a similar relationship to each other.</p>
    </div>
  </div>
  <!-- Grammar automatically added -->
