Notiz: |-
  <div class="section">
    <div class="section-title"><i>quelque(s)</i> and <i>Some of them</i></div>
    <div class="section-content">
      <p><span class="fr">Quelque(s)</span> is an indefinite article with <span class="de">"some"</span> or <span class="de">"a few"</span> It's always associated with a nominal phrase:</p>
      <div class="examples">
        <div class="fr">J'ai bien <u>quelques</u> idées, mais...</div>
        <div class="de spoiler">I already have some ideas, but...</div>
        <div class="fr">Je suis parti en vacances avec <u>quelques</u> amies.</div>
        <div class="de spoiler">I went on vacation with some girlfriends.</div>
      </div>
      <p><span class="fr">Quelques-un(e)s</span> is an indefinite pronoun. It stands alone, instead of a nominal phrase, and can refer to both living and non-living:</p>
      <div class="examples">
        <div class="fr">Il y en a toujours <u>quelques-uns</u> qui n'ont pas d'appétit.</div>
        <div class="de spoiler">There are always some who don't have an appetite.</div>
        <div class="fr">Des voitures sans plaques ? J'en ai vu <u>quelques-unes</u>, mais pas tant que ça.</div>
        <div class="de spoiler">I've seen some, but not so many.</div>
      </div>
      <p>The singular form is <span class="fr">quelqu'un</span>But it can only be used for humans. <span class="fr">un(e)</span>.</p>
      <p class="tip"><span class="fr">Chaque</span> and <span class="fr">chacun</span>, and <span class="fr">mon</span> and <span class="fr">le mien</span> (and the other possessive pronouns) have a similar relationship to each other.</p>
    </div>
  </div>
