Notiz: |-
  <div class="section">
    <div class="section-title"><i>joindre</i> and <i>rejoindre</i></div>
    <div class="section-content">
      <p><span class="fr">Joindre</span> means connecting two things, getting them to touch, communicate or interact.</p>
      <div class="examples">
        <div class="fr">Joindre les deux bouts.</div>
        <div class="de spoiler">We'll make it through.</div>
        <div class="fr">Joindre l'utile à l'agréable.</div>
        <div class="de spoiler">Connect the useful to the pleasant.</div>
      </div>
      <p><span class="fr">Rejoindre</span> (#1007) means either reconnecting things that were previously separated or moving towards something and reaching it.</p>
      <p>The meaning is sometimes the same:</p>
      <div class="examples">
        <div class="fr">Venez nous rejoindre!</div>
        <div class="de spoiler">Come and join us!</div>
        <div class="fr">Venez vous joindre à nous!</div>
        <div class="de spoiler">Come and join us!</div>
      </div>
      <p>Sometimes, however, it is clearly different:</p>
      <div class="examples">
        <div class="fr">Je n'ai pas réussi à le joindre.</div>(because he didn't answer the phone)
        <div class="de spoiler">I couldn't reach him.</div>
        <div class="fr">Je n'ai pas réussi à le rejoindre.</div>(because I was too slow)
        <div class="de spoiler">I couldn't reach him.</div>
      </div>
    </div>
  </div>
