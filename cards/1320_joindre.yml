  <div class="section">
    <div class="section-title"><i>joindre</i> and <i>rejoindre</i></div>
    <div class="section-content">
      <p><span class="fr">Joindre</span> It means connecting two things, making them touch, communicate, or collaborate.</p>
      <div class="examples">
        <div class="fr">Joindre les deux bouts.</div>
        <div class="de spoiler">Get through the rounds.</div>
        <div class="fr">Joindre l'utile à l'agréable.</div>
        <div class="de spoiler">To combine the useful with the pleasant.</div>
      </div>
      <p><span class="fr">Rejoindre</span> (#1007) means either to reconnect things that were previously separated, or to move on to something and achieve it.</p>
      <p>Sometimes the meaning is the same:</p>
      <div class="examples">
        <div class="fr">Venez nous rejoindre!</div>
        <div class="de spoiler">Come and join us!</div>
        <div class="fr">Venez vous joindre à nous!</div>
        <div class="de spoiler">Come and join us!</div>
      </div>
      <p>But sometimes it is quite different:</p>
      <div class="examples">
        <div class="fr">Je n'ai pas réussi à le joindre.</div>(because he didn't answer the phone)
