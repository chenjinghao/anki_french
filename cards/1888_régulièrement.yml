Wort mit Artikel: régulièrement
Femininum / Plural: ''
IPA: \ʁe.ɡy.ljɛʁ.mɑ̃\
Definition: regular, time and time again
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
