Notiz: |-
  <div class="section">
    <div class="section-title"><i>essai</i> and <i>tentative</i></div>
    <div class="section-content">
      <p><b>Essai</b> emphasizes the systematic or methodical nature of an experiment, often in a controlled or planned context, e.g. "essai scientifique" (scientific experiment).</p>
      <p><b>Tentative</b> (#1381) emphasizes the effort or effort to achieve a goal, especially when that goal is difficult or uncertain, e.g. "tentative dévasion".</p>
    </div>
  </div>
