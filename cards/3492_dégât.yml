Notiz: |-
  <div class="section">
    <div class="section-title"><i>dégât</i> and <i>dommage</i></div>
    <div class="section-content">
      <p><span class="fr">Dégât</span> means <span class="de">"Schaden"</span> or <span class="de">Damage</span> in the sense of a concrete, often visible damage. It is often used for material damage.</p>
      <div class="examples">
        <div class="fr">La tempête a causé d'importants dégâts sur la côte.</div>
        <div class="de spoiler">The storm has caused considerable damage to the coast.</div>
        <div class="fr">L'inondation a provoqué des dégâts dans toute la maison.</div>
        <div class="de spoiler">The flood has caused damage throughout the house.</div>
      </div>
      <p><span class="fr">Dommage</span> (#1156) means ebenfalls <span class="de">"Schaden"</span>However, it has a wider scope. It can relate to material, moral or intangible damage and is often used in the legal context.</p>
      <div class="examples">
        <div class="fr">Il réclame des dommages et intérêts pour le préjudice subi.</div>
        <div class="de spoiler">He claims compensation for the damage suffered.</div>
        <div class="fr">La pollution cause des dommages à l'environnement.</div>
        <div class="de spoiler">The pollution causes damage to the environment.</div>
      </div>
      <p><span class="fr">Dommage</span> can also be used as an exclamation <span class="de">"schade!"</span> are used to express regret.</p>
      <div class="examples">
        <div class="fr">Dommage que tu ne puisses pas venir à la fête.</div>
        <div class="de spoiler">Too bad you can't come to the party.</div>
      </div>
    </div>
  </div>
