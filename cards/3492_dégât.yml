Notiz: |-
  <div class="section">
    <div class="section-title"><i>dégât</i> and <i>dommage</i></div>
    <div class="section-content">
      <p><span class="fr">Dégât</span> means <span class="de">"Damages"</span> or <span class="de">'Damages'</span> In the sense of concrete, often visible damage, it is often used for material damage.</p>
      <div class="examples">
        <div class="fr">La tempête a causé d'importants dégâts sur la côte.</div>
        <div class="de spoiler">The storm caused considerable damage on the coast.</div>
        <div class="fr">L'inondation a provoqué des dégâts dans toute la maison.</div>
        <div class="de spoiler">The flood damaged the entire house.</div>
      </div>
      <p><span class="fr">Dommage</span> (#1156) also means <span class="de">"Damages"</span>It can refer to material, moral or intangible damage and is often used in a legal context.</p>
      <div class="examples">
        <div class="fr">Il réclame des dommages et intérêts pour le préjudice subi.</div>
        <div class="de spoiler">He demands compensation for the damage suffered.</div>
        <div class="fr">La pollution cause des dommages à l'environnement.</div>
        <div class="de spoiler">Pollution causes damage to the environment.</div>
      </div>
      <p><span class="fr">Dommage</span> Can also be used as an exclamation point <span class="de">"It's too bad!"</span> I think it's a good idea to use it as a way of expressing regret.</p>
      <div class="examples">
        <div class="fr">Dommage que tu ne puisses pas venir à la fête.</div>
        <div class="de spoiler">It's too bad you can't come to the party.</div>
      </div>
    </div>
  </div>
