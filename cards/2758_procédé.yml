Notiz: |-
  <div class="section">
    <div class="section-title"><i>processus</i>, <i>procédure</i> and <i>procédé</i></div>
    <div class="section-content">
      <p>These three terms have a common meaning of ‘method' but differ in their specific use:</p>

      <p><span class="fr">Processus</span> (#689) refers to a sequence of operations or a series of organized, consecutive operations aimed at a specific result.</p>
      <div class="examples">
        <div class="fr">J'ai écouté un reportage qui expliquait le processus de croissance économique.</div>
        <div class="de spoiler">I heard a report explaining the process of economic growth.</div>
      </div>

      <p><span class="fr">Procédure</span> (#993) describes a series of formalities or steps that must be followed, or a set of rules that must be observed in a particular situation.</p>
      <div class="examples">
        <div class="fr">La pilote a suivi scrupuleusement la procédure d'atterrissage que lui a indiquée la tour de contrôle.</div>
        <div class="de spoiler">The pilot carefully followed the landing procedure given to her by the control tower.</div>
      </div>

      <p><span class="fr">Procédé</span> (#2758) is a method used to obtain a certain result.</p>
      <div class="examples">
        <div class="fr">Cette entreprise québécoise a mis au point d'intéressants procédés d'extrusion.</div>
        <div class="de spoiler">This Quebec company has developed interesting extrusion methods.</div>
      </div>

      <p>To sum up, we can say: <span class="fr">procédé</span> is an applied method, a <span class="fr">processus</span> a sequence of operations, and a <span class="fr">procédure</span> a set of rules to achieve a specific objective.</p>
    </div>
  </div>
