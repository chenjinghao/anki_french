Notiz: |-
  <div class="section">
    <div class="section-title"><i>d'après</i> and <i>selon</i></div>
    <div class="section-content">
      <p><span class="fr">D'après</span> means <span class="de">"after"</span> or <span class="de">"Loudly"</span> and is used to specify a source or basis for an information. It often points to an external source.</p>
      <div class="examples">
        <div class="fr">D'après le journal, il va pleuvoir demain.</div>
        <div class="de spoiler">According to the paper, it will rain tomorrow.</div>
        <div class="fr">D'après mon médecin, je dois me reposer.</div>
        <div class="de spoiler">According to my doctor, I need to rest.</div>
      </div>
      <p><span class="fr">Selon</span> (#240) also means <span class="de">"after"</span> or <span class="de">"Loudly"</span>However, it is more commonly used for opinions, points of view or principles. <span class="de">"depending on"</span> What do you mean?</p>
      <div class="examples">
        <div class="fr">Selon moi, cette décision est correcte.</div>
        <div class="de spoiler">In my opinion, this is the right decision.</div>
        <div class="fr">Les prix varient selon la qualité.</div>
        <div class="de spoiler">Prices vary depending on the quality.</div>
      </div>
      <p>Both prepositions can often be used interchangeably, but <span class="fr">d'après</span> It refers more to specific sources or statements, whereas <span class="fr">selon</span> It is more versatile and is also used for variations or personal views.</p>
    </div>
  </div>
