Notiz: |-
  <div class="section">
    <div class="section-title"><i>d'après</i> and <i>selon</i></div>
    <div class="section-content">
      <p><span class="fr">D'après</span> means <span class="de">"after"</span> or <span class="de">"laut"</span> and is used to provide a source or basis for an information. It often points to an external source.</p>
      <div class="examples">
        <div class="fr">D'après le journal, il va pleuvoir demain.</div>
        <div class="de spoiler">The paper says it'll rain tomorrow.</div>
        <div class="fr">D'après mon médecin, je dois me reposer.</div>
        <div class="de spoiler">According to my doctor, I have to rest.</div>
      </div>
      <p><span class="fr">Selon</span> (#240) means ebenfalls <span class="de">"after"</span> or <span class="de">"laut"</span>However, it is more often used for opinions, positions or principles. <span class="de">"Depending on"</span> bedeuten.</p>
      <div class="examples">
        <div class="fr">Selon moi, cette décision est correcte.</div>
        <div class="de spoiler">In my opinion, this decision is right.</div>
        <div class="fr">Les prix varient selon la qualité.</div>
        <div class="de spoiler">Prices vary according to quality.</div>
      </div>
      <p>Both prepositions can often be used interchangeably, but <span class="fr">d'après</span> refers more to concrete sources or statements, while <span class="fr">selon</span> is more versatile and is also used for variations or personal views.</p>
    </div>
  </div>
