Notiz: |-
  <div class="section">
    <div class="section-title"><i>demeure</i>, <i>maison</i>, <i>domicile</i> and <i>résidence</i></div>
    <div class="section-content">
      <p>These four French terms refer to all residences, but are used in different contexts.</p>

      <p><span class="fr">Demeure</span> means <span class="de">"House of residence"</span> It can also refer to an important building.</p>
      <div class="examples">
        <div class="fr">Elle a choisi d'établir sa demeure en Outaouais.</div>
        <div class="de spoiler">She has decided to establish her residence in Outaouais.</div>
        <div class="fr">Cette vieille demeure est aussi vaste qu'un château.</div>
        <div class="de spoiler">This old estate is as extensive as a castle.</div>
      </div>

      <p><span class="fr">Maison</span> #325) means <span class="de">"House"</span> and more specifically refers to a building or part of a building that serves as an apartment, often for a family.</p>
      <div class="examples">
        <div class="fr">Nancie possède une magnifique maison centenaire au toit mansardé.</div>
        <div class="de spoiler">Nancie owns a beautiful 100-year-old house with a mansard roof.</div>
        <div class="fr">Les maisons en rangée sont très populaires auprès des jeunes acheteurs.</div>
        <div class="de spoiler">Row houses are very popular with young buyers.</div>
      </div>

      <p><span class="fr">Domicile</span> #2434) means <span class="de">'Residency'</span> and refers, from a legal point of view, to a single, fixed, official and lawful place of residence.</p>
      <div class="examples">
        <div class="fr">Le domicile de Marie-Anne se situe à Québec; elle pourra donc voter aux élections municipales de cette ville.</div>
        <div class="de spoiler">Marie-Anne's place of residence is in Québec, so she can take part in local elections in that city.</div>
        <div class="fr">Alain a élu domicile rue Saint-Jean.</div>
        <div class="de spoiler">Alain has chosen his residence in St. Jean Street.</div>
      </div>

      <p><span class="fr">Résidence</span> #3524) means <span class="de">'Residence'</span> or <span class="de">'Residency'</span> And it can be any place where you live for a certain period of time. You can have multiple residences.</p>
      <div class="examples">
        <div class="fr">Ta résidence secondaire se situe-t-elle près d'un lac?</div>
        <div class="de spoiler">Is your second home near a lake?</div>
        <div class="fr">Il est propriétaire d'une somptueuse résidence d'été où il se rend quelques semaines chaque année.</div>
        <div class="de spoiler">He owns a magnificent summer residence that he visits every year for a few weeks.</div>
      </div>
    </div>
  </div>
