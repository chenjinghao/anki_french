Rang: 1750
Wort: sûrement
Wortart: adv

# Feel free to improve these fields!
Wort mit Artikel: sûrement
Femininum / Plural: ''
IPA: \syʁ.mɑ̃\
Definition: certainly, certainly
Register: ↘nonfiction

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Quelqu'un a *sûrement* besoin d'aide.
  Somebody's gonna need help.

  Il va *sûrement* pleuvoir ce soir.
  It'll rain for sure tonight.

  Je ne peux pas venir maintenant, mais je viendrai demain, *sûrement*.
  I can't come now, but I'll be there tomorrow.

  – "As-tu fait tes devoirs ?"<br>– "*Sûrement* pas !"
  – "Did you do your homework?"<br>– "*Sure* not!"

  Pour réussir son examen, il faut avancer lentement mais *sûrement*.
  In order to pass the test, you have to move slowly but surely.

  Le guide nous a conduits *sûrement* à travers les montagnes.
  The guide certainly led us through the mountains.

  *Sûrement*, il y a une explication logique à tout cela.
  Surely there is a logical explanation for this.

  – "Tu veux venir avec nous ?"<br>– "Oui, *sûrement* !"
  – "Do you want to come with us?"<br>– "Yes, *certainly*!"

  La voiture roule *sûrement* sur l'autoroute.
  The car's safely on the highway.

  Elle est *sûrement* en retard à cause des embouteillages.
  She's probably late for traffic jams.

  L'argent sera *sûrement* investi dans ce projet.
  The money will surely be invested in this project.

  Cette histoire s'est *sûrement* passée comme elle l'a racontée.
  This story has *certainly* happened as it was told.

  Les enfants sont *sûrement* déjà rentrés de l'école.
  The kids must be back from school.

  Il a *sûrement* oublié notre rendez-vous.
  I'm sure he forgot our meeting.

  Le médecin pourra *sûrement* vous recevoir demain matin.
  The doctor can *certainly* see you in the morning.

  Marie va *sûrement* nous aider avec ce problème.
  I'm sure Marie will help us with this problem.

