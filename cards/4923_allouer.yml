Notiz: |-
  <div class="section">
    <div class="section-title"><i>octroyer</i> and <i>allouer</i></div>
    <div class="section-content">
      <p><span class="fr">Octroyer</span> (#4232) means <span class="de">'value' means the value of the underlying asset;</span> or <span class="de">'approved'</span> and is used when an authority or institution officially admits or grants something, often as a favor or privilege.</p>
      <div class="examples">
        <div class="fr">Le roi a octroyé une charte à la ville.</div>
        <div class="de spoiler">The king has granted the city a charter.</div>
        <div class="fr">L'université lui a octroyé un doctorat honorifique.</div>
        <div class="de spoiler">The university awarded him an honorary doctorate.</div>
      </div>
      <p><span class="fr">Allouer</span> means <span class="de">'sharing'</span> or <span class="de">'approved'</span> and refers to the allocation of resources, resources or time according to specific criteria or needs.</p>
      <div class="examples">
        <div class="fr">Le gouvernement a alloué un budget considérable à l'éducation.</div>
        <div class="de spoiler">The government has allocated a considerable budget to education.</div>
        <div class="fr">Il faut allouer plus de temps à cette tâche importante.</div>
        <div class="de spoiler">You have to give more time to this important task.</div>
      </div>
      <p><span class="fr">Octroyer</span> has a more solemn connotation and often implies an authority that grants something special while <span class="fr">allouer</span> It is more neutral and focuses on the practical distribution of resources.</p>
