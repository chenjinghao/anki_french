Wort mit Artikel: allouer
Femininum / Plural: ''
IPA: \a.lwe\
Definition: Assignment, grant
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Cinq minutes sont *allouées* pour deux questions.
  There are two questions that are scheduled for five minutes.

  Le gouvernement a *alloué* des fonds supplémentaires pour la recherche scientifique.
  The government has granted additional funding for scientific research.

  On lui a *alloué* un délai supplémentaire pour finir son travail.
  She was given an additional deadline to finish her work.

  La banque nous a *alloué* un crédit pour acheter notre maison.
  The bank gave us a loan to buy our house.

  Le temps *alloué* à cet exercice est de trente minutes.
  The time required for this exercise is thirty minutes.

  L'entreprise *alloue* une prime de Noël à tous ses employés.
  The company grants all employees a Christmas money.

  Combien de temps sera *alloué* à chaque présentation ?
  How much time is given for each talk?

  Le conseil municipal a *alloué* un budget pour rénover l'école.
  The city council has *approved* a budget for the renovation of the school.

  Une bourse d'études lui a été *allouée* par l'université.
  The university has *granted* her a scholarship.

  Le département informatique s'est vu *allouer* de nouveaux ordinateurs.
  New computers have been assigned to the IT department.

  La subvention *allouée* au projet culturel a été augmentée.
  *The* grant granted for the cultural project has been increased.

  Le jury *alloue* trois minutes à chaque candidat pour se présenter.
  The jury will give each candidate three minutes to introduce themselves.

  Une aide financière sera *allouée* aux familles dans le besoin.
  The needy families are provided with financial assistance.

  L'association s'est fait *allouer* des locaux par la mairie.
  The association has been assigned premises by the city administration.

  Le comité a *alloué* des ressources supplémentaires au projet.
  The committee has *allocated* additional resources to the project.

