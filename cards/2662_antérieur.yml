Beispielsätze: |-
  J'ai connu le système judiciaire *antérieur*.
  I've known the old justice system.

  L'époque *antérieure* à la Révolution française était marquée par la monarchie absolue.
  The period before the French Revolution was marked by absolute monarchy.

  Cette découverte est *antérieure* à 1900.
  This discovery was made before 1900.

  Les pattes *antérieures* du chat sont plus agiles que ses pattes postérieures.
  The cat's front legs are more agile than its hind legs.

  Pour comprendre le conflit actuel, il faut examiner les événements *antérieurs*.
  To understand the current conflict, we need to look back on past events.

  La face *antérieure* de l'omoplate est légèrement concave.
  The front of the omoplate is slightly concave.

  Les écrivains *antérieurs* au XIX<sup>e</sup> siècle avaient un style très différent.
  Writers before the 19th century had a very different style.

  Dans la phrase "Quand j'eus fini, je partis", "j'eus fini" est au *passé antérieur*.
  In the phrase "When I'm done, I'm gone", "I'm done" is in the *past*.

  La partie *antérieure* de l'édifice a été rénovée récemment.
  The front part of the building was recently renovated.

  Les membres *antérieurs* des chevaux sont essentiels pour leur équilibre.
  The front limbs of horses are essential for their balance.

  Le contrat *antérieur* n'est plus valable depuis la signature du nouveau.
  The previous contract is no longer valid as of the signing of the new one.

  Les voyelles *antérieures* comme [i] et [e] sont produites à l'avant de la bouche.
  The previous vowels like [i] and [e] are produced at the front of the mouth.

  Il faut rétablir l'état de choses *antérieur* pour résoudre ce problème.
  We need to restore the previous state of affairs to resolve this problem.

  Les ligaments *antérieurs* du genou jouent un rôle crucial dans sa stabilité.
  The anterior ligaments of the knee play a crucial role in its stability.

  Dans une relation d'ordre, 3 est *antérieur* à 5.
  In an order relation, 3 is before 5.

  Le *futur antérieur* exprime une action qui sera terminée avant une autre dans le futur.
  An earlier future expresses an action that will be completed before another in the future.

  Les découvertes *antérieures* ont pavé la voie à cette percée scientifique.
  Previous discoveries paved the way for this scientific breakthrough.

  L'*antérieur* du cheval doit être bien développé pour une bonne performance.
  The front of the horse must be well developed for good performance.

  La partie *antérieure* du navire a subi le plus de dégâts lors de la collision.
  The front part of the ship suffered the most damage during the collision.

  Les bords *antérieurs* de la clavicule sont plus visibles chez les personnes minces.
  The anterior edges of the clavicle are more visible in thin people.

