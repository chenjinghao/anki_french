Notiz: |-
  <div class="section">
    <div class="section-title"><i>parfois</i> and <i>quelquefois</i></div>
    <div class="section-content">
      <p><span class="fr">Parfois</span> and <span class="fr">quelquefois</span> bedeuten beide <span class="de">"manchmal"</span> or <span class="de">"Somewhere"</span> and are in most cases interchangeable. However, there is a subtle difference in the nuance:</p>

      <p><span class="fr">Quelquefois</span> (literally: <span class="de">"einige Male"</span>) implies rather countable, discrete events.</p>
      <div class="examples">
        <div class="fr">Je vais <u>quelquefois</u> au cinéma, peut-être deux ou trois fois par mois.</div>
        <div class="de spoiler">I'm going <u>manchmal</u> to the cinema, maybe two or three times a month.</div>
      </div>

      <p><span class="fr">Parfois</span> (#410) indicates a vague, indeterminate or more continuous period.</p>
      <div class="examples">
        <div class="fr">Il est <u>parfois</u> difficile de se concentrer quand il fait chaud.</div>
        <div class="de spoiler">It's <u>manchmal</u> difficult to concentrate when it's hot.</div>
        <div class="fr">La vie est <u>parfois</u> compliquée.</div>
        <div class="de spoiler">Life is <u>manchmal</u> kompliziert.</div>
      </div>
    </div>
  </div>
