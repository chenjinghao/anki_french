Notiz: |-
  <div class="section">
    <div class="section-title"><i>parfois</i> and <i>quelquefois</i></div>
    <div class="section-content">
      <p><span class="fr">Parfois</span> and <span class="fr">quelquefois</span> meaning both <span class="de">"Sometimes"</span> or <span class="de">'occasionally'</span> But there's a subtle difference in nuance:</p>

      <p><span class="fr">Quelquefois</span> (literally: <span class="de">"a few times"</span>) implies more numerous, discrete events.</p>
      <div class="examples">
        <div class="fr">Je vais <u>quelquefois</u> au cinéma, peut-être deux ou trois fois par mois.</div>
        <div class="de spoiler">I 'm going . <u>Sometimes</u> to the movies, maybe two or three times a month.</div>
      </div>

      <p><span class="fr">Parfois</span> On the other hand, (#410) indicates a more vague, indefinite or continuous period.</p>
      <div class="examples">
        <div class="fr">Il est <u>parfois</u> difficile de se concentrer quand il fait chaud.</div>
        <div class="de spoiler">It 's ... <u>Sometimes</u> It's hard to concentrate when it's hot.</div>
        <div class="fr">La vie est <u>parfois</u> compliquée.</div>
        <div class="de spoiler">Life is <u>Sometimes</u> It's complicated.</div>
      </div>
    </div>
  </div>
