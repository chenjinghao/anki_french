Rang: 3170
Wort: quelquefois
Wortart: adv

# Feel free to improve these fields!
Wort mit Artikel: quelquefois
Femininum / Plural: ''
IPA: \kɛl.kə.fwa\
Definition: Sometimes, once in a while
Register: ↗Fiktion ↘Sachtext ↘Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  *Quelquefois* je pense qu'il a raison.
  *Sometimes* I think he's right.

  *Quelquefois*, en hiver, il neige même dans le sud de la France.
  *Sometimes*, in winter, it snows even in the south of France.

  Ma grand-mère vient nous voir *quelquefois* pendant les vacances.
  My grandmother comes to visit us *sometimes* during the holidays.

  Les trains peuvent *quelquefois* avoir du retard à cause du mauvais temps.
  Trains can *sometimes* be delayed because of bad weather.

  Julie arrive *quelquefois* en retard au bureau le lundi matin.
  Julie is *sometimes* late for the office on Monday mornings.

  *Quelquefois*, je préfère rester seul à la maison plutôt que de sortir.
  *Sometimes* I'd rather stay home alone than go out.

  As-tu *quelquefois* pensé à changer de travail ?
  Have you ever thought about changing jobs?

  Il fait *quelquefois* des erreurs, mais il apprend vite.
  He makes mistakes *sometimes*, but he learns quickly.

  *Quelquefois*, les solutions les plus simples sont les meilleures.
  *Sometimes* the simplest solutions are the best.

  Le chat dort sur le canapé *quelquefois*.
  *Sometimes* the cat sleeps on the couch.

  *Quelquefois*, je me demande ce que l'avenir nous réserve.
  *Sometimes* I wonder what the future holds for us.

  Les enfants sont *quelquefois* difficiles à comprendre.
  Children are *sometimes* hard to understand.

  *Quelquefois*, il suffit d'un sourire pour égayer toute une journée.
  *Sometimes* a smile is enough to make an entire day happy.

