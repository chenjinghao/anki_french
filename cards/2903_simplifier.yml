Notiz: |-
  <div class="section">
    <div class="section-title"><i>simplifier</i> and <i>faciliter</i></div>
    <div class="section-content">
      <p><span class="fr">Simplifier</span> means <span class="de">'simplify'</span> And it refers to the process of making something less complex or complicated by reducing or removing elements.</p>
      <div class="examples">
        <div class="fr">Le professeur a simplifié l'explication pour que les enfants comprennent.</div>
        <div class="de spoiler">The teacher simplified the explanation so that the children could understand.</div>
        <div class="fr">Cette application simplifie la gestion de vos finances.</div>
        <div class="de spoiler">This application simplifies the management of your finances.</div>
      </div>
      <p><span class="fr">Faciliter</span> #1813) means <span class="de">'Easy to use'</span> and refers to making something easier or more accessible without necessarily reducing its complexity.</p>
      <div class="examples">
        <div class="fr">Les nouvelles technologies facilitent la communication à distance.</div>
        <div class="de spoiler">New technologies facilitate communication over long distances.</div>
        <div class="fr">Un bon éclairage facilite la lecture.</div>
        <div class="de spoiler">Good lighting makes reading easier.</div>
      </div>
      <p>The main difference is that <span class="fr">simplifier</span> changes the structure or complexity of a matter, while <span class="fr">faciliter</span> facilitates access or execution without altering the nature of the matter itself.</p>
    </div>
  </div>
