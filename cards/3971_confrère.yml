Rang: 3971
Wort: confrère
Wortart: nm

# Feel free to improve these fields!
Wort mit Artikel: le confrère
Femininum / Plural: consœur
IPA: \kɔ̃.fʁɛʁ\
Definition: (occupational) colleague
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Mes *confrères* de classe ont bénéficié de ces bourses.
  My classmates have received these scholarships.

  J'ai recommandé à mon patient de consulter un *confrère* spécialiste.
  I recommended that my patient visit a peer.

  Les *confrères* de l'Académie ont voté à l'unanimité pour son admission.
  The *colleagues* of the Academy voted unanimously for his admission.

  Mon *confrère* en poésie m'a donné des conseils précieux sur mes vers.
  My poet *colleague* gave me valuable advice on my verses.

  Je souhaite la bienvenue à notre nouveau *confrère* dans notre cabinet médical.
  I welcome our new colleague to our doctor's office.

  Cher *confrère*, je vous prie d'agréer l'expression de mes sentiments distingués.
  My dear *colleague*, I remain with your kind regards.

  Les *confrères* de Saint-Vincent-de-Paul se réunissent chaque mardi.
  The confreres of the Saint Vincent community meet every Tuesday.

  Un avocat respecté par ses *confrères* prendra la défense de l'accusé.
  A lawyer respected by his *colleagues* will defend the defendant.

  Tous mes *confrères* journalistes ont couvert cet événement important.
  All my fellow journalists have reported on this important event.

  Le docteur Martin a transmis le dossier médical à son *confrère* de l'hôpital.
  Dr. Martin forwarded the medical records to his hospital colleague.

  Notre *confrère* de l'université donnera une conférence la semaine prochaine.
  Our university *colleague* will give a lecture next week.

  Les *confrères* du conseil de l'ordre ont examiné la plainte avec attention.
  The members of the Staff Committee have carefully examined the complaint.

  Je salue mes *confrères* artistes qui exposent leurs œuvres ce soir.
  I greet my fellow artists who are exhibiting their works tonight.

