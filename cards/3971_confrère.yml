Notiz: |-
  <div class="section">
    <div class="section-title"><i>collègue</i> and <i>confrère/consœur</i></div>
    <div class="section-content">
      <p><span class="fr">Collègue</span> (#1099) means a person who: <span class="de">"im gleichen Unternehmen arbeitet"</span> or <span class="de">"plays the same function"</span> It also refers to persons who perform similar activities.</p>
      <div class="examples">
        <div class="fr">Il mange avec ses collègues dans la salle des professeurs.</div>
        <div class="de spoiler">He eats in the teacher's room with his colleagues.</div>
        <div class="fr">Elle partage la même passion que ses collègues musiciens.</div>
        <div class="de spoiler">She shares the same passion as her fellow musicians.</div>
      </div>

      <p><span class="fr">Confrère</span> (male) and <span class="fr">consœur</span> (female) means persons who: <span class="de">"member of the same profession"</span> or <span class="de">"doing the same profession"</span>, especially in the case of professions such as doctors, lawyers, notaries, architects, pharmacists, writers or journalists. The term is also used for members of the same artistic, literary or scientific society.</p>
      <div class="examples">
        <div class="fr">Ma médecin m'a adressé à un de ses confrères.</div>
        <div class="de spoiler">My doctor referred me to one of her professional colleagues.</div>
        <div class="fr">Ce grand architecte s'attire l'admiration de ses confrères et consœurs.</div>
        <div class="de spoiler">This great architect wins the admiration of his professional colleagues.</div>
      </div>

      <p>In modern French, <span class="fr">confrère</span> usually used only for men, while <span class="fr">consœur</span> is used for women, regardless of whether they are considered in relation to a man or another woman.</p>
      <div class="examples">
        <div class="fr">Mon confrère avocat est aussi mon collègue au Parlement.</div>
        <div class="de spoiler">My colleague is also my colleague in Parliament.</div>
        <div class="fr">Ma consœur à l'Académie des lettres du Québec a rédigé un brillant essai.</div>
        <div class="de spoiler">My colleague at the Quebec Academy of Literature has written a brilliant essay.</div>
      </div>
    </div>
  </div>
