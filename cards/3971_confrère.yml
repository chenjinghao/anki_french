Notiz: |-
  <div class="section">
    <div class="section-title"><i>collègue</i> and <i>confrère/consœur</i></div>
    <div class="section-content">
      <p><span class="fr">Collègue</span> #1099) refers to a person who <span class="de">"working in the same company"</span> or <span class="de">"exercises the same function"</span> In a broader sense, it also refers to persons engaged in similar activities.</p>
      <div class="examples">
        <div class="fr">Il mange avec ses collègues dans la salle des professeurs.</div>
        <div class="de spoiler">He's eating with his colleagues in the teacher's room.</div>
        <div class="fr">Elle partage la même passion que ses collègues musiciens.</div>
        <div class="de spoiler">She shares the same passion as her fellow musicians.</div>
      </div>

      <p><span class="fr">Confrère</span> (male) and <span class="fr">consœur</span> (female) refer to persons who: <span class="de">'belonging to the same profession'</span> or <span class="de">"exercising the same freelance profession"</span>, especially in freelance professions such as doctors, lawyers, notaries, architects, pharmacists, writers or journalists.The term is also used for members of the same artistic, literary or scientific society.</p>
      <div class="examples">
        <div class="fr">Ma médecin m'a adressé à un de ses confrères.</div>
        <div class="de spoiler">My doctor referred me to one of her colleagues.</div>
        <div class="fr">Ce grand architecte s'attire l'admiration de ses confrères et consœurs.</div>
        <div class="de spoiler">This great architect is gaining the admiration of his colleagues.</div>
      </div>

      <p>In modern French it is <span class="fr">confrère</span> Generally used only for men, whereas <span class="fr">consœur</span> It is used for women regardless of whether they are considered to be related to a man or another woman.</p>
      <div class="examples">
        <div class="fr">Mon confrère avocat est aussi mon collègue au Parlement.</div>
        <div class="de spoiler">My colleague of lawyers is also my colleague in Parliament.</div>
        <div class="fr">Ma consœur à l'Académie des lettres du Québec a rédigé un brillant essai.</div>
        <div class="de spoiler">My colleague at the Académie de littérature du Québec has written a brilliant essay.</div>
      </div>
    </div>
  </div>
