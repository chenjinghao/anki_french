Notiz: |-
  <div class="section">
    <div class="section-title"><i>diffuser</i> and <i>répandre</i></div>
    <div class="section-content">
      <p><span class="fr">Diffuser</span> (#1995) means <span class="de">"verbreiten"</span> or <span class="de">"ausstrahlen"</span>, often evenly in all directions:</p>
      <div class="examples">
        <div class="fr">La lampe diffusait une lumière douce.</div>
        <div class="de spoiler">The lamp spread a gentle light.</div>
        <div class="fr">La radio a diffusé la nouvelle.</div>
        <div class="de spoiler">The radio sent the message.</div>
        <div class="fr">Ce journal est diffusé à 2000 exemplaires.</div>
        <div class="de spoiler">This newspaper is distributed in 2000 copies.</div>
      </div>
      <p>In chemistry, it is also used as a <span class="de">"sich ausbreiten"</span> is used:</p>
      <div class="examples">
        <div class="fr">Le médicament diffuse sous la peau.</div>
        <div class="de spoiler">The drug spreads under the skin.</div>
      </div>
      <p><span class="fr">Se répandre</span> means <span class="de">"sich ausbreiten"</span> or <span class="de">"verbreiten"</span> in the broader sense:</p>
      <div class="examples">
        <div class="fr">La rougeur s'est répandue sur son front.</div>
        <div class="de spoiler">The redness spread on his forehead.</div>
        <div class="fr">La nouvelle se répand dans le public.</div>
        <div class="de spoiler">The news is spreading to the public.</div>
      </div>
      <p>It can also <span class="de">"to pour out"</span> in the figurative sense:</p>
      <div class="examples">
        <div class="fr">Il s'est répandu en excuses.</div>
        <div class="de spoiler">He's been pouring himself in excuses.</div>
      </div>
    </div>
  </div>
