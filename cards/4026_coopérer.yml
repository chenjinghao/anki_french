Notiz: |-
  <div class="section">
    <div class="section-title"><i>collaborer</i> and <i>coopérer</i></div>
    <div class="section-content">
      <p><span class="fr">Collaborer</span> (#2963) means <span class="de">"zusammenarbeiten"</span> and refers to a joint work on a project or task, often with emphasis on the process of collaboration itself.</p>
      <div class="examples">
        <div class="fr">Les deux entreprises collaborent sur un nouveau projet technologique.</div>
        <div class="de spoiler">The two companies are working together on a new technology project.</div>
        <div class="fr">Les artistes ont collaboré pour créer cette exposition unique.</div>
        <div class="de spoiler">The artists worked together to create this unique exhibition.</div>
      </div>
      <p><span class="fr">Coopérer</span> means ebenfalls <span class="de">"kooperieren"</span> or <span class="de">"zusammenwirken"</span>It can also convey the idea that each party retains its own role.</p>
      <div class="examples">
        <div class="fr">Les pays doivent coopérer pour lutter contre le changement climatique.</div>
        <div class="de spoiler">Countries need to cooperate to combat climate change.</div>
        <div class="fr">Les différents services coopèrent pour résoudre ce problème complexe.</div>
        <div class="de spoiler">The various departments work together to solve this complex problem.</div>
      </div>
      <p>Obwohl beide Verben <span class="de">"Zusammenarbeit"</span> has <span class="fr">collaborer</span> often lead to closer integration of work, while <span class="fr">coopérer</span> the coordination of separate units for a common goal.</p>
    </div>
  </div>
