Notiz: |-
  <div class="section">
    <div class="section-title"><i>adaptation</i> and <i>ajustement</i></div>
    <div class="section-content">
      <p><span class="fr">Adaptation</span> (#2701) means <span class="de">'Adaptation'</span> and refers to a broader process where something or someone adapts to new circumstances, conditions or environments.</p>
      <div class="examples">
        <div class="fr">L'adaptation à un nouveau pays peut prendre du temps.</div>
        <div class="de spoiler">Adapting to a new country can take time.</div>
        <div class="fr">Ce film est une adaptation du roman de Victor Hugo.</div>
        <div class="de spoiler">This film is an adaptation of Victor Hugo's novel.</div>
      </div>
      <p><span class="fr">Ajustement</span> means <span class="de">"Justice"</span> or <span class="de">'Setting up'</span> and refers to smaller, more precise changes or corrections to adjust or improve something more precisely.</p>
      <div class="examples">
        <div class="fr">Il faut faire un ajustement du son sur la télévision.</div>
        <div class="de spoiler">You have to adjust the tone on the TV.</div>
        <div class="fr">L'ajustement des prix est nécessaire en raison de l'inflation.</div>
        <div class="de spoiler">The adjustment of prices is necessary because of inflation.</div>
      </div>
      <p>The main difference lies in the scope: <span class="fr">adaptation</span> It is often deeper and more comprehensive, while <span class="fr">ajustement</span> refers to smaller, more technical or precise changes.</p>
