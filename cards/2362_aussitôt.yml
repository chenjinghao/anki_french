# Feel free to improve these fields!
Wort mit Artikel: aussitôt
Femininum / Plural: ''
IPA: \o.si.to\
Definition: immediately after that, immediately
Register: ↗Fiktion ↘Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  On décida *aussitôt* de dîner ensemble.
  We immediately decided to have dinner together.

  Il a *aussitôt* compris mon problème.
  He immediately understood my problem.

  *Aussitôt* la réunion terminée, elle est rentrée chez elle.
  As soon as the meeting was over, she went home.

  "*Aussitôt dit, aussitôt fait* !" s'écria-t-elle en se mettant au travail.
  "As soon as I say, as soon as I do!" she exclaimed as she went to work.

  *Aussitôt que* tu auras fini tes devoirs, nous irons au cinéma.
  *As soon as* you finish your homework, we'll go to the movies.

  Le chat s'est *aussitôt* caché sous le lit.
  The cat immediately hid under the bed.

  *Aussitôt* arrivé à Paris, j'ai visité la Tour Eiffel.
  As soon as I arrived in Paris, I visited the Eiffel Tower.

  Elle m'a appelé et je suis venu *aussitôt*.
  She called me, and I came *right away*.

  *Aussitôt* le soleil levé, les oiseaux commencent à chanter.
  As soon as the sun came up, the birds started singing.

  Je vous répondrai *aussitôt que possible*.
  I'll get back to you as soon as I can.

  *Aussitôt* après le petit-déjeuner, nous partirons en randonnée.
  As soon as breakfast is over, we'll go hiking.

  Il a *aussitôt* reconnu son erreur.
  He immediately admitted his mistake.

  *Aussitôt que* la pluie s'arrêtera, nous sortirons.
  *As soon as* the rain stops, we'll go out.

  Le médecin est arrivé *aussitôt* après mon appel.
  The doctor arrived right after I called.

  *Aussitôt* la porte ouverte, le chien s'est échappé.
  As soon as the door opened, the dog ran away.

  Marie a *aussitôt* accepté mon invitation.
  Marie immediately accepted my invitation.

  *Aussitôt que* j'ai entendu l'alarme, j'ai évacué le bâtiment.
