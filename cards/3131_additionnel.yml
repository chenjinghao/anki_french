  <div class="section">
    <div class="section-title"><i>supplémentaire</i> and <i>additionnel</i></div>
    <div class="section-content">
      <p><span class="fr">Supplémentaire</span> (#1267) means <span class="de">"additional"</span> in the sense of something that is added to an already complete whole. It often implies something complementary or extra that goes beyond the normal or expected.</p>
      <div class="examples">
        <div class="fr">Il demande des heures supplémentaires pour finir le projet.</div>
        <div class="de spoiler">He is applying for overtime to complete the project.</div>
        <div class="fr">Nous avons besoin d'une chambre supplémentaire pour les invités.</div>
        <div class="de spoiler">We need an extra room for the guests.</div>
      </div>
      <p><span class="fr">Additionnel</span> means ebenfalls <span class="de">"additional"</span>It emphasizes the aspect of adding or accumulating and is often used in business or administrative contexts.</p>
      <div class="examples">
        <div class="fr">Des coûts additionnels seront facturés pour ce service.</div>
        <div class="de spoiler">Additional costs will be charged for this service.</div>
