Wort mit Artikel: additionnel
Femininum / Plural: additionnelle
IPA: \a.di.sjɔ.nɛl\
Definition: In addition
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
