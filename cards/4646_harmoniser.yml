Wort mit Artikel: harmoniser
Femininum / Plural: ''
IPA: \aʁ.mɔ.ni.ze\
Definition: to coordinate, to reconcile
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Il *harmonise* les règles.
  He's matching the rules.

  Le peintre a *harmonisé* les couleurs de sa toile avec soin.
  The painter carefully *matched* the colours of his canvas.

  Les voix des choristes s'*harmonisent* parfaitement.
  The voices of the choir singers harmonize perfectly with each other.

  Le compositeur a *harmonisé* cette mélodie traditionnelle.
  The composer has harmonized this traditional melody.

  Nous devons *harmoniser* nos horaires avec ceux des autres départements.
  We need to coordinate our schedules with those of the other departments.

  Son style vestimentaire s'*harmonise* bien avec sa personnalité.
  Her style of clothing harmonizes well with her personality.

  L'architecte a *harmonisé* les nouvelles constructions avec le paysage existant.
  The architect has brought the new buildings into line with the existing landscape.

  Le facteur d'orgues *harmonise* chaque tuyau avec précision.
  The organ builder precisely tunes each pipe.

  Ces deux propositions ne s'*harmonisent* pas du tout.
  These two proposals do not harmonize at all.

  Elle a parfaitement *harmonisé* le maquillage avec sa tenue de soirée.
  She perfectly matched the make-up with her evening dress.

  Les pays européens cherchent à *harmoniser* leurs politiques environnementales.
  The European countries are trying *to coordinate* their environmental policies.

  La décoratrice *harmonise* les couleurs des murs avec celles des meubles.
  The interior decorator matches the wall colors with the furniture colors.

  Ces tons pastels s'*harmonisent* naturellement entre eux.
  These pastel tones harmonize by nature.

  Le chef d'orchestre a *harmonisé* plusieurs chansons folkloriques.
  The conductor has harmonized several folk songs.

  Nous devons *harmoniser* nos efforts pour réussir ce projet.
  We need to coordinate our efforts to complete this project successfully.

  Les tissus s'*harmonisent* parfaitement avec le papier peint.
  The fabrics *fit* perfectly with the wallpaper.

  L'artiste a *harmonisé* les différentes parties de son œuvre.
  The artist has reconciled the various parts of his work.

