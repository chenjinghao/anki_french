Notiz: |-
  <div class="section">
    <div class="section-title"><i>certes</i> and <i>certainement</i></div>
    <div class="section-content">
      <p><span class="fr">Certes</span> (#1021) means <span class="de">"gewiss"</span> or <span class="de">"Sure"</span> and is often used to express an agreement that is later relativized by an objection. It often initiates a grant that is continued with "but" or "but".</p>
      <div class="examples">
        <div class="fr">Certes, il est intelligent, mais il manque de motivation.</div>
        <div class="de spoiler">Of course, he's intelligent, but he lacks motivation.</div>
        <div class="fr">C'est certes un problème difficile, néanmoins nous devons le résoudre.</div>
        <div class="de spoiler">It is certainly a difficult problem, but we must resolve it.</div>
      </div>
      <p><span class="fr">Certainement</span> means <span class="de">"bestimmt"</span> or <span class="de">"with certainty"</span> and expresses a stronger, unqualified certainty. It is often used as a simple affirmation.</p>
      <div class="examples">
        <div class="fr">Il viendra certainement à la fête demain.</div>
        <div class="de spoiler">He'll be at the party tomorrow.</div>
        <div class="fr">As-tu fini ton travail? - Certainement!</div>
        <div class="de spoiler">- Did you finish your job?</div>
      </div>
    </div>
  </div>
