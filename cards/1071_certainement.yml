# Please do not change these fields.
Rang: 1071
Wort: certainement
Wortart: adv

# Feel free to improve these fields!
Wort mit Artikel: certainement
Femininum / Plural: ''
IPA: \sɛʁ.tɛn.mɑ̃\
Definition: Surely,
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Ce n'est *certainement* pas nous qui ferons cela.
  That won't be us who will.

  Il viendra *certainement* à la fête demain soir.
  He'll be at the party tomorrow night.

  As-tu bien dormi ? - *Certainement* !
  - Did you sleep well?

  Elle est *certainement* la meilleure joueuse de l'équipe.
  She is undoubtedly the best player in the team.

  Je ne peux pas vous dire *certainement* quand il rentrera.
  I can't tell you for sure when he's coming back.

  *Certainement* pas avant midi, il dort toujours très tard.
  Not until 12 o'clock, he sleeps very long.

  Cette robe coûte *certainement* plus de cent euros.
  This dress *certainly* costs more than a hundred euros.

  Le train aura *certainement* du retard avec ce temps.
  The train will be delayed in this weather.

  Voulez-vous encore du café ? - *Certainement* !
  - Would you like some more coffee?

  Il a *certainement* oublié notre rendez-vous.
  He must have forgotten our meeting.

  Cette solution résoudra *certainement* le problème.
  This solution will surely solve the problem.

  C'est *certainement* la décision la plus difficile de ma vie.
  This is *undoubtedly* the most difficult decision of my life.

  Le médecin viendra *certainement* dans l'après-midi.
  The doctor will be here in the afternoon.

  Tu as *certainement* raison de te méfier.
  I'm sure you're right to be suspicious.

  Ces fruits sont *certainement* trop mûrs.
  These fruits are certainly overripe.

  Elle a *certainement* déjà lu ce livre trois fois.
  She's probably read this book three times.

  *Certainement*, nous devrons reporter la réunion.
  No doubt we will have to postpone the meeting.

