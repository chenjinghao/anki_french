Notiz: |-
  <div class="section">
    <div class="section-title"><i>certes</i> and <i>certainement</i></div>
    <div class="section-content">
      <p><span class="fr">Certes</span> #1021) means <span class="de">"Certainly"</span> or <span class="de">'Surely'</span> and is often used to express consent, which is later relativized by an objection. It often introduces a concession that is continued with "but" or "yet".</p>
      <div class="examples">
        <div class="fr">Certes, il est intelligent, mais il manque de motivation.</div>
        <div class="de spoiler">Sure, he's smart, but he lacks motivation.</div>
        <div class="fr">C'est certes un problème difficile, néanmoins nous devons le résoudre.</div>
        <div class="de spoiler">It is certainly a difficult problem, yet we must solve it.</div>
      </div>
      <p><span class="fr">Certainement</span> means <span class="de">'specified'</span> or <span class="de">"Certainly"</span> It's often used as a simple affirmation.</p>
      <div class="examples">
        <div class="fr">Il viendra certainement à la fête demain.</div>
        <div class="de spoiler">I'm sure he'll come to the party tomorrow.</div>
        <div class="fr">As-tu fini ton travail? - Certainement!</div>
        <div class="de spoiler">- Have you finished your work?</div>
      </div>
    </div>
  </div>
