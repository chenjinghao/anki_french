Rang: 149
Wort: entendre
Wortart: vi, vt, vr

# Feel free to improve these fields!
Wort mit Artikel: entendre
Femininum / Plural: ''
IPA: \ɑ̃.tɑ̃dʁ\
Definition: hearing, understanding
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  J'ai *entendu* la nouvelle.
  I *heard* the news.

  Il *entend* mal depuis son accident.
  He's been *hearing* bad things since his accident.

  "Je ne veux rien *entendre* !" a-t-elle crié en claquant la porte.
  "I don't want to hear about it!" she screamed and slammed the door.

  *Entendez-vous* le chant des oiseaux le matin ?
  Do you hear the birds singing in the morning?

  Elle s'*entend* bien avec ses collègues.
  She gets along well with her colleagues.

  J'ai *entendu* dire que tu as trouvé un nouvel emploi.
  I *heard* you found a new job.

  Le professeur a *entendu* l'élève chuchoter pendant l'examen.
  The teacher *heard* the student whisper during the exam.

  Il faut *s'entendre* sur les termes du contrat avant de le signer.
  We need to agree on the terms of the contract before we sign it.

  On *s'entend* à peine avec tout ce bruit !
  You hardly get along with all the noise!

  J'*entends* bien vos inquiétudes, mais nous devons avancer.
  I *understand* your concerns, but we need to move forward.

  Le juge a *entendu* les témoins avant de rendre son verdict.
  The judge listened *to* the witnesses before he handed down his sentence.

  Elle *s'y entend* en cuisine française.
  She *understands something* about French cuisine.

  *Entendons-nous* bien : ce projet doit être terminé dans une semaine.
  So that we *understand* each other correctly: this project must be completed in a week.

  Je n'ai pas bien *entendu* ce que tu as dit. Peux-tu répéter ?
  I didn't hear well what you said.

  Il *entend* faire de ce restaurant le meilleur de la ville.
  He intends to make this restaurant the best in the city.

  Nous nous sommes mal *entendus* sur la date de la réunion.
  We misunderstood the date of the meeting.

  *Entendre raison* n'est pas toujours facile pour certaines personnes.
  Accepting reason is not always easy for some people.

  J'ai *entendu* un bruit étrange venant du grenier.
  I *heard* a strange sound coming from the attic.

  Elle *ne l'entend pas de cette oreille*.
  She doesn't think so.

  À les *entendre*, on croirait que tout va mal.
  If you hear them, you might think things are going badly.

  J'ai bien *entendu* votre requête et je vais y réfléchir.
  I understand your request well and I'll think about it.

  Il *s'entend comme larron en foire* avec son nouveau voisin.
  He gets along brilliantly with his new neighbor.

  On *entend* souvent dire que l'exercice est bon pour la santé.
  You often hear that exercise is good for your health.

  Je n'y *entends* rien en mécanique.
  I don't know anything about mechanics.

  *Entendez-vous* le tonnerre au loin ?
  Do you hear the thunder in the distance?

  Il faut *s'entendre* pour réussir un projet d'équipe.
  You have to *understand* each other to successfully complete a team project.

  J'ai *entendu* parler de ce film, mais je ne l'ai pas encore vu.
  I've *heard* about this movie, but I haven't seen it yet.

  Elle *s'entend à merveille* pour organiser des fêtes.
  She knows how to organize festivals.

  Faites comme vous l'*entendez*, c'est votre décision.
  Do it as you think it is right, it's your decision.

  *Entends-tu* ce que je dis ?
  Do you hear what I'm saying?

  Il ne veut rien *entendre* de mes conseils.
  He doesn't want to hear about my advice.

  On *s'entend à demi-mot* entre amis.
  Friends are meant to be without many words.

  J'ai *entendu* la porte claquer dans la nuit.
  I heard the door banging that night.

  Elle *s'entend* répéter les mêmes erreurs.
  It hears itself repeat the same mistakes.

  *Entendez-vous* par là que vous refusez ma proposition ?
  Do you mean you're rejecting *my* proposal?

  Je n'ai pas l'intention de me laisser faire, *entendez-vous* ?
  I don't intend to let you take me by surprise, do you *understand*?

  Il faut *s'entendre* sur le prix avant de conclure l'affaire.
  You have to agree on the price before you finish the business.

  J'ai *entendu* dire que le restaurant va fermer.
  I *heard* the restaurant is closing.

  On *entend* parfois des histoires incroyables.
  Sometimes you hear incredible stories.

  Je m'*entends* bien avec mes voisins, heureusement.
  I get along well with my neighbors, fortunately.

  *Entendez-vous* ce que je veux dire ?
  Do you understand what I mean?

  Il *s'entend* à merveille en matière de vins.
  He knows a lot about wines.

  J'ai *entendu* un cri dans la rue.
  I *heard* a scream on the street.

  Elle a *fait entendre* sa voix lors de la réunion.
  She raised her voice at the meeting.

  Nous nous sommes *entendus* sur les termes du contrat.
  We have *agreed* on the terms of the contract.

  *Entendons-nous* bien : je ne reviendrai pas sur ma décision.
  So that we *understand* each other correctly: I will not take my decision back.

  J'ai *entendu* quelqu'un frapper à la porte.
  I *heard* someone knocking on the door.

  Il ne veut rien *entendre* à propos de son régime.
  He doesn't want to hear about his diet.

  On *s'entend* bien dans notre équipe de travail.
  We get along well with our work team.

  *Entends-tu* le bruit de la mer ?
  Do you hear the sound of the sea?

  Elle *s'entend à* régler les conflits rapidement.
  She knows how to resolve conflicts quickly.

  J'ai *entendu* des rumeurs sur la fermeture de l'usine.
  I *heard* rumors about the factory closing.

  Il faut *s'entendre* sur les objectifs avant de commencer.
  You have to agree on the goals before you start.

  *Entendez-vous* le son de la cloche au loin ?
  Do you hear the sound of the bell in the distance?

  Je n'*entends rien à* ces nouvelles technologies.
  *I don't know anything about* these new technologies.

  On *s'entend* pour dire que la situation est préoccupante.
  It is agreed that the situation is worrying.

  *Entends-tu* ce que je veux dire par là ?
  Do you understand what I'm saying?

  J'ai *entendu* un bruit étrange venant de la cave.
  I *heard* a strange sound coming out of the basement.

