Notiz: |-
  <div class="section">
    <div class="section-title"><i>miracle</i> and <i>merveille</i></div>
    <div class="section-content">
      <p><span class="fr">Miracle</span> (#2638) means <span class="de">"Wunder"</span> in the religious or extraordinary sense. It denotes a supernatural event or something that seems to break the natural laws.</p>
      <div class="examples">
        <div class="fr">Les fidèles croient que sa guérison est un vrai miracle.</div>
        <div class="de spoiler">Believers believe that his healing is a true miracle.</div>
        <div class="fr">C'est un miracle qu'il ait survécu à cet accident.</div>
        <div class="de spoiler">It's a miracle that he survived this accident.</div>
      </div>
      <p><span class="fr">Merveille</span> means <span class="de">"Wunder"</span> in the sense of something admirable or extraordinary. It denotes something that evokes wonder or admiration without being supernatural.</p>
      <div class="examples">
        <div class="fr">Ce château est une merveille d'architecture.</div>
        <div class="de spoiler">This castle is a wonder of architecture.</div>
        <div class="fr">Les sept merveilles du monde antique fascinent encore aujourd'hui.</div>
        <div class="de spoiler">The seven wonders of the world of antiquity still fascinate today.</div>
      </div>
      <p><span class="fr">Miracle</span> often has a spiritual or inexplicable dimension, while <span class="fr">merveille</span> refers to something that impresses with its beauty, its ability or its exceptionality.</p>
    </div>
  </div>
