Notiz: |-
  <div class="section">
    <div class="section-title"><i>buter</i> and <i>heurter</i></div>
    <div class="section-content">
      <p><span class="fr">Buter</span> means <span class="de">'push'</span> or <span class="de">'Thumbs up'</span> And it's often used when you run into an obstacle or something you can't move forward with.</p>
      <div class="examples">
        <div class="fr">Il a buté contre une pierre et est tombé.</div>
        <div class="de spoiler">He bumped into a rock and fell.</div>
        <div class="fr">Elle bute sur ce problème de mathématiques depuis des heures.</div>
        <div class="de spoiler">She hasn't been able to get past this math problem for hours.</div>
      </div>
      <p><span class="fr">Heurter</span> (#2601) means <span class="de">'throwing'</span> or <span class="de">'push'</span> and can be used both physically and metaphorically, often with the idea of shock or injury.</p>
      <div class="examples">
        <div class="fr">La voiture a heurté un arbre.</div>
        <div class="de spoiler">The car crashed into a tree.</div>
        <div class="fr">Ses propos ont heurté la sensibilité de l'auditoire.</div>
        <div class="de spoiler">His words hurt the audience's feelings.</div>
      </div>
      <p>While both verbs describe a type of collision, implies <span class="fr">buter</span> Often an obstacle or a difficulty, while <span class="fr">heurter</span> the impact or injury aspect is more emphasized.</p>
    </div>
  </div>
