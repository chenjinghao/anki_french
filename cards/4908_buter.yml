Notiz: |-
  <div class="section">
    <div class="section-title"><i>buter</i> and <i>heurter</i></div>
    <div class="section-content">
      <p><span class="fr">Buter</span> means <span class="de">"Toast"</span> or <span class="de">"stolpern"</span> and is often used when you hit an obstacle or when something does not get any further.</p>
      <div class="examples">
        <div class="fr">Il a buté contre une pierre et est tombé.</div>
        <div class="de spoiler">He hit a stone and fell.</div>
        <div class="fr">Elle bute sur ce problème de mathématiques depuis des heures.</div>
        <div class="de spoiler">She hasn't been able to get anywhere on this math problem for hours.</div>
      </div>
      <p><span class="fr">Heurter</span> (#2601) means <span class="de">"punch"</span> or <span class="de">"Toast"</span> and can be used both physically and figuratively, often with the idea of shocking or injury.</p>
      <div class="examples">
        <div class="fr">La voiture a heurté un arbre.</div>
        <div class="de spoiler">The car hit a tree.</div>
        <div class="fr">Ses propos ont heurté la sensibilité de l'auditoire.</div>
        <div class="de spoiler">His words have hurt the feelings of the audience.</div>
      </div>
      <p>While both verbs describe a kind of collision, implies <span class="fr">buter</span> often an obstacle or a difficulty, while <span class="fr">heurter</span> more stressing the aspect of impact or injury.</p>
    </div>
  </div>
