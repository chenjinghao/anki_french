Notiz: |2-
      <p><span class="fr">Ficher</span> is a versatile French verb with different meanings and special forms of participation.</p>

      <p>1. <span class="de">"Einstecken"</span> or <span class="de">"einschlagen"</span> - push something into it at its top, like a nail or pole.</p>
      <div class="examples">
        <div class="fr">Ficher un clou dans le mur.</div>
        <div class="de spoiler">Hit a nail in the wall.</div>
      </div>

      <p>2. <span class="de">"Erfassen"</span>, <span class="de">"registrieren"</span> (e.g. by the police).</p>
      <div class="examples">
        <div class="fr">Les suspects sont fichés par la police.</div>
        <div class="de spoiler">The suspects are registered by the police.</div>
      </div>

      <p>3. In the reflexive form <span class="fr">s'en ficher</span>: <span class="de">"Don't worry"</span>, <span class="de">"No matter"</span> (Euphemistic)</p>
      <div class="examples">
        <div class="fr">Je m'en fiche !</div>
        <div class="de spoiler">I don't care!</div>
      </div>

      <p>4. colloquial in the sense of <span class="de">"tun"</span> or <span class="de">"machen"</span>.</p>
      <div class="examples">
        <div class="fr">Qu'est-ce que tu fiches là ?</div>
        <div class="de spoiler">Was machst du da?</div>
      </div>

      <p>5. In the reflexive form <span class="fr">se ficher de quelqu'un</span>: <span class="de">"to make fun of someone"</span>.</p>
      <div class="examples">
        <div class="fr">Il se fiche de moi.</div>
        <div class="de spoiler">He's making fun of me.</div>
      </div>

      <h3>Partizipformen</h3>
      <p><span class="fr">Fiché</span> – the regular participle Perfect, used for the more formal meanings:</p>
      <div class="examples">
        <div class="fr">Il a fiché le couteau dans la planche.</div>
        <div class="de spoiler">He put the knife in the board.</div>
        <div class="fr">Le suspect a été fiché par les autorités.</div>
        <div class="de spoiler">The suspect was registered by the authorities.</div>
      </div>

      <p><span class="fr">Fichu</span> – the irregular participle, mainly used in colloquial and euphemistic contexts:</p>
      <div class="examples">
        <div class="fr">J'ai fichu mes clés quelque part et je ne les trouve plus.</div>
        <div class="de spoiler">I put my keys somewhere and I can't find them anymore.</div>
        <div class="fr">C'est fichu, on n'y arrivera jamais.</div>
        <div class="de spoiler">It's hopeless, we'll never make it.</div>
      </div>

      <p class="highlight">The colloquial meaning in the sense of <span class="de">"Don't worry"</span> is a weakened expression for the vulgar <span class="fr">foutre</span> (<span class="de">"ficken"</span>).</p>
