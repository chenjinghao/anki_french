Notiz: |-
  |2-
        <p><span class="fr">Ficher</span> is a versatile French verb with different meanings and particular participle forms.</p>

        <p>1. <span class="de">"Stick in"</span> or <span class="de">"attack"</span> - inserting something at its tip, like a nail or a stick.</p>
        <div class="examples">
          <div class="fr">Ficher un clou dans le mur.</div>
          <div class="de spoiler">Hit a nail in the wall.</div>
        </div>

        <p>2. <span class="de">"Capture"</span>, <span class="de">'register'</span> (e.g. by the police).</p>
        <div class="examples">
          <div class="fr">Les suspects sont fichés par la police.</div>
          <div class="de spoiler">The suspects will be registered by the police.</div>
        </div>

        <p>3. In the reflective form <span class="fr">s'en ficher</span>: <span class="de">"Don't worry about it"</span>, <span class="de">"I don't care what you say"</span> (euphemistically)</p>
        <div class="examples">
          <div class="fr">Je m'en fiche !</div>
          <div class="de spoiler">I don't give a shit!</div>
        </div>

        <p>4. in the sense of the word 'community'. <span class="de">"Doing"</span> or <span class="de">"make"</span>.</p>
        <div class="examples">
          <div class="fr">Qu'est-ce que tu fiches là ?</div>
          <div class="de spoiler">What are you doing, man?</div>
        </div>

        <p>5. In the reflective form <span class="fr">se ficher de quelqu'un</span>: <span class="de">"make fun of someone"</span>.</p>
        <div class="examples">
          <div class="fr">Il se fiche de moi.</div>
          <div class="de spoiler">He's making fun of me.</div>
        </div>

        <h3>Participatory forms</h3>
        <p><span class="fr">Fiché</span> the regular participle perfect, used for the more formal meanings:</p>
        <div class="examples">
          <div class="fr">Il a fiché le couteau dans la planche.</div>
          <div class="de spoiler">He put the knife in the board.</div>
          <div class="fr">Le suspect a été fiché par les autorités.</div>
          <div class="de spoiler">The suspect was registered by the authorities.</div>
        </div>

        <p><span class="fr">Fichu</span> the irregular participle, used mainly in colloquial and euphemistic contexts:</p>
        <div class="examples">
          <div class="fr">J'ai fichu mes clés quelque part et je ne les trouve plus.</div>
          <div class="de spoiler">I left my keys somewhere and I can't find them.</div>
          <div class="fr">C'est fichu, on n'y arrivera jamais.</div>
          <div class="de spoiler">It's hopeless, we'll never make it.</div>
        </div>

        <p class="highlight">The linguistic significance in the sense of <span class="de">"Don't worry about it"</span> is a weakened expression for the vulgar <span class="fr">foutre</span> (<span class="de">"Fuck you"</span>).</p>
