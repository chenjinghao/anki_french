Notiz: |-
  <div class="section">
    <div class="section-title"><i>auparavant</i> and <i>précédemment</i></div>
    <div class="section-content">
      <p><span class="fr">Auparavant</span> (#1001) means <span class="de">"zuvor"</span>, <span class="de">"vorher"</span> or <span class="de">"formerly"</span> and generally refers to an earlier date or time, often without a specific reference.</p>
      <div class="examples">
        <div class="fr">Je n'avais jamais visité Paris auparavant.</div>
        <div class="de spoiler">I had never visited Paris before.</div>
        <div class="fr">Il faut terminer ce projet auparavant.</div>
        <div class="de spoiler">This project must be completed beforehand.</div>
      </div>
      <p><span class="fr">Précédemment</span> means <span class="de">"vorherig"</span> or <span class="de">"vorausgehend"</span> and is used to refer to something that has immediately preceded or occurred in a certain sequence.</p>
      <div class="examples">
        <div class="fr">Comme mentionné précédemment, nous devons finir ce rapport avant vendredi.</div>
        <div class="de spoiler">As mentioned above, we must complete this report before Friday.</div>
        <div class="fr">Il avait précédemment travaillé pour une entreprise concurrente.</div>
        <div class="de spoiler">He had previously worked for a competitor.</div>
      </div>
      <p>The main difference is that <span class="fr">précédemment</span> often has a clearer temporal relationship and is more frequently used in formal or written contexts, while <span class="fr">auparavant</span> In addition, it is possible to use it in both formal and informal situations.</p>
    </div>
  </div>
