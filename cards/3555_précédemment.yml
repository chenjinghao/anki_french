Notiz: |-
  <div class="section">
    <div class="section-title"><i>auparavant</i> and <i>précédemment</i></div>
    <div class="section-content">
      <p><span class="fr">Auparavant</span> (#1001) means <span class="de">"before"</span>, <span class="de">"before"</span> or <span class="de">"previously"</span> and generally refers to an earlier date or period, often without specific reference.</p>
      <div class="examples">
        <div class="fr">Je n'avais jamais visité Paris auparavant.</div>
        <div class="de spoiler">I've never been to Paris before.</div>
        <div class="fr">Il faut terminer ce projet auparavant.</div>
        <div class="de spoiler">This project must be completed first.</div>
      </div>
      <p><span class="fr">Précédemment</span> means <span class="de">'previously'</span> or <span class="de">'foreseeable'</span> and is used to refer to something that has preceded or occurred in a particular sequence before.</p>
      <div class="examples">
        <div class="fr">Comme mentionné précédemment, nous devons finir ce rapport avant vendredi.</div>
        <div class="de spoiler">As already mentioned, we must finish this report by Friday.</div>
        <div class="fr">Il avait précédemment travaillé pour une entreprise concurrente.</div>
        <div class="de spoiler">He had previously worked for a competing company.</div>
      </div>
      <p>The main difference is that <span class="fr">précédemment</span> often has a clearer temporal context and is used more frequently in formal or written contexts, whereas <span class="fr">auparavant</span> It is more general and can be used in both formal and informal situations.</p>
    </div>
  </div>
