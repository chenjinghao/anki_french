# Feel free to improve these fields!
Wort mit Artikel: dépêcher
Femininum / Plural: ''
IPA: \de.pe.ʃe\
Definition: Hurry up
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  J'ai bloqué l'ascenseur, *dépêchez*-vous, vite !
  I've blocked the elevator. *Hurry up*, hurry up!

  Il faut se *dépêcher* de finir ce travail avant midi.
  We must hurry to finish this work before noon.

  Le ministre a *dépêché* un émissaire pour négocier la paix.
  The minister has sent an emissary to negotiate peace.

  "*Dépêche*-toi de ranger ta chambre avant que papa rentre !"
  "*Hurry up* and clean your room before Daddy gets home!"

  Les étudiants se *dépêchaient* de prendre des notes pendant le cours.
  The students were quick to take notes during the class.

  L'entreprise a *dépêché* des experts pour résoudre le problème technique.
  The company sent experts to solve the technical problem.

  Je me suis *dépêchée* de prendre le dernier train.
  I hurried to take the last train.

  Marie se *dépêche* toujours le matin pour ne pas rater son bus.
  Marie always hurries in the morning so as not to miss her bus.

  Le gouvernement a *dépêché* une équipe de secours dans la zone sinistrée.
  The government has sent a rescue team to the disaster area.

  *Dépêchez*-vous de faire vos courses avant la fermeture du magasin !
  *Hurry up* and go shopping before the store closes!

  Pierre s'est *dépêché* de terminer son assiette pour aller jouer.
  Pierre hurriedly finished his plate and went to play.

  L'ambassade a *dépêché* un représentant à la réunion d'urgence.
  The embassy sent a representative to the emergency meeting.

  Nous nous *dépêchons* de rentrer avant l'orage.
  We're in a hurry to get home before the storm.

  Il faut que je me *dépêche* de poster cette lettre aujourd'hui.
  I need to *hurry up* and post this letter today.

  Le patron s'est *dépêché* d'appeler les pompiers quand il a vu la fumée.
  The boss hurried to call the fire department when he saw the smoke.

  Le président a *dépêché* son conseiller auprès du premier ministre.
  The President has sent his adviser to the Prime Minister.

