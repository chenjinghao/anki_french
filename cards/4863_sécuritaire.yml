Beispielsätze: |-
  Le niveau de décontamination sera totalement *sécuritaire*.
  The level of decontamination will be absolutely *safe*.

  Le gouvernement a mis en place des mesures *sécuritaires* strictes dans les aéroports.
  The government has introduced strict *security* measures at airports.

  La politique *sécuritaire* du maire fait débat dans notre ville.
  The mayor's *security* policy is responsible for discussions in our city.

