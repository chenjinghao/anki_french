Beispielsätze: |-
  L'accès en resterait *théoriquement* interdit aux femmes seules.
  Access would theoretically be prohibited for single women.

  *Théoriquement*, je devrais terminer ce projet avant vendredi.
  *Theoretically*, I should finish this project before Friday.

  Cette solution est *théoriquement* possible, mais difficile à mettre en pratique.
  This solution is theoretically possible, but difficult to implement.

  *Théoriquement*, nous aurions dû recevoir une réponse hier.
  *Theoretically*, we should have received an answer yesterday.

  Le moteur devrait *théoriquement* fonctionner avec ce carburant.
  The engine should function theoretically with this fuel.

  *Théoriquement*, tous les citoyens ont les mêmes droits.
  *Theoretically*, all citizens have the same rights.

  Cette méthode n'est validée que *théoriquement*.
  This method is only theoretically validated.

  *Théoriquement*, le train arrive dans cinq minutes.
  *Theoretically*, the train comes in five minutes.

  Le problème est *théoriquement* résolu depuis longtemps.
  The problem has been solved theoretically for a long time.

  *Théoriquement*, ce médicament ne provoque pas d'effets secondaires.
  *Theoretically*, this drug does not cause any side effects.

  Cette hypothèse n'est prouvée que *théoriquement*.
  This hypothesis is only theoretically proven.

  *Théoriquement*, il y a assez de places pour tout le monde.
  *Theoretically*, there are plenty of places for everyone.

  Les résultats sont *théoriquement* corrects, mais pas applicables.
  The results are theoretically correct but not applicable.

  *Théoriquement*, nous devrions économiser 30% d'énergie.
  *Theoretically*, we should save 30% of energy.

  Le système est *théoriquement* capable de gérer mille utilisateurs.
  The system is theoretically able to manage a thousand users.

