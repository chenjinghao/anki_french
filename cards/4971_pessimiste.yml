Beispielsätze: |-
  Je ne suis pas aussi *pessimiste* que lui.
  I'm not as *pessimistic* as he is.

  Sa vision *pessimiste* du monde l'empêche d'être heureux.
  His *pessimistic* view of the world prevents him from being happy.

  Marie est une *pessimiste* invétérée qui ne voit jamais le bon côté des choses.
  Marie is a hard-on *pessimist* who never sees the good side of things.

  Le rapport dresse un tableau très *pessimiste* de la situation économique.
  The report draws a very *pessimistic* picture of the economic situation.

  Les *pessimistes* pensent que tout va mal, les optimistes voient des opportunités.
  The *pessimists* think that everything is going badly, the optimists see opportunities.

  Elle s'est montrée *pessimiste* quant à ses chances de réussite à l'examen.
  She was *pessimistic* about her chances of success in the test.

  Son naturel *pessimiste* commence à déteindre sur toute l'équipe.
  His *pessimistic* predisposition begins to rub off on the whole team.

  Les prévisions *pessimistes* des experts ne se sont heureusement pas réalisées.
  Fortunately, the *pessimistic* predictions of the experts did not occur.

  Ce *pessimiste* ne voit que les problèmes, jamais les solutions.
  This *pessimist* sees only the problems, never the solutions.

  Pourquoi es-tu toujours si *pessimiste* concernant l'avenir ?
  Why are you always so *pessimistic* about the future?

  Les marchés financiers sont devenus *pessimistes* après l'annonce des chiffres.
  The financial markets became *pessimistic* after the disclosure of the figures.

  Je refuse d'être *pessimiste* face aux défis qui nous attendent.
  I refuse to be *pessimistic* in the face of the challenges ahead.

  Cette *pessimiste* chronique nous décourage tous avec ses prédictions négatives.
  This chronic *pessimist* discourages us all with her negative predictions.

  Même les plus grands *pessimistes* doivent admettre que la situation s'améliore.
  Even the greatest *pessimists* must admit that the situation is improving.

