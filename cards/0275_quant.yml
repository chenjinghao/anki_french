Wort mit Artikel: quant
Femininum / Plural: ''
IPA: \kɑ̃t\
Definition: with regard to ...
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Les vents tempétueux ont modifié la situation *quant* aux avalanches.
  The stormy winds have changed the situation regarding avalanches.

  *Quant à* moi, je préfère rester à la maison ce soir.
  *As far as I'm concerned*, I'd rather stay home tonight.

  Le professeur est optimiste *quant* aux progrès de ses élèves.
  The teacher is optimistic about the progress of his students.

  *Quant à* Pierre, il arrivera plus tard dans la soirée.
  As far as Pierre is concerned, he'll be here later in *the* evening.

  Les experts restent prudents *quant* à l'évolution des prix.
  The experts remain cautious about price developments.

  *Quant à* partir en vacances cet été, nous n'avons pas encore décidé.
  As far as summer holidays are concerned, we have not yet made a decision.

  Marie hésite encore *quant* au choix de ses études.
  Marie is still uncertain about her choice of studies.

  *Quant au* restaurant, j'ai déjà réservé une table.
  As far as *the* restaurant is concerned, I've already reserved a table.

  Les médecins sont inquiets *quant* à la propagation du virus.
  The doctors are concerned about the spread of the virus.

  *Quant à* prendre le train ou la voiture, je préfère le train.
  As far as the choice between train and car is concerned, I prefer the train.

  *Quant aux* détails du projet, nous en discuterons demain.
  As far as *the* project details are concerned, we'll talk about this tomorrow.

  Les chercheurs sont divisés *quant* aux résultats de l'étude.
  The researchers share their views on the results of the studies.

  *Quant à* lui, il préfère travailler seul.
  As for him, he prefers to work alone.

  Les parents sont optimistes *quant* à l'adaptation de leur enfant à l'école.
  Parents are optimistic about their child's acclimatization at school.

  *Quant à* déménager dans une autre ville, elle y réfléchit encore.
  As for moving to another city, she's still thinking about it.

  *Quant aux* vacances d'hiver, nous irons probablement au ski.
  As far as winter holidays are concerned, we're probably going skiing.

