Notiz: |-
  <div class="section">
    <div class="section-title"><i>arbitrage</i> and <i>médiation</i></div>
    <div class="section-content">
      <p><span class="fr">Arbitrage</span> (#3443) means: <span class="de">"Schiedsverfahren"</span>where a neutral arbitrator makes a binding decision to resolve a conflict.</p>
      <div class="examples">
        <div class="fr">Les deux entreprises ont eu recours à l'arbitrage pour résoudre leur différend commercial.</div>
        <div class="de spoiler">The two companies have initiated arbitration to resolve their commercial dispute.</div>
        <div class="fr">La décision d'arbitrage est définitive et contraignante.</div>
        <div class="de spoiler">The award shall be final and binding.</div>
      </div>
      <p><span class="fr">Médiation</span> means: <span class="de">"Vermittlung"</span>, in which a neutral mediator helps the parties to find a friendly solution themselves.</p>
      <div class="examples">
        <div class="fr">Le couple a choisi la médiation pour leur divorce à l'amiable.</div>
        <div class="de spoiler">The couple chose mediation for their friendly divorce.</div>
        <div class="fr">Le médiateur facilite le dialogue sans imposer de solution.</div>
        <div class="de spoiler">The mediator facilitates dialogue without imposing a solution.</div>
      </div>
      <p>The main difference is that the <span class="fr">arbitrage</span> a binding decision is taken by the outside world, while at the time of the <span class="fr">médiation</span> the parties themselves should reach an agreement.</p>
    </div>
  </div>
