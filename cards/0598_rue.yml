Notiz: |-
  <div class="section">
    <div class="section-title"><i>rue</i> and <i>route</i></div>
    <div class="section-content">
      <p><span class="fr">Rue</span> typically means an urban road or a road within an area under construction. It corresponds to the German word "Straße" or "Gasse" and refers to smaller paths surrounded by buildings, mainly used by pedestrians and local traffic.</p>
      <div class="examples">
        <div class="fr">Je vis dans une petite rue près du centre-ville.</div>
        <div class="de spoiler">I live in a small street near the city center.</div>
        <div class="fr">La rue Saint-Honoré est très célèbre à Paris.</div>
        <div class="de spoiler">Rue Saint-Honoré is very famous in Paris.</div>
      </div>
      <p><span class="fr">Route</span> (#512) refers to a larger road or main road, often outside of urban centres. It can be compared with the German "Chaussee" or "Landstraße" and is usually used for roads connecting towns and villages at which higher speeds are allowed.</p>
      <div class="examples">
        <div class="fr">Nous prenons la route nationale pour aller à Lyon.</div>
        <div class="de spoiler">We'll take the national road to Lyon.</div>
        <div class="fr">La route est glissante à cause de la pluie.</div>
        <div class="de spoiler">The road is slippery because of the rain.</div>
      </div>
    </div>
  </div>
