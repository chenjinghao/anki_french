Beispielsätze: |-
  Sauvegardez-la pour un traitement *ultérieur*.
  Save it for further treatment.

  Une édition *ultérieure* de ce livre contiendra un nouveau chapitre.
  A later edition of this book will contain a new chapter.

  Je vous transmettrai des informations *ultérieures* dès que possible.
  I'll give you further information as soon as possible.

  Toute modification *ultérieure* du contrat doit être approuvée par écrit.
  Any *subsequent* amendment to the contract must be approved in writing.

  Dans une phase *ultérieure*, nous développerons ce projet.
  In a later phase, we will develop this project.

  Ces détails seront précisés lors d'une communication *ultérieure*.
  These details will be specified in a *subsequent* communication.

  La date *ultérieure* n'a pas encore été fixée.
  The next date has not yet been set.

  Les développements *ultérieurs* ont montré qu'il avait raison.
  Later developments showed that he was right.

  Nous reportons la réunion à une date *ultérieure*.
  We're postponing the meeting to a later date.

  Des études *ultérieures* seront nécessaires pour confirmer ces résultats.
  Further studies will be needed to confirm these findings.

  Les analyses *ultérieures* ont révélé une erreur dans les calculs.
  *Subsequent* analyses revealed an error in the calculations.

  Pour toute question *ultérieure*, n'hésitez pas à me contacter.
  For any further questions, please do not hesitate to contact me.

  Les événements *ultérieurs* ont prouvé que sa décision était sage.
  The events that followed proved that his decision was wise.

