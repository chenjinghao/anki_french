  Toute modification *ultérieure* du contrat doit être approuvée par écrit.
  Any subsequent amendment of the contract must be approved in writing.

  Dans une phase *ultérieure*, nous développerons ce projet.
  In a *later* phase, we will develop this project.

  Ces détails seront précisés lors d'une communication *ultérieure*.
  These details will be clarified in a further communication.

  La date *ultérieure* n'a pas encore été fixée.
  The *later* date is not yet fixed.

  Les développements *ultérieurs* ont montré qu'il avait raison.
  Further developments have shown that he was right.

  Nous reportons la réunion à une date *ultérieure*.
  We'll postpone the meeting until *later*.

  Des études *ultérieures* seront nécessaires pour confirmer ces résultats.
  Further studies will be necessary to confirm these results.

  Les analyses *ultérieures* ont révélé une erreur dans les calculs.
  The *later* analyses have revealed an error in the calculations.

  Pour toute question *ultérieure*, n'hésitez pas à me contacter.
  For further questions you can contact me at any time.

  Les événements *ultérieurs* ont prouvé que sa décision était sage.
  *Later* events have proved that his decision was wise.

