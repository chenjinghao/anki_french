  Un passage couvert *relie* les deux bâtiments.
  A covered corridor *connects* the two buildings.

  L'histoire *relie* le présent au passé.
  History *connects* the present with the past.

  Le cordon *relie* le combiné au téléphone.
  The cable *connects* the phone to the phone.

