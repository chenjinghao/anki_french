Rang: 1121
Wort: suivant
Wortart: prep, conj, adj, nm

# Feel free to improve these fields!
Wort mit Artikel: suivant
Femininum / Plural: suivante
IPA: \sɥi.vɑ̃\
Definition: The following, next
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Les 20 jours *suivants*, ils meurent de faim.
  For the next 20 days, they starve to death.

  La page *suivante* explique les détails du processus.
  The following page explains the details of the process.

  Le bus s'est arrêté à l'arrêt *suivant*.
  The bus stopped at the next stop.

  "*Au suivant* !" cria le coiffeur.
  "Next time!" shouted the barber.

  *Suivant* les circonstances, nous devrons adapter notre stratégie.
  Depending on the circumstances, we'll have to adapt our strategy.

  La réunion est reportée à la semaine *suivante*.
  The meeting is postponed to the following week.

  *Suivant* ses conseils, j'ai changé mon alimentation.
  Following his advice, I changed my diet.

  Découpez le papier *suivant* les pointillés.
  Cut the paper next to the dots.

  Je vous présente l'exemple *suivant*.
  Let me give you the *following* example.

  *Suivant* qu'il pleuve ou non, nous irons au parc.
  Depending on whether it rains or not, we'll go to the park.

  Les événements *suivants* ont changé sa vie pour toujours.
  *The following* events changed his life forever.

  L'ordre du jour est le *suivant* : présentation, pause, discussion.
  The agenda is as follows: presentation, break, discussion.

  Le patient *suivant* peut entrer.
  The next patient can come in.

  *Suivant* la tradition, nous mangeons du poisson le vendredi.
  According to tradition, we eat fish on Fridays.

  La fois *suivante*, je ferai plus attention.
  *Next* time, I'll be more careful.

  *Suivant* son habitude, il arrive en retard.
  As usual, he's late.

  Le chapitre *suivant* traite des verbes irréguliers.
  The next chapter deals with irregular verbs.

  *Suivant* les experts, la situation va s'améliorer.
  According to the experts, the situation will improve.

  L'exercice *suivant* est plus difficile.
  The next exercise is more difficult.

  *Suivant* la météo, nous prendrons la voiture ou le vélo.
  Depending on the weather, we'll take the car or the bike.

  Veuillez passer à la diapositive *suivante*.
  Please move on to the *next* slide.

  *Suivant* les règles du jeu, on ne peut pas reculer.
  According to the rules of the game, you can't back down.

  Le train *suivant* part dans une heure.
  The next train leaves in an hour.

  La cliente *suivante* s'est plainte du service.
  The *next* customer complained about the service.

  *Suivant* les saisons, les prix varient considérablement.
  Depending on the season, prices vary considerably.

  Le candidat *suivant* peut entrer dans la salle d'examen.
  The next candidate can enter the exam room.

  La température varie *suivant* l'altitude.
  The temperature varies according to the altitude.

  Le mois *suivant*, elle a démissionné.
  The *following* month, she resigned.

  *Suivant* vos instructions, j'ai rempli le formulaire.
  Following your instructions, I filled out the form.

  Le concert *suivant* aura lieu en plein air.
  The next concert will be in the open air.

  *Suivant* la recette, il faut ajouter du sel.
  According to the recipe, salt should be added.

