Notiz: |-
  <p><span class="fr">"Je suis excité(e)"</span> has a sexual connotation in French and means <span class="de">"I'm excited"</span>. Do not use it if you <span class="de">"I'm thrilled"</span> (as in English).</p>

  <p>Alternatives to express enthusiasm:</p>

  <div class="examples">
    <div class="fr">J'ai (trop) hâte d'être en weekend.</div>
    <div class="de spoiler">I look forward (very) to the weekend.</div>

    <div class="fr">Je suis impatiente de visiter Paris.</div>
    <div class="de spoiler">I can't wait to visit Paris.</div>

    <div class="fr">Je suis excitée comme une puce à l'idée de partir en vacances.</div>
    <div>(Speaking in English)</div>
    <div class="de spoiler">I'm very excited about the idea of going on vacation.</div>

    <div class="fr">Mes enfants étaient surexcités quand je leur ai dit qu'on allait à Disneyland.</div>
    <div class="de spoiler">My kids were really excited when I told them we were going to Disneyland.</div>
