# Feel free to improve these fields!
Wort mit Artikel: exciter
Femininum / Plural: ''
IPA: \ɛk.si.te\
Definition: exciting, irritable
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Je suis très *excitée* d'aller voter.
  I'm very *excited* to vote.

  La musique forte peut *exciter* les chiens.
  Loud music can make dogs *restless*.

  Son parfum l'*excitait* beaucoup.
  Your perfume really excited him.

  L'odeur du pain frais *excite* l'appétit.
  The scent of fresh bread stimulates the appetite.

  Cette histoire mystérieuse *excite* mon imagination.
  This mysterious story inspires my imagination.

  Le café peut *exciter* le système nerveux.
  Coffee can excite the nervous system.

  Les manifestants *excitaient* la foule à la violence.
  The demonstrators incited the crowd *to* violence.

  Le professeur *excite* la curiosité des élèves.
  The teacher awakens the curiosity of the students.

  La chaleur *excite* les tensions dans la ville.
  The heat is exacerbating the tension in the city.

  Cette idée ne m'*excite* pas du tout.
  This idea doesn't appeal to me at all.

  Le travail manuel l'*excite* beaucoup.
  He is very enthusiastic about the manual work.

  "Ne t'*excite* pas comme ça sur ce jeu vidéo !"
  "Don't get so upset about this video game!"

  Les enfants *s'excitent* facilement avant Noël.
  The children get a little upset before Christmas.

  Cette découverte *excite* la jalousie de ses collègues.
  This discovery arouses the envy of his colleagues.

  Le chercheur *excite* les cellules avec des impulsions électriques.
  The researcher excites the cells with electrical impulses.

  La vue du sang *excite* le requin.
  The sight of blood *drives* the shark.

  Pierre *s'excite* toujours pendant les débats politiques.
  Pierre is always upset about political debates.

  La compétition *excite* son courage.
  The competition inspires his courage.

  Les réseaux sociaux *excitent* les tensions entre les communautés.
  Social media *exacerbate* the tensions between communities.

  Son nouveau projet *excite* son imagination créative.
  His new project stimulates his creative imagination.

  L'alcool peut *exciter* les comportements agressifs.
  Alcohol can *promote* aggressive behavior.

  Marie *excite* son chien avec un bâton.
  Marie's teasing her dog with a stick.

  La douleur *s'excite* quand je bouge le bras.
  The pain gets worse when I move my arm.

  Les supporters *excités* ont envahi le terrain.
  The angry fans stormed the field.

  Le patron *excite* ses employés à travailler plus dur.
  The boss encourages his employees *to* work harder.

  Cette musique *excite* les danseurs.
  This music puts the dancers *in high spirits*.

  La vue de la nourriture *excite* sa faim.
  The sight of food stimulates his hunger.

  Le scientifique *excite* les molécules avec un laser.
  The scientist excites the molecules with a laser.

  Les enfants *s'excitent* trop devant la télévision.
  The children get too upset in front of the TV.

  "Cette proposition ne m'*excite* pas vraiment."
  "This proposal doesn't really appeal to me."

  Son succès *excite* l'envie de ses rivaux.
  His success arouses the envy of his rivals.

  Les nouvelles technologies *excitent* sa curiosité.
  New technologies arouse his curiosity.

  Le bruit constant *excite* sa migraine.
  The constant noise makes her migraine worse.

  Cette histoire *excite* ma compassion.
  This story awakens my compassion.

  Le médecin *excite* le nerf avec une électrode.
  The doctor stimulates the nerve with an electrode.

  Les parents *excitent* l'ambition de leurs enfants.
  The parents *promote* the ambition of their children.

  La victoire *excite* leur enthousiasme.
  Victory increases their enthusiasm.

  Cette perspective *excite* mon intérêt.
  This perspective arouses my interest.

  Le parfum des fleurs *excite* les abeilles.
  The scent of the flowers stimulates the bees.

  "Ne t'*excite* pas pour si peu !"
  "Don't get upset about such a little thing!"

