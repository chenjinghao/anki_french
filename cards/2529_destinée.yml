Wort mit Artikel: la destinée
Femininum / Plural: ''
IPA: \dɛs.ti.ne\
Definition: Destiny, destiny
Register: '' # Beispiel: ↘nonfiction ↗spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Notre destination, c'est aussi notre *destinée*.
  Our goal is also our *destiny*.

  Chacun doit accepter sa *destinée*, même si elle est parfois cruelle.
  Everyone has to accept their fate, even if it is sometimes cruel.

  La *destinée* de ce tableau est de finir dans un grand musée.
  The *purpose* of this painting is to end up in a large museum.

  Les parents tiennent entre leurs mains la *destinée* de leurs enfants.
  The parents hold the fate of their children in their hands.

  Je ne crois pas à une *destinée* toute tracée.
  I don't believe in a predetermined fate.

  Marie et Pierre ont uni leurs *destinées* il y a vingt ans.
  Marie and Pierre united their fates twenty years ago.

  La *destinée* de ce livre fut remarquable : il est devenu un best-seller mondial.
  The *purpose* of this book was remarkable: it became a worldwide bestseller.

  Cette découverte scientifique a changé la *destinée* de l'humanité.
  This scientific discovery has changed the fate of humanity.

  Leurs *destinées* se sont croisées par hasard dans ce petit café.
  Their fates happened to cross in this little café.

  Il faut parfois savoir prendre sa *destinée* en main.
  Sometimes you have to take your own *destiny* into your own hands.

  La guerre a bouleversé la *destinée* de millions de personnes.
  The war has shaken the fate of millions of people.

  Cette jeune artiste semble promise à une belle *destinée*.
  This young artist seems to be destined for a beautiful fate.

  Les anciens croyaient que les étoiles influençaient notre *destinée*.
  The ancients believed that the stars influenced our fate.

  La *destinée* de cette invention fut plutôt inattendue.
  The determination of this invention was rather unexpected.

  Je me demande quelle *destinée* attend nos enfants.
  I wonder what fate awaits our children.

  Le peuple croit fermement aux grandes *destinées* de son pays.
  The people firmly believe in the great fates of their country.

  Cette rencontre a changé sa *destinée* à tout jamais.
  This encounter has changed his fate forever.

  La *destinée* de ce monument est de témoigner de notre histoire.
  The *purpose* of this monument is to testify to our history.

  À quoi bon lutter contre sa *destinée* ?
  Why fight his fate?

