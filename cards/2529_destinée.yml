Notiz: |-
  <div class="section">
    <div class="section-title"><i>destinée</i> and <i>destin</i></div>
    <div class="section-content">
      <p><span class="fr">Destinée</span> It often implies an inner force or a way of life that you can shape yourself.</p>
      <div class="examples">
        <div class="fr">Elle a toujours su que sa destinée était de devenir artiste.</div>
        <div class="de spoiler">She always knew it was her destiny to become an artist.</div>
        <div class="fr">Chacun est responsable de sa propre destinée.</div>
        <div class="de spoiler">Everyone is responsible for their own destiny.</div>
      </div>
      <p><span class="fr">Destin</span> (#2337) refers more to destiny in the sense of an external, often unavoidable force. It is often seen as predetermined or inevitable.</p>
      <div class="examples">
        <div class="fr">Le destin a voulu que leurs chemins se croisent.</div>
        <div class="de spoiler">Fate wanted them to cross paths.</div>
        <div class="fr">On ne peut pas échapper à son destin.</div>
        <div class="de spoiler">You can't escape your destiny.</div>
      </div>
    </div>
