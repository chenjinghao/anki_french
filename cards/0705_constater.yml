Rang: 705
Wort: constater
Wortart: vt, vi

# Feel free to improve these fields!
Wort mit Artikel: constater
Femininum / Plural: ''
IPA: \kɔ̃s.ta.te\
Definition: to establish, certify
Register: '' # Beispiel: ↘Sachtext ↗Mündlich

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Je *constate* de ce fait.
  I can *see* that.

  On a *constaté* une hausse significative des températures depuis dix ans.
  Temperatures have risen significantly over the past decade.

  Le médecin a *constaté* le décès à 3 heures du matin.
  The doctor *found* him dead at 3:00 a.m.

  En rentrant, elle a *constaté* que sa voiture avait disparu.
  On her way home, she *found* that her car had disappeared.

  L'huissier a *constaté* les dommages causés par la tempête.
  The waiter noticed the damage caused by the storm.

  Je dois malheureusement *constater* que vous avez tort.
  Unfortunately, I have to admit that you're wrong.

  Les scientifiques ont *constaté* la présence de nouveaux polluants dans l'eau.
  Scientists have discovered new pollutants in the water.

  Il a fait *constater* son accident par la police.
  He had his accident reported to the police.

  Nous *constatons* avec plaisir vos progrès en français.
  We are pleased to see your progress in French.

  Les chercheurs ont *constaté* une augmentation du niveau des océans.
  Researchers have observed an increase in ocean levels.

  Elle a *constaté* son erreur trop tard.
  She realized her mistake too late.

  Le rapport *constate* une amélioration de la situation.
  The report notes an improvement in the situation.

  Tu *constates* que j'avais raison depuis le début ?
  Can you see I was right from the start?

  Les experts ont *constaté* l'authenticité du tableau.
  The experts have *found* that the table is authentic.

  Je *constate* avec regret votre absence à la réunion.
  I regret to note your absence from the meeting.

  Nous avons dû *constater* l'échec de notre projet.
  We must have seen the failure of our plan.

  Le jury a *constaté* plusieurs irrégularités pendant le concours.
  The jury *found* several irregularities during the competition.

