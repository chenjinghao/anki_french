  The judge gave his verdict without regard for the mitigating circumstances.

  À tous *égards*, ce fut une journée réussie.
  In all respects, it was a successful day.

  Par *égard* pour sa famille, il a décidé de ne pas démissionner.
  Out of respect for his family, he decided not to resign.

  Son comportement manque d'*égards* envers les autres.
  His behavior is disrespectful to others.

  À cet *égard*, je n'ai rien à ajouter.
