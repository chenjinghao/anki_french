Notiz: |-
  <div class="section">
    <div class="section-title"><i>cependant</i>, <i>pourtant</i>, <i>néanmoins</i> and <i>toutefois</i></div>
    <div class="section-content">
      <p>These four French conjunctions all express a contrast, similar to the German conjunction. <span class="de">"but"</span> or <span class="de">"even though"</span>Despite their different etymological origins, they are often used synonymously.</p>

      <p><span class="fr">Cependant</span> (#352): etymologically <span class="de">"in the meantime"</span>It expresses that something parallel to another fact exists.</p>
      <div class="examples">
        <div class="fr">Il a bon visage, cependant il est malade.</div>
        <div class="de spoiler">He looks good, but he's sick.</div>
      </div>

      <p><span class="fr">Pourtant</span> #460): etymological <span class="de">"for such a great cause"</span>It emphasizes the contrast between two facts.</p>
      <div class="examples">
        <div class="fr">Il a bon visage, pourtant il est malade.</div>
        <div class="de spoiler">He looks good, yet he's sick.</div>
      </div>

      <p><span class="fr">Néanmoins</span>: etymological <span class="de">"in no way less"</span>It suggests that the contrast does not diminish the main statement.</p>
      <div class="examples">
        <div class="fr">Il a bon visage, néanmoins il est malade.</div>
        <div class="de spoiler">He looks good, but he's still sick.</div>
      </div>

      <p><span class="fr">Toutefois</span> #770): etymological <span class="de">"under all circumstances"</span>It implies that the statement remains valid despite all other factors.</p>
      <div class="examples">
        <div class="fr">Il a bon visage, toutefois il est malade.</div>
        <div class="de spoiler">He looks good, yet he's sick.</div>
      </div>
      <p>Despite their different origins and nuances, these conjunctions are often used interchangeably in modern French without a clear reason for preferring one over the other.</p>
    </div>
  </div>
