Notiz: |-
  <div class="section">
    <div class="section-title"><i>régir</i> and <i>gouverner</i></div>
    <div class="section-content">
      <p><span class="fr">Régir</span> means <span class="de">"rules"</span> or <span class="de">'determining'</span> and refers to the setting and enforcement of rules, laws or principles that control a system or situation.</p>
      <div class="examples">
        <div class="fr">Ces lois régissent les relations commerciales internationales.</div>
        <div class="de spoiler">These laws govern international trade relations.</div>
        <div class="fr">Les principes qui régissent l'économie de marché.</div>
        <div class="de spoiler">The principles that govern the market economy.</div>
      </div>
      <p><span class="fr">Gouverner</span> #2063) means <span class="de">"rule"</span> or <span class="de">'Driving'</span> and refers to the exercise of political power or the leadership of a country, an organization or a group of people.</p>
      <div class="examples">
        <div class="fr">Le président a gouverné le pays pendant deux mandats.</div>
        <div class="de spoiler">The president has ruled the country for two terms.</div>
        <div class="fr">Elle gouverne sa vie selon des principes stricts.</div>
        <div class="de spoiler">She directs her life according to strict principles.</div>
      </div>
      <p>The main difference is that <span class="fr">régir</span> It is more likely to be applied to systems, rules and abstract concepts, whereas <span class="fr">gouverner</span> typically describes the direct leadership or management of people or organizations.</p>
    </div>
