  <div class="section">
    <div class="section-title"><i>livrer</i> and <i>fournir</i></div>
    <div class="section-content">
      <p><span class="fr">Livrer</span> means <span class="de">"liefern"</span> or <span class="de">"ausliefern"</span> (#613) and refers to the process of physical transport and transfer of goods or objects to a specific place or consignee.</p>
      <div class="examples">
        <div class="fr">Le coursier va livrer le colis demain matin.</div>
        <div class="de spoiler">The courier will deliver the package in the morning.</div>
        <div class="fr">La pizzeria livre à domicile.</div>
        <div class="de spoiler">The pizzeria is delivering home.</div>
      </div>
      <p><span class="fr">Fournir</span> means <span class="de">"liefern"</span> For the purposes of: <span class="de">"bereitstellen"</span> or <span class="de">"to make available"</span>It refers more to the supply of something that is needed and does not necessarily involve physical transport.</p>
      <div class="examples">
        <div class="fr">L'entreprise fournit l'électricité à toute la région.</div>
        <div class="de spoiler">The company supplies electricity to the entire region.</div>
        <div class="fr">Le gouvernement s'engage à fournir des soins médicaux gratuits.</div>
        <div class="de spoiler">The government is committed to providing free medical care.</div>
      </div>
    </div>
  </div>
