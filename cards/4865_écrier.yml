Rang: 4865
Wort: écrier
Wortart: vr

# Feel free to improve these fields!
Wort mit Artikel: s’écrier
Femininum / Plural: ''
IPA: \e.kʁje\
Definition: 'Calling [from emotion]'
Register: ↗fiction ↘nonfiction ↘spoken

# Example sentences must be separated by line breaks.
# Separate each pair with two line breaks.
Beispielsätze: |-
  Venez, venez tous, *s'écria*-t-elle.
  Come on, come on, come on, call her.

  Surprise par le bruit soudain, elle *s'écria* : "Qu'est-ce que c'était ?"
  Surprised by the sudden noise, she shouted, "What was that?"

  "C'est impossible !" *s'écria* Pierre en lisant le message.
  "That's impossible!" cried Pierre when he read the message.

  Les enfants *s'écrièrent* de joie en voyant les cadeaux.
  The children *screamed* with joy when they saw the presents.

  "Au voleur !" *s'écria* le marchand en poursuivant le pickpocket.
  "Hold the thief!" cried the merchant as he ran after the pickpocket.

  "Je ne permettrai pas cela !" *s'écria-t-il* avec indignation.
  "I won't let that happen!" he cried indignantly.

  Marie *s'écria* de douleur quand elle se cogna le pied.
  Marie *screamed* in pain when she bumped into her foot.

  "Quelle belle surprise !" *s'écria* la grand-mère en ouvrant la porte.
  "What a nice surprise!" cried the grandmother when she opened the door.

  "Attention !" *s'écria* le professeur quand l'expérience commença à fumer.
  "Attention!" cried the teacher, as the experiment began to smoke.

  "Je l'ai trouvé !" *s'écria* le chercheur après des mois de travail.
  "I found it!" the researcher shouted after months of work.

  Les spectateurs *s'écrièrent* d'admiration devant le feu d'artifice.
  The spectators shouted admiringly at the sight of the fireworks.

  "Maintenant je comprends tout !" *s'écria-t-elle* soudainement.
  "Now I understand everything!" she suddenly shouted.

  "C'est magnifique !" *s'écria* Thomas en découvrant la vue depuis le sommet.
  "That's beautiful!" cried Thomas when he discovered the view from the summit.

