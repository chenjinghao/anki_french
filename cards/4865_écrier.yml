Notiz: |-
  <div class="section">
    <div class="section-title"><i>crier</i> and <i>s'écrier</i></div>
    <div class="section-content">
      <p><span class="fr">Crier</span> #1950) means <span class="de">"scream"</span> or <span class="de">"calling"</span> and refers to speaking out loud, often over a long period of time or repeatedly.</p>
      <div class="examples">
        <div class="fr">Les enfants crient dans la cour de récréation.</div>
        <div class="de spoiler">The kids are screaming in the school yard.</div>
        <div class="fr">Il crie toujours quand il est en colère.</div>
        <div class="de spoiler">He always screams when he's angry.</div>
      </div>
      <p><span class="fr">S'écrier</span> means <span class="de">"screaming"</span> and refers to a sudden, often spontaneous, scream in response to something. It usually involves a one-time, emotional expression.</p>
      <div class="examples">
        <div class="fr">« Quelle surprise ! » s'écria-t-elle en voyant son ami.</div>
        <div class="de spoiler">"What a surprise!" she shouted as she saw her boyfriend.</div>
        <div class="fr">Il s'écria de joie en apprenant la nouvelle.</div>
        <div class="de spoiler">He shouted with joy when he heard the news.</div>
      </div>
