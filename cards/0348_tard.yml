  He often stays *late* in the office.

  Elle a découvert sa passion *sur le tard*.
  She didn't discover her passion until late.

  Mon frère rentre toujours *tard*.
  My brother always comes home *late*.

  Il ne faut pas rester trop *tard* à la fête.
  You shouldn't be *late* for the party.

