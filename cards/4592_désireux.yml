Beispielsätze: |-
  Beaucoup seraient *désireux* de vous rencontrer.
  Many would be eager to meet you.

  Elle est *désireuse* d'apprendre le japonais depuis son enfance.
  Since childhood, she has wanted to learn Japanese.

  Les étudiants semblent particulièrement *désireux* de réussir leurs examens.
  The students seem to be particularly keen to pass their exams.

  Je suis *désireuse* que mes enfants reçoivent la meilleure éducation possible.
  I *want* my children to receive the best possible education.

  Les personnes *désireuses* de quitter le pays doivent remplir ce formulaire.
  Persons wishing to leave must complete this form.

  Il était tellement *désireux* de plaire qu'il en devenait maladroit.
  He was so anxious to please that he was clumsy.

  Ma sœur est *désireuse* d'obtenir une promotion depuis longtemps.
  My sister's been eager to get a promotion for a long time.

  Les jeunes couples *désireux* d'acheter leur première maison peuvent obtenir une aide.
  Young couples who are willing to buy their first home can get support.

  Notre équipe est *désireuse* d'améliorer ses performances.
  Our team wants to improve its performance.

  Les candidats *désireux* de postuler doivent envoyer leur CV avant vendredi.
  Candidates wishing to apply must submit their CV by Friday.

  Marie semblait *désireuse* d'en savoir plus sur ce sujet passionnant.
  Marie seemed eager to learn more about this exciting topic.

  Il était trop *désireux* de conclure l'affaire pour négocier efficacement.
  He was too eager to close the deal to negotiate effectively.

  Les spectateurs *désireux* d'obtenir les meilleures places doivent réserver tôt.
  Spectators *interested* in the best places must reserve early.

  Nous sommes *désireux* de contribuer au succès de ce projet innovant.
  We strive to contribute to the success of this innovative project.

