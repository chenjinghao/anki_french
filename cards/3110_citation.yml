Beispielsätze: |-
  J'aimerais mentionner quelques *citations*.
  I'd like to mention a few quotes.

  Le professeur a utilisé une *citation* de Victor Hugo pour commencer son cours.
  The professor used a quote from Victor Hugo to start his class.

  Son discours était truffé de *citations* philosophiques.
  His speech was filled with philosophical *quotations*.

  Il faut toujours indiquer la source d'une *citation*.
  The source of a quote must always be indicated.

  La *citation* à comparaître est arrivée ce matin par courrier recommandé.
  The subpoena was received this morning by registered mail.

  Le sergent a reçu une *citation* pour acte de bravoure.
  The sergeant received a citation for gallantry.

  Cette *citation* est devenue la devise de notre école.
  That quote became the motto of our school.

  J'ai reçu une *citation* en justice pour témoigner dans cette affaire.
  I've been summoned to testify in this case.

  Le colonel lui a remis une *citation* à l'ordre du régiment.
  The colonel gave him a subpoena to the regiment.

  Elle collectionne les *citations* inspirantes dans un petit carnet.
  She collects the inspirational quotes in a little notebook.

  Le film contenait plusieurs *citations* musicales d'œuvres classiques.
  The film contained several musical *quotations* from classical works.

  Une *citation* directe doit toujours être mise entre guillemets.
  A direct quote should always be placed between quotes.

  La *citation* à l'ordre de la Nation est une distinction prestigieuse.
  The citation to the Order of the Nation is a prestigious distinction.

  Le juge a émis une *citation* à comparaître pour le témoin principal.
