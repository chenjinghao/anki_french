  Sa thèse contient trop de *citations* et pas assez d'idées originales.
  His dissertation contains too many *quotations* and too little of his own ideas.

  Les étudiants doivent apprendre à bien référencer leurs *citations*.
  The students must learn to prove their *quotations* correctly.

  Le ministre a terminé son discours par une *citation* de Gandhi.
  The minister ended his speech with a quote from Gandhi.

  La *citation* en conciliation vise à résoudre le conflit à l'amiable.
  The summons to the conciliation procedure aims to settle the conflict amicably.

  Cette *citation* latine est gravée sur la façade du bâtiment.
  This Latin *quotation* is carved into the facade of the building.

  "Fin de *citation*", a-t-il dit en fermant le livre.
  "End of quote," he said, closing the book.

