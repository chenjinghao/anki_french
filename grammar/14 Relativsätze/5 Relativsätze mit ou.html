<div class="section-title" data-topic="B1">Relative rates with <i>où</i></div>
<div class="section-content">
  <p>The relative pronoun <span class="fr tag-lemma rounded-border">où</span> is used to express location data in the relative sentence:</p>
  <div class="examples">
    <div class="fr">Paris est la ville <u>où</u> Marie travaille maintenant.</div>
    <div class="de spoiler">Paris is the city, <u>in the</u> Marie jetzt arbeitet.</div>
  </div>
</div>
