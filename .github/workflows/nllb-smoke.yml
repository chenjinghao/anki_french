name: NLLB translation smoke test

on:
  push:
    branches:
      - english-translation

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[run nllb smoke]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: english-translation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NLLB runtime
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers==4.56.1 sentencepiece==0.2.1
      - name: Run NLLB smoke test
        env:
          HF_HOME: ${{ runner.temp }}/hf-cache
          TOKENIZERS_PARALLELISM: 'false'
        run: python scripts/nllb_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: nllb-smoke
          path: nllb-smoke.txt
          if-no-files-found: error
