name: Promote validated v6 5000-card corpus

on:
  push:
    branches:
      - english-translation

permissions:
  contents: write
  actions: read

jobs:
  promote:
    if: contains(github.event.head_commit.message, '[promote v6 repaired corpus]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: english-translation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation runtime
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers==4.56.1 sentencepiece==0.2.1 pyyaml==6.0.2
      - name: Download exact green repaired corpus
        uses: actions/download-artifact@v4
        with:
          name: v6-full-5000-card-repaired
          path: /tmp/v6-repaired
          run-id: 34554527052
          github-token: ${{ github.token }}
      - name: Verify artifact shape
        run: |
          test "$(grep -c . /tmp/v6-repaired/v6-full-repaired/v6-full-all-paths.txt)" -eq 5000
          test "$(find /tmp/v6-repaired/v6-full-repaired/v6-full-combined/cards -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 5000
      - name: Promote cards into branch tree
        run: |
          rsync -a --delete /tmp/v6-repaired/v6-full-repaired/v6-full-combined/cards/ cards/
          test "$(find cards -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 5000
      - name: Recheck reviewed repairs
        run: |
          python scripts/repair_v6_full_audit.py \
            --root . \
            --check \
            --report /tmp/v6-promote-regressions.txt
      - name: Recheck strongest full-card gate
        run: |
          python scripts/v6_full_cards.py validate \
            --root . \
            --paths-file /tmp/v6-repaired/v6-full-repaired/v6-full-all-paths.txt \
            --report /tmp/v6-promote-report.txt
      - name: Stage and verify card-only corpus promotion
        run: |
          git add cards
          test -n "$(git diff --cached --name-only | grep '^cards/' || true)"
          bad="$(git diff --cached --name-only | grep -v '^cards/' || true)"
          test -z "$bad"
      - name: Commit validated corpus and remove temporary workflow
        run: |
          rm .github/workflows/v6-promote-repaired-corpus.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/v6-promote-repaired-corpus.yml
          git commit -m 'Promote validated v6 5000-card corpus'
          git push origin HEAD:english-translation
