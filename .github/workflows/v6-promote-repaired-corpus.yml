name: Promote validated v6 5000-card corpus

on:
  push:
    branches:
      - english-translation

permissions:
  contents: write
  actions: read

jobs:
  promote:
    if: contains(github.event.head_commit.message, '[promote v6 repaired corpus]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: english-translation
          fetch-depth: 0
      - name: Download exact green repaired corpus
        uses: actions/download-artifact@v4
        with:
          name: v6-full-5000-card-repaired
          path: /tmp/v6-repaired
          run-id: 34554527052
          github-token: ${{ github.token }}
      - name: Verify and stage exact repaired cards
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/v6-repaired/v6-full-repaired/v6-full-combined/cards
          test "$(find "$src" -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 5000
          test "$(grep -c . /tmp/v6-repaired/v6-full-repaired/v6-full-all-paths.txt)" -eq 5000
          echo 'Before promotion:'
          git hash-object cards/0002_de.yml
          git hash-object "$src/0002_de.yml"
          test "$(git hash-object cards/0002_de.yml)" != "$(git hash-object "$src/0002_de.yml")"
          rsync -a --delete "$src/" cards/
          cmp cards/0002_de.yml "$src/0002_de.yml"
          test "$(find cards -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 5000
          git add -f -A -- cards
          echo 'First staged paths:'
          git diff --cached --name-only | sed -n '1,20p'
          test "$(git diff --cached --name-only -- cards | wc -l)" -gt 0
          bad="$(git diff --cached --name-only | grep -v '^cards/' || true)"
          test -z "$bad"
          git show :cards/0002_de.yml > /tmp/staged-0002.yml
          cmp /tmp/staged-0002.yml "$src/0002_de.yml"
      - name: Commit validated corpus and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v6-promote-repaired-corpus.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/v6-promote-repaired-corpus.yml
          git commit -m 'Promote validated v6 5000-card corpus'
          git push origin HEAD:english-translation
