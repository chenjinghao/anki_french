name: V6 French-source 500-card QA-only

on:
  push:
    branches:
      - english-translation

permissions:
  contents: read
  actions: read

jobs:
  qa:
    if: contains(github.event.head_commit.message, '[run v6 scale2 qa]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: english-translation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation runtime
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers==4.56.1 sentencepiece==0.2.1 pyyaml==6.0.2
      - name: Download French-source 500-card artifact
        uses: actions/download-artifact@v4
        with:
          name: v6-500-card-french-source-pilot
          path: prior-scale2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: chenjinghao/anki_french
          run-id: 34500069784
      - name: Apply current repairs to prior artifact
        run: |
          python scripts/repair_v6.py \
            --root prior-scale2/v6-scale2-combined \
            --paths-file prior-scale2/v6-scale2-all-paths.txt
          python scripts/repair_v6_scale.py \
            --root prior-scale2/v6-scale2-combined \
            --paths-file prior-scale2/v6-scale2-all-paths.txt
      - name: Run strengthened 500-card gate
        run: |
          python scripts/v6_scale_pilot_v2.py validate \
            --root prior-scale2/v6-scale2-combined \
            --paths-file prior-scale2/v6-scale2-all-paths.txt \
            --report prior-scale2/v6-scale2-qa-report.txt
      - name: Upload repaired QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-500-card-french-source-qa-repaired
          path: prior-scale2
          retention-days: 7
